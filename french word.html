<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フランス料理用語検索</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{--bg:#fdf7f7;--sf:#fff;--tx:#23202a;--mu:#6d6872;--ln:#ecdcdf;--ac:#b23f66;--ac2:#fbe6ec;--mk:#ffe58a;--sh:0 2px 8px rgba(35,32,42,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141a;--sf:#211d26;--tx:#ece8ee;--mu:#a29ca8;--ln:#383240;--ac:#f2a7bf;--ac2:#3a2230;--mk:#7a6212;--sh:0 2px 10px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#17141a;--sf:#211d26;--tx:#ece8ee;--mu:#a29ca8;--ln:#383240;--ac:#f2a7bf;--ac2:#3a2230;--mk:#7a6212;--sh:0 2px 10px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:780px;margin:0 auto;padding:28px 18px 80px}
h1{font:700 2rem/1.3 "Shippori Mincho","Yu Mincho",serif;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 18px;font-size:.92rem}
.search-wrap{position:relative}
input{width:100%;box-sizing:border-box;padding:10px 36px 10px 14px;font:inherit;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;transition:border-color .15s}
input:focus{border-color:var(--ac)}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--mu);font-size:1.1rem;padding:2px 6px;display:none}
#clr.on{display:block}
.chips,.subchips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0}
.chips button{font-size:.74rem;padding:2px 10px;line-height:1.5}
.subchips{margin-top:6px;padding-top:6px;border-top:1px dashed var(--ln)}
.subchips:empty{display:none}
.subchips button{font-size:.7rem;padding:1px 8px;line-height:1.45;opacity:.92}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 -18px;padding:8px 18px 10px;border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
mark{background:var(--mk);color:var(--tx);border-radius:3px;padding:0 1px}
button{font:inherit;font-size:.82rem;padding:4px 12px;border-radius:99px;border:1.5px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled){border-color:var(--ac)}
button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
#cnt{color:var(--mu);font-size:.85rem;margin:12px 0 6px}
.e{position:relative;padding:16px 0;border-top:1px solid var(--ln);scroll-margin-top:calc(var(--bh,110px) + env(safe-area-inset-top,0px) + 8px)}
.eh{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;padding-right:64px}
.fr{font:700 1.35rem/1.35 "Shippori Mincho",serif;color:var(--ac)}
.kn{font-weight:500}
.tg{display:inline-block;font-size:.73rem;padding:1px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);border:none;cursor:pointer}
.tg:hover{filter:brightness(.95)}
.acts{position:absolute;right:0;top:15px;display:flex;gap:4px}
.ico{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--mu)}
.ico.fav-on{color:#d99b00;border-color:#d99b00;background:var(--sf)}
.ico.playing{color:var(--ac);border-color:var(--ac)}
dl{display:grid;grid-template-columns:4.2em 1fr;gap:7px 8px;margin:8px 0 0}
dt{color:var(--ac);font-weight:700;font-size:.75rem;line-height:1.5;padding-top:.28em;text-align:right}
dd{margin:0;max-width:40em;font-size:.93rem;border-left:2px solid var(--ln);padding-left:10px}
.no{color:var(--mu);padding:30px 0}
a.xl{color:var(--ac);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
a.xl:hover{text-decoration-style:solid}
a.xl:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:2px}
.e.fl{border-radius:6px;animation:fl 2.4s ease-out}
@keyframes fl{0%,35%{background:var(--mk);box-shadow:0 0 0 8px var(--mk)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.bl{font-size:.84rem}
.more-bl{font-size:.75rem;padding:1px 8px;margin-left:4px;vertical-align:baseline}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
@media (prefers-reduced-motion:reduce){.e.fl{animation:none;background:var(--mk);box-shadow:0 0 0 8px var(--mk)}}
#float{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:8px}
#nav{display:none;gap:8px}
#nav.on{display:flex}
#float button{width:40px;height:40px;padding:0;font-size:1.2rem;line-height:1;border-radius:50%;background:var(--sf);box-shadow:var(--sh);opacity:.9}
#float button:disabled{opacity:.35;cursor:default}
#top{display:none}
#top.on{display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<main>
<h1>フランス料理用語検索</h1>
<p class="sub">ご質問、不明点、変更、苦情は大村まで！</p>
<div class="tools">
  <button id="rnd" type="button">🎲 おまかせで1語</button>
  <button id="thm" type="button">🌙 ダークモード</button>
</div>
<div class="bar">
  <div class="search-wrap">
    <input id="q" type="search" placeholder="語句を入力（スペースでAND検索 / キーでフォーカス）" aria-label="検索" autofocus>
    <button id="clr" type="button" aria-label="検索をクリア" title="クリア">×</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="subchips" id="subchips"></div>
</div>
<p id="cnt" aria-live="polite"></p>
<div id="list"></div>
<p class="sub" style="margin-top:32px">AIなどを活用した語句のため、日本語に不自由な点や間違い等あるかと思いますので、何とぞご寛容の上、ご報告いただけますようお願いします。</p>
</main>
<div id="float">
  <div id="nav" role="group" aria-label="履歴">
    <button id="nb" type="button" aria-label="戻る" title="戻る">‹</button>
    <button id="nf" type="button" aria-label="進む" title="進む">›</button>
  </div>
  <button id="top" type="button" aria-label="先頭へ戻る" title="先頭へ戻る">↑</button>
</div>
<script>
var D=[{"f":"Bœuf","r":"ブフ","j":"牛肉","c":"食材","m":"フランス料理の主役となる牛肉。フィレやアントルコートはステーキやロティに、すね肉やほほ肉は赤ワイン煮込みなど部位ごとに使い分ける","t":"部位によって赤身の力強い旨味から脂のまろやかな甘みまで多彩に楽しめ、熟成や煮込みで深いコクが増す","z":"フランスではシャロレー牛などのブランド牛が有名。","d":"ブフ・ブルギニョン、ポトフ、ステーク・フリット、ステーク・タルタル、トゥルヌド・ロッシーニ","g":"肉"},{"f":"Porc","r":"ポール","j":"豚肉","c":"食材","m":"フランスで最も日常的に食べられる肉の一つ。ローストやソテーのほか、ハム・パテ・ソーセージなどシャルキュトリの主原料になる","t":"きめ細かな赤身と甘くコクのある脂が調和し、塩漬けや燻製、煮込みで旨味がぐっと引き立つ","z":"フランスのシャルキュトリ（食肉加工品）には欠かせない。","d":"シュークルート、カスレ、リエット、パテ・アン・クルート、豚のロベールソース","g":"肉"},{"f":"Poulet","r":"プーレ","j":"鶏肉","c":"食材","m":"クセがなく幅広い調理法に合う鶏肉。丸ごとのロースト、フリカセ、コック・オ・ヴァンなど家庭料理から高級料理まで広く使われる","t":"クセのない上品で淡白な旨味と柔らかな肉質で、バターやクリーム、赤ワインなどあらゆるソースになじむ","z":"ブレス産の鶏（プーレ・ド・ブレス）は最高級とされる。","d":"コック・オ・ヴァン、鶏のフリカセ、プーレ・ロティ、シュプレームソース添え","g":"鳥肉、うさぎ肉"},{"f":"Canard","r":"カナール","j":"鴨肉","c":"食材","m":"フランス料理で珍重される水鳥の肉。胸肉（マグレ）のロティやもも肉のコンフィ、フォアグラの生産など余すところなく用いられる","t":"鉄分を感じる濃厚な赤身の旨味と香り高い脂のコクがあり、柑橘やベリーの甘酸っぱいソースと抜群に合う","z":"オレンジソースを添える「鴨のロースト オレンジ風味」が有名。","d":"鴨のコンフィ、カナール・ア・ロランジュ、マグレのロティ、サルミ","g":"鳥肉、うさぎ肉"},{"f":"Agneau","r":"アニョー","j":"仔羊肉","c":"食材","m":"生後1年未満の若い羊の肉。骨付き背肉（キャレ）やもも肉（ジゴ）のロースト、首肉の煮込み（ナヴァラン）などが古典的な定番","t":"独特の穏やかな芳香と柔らかくきめ細かい肉質を持ち、マトンよりクセが少なく上品な脂の甘みがある","z":"春先の「プレ・サレ（塩沼地で育った羊）」は特に珍重される。","d":"ナヴァラン、ジゴ・ダニョー（仔羊もも肉のロースト）、仔羊の香草焼き（ペルシヤード）","g":"肉"},{"f":"Homard","r":"オマール","j":"オマール海老","c":"食材","m":"大型の甲殻類（ロブスター）","t":"弾けるようにプリッとした肉厚な食感と濃密な甘みがあり、殻やミソから抽出される芳醇な旨味も格別","z":"ブルターニュ産の「オマール・ブルー」は最高級品。　【日本との違い】日本のイセエビは爪がなく、別の種類にあたる","d":"オマール・テルミドール、ビスク・ド・オマール、オマールのアメリケーヌソース","g":"魚介類"},{"f":"Truffe","r":"トリュフ","j":"トリュフ","c":"食材","m":"土の中でナラやハシバミの根と共生して育つ高級きのこ。冬が旬の黒トリュフと秋〜冬の白トリュフがあり、ソースや仕上げの香り付けに使う","t":"森の土やナッツを思わせる官能的で強い芳香が料理全体を包み込み、ひと削りで気高い余韻を広げる","z":"「台所のダイヤモンド」とも呼ばれる高級食材。","d":"トゥルヌド・ロッシーニ、ソース・ペリグー、トリュフのオムレツ、ブレス鶏のドゥミ・ドゥイユ","g":"野菜"},{"f":"Foie gras","r":"フォアグラ","j":"フォアグラ","c":"食材","m":"ガチョウやアヒルの肥大した肝臓","t":"舌の上でねっとりとろける極上の滑らかさと、濃厚で上品な脂の甘み・コクが口いっぱいに広がる","z":"トリュフ、キャビアと並ぶ世界三大珍味の一つ。","d":"フォアグラのポワレ、フォアグラのテリーヌ、トゥルヌド・ロッシーニ","g":"臓物"},{"f":"Escargot","r":"エスカルゴ","j":"エスカルゴ","c":"食材","m":"食用に養殖・採取されるカタツムリ。殻にパセリとにんにくのバターを詰めてオーブンで焼くブルゴーニュ風が代表的な前菜","t":"サザエに似たコリッと心地よい弾力があり、にんにくとパセリの香草バターが染み込むと芳醇な旨味が広がる","z":"ブルゴーニュ風（パセリとニンニクのバター焼き）が定番。","d":"エスカルゴのブルゴーニュ風（ブール・デスカルゴ焼き）","g":"魚介類"},{"f":"Champignon","r":"シャンピニオン","j":"シャンピニオン","c":"食材","m":"きのこ全般、特にマッシュルーム","t":"穏やかな森の香りと豊富な旨味成分を持ち、炒めて水分を飛ばすほど濃厚なコクと風味が凝縮する","z":"パリ近郊の採石場跡で栽培されたため「シャンピニオン・ド・パリ」と呼ばれる。","d":"デュクセル、ソース・シャスール、ブフ・ブルギニョン、シャンピニオンのポタージュ","g":"野菜"},{"f":"Sauté","r":"ソテー","j":"ソテー","c":"調理法","m":"フライパンやソトゥーズに少量の油やバターを熱し、強めの火で食材を動かしながら手早く焼き上げる基本調理法。肉や魚、きのこ、野菜に幅広く使う","t":"表面に香ばしい焼き色（メイラード反応）がつき、中は水分と旨味を保ったジューシーで軽快な仕上がりになる","z":"フランス語の「sauter（跳ぶ）」が語源。フライパンの中で食材が跳ねる様子から。","g":"加熱・火入れ"},{"f":"Rôti","r":"ロティ","j":"ロティ","c":"調理法","m":"塊肉や丸鶏、大型の魚をオーブンや串焼きで、焼き汁を回しかけ（アロゼ）ながらじっくり焼き上げる調理法。焼き上がり後に休ませて肉汁を落ち着かせる","t":"外側は香ばしくこんがり焼き上がり、内側は余熱でしっとりと均一に火が入った肉本来の旨味が際立つ","z":"日曜日の家族の集まりでローストラムなどがよく食べられる。","g":"加熱・火入れ"},{"f":"Braisé","r":"ブレゼ","j":"ブレゼ","c":"調理法","m":"肉や野菜の表面を焼き付けてから、香味野菜と少量のワイン・だしを加え、蓋をして密閉した状態でオーブンや弱火で長時間じっくり加熱する「蒸し煮」","t":"硬いすね肉やほほ肉もコラーゲンがゼラチン化してとろけるように柔らかくなり、凝縮した煮汁の深いコクが染み込む","z":"固い肉を美味しく食べるための伝統的な調理法。","g":"加熱・火入れ"},{"f":"Poché","r":"ポシェ","j":"ポシェ","c":"調理法","m":"だし汁やクール・ブイヨン、ワイン、シロップなどの液体を沸騰直前（70〜85℃前後）に保ち、食材を静かに沈めて優しく火を通す調理法。卵・魚・鶏胸肉・果物に用いる","t":"タンパク質が硬く締まらず、驚くほどしっとり滑らかで繊細な食感に仕上がり、煮汁の穏やかな風味がほのかに移る","z":"ポーチドエッグ（oeuf poché）や魚の調理によく使われる。","g":"加熱・火入れ"},{"f":"Frit","r":"フリ","j":"フリ","c":"調理法","m":"たっぷりの油で食材を揚げる調理法。高温で手早く揚げることで水分を閉じ込め、外はカリッと軽やかに仕上げる","t":"外側はカリッと香ばしく軽快な歯ざわりで、内側は高温で水分が閉じ込められてふっくらジューシーに仕上がる","z":"フライドポテトはフランス語で「ポム・フリット（pommes frites）」。","g":"加熱・火入れ"},{"f":"Grillé","r":"グリエ","j":"グリエ","c":"調理法","m":"焼き網や溝付きの鉄板を使い、強火の直火で焼き上げる調理法。香ばしい焼き目と余分な脂を落とした軽やかな仕上がりが特徴","t":"直火ならではの香ばしい網目の焼き目と燻製のようなスモーキーな香りが加わり、余分な脂が落ちてさっぱり旨味が引き立つ","z":"肉や魚だけでなく、野菜のグリエも人気。","g":"加熱・火入れ"},{"f":"Confit","r":"コンフィ","j":"コンフィ","c":"調理法","m":"塩漬けした鴨や豚肉をたっぷりの動物脂の中で低温（80〜90℃前後）のまま数時間じっくり煮る伝統的保存調理法。果物を砂糖シロップで煮含める技法も指す","t":"低温の脂でじっくり火が入るため、肉はフォークでほろりと崩れるほど柔らかく、凝縮した旨味とまろやかなコクが生まれる","z":"元々は冷蔵庫がない時代に肉などを長期間保存するための方法だった。","g":"加熱・火入れ"},{"f":"Flambé","r":"フランベ","j":"フランベ","c":"調理法","m":"調理の仕上げにコニャックやラム酒、グランマルニエなどアルコール度数の高い酒を振りかけ、火をつけて一気にアルコール分だけを飛ばす演出と香り付けの技法","t":"アルコールの角が取れて芳醇な酒の香りだけが食材やソースに残り、奥行きのある華やかで大人びた風味に仕上がる","z":"クレープ・シュゼットなどのデザートでも客前でよく行われる。","g":"調味・仕上げ"},{"f":"En papillote","r":"アン・パピヨット","j":"アン・パピヨット","c":"調理法","m":"魚介や鶏肉、野菜にハーブや白ワイン・バターを添えてクッキングシートやアルミホイルで隙間なく包み、オーブンで蒸し焼きにする「包み焼き」","t":"食材の水分と香草・ワインの芳香が袋の中に閉じ込められ、身はふっくらジューシーで、開けた瞬間に豊かな香りが立つ","z":"開けた瞬間に立ち上る香りが食欲をそそる。","g":"加熱・火入れ"},{"f":"Béchamel","r":"ベシャメル","j":"ベシャメル","c":"ソース","m":"同量のバターと小麦粉を色づけずに炒めた白いルーを、温めた牛乳で少しずつ伸ばした基本の白ソース（母なるソースの一つ）。グラタンやモルネーソースの土台になる","t":"ミルクの優しい甘みとバターのまろやかなコクが広がる、クセのないクリーミーな味わい。ナツメグのほのかな香りが後味を引き締める","z":"グラタンやクロックムッシュなどに欠かせない基本のソース（ソース・メール）。","g":"ベシャメル系"},{"f":"Velouté","r":"ヴルーテ","j":"ヴルーテ","c":"ソース","m":"白いルーを鶏・仔牛・魚の澄んだ白いブイヨンで伸ばし、弱火でじっくり煮込んだ基本のソース。シュプレームやヴァン・ブランなど数多くの白系ソースの土台になる","t":"ビロードのようになめらかな口当たりで、だしの繊細な旨味とバターのコクが穏やかに広がる上品な味わい","z":"フランス語で「ビロードのような」という意味。","g":"ヴルーテ系"},{"f":"Espagnole","r":"エスパニョール","j":"エスパニョール","c":"ソース","m":"きつね色以上に炒めた褐色ルーに、茶色いフォン・ド・ヴォーや香味野菜・トマトを加えて長時間煮込んだ基本の褐色ソース。ドゥミ・グラスなど肉用ソースの土台になる","t":"ローストした骨と野菜の深い旨味、炒めた小麦粉の香ばしさが溶け合った、重厚で奥行きのある濃厚な味わい","z":"ドゥミ・グラスソースなどのベースとなる重要なソース。","g":"褐色ソース系"},{"f":"Tomate","r":"ソース・トマト","j":"トマトソース","c":"ソース","m":"完熟トマトをベースに、玉ねぎ・にんじん・にんにく・タイムなどの香味野菜や塩豚の脂とともにじっくり煮込んだ基本ソース。肉・魚・パスタまで幅広く使われる","t":"トマトの爽やかな酸味と凝縮した甘みに、香味野菜とハーブのやさしい旨味が調和した親しみやすい味わい","z":"パスタはもちろん、肉や魚の煮込みなど幅広く使われる。","g":"トマト系"},{"f":"Hollandaise","r":"オランデーズ","j":"オランデーズ","c":"ソース","m":"卵黄と少量の水（または酢・白ワイン）を湯せんで泡立てながら、澄ましバターを少しずつ加えて乳化させ、レモン汁で整えた温かいソース。白アスパラや魚料理に合わせる","t":"バターの芳醇なコクと卵黄のとろりとした濃厚さがありながら、レモンの爽やかな酸味が後味を軽やかに引き締める","z":"エッグベネディクトやゆでたアスパラガスによく合わせられる。","g":"温製乳化系"},{"f":"Mayonnaise","r":"マヨネーズ","j":"マヨネーズ","c":"ソース","m":"卵黄に酢（またはレモン汁）とマスタード、塩を加え、サラダ油を少しずつ混ぜて乳化させた冷製ソースの基本。レムラードやタルタルなど多彩な冷製ソースの土台になる","t":"まろやかな卵のコクとすっきりした酸味が調和した、なめらかで艶のある口当たり。手作りは軽やかで上品な風味","z":"名はスペイン・メノルカ島の港町マオンに由来するという説がある。手作りは市販品より酸味がマイルド。","g":"冷製乳化系"},{"f":"Vinaigrette","r":"ヴィネグレット","j":"ヴィネグレット","c":"ソース","m":"油と酢（基本は3：1）に塩・こしょう、ディジョンマスタードなどを加えて混ぜ合わせた冷製ドレッシング。生野菜サラダや温野菜、冷前菜の味付けの基本","t":"きりっとした酢の酸味と油のまろやかさが素材のみずみずしさを引き立てる、さっぱりと軽快な味わい","z":"比率は一般的に「油３：酢１」が黄金比と言われている。","g":"冷製乳化系"},{"f":"Béarnaise","r":"ベアルネーズ","j":"ベアルネーズ","c":"ソース","m":"エシャロット・エストラゴン・白ワインビネガーを煮詰めたエッセンスに卵黄と澄ましバターを乳化させ、刻みエストラゴンとセルフィーユを加えた温かいソース。牛ステーキの定番","t":"オランデーズの濃厚なバターのコクに、エストラゴンの甘く爽やかなハーブ香とほどよい酸味が重なる華やかな味わい","z":"ステーキ、特にシャトーブリアンによく添えられる。","g":"温製乳化系"},{"f":"Bordelaise","r":"ボルドレーズ","j":"ボルドレーズ","c":"ソース","m":"ボルドー産赤ワインとエシャロットをじっくり煮詰め、フォン・ド・ヴォーやドゥミ・グラスを加えて仕上げに牛の骨髄とバターを合わせる古典ソース。牛ステーキの定番","t":"赤ワインの豊かな渋みと酸味に、肉の深い旨味と骨髄のまろやかなコクが溶け合った、重厚で気品ある大人の味わい","z":"牛肉のステーキ（アントレコート）に合わせるのが定番。","g":"褐色ソース系"},{"f":"Chasseur","r":"シャスール","j":"シャスール","c":"ソース","m":"薄切りマッシュルームとエシャロットをバターで炒め、白ワインを煮詰めてドゥミ・グラスとトマト、パセリを加えた「猟師風」ソース。鶏肉や仔牛肉、ジビエによく合う","t":"きのこの芳醇な香りと旨味に、白ワインの軽やかな酸味とドゥミ・グラスの深いコクが調和した奥行きのある味わい","z":"「猟師風」という意味で、本来は狩猟肉（ジビエ）に合わせられていた。","g":"褐色ソース系"},{"f":"Beurre blanc","r":"ブール・ブラン","j":"ブール・ブラン","c":"ソース","m":"みじん切りのエシャロット、白ワイン、白ワインビネガーをほぼ水分がなくなるまで煮詰め、冷たいバターを少しずつ溶かし込んで乳化させたロワール発祥のソース。白身魚の定番","t":"豊かなバターのコクとなめらかな口当たりがありながら、白ワインと酢のキレのある酸味で後味は驚くほど軽やか","z":"川魚や白身魚のソテーなどに非常によく合う。","g":"バター乳化系"},{"f":"Amuse-bouche","r":"アミューズ・ブーシュ","j":"アミューズ・ブーシュ","c":"コース・その他","m":"コース料理の冒頭、前菜の前にシェフからの挨拶代わりとして供される一口サイズの小さなお楽しみ。食前酒とともに楽しむのが定番","t":"これから始まるコースへの期待を高めるため、塩気・酸味・香りなど味の輪郭がはっきりした軽快な仕立てが多い","z":"直訳すると「口を楽しませるもの」。シェフの挨拶代わりの一品。","g":"コース・構成"},{"f":"Hors-d’œuvre","r":"オードブル","j":"オードブル","c":"コース・その他","m":"主菜（メインディッシュ）の前に提供される前菜の総称。テリーヌやマリネなどの冷前菜から、パイ包みなどの温前菜まで多彩に展開される","t":"主菜に向けて食欲を心地よく高めるよう、酸味やハーブ、軽やかな食感を取り入れたメリハリのある味わいが多い","z":"直訳すると「作品の外」。メインの食事の枠外にあるものという意味。","g":"コース・構成"},{"f":"Soupe","r":"スープ","j":"スープ","c":"コース・その他","m":"肉・魚介・野菜を煮込んだ汁物全般。フランスでは家庭的な具だくさんのスープや、パンを浸して食べる仕立てを指すことが多い","t":"じっくり引き出した素材のだしと野菜の甘みが溶け合った、体の芯からほっと温まる滋味深い味わい","z":"オニオングラタンスープ（Soupe à l’oignon）などが有名。","g":"コース・構成"},{"f":"Sorbet","r":"ソルベ","j":"ソルベ","c":"コース・その他","m":"果汁や果物のピューレ、ワインなどにシロップを加えて凍らせた氷菓（シャーベット）。コースの中盤の口直しや、食後の軽やかなデザートに供される","t":"乳脂肪分を使わないため口溶けが極めて軽やかで、果実本来の瑞々しい甘酸っぱさと清涼感がすっと口を整える","z":"口直しとしてコースの途中で出されることがある。","g":"コース・構成"},{"f":"Plat principal","r":"プラ・プランシパル","j":"メインディッシュ","c":"コース・その他","m":"フルコースの中心となる主菜（メインディッシュ）。魚料理（ポワソン）と肉料理（ヴィアンド）の両方が供される正式な構成もある","t":"コースの頂点にふさわしく、丁寧な火入れと濃厚なソース、付け合わせが織りなす満足感の高い力強い味わい","z":"魚料理（ポワソン）と肉料理（ヴィアンド）の両方が出るフルコースもある。","g":"コース・構成"},{"f":"Dessert","r":"デセール","j":"デザート","c":"デザート","m":"食事の締めくくりに供される甘い菓子や果物の総称。焼き菓子、冷菓、温かいスフレなど、食後の余韻を彩る一皿","t":"食後の満腹感の中でも心地よく楽しめる豊かな甘みと香り。温冷のコントラストや酸味・苦味でコースの余韻を華やかに締めくくる","z":"チーズ（フロマージュ）の後に提供されるのが正式なフランス料理の順序。","g":"冷菓・皿盛りデザート"},{"f":"Crêpe","r":"クレープ","j":"クレープ","c":"デザート","m":"小麦粉・卵・牛乳・溶かしバターの生地を薄く丸く焼き上げたブルターニュ発祥の菓子。砂糖とバターでシンプルに食べるほか、ソースで煮るクレープ・シュゼットも定番","t":"縁は軽く香ばしく、中心はしっとりもちもちとした優しい食感。バターと卵の素朴な甘みがソースや果実の風味を引き立てる","z":"フランスのブルターニュ地方の名物。2月2日の「シャンドルール（聖燭祭）」に食べる習慣がある。","g":"冷菓・皿盛りデザート"},{"f":"Macaron","r":"マカロン","j":"マカロン","c":"デザート","m":"泡立てた卵白（メレンゲ）に砂糖とアーモンドプードルを混ぜて焼き、ガナッシュやバタークリーム、ジャムを挟んだパリの象徴的な焼き菓子。色鮮やかな見た目も魅力","t":"表面は繊細にサクッと割れ、中はしっとりねっちりとした独特の食感。アーモンドの香ばしさと多彩なクリームの濃厚な甘みが溶け合う","z":"現在主流のクリームを挟んだ「マカロン・パリジャン」は20世紀にパリのラデュレで考案された。","g":"焼き菓子・小菓子"},{"f":"Tarte","r":"タルト","j":"タルト","c":"デザート","m":"型に敷いたタルト生地（パート・サブレやブリゼ）に、季節の果物・アーモンドクリーム・カスタードなどを詰めて焼き上げたフランス菓子の代表格","t":"バター香るサクサク・ほろほろの生地と、焼き込んで甘みが凝縮した果物の酸味やなめらかなクリームが一体となる王道の味","z":"りんごを使った「タルト・タタン」は、タタン姉妹が失敗から生み出したという有名な逸話がある。","g":"ケーキ・タルト"},{"f":"Mille-feuille","r":"ミルフィーユ","j":"ミルフィーユ","c":"デザート","m":"薄く焼き上げたキャラメリゼ済みの折り込みパイ生地（パート・フイユテ）3枚と、濃厚なカスタードクリームを交互に重ねた「千枚の葉」の名を持つ古典ケーキ","t":"フォークを入れるとパリパリと軽快に砕ける香ばしいパイと、バニラ香るなめらかで濃厚なクリームの対比がたまらない味わい","z":"フランス語で「千枚の葉」という意味。","g":"ケーキ・タルト"},{"f":"Fromage","r":"フロマージュ","j":"チーズ","c":"チーズ","m":"牛・羊・山羊の乳を乳酸菌や酵素で固め、発酵・熟成させた食品の総称。フランスでは主菜の後、デザートの前にプラトーで味わうのが正式な流れ","t":"フレッシュの爽やかな酸味から、白カビのクリーミーさ、青カビの刺激、長期熟成ハードの深い旨味まで多彩な風味が広がる","z":"フランスには「村の数だけチーズがある」と言われるほど種類が豊富。","g":"チーズ用語"},{"f":"Camembert","r":"カマンベール","j":"カマンベール","c":"チーズ","m":"ノルマンディ地方原産の牛乳製白カビチーズ。木箱入りが定番で、室温に戻してから切り分ける。シードルや軽めの赤ワインと相性がよい","t":"熟成が進むと中心までとろりと柔らかく、バターのような濃厚なコクとマッシュルームを思わせる穏やかな香りが広がる","z":"マリー・アレルという女性が製法を確立したと言われている。","g":"白カビ"},{"f":"Roquefort","r":"ロックフォール","j":"ロックフォール","c":"チーズ","m":"南仏ロックフォール村の天然洞窟で熟成させる、羊乳製の世界三大ブルーチーズ（AOP）。ソーテルヌなど甘口ワインやくるみ、はちみつと好相性","t":"羊乳ならではの濃厚な甘みとコクに、青カビのシャープな刺激と力強い塩気が重なり、長い余韻を残す芳醇な味わい","z":"洞窟の中で熟成されるのが特徴。","g":"青カビ"},{"f":"Blanchir","r":"ブランシール","c":"調理法","m":"野菜や肉・骨を沸騰湯（または水から）で短時間ゆでてから冷水にとる下処理。野菜の青臭さやアク抜き、色止め、肉の臭み抜きや皮むき（湯むき）の前工程に使う","j":"下ゆでする","t":"雑味やアク、えぐみがすっきり抜けて素材の持ち味がクリアになり、緑野菜は色鮮やかでほどよい歯ざわりが保たれる","z":"ゆでた後に氷水で冷やすと、色止めになる","g":"下処理・仕込み"},{"f":"Déglacer","r":"デグラセ","c":"調理法","m":"肉や魚を焼いたフライパンや鍋の余分な脂を捨て、ワインやフォン・だしを注いで木べらでこすり、鍋底にこびりついた旨味（スュック）を溶かし出すソース作りの基本工程","j":"鍋底の旨味を溶かす","t":"焦げ目の香ばしさと肉の凝縮した旨味がすべて液体に溶け込み、深みとコクのあるソースの核が生まれる","z":"ワインやフォンを注いで煮立て、鍋底のスュックを溶かす","g":"調味・仕上げ"},{"f":"Mijoter","r":"ミジョテ","c":"調理法","m":"鍋の中身を沸騰させず、ごく弱火でふつふつと時間をかけて煮込む調理法。肉を柔らかくし、具材と煮汁の味をじっくりなじませる","j":"とろ火で煮込む","t":"具材がほろりと柔らかく煮崩れず、だしと素材の旨味が角の取れたまろやかな一体感を生む","z":"沸騰させず、ふつふつと煮立つ程度の火加減","g":"加熱・火入れ"},{"f":"Gratiner","r":"グラティネ","c":"調理法","m":"ソースやチーズ、パン粉をかけた料理を高温のオーブンや上火のサラマンドルに入れ、表面をこんがりときつね色に焼き上げる仕上げの調理法","j":"表面に焼き色をつける","t":"表面に香ばしくパリッとした焼き色とチーズやソースの焦げた風味が加わり、中のとろりとした具材との対比が際立つ","z":"サラマンドルの上火をあてることも多い","g":"加熱・火入れ"},{"f":"Saisir","r":"セジール","c":"調理法","m":"熱したフライパンや鍋に少量の油をひき、強火で肉や魚の表面を一気に焼き固めて香ばしい焼き色をつける技法。煮込みやローストの前工程としても基本となる","j":"強火で表面を焼き固める","t":"表面に芳醇で香ばしい焼き色がつき、煮込みやソースに深いコクと香りの土台を与える","z":"目的は焼き色と香ばしさ。肉汁を閉じ込める効果は科学的には否定されている","g":"加熱・火入れ"},{"f":"Réduire","r":"レデュイール","c":"調理法","m":"だしやワイン、ソース、生クリームなどを蓋をせずに加熱し、水分を蒸発させてとろみと風味を凝縮させる基本技法。フランス料理のソース作りの要","j":"煮詰める","t":"余分な水分が飛ぶことで素材の旨味と香り、濃度がぎゅっと凝縮し、艶やかで力強い味わいになる","z":"味が凝縮する一方で塩分も濃くなる。詰めすぎに注意し、仕上がりの少し手前で止める","g":"調味・仕上げ"},{"f":"Mariner","r":"マリネ","c":"調理法","m":"肉や魚介、野菜をワイン・酢・油・香味野菜・ハーブ・スパイスを合わせた調味液（マリナード）に一定時間漬け込む下処理。ジビエの臭み消しや冷前菜にも使う","j":"マリネする","t":"調味液の酸味と香草の風味が芯まで染み込み、臭みが和らぐと同時に肉質が柔らかくしっとり仕上がる","z":"酢、ワイン、油、ハーブなどに漬ける","g":"下処理・仕込み"},{"f":"Barder","r":"バルデ","c":"調理法","m":"鶏やウズラ、野鳥の胸肉や牛ヒレなど脂肪の少ない淡白な肉を、薄切りの豚の背脂（バルド）で巻いてタコ糸で縛り、ロースト中の乾燥を防ぐ古典技法","j":"豚の背脂で巻く","t":"加熱中に溶け出した背脂が肉をしっとり潤し、パサつきを防ぎつつまろやかな脂のコクと香ばしさを添える","z":"鶏や鳩の胸肉のような淡白な肉を保護する","g":"下処理・仕込み"},{"f":"Fumer","r":"フュメ","c":"調理法","m":"木材チップの煙で食材をいぶし、保存性と独特の芳香を与える調理法。低温の冷燻（スモークサーモン等）と高温の温燻がある","j":"燻製にする","z":"ブナなどの木材のチップを使うことが多い","t":"ブナや桜などの木材チップ由来の芳醇な燻香が素材に染み込み、塩気と旨味が引き締まった奥深い味わいになる","g":"加熱・火入れ"},{"f":"Monter au beurre","r":"モンテ・オ・ブール","c":"調理法","m":"火を止める直前（またはごく弱火）の温かいソースに、角切りの冷たいバターを少しずつ加えて揺すりながら乳化させ、とろみと艶をつける仕上げの王道技法","j":"冷たいバターで仕上げる","t":"ソースにまろやかなバターのコクとビロードのような滑らかな口当たり、美しい照りが加わり味がひとつにまとまる","z":"ソースに冷たいバターを少しずつ溶かし込む。仕上げの定番","g":"調味・仕上げ"},{"f":"Clarifier","r":"クラリフィエ","c":"調理法","m":"濁ったブイヨンにひき肉・香味野菜・卵白を加えて静かに加熱し濁りを吸着させて澄ます技法（コンソメ作り）。また、バターを溶かして水分と乳固形分を除く澄ましバター作りも指す","j":"澄ませる","t":"雑味や濁りが完全に取り除かれ、澄み渡るクリアな口当たりと凝縮した上品な旨味が際立つ","z":"コンソメは卵白で、バターは水分と乳たんぱくを除いて澄ます","g":"調味・仕上げ"},{"f":"Napper","r":"ナペ","c":"調理法","m":"料理全体にソースを均一に美しくかけること。また、ソースやクレーム・アングレーズがスプーンの背をうっすら覆うほどの理想的なとろみ（濃度）に達した状態も指す","j":"ソースで覆う","z":"ソースがスプーンの背にうっすら残る濃度が、ナペの目安","t":"素材とソースがほどよく絡み合い、ひと口ごとにまろやかな一体感を楽しめる","g":"調味・仕上げ"},{"f":"Vapeur (à la)","r":"ア・ラ・ヴァプール","c":"調理法","m":"湯気（蒸気）の熱だけで食材に火を通す調理法。油脂を使わず素材の水分や香り、色合いを損なわないため、魚介や野菜に向く","j":"蒸す","z":"蒸気だけで加熱するので、素材の風味が逃げにくい","t":"余分な油脂を使わないため後味が極めて軽やかで、素材本来の瑞々しい甘みと繊細な香りがふっくらと引き立つ","g":"加熱・火入れ"},{"f":"Concasser","r":"コンカッセ","c":"調理法","m":"トマトやハーブ、香味野菜などを粗く刻む切り方。特に湯むきして種を取り除いた完熟トマトを5mm〜1cm角に切った「トマトのコンカッセ」を指すことが多い","j":"粗く刻む","z":"トマトのコンカッセは、湯むきして種を除き、角切りにしたもの","t":"素材の瑞々しい果肉感と食感がほどよく残り、ソースや付け合わせにフレッシュな彩りとアクセントを添える","g":"切り方・成形"},{"f":"Ciseler","r":"スィズレ","c":"調理法","m":"玉ねぎやエシャロット、パセリ・シブレットなどのハーブを細かく均一にみじん切りにする切り方。また、魚に火が通りやすいよう身に斜めの切り込みを入れることも指す","j":"みじん切りにする","z":"エシャロットや玉ねぎ、ハーブの細かい切り方","g":"切り方・成形"},{"f":"Julienne","r":"ジュリエンヌ","c":"調理法","m":"にんじん・ポロねぎ・セロリ・柑橘の皮などを、長さ4〜5cm、太さ1〜2mmほどのマッチ棒のように均一な細い千切りにするフランスの基本の切り方","j":"千切り","z":"マッチ棒ほどの細切り","t":"繊維が細く断たれるため口当たりが軽やかで、スープの浮き身や魚料理の付け合わせに繊細な食感と彩りを添える","g":"切り方・成形"},{"f":"Brunoise","r":"ブリュノワーズ","c":"調理法","m":"ジュリエンヌ（細い千切り）にした野菜をさらに端から細かく切り、2〜3mm角の極小のさいの目切りにする切り方。コンソメの浮き身やソースの具材に用いる","j":"小さなさいの目切り","z":"2〜3mm角の小さな角切り","t":"粒が小さく均一なため火の通りが揃い、スープやソースの中で素材の甘みと軽快な歯ざわりを上品に楽しめる","g":"切り方・成形"},{"f":"Chiffonnade","r":"シフォナード","c":"調理法","m":"バジル、オゼイユ（ソレル）、レタス、ほうれん草などの葉物野菜を何枚か重ねてくるりと巻き、端からごく細い帯状に刻む切り方。仕上げの飾りやスープに使う","j":"葉もの野菜の細切り","z":"葉を重ねて巻き、細く切る。バジルやソレルに使う","t":"葉を潰さず軽やかに刻むことでフレッシュな香りが立ち、ふわりとした繊細な口当たりになる","g":"切り方・成形"},{"f":"Tourner","r":"トゥルネ","c":"調理法","m":"じゃがいも・にんじん・かぶなどの根菜を、ペティナイフで角を落として均一な大きさ・形（古典では7面のラグビーボール形）に面取りする伝統的な切り方","j":"面取りする","z":"古典では、野菜を7面のラグビーボール形に整える","t":"角がないため煮崩れしにくく、火の通りが均一になってホクホクとなめらかな食感に仕上がる","g":"切り方・成形"},{"f":"Parer","r":"パレ","c":"調理法","m":"肉や魚の余分な脂身、硬い筋、薄皮、骨や端材を包丁で丁寧に取り除き、料理に適した美しい形と食べやすさに整える基本の下処理","j":"下処理で整える","z":"取り除いた筋や端材は、だしやファルスに使うことがある","g":"下処理・仕込み"},{"f":"Mise en place","r":"ミザンプラス","c":"厨房・道具","m":"営業や調理を始める前に、食材の計量・下処理・切り出し・器具の配置まですべて完璧に整えておく厨房の基本原則と段取り全般","j":"仕込み・段取り","z":"「所定の位置に置くこと」の意味。厨房の基本の考え方","g":"厨房役職・組織"},{"f":"Mirepoix","r":"ミルポワ","c":"コース・その他","m":"玉ねぎ・にんじん・セロリ（比率は2：1：1が基本）を角切りや薄切りにした香味野菜のミックス。フォンや煮込み、ローストの土台に欠かせない","j":"香味野菜の角切り","t":"じっくり加熱することで野菜の自然な甘みと芳醇な香りが溶け出し、料理全体に奥行きのある旨味の土台を作る","z":"玉ねぎ2：にんじん1：セロリ1が一般的。名はミルポワ公爵の料理人に由来するとされる","g":"調理基礎・表現"},{"f":"Bouquet garni","r":"ブーケ・ガルニ","c":"コース・その他","m":"タイム、ローリエ、パセリの茎（好みでポロねぎの青い葉やセロリ）をタコ糸で束ねた香草の束。煮込みやブイヨンに加えて香り付けし、仕上げに取り出す","j":"香草の束","t":"複数のハーブが織りなす穏やかで清涼な香りが肉や魚の臭みを和らげ、煮込み料理に上品なまとまりを与える","z":"ひもで束ね、煮込みの最後に取り出す","g":"調理基礎・表現"},{"f":"Liaison","r":"リエゾン","c":"コース・その他","m":"卵黄と生クリームを混ぜ合わせ、沸騰させずにソースやスープに加えて滑らかなとろみとコクを出す「つなぎ」の技法（ブランケットやフリカセの要）","j":"つなぎ","z":"「結びつけること」の意味。加熱しすぎると卵黄が固まる","t":"角のないビロードのように滑らかな口当たりと、卵黄・生クリームのまろやかで上品なコクが全体をやわらかくまとめる","g":"調理基礎・表現"},{"f":"Roux","r":"ルー","c":"ソース","m":"同量のバターと小麦粉を弱火でじっくり炒めて作る、フランス料理のとろみ付けの基本。炒め時間によって白・ブロンド・褐色の3段階に分かれ、各種基本ソースの土台になる","j":"ルー","t":"白いルーは粉臭さのない穏やかな乳の風味、褐色になるほどナッツのような香ばしさと深いコクが増す","z":"白・ブロンド・褐色の3段階。ベシャメル、ヴルーテ、エスパニョールの土台","g":"だし・ベース"},{"f":"Fond de veau","r":"フォン・ド・ヴォー","c":"ソース","m":"焼いた仔牛の骨とすね肉、香味野菜（ミルポワ）、トマトペーストを長時間コトコト煮出して取る褐色の基本だし。肉料理用ソースの要となる","j":"仔牛のだし","t":"仔牛特有の臭みのない上品な甘みと、骨から溶け出したゼラチン質によるまろやかで奥深い旨味","z":"ゼラチン質が多く、ソースにつやととろみを出す","g":"だし・ベース"},{"f":"Fumet","r":"フュメ","c":"ソース","m":"ヒラメや舌平目など白身魚の骨と頭を、白ワイン・エシャロット・香味野菜とともに20〜30分ほど短時間で煮出した澄んだ魚だし。魚用ソースやスープの土台になる","j":"魚のだし","t":"雑味や生臭みがなく、白身魚の繊細な甘みと白ワインの爽やかな香りが澄み渡る上品な旨味","z":"煮すぎると生臭みが出るので短時間で取る","g":"だし・ベース"},{"f":"Court-bouillon","r":"クール・ブイヨン","c":"ソース","m":"水・白ワイン（または酢）・玉ねぎ・にんじん・ハーブ・粒こしょうを煮出した魚介専用のゆで汁。丸ごとの魚やエビ・カニを風味よくポシェするのに使う","j":"魚介用のゆで汁","t":"ワインと香味野菜、ハーブの穏やかな香りと軽い酸味が魚介の臭みを和らげ、素材の甘みをすっきり引き立てる","z":"「短い（court）ブイヨン」の意味で、短時間で取る","g":"だし・ベース"},{"f":"Consommé","r":"コンソメ","c":"ソース","m":"肉や魚のブイヨンに、ひき肉・香味野菜・卵白を加えて静かに加熱し、濁りを吸着させて琥珀色に澄ませた最高級のクリアスープ。温製・冷製（ジュレ）ともに供される","j":"澄んだスープ","t":"一切の雑味がない透明な口当たりながら、肉と野菜の旨味が幾重にも凝縮された力強く洗練された味わい","z":"卵白が濁りを吸着して澄む","g":"だし・ベース"},{"f":"Demi-glace","r":"ドゥミ・グラス","c":"ソース","m":"エスパニョールソースとフォン・ド・ヴォーを同量合わせ、アクを取りながら半量になるまでじっくり煮詰めた濃厚な褐色ソース。多くの肉用派生ソースの土台になる","j":"ドゥミ・グラス","g":"褐色ソース系","t":"仔牛の骨と香味野菜の旨味がぎゅっと凝縮された、重厚で艶やかなコク。後味にほのかな香ばしさが残る","z":"古典ではエスパニョールをさらに煮詰め、仕上げに少量の辛口マデラを加える"},{"f":"Mornay","r":"モルネ","c":"ソース","m":"ベシャメルソースにグリュイエールやパルメザンなどのすりおろしチーズと卵黄を加えたソース。魚介や野菜、卵にかけてオーブンで焼き色をつけるグラタンの定番","j":"モルネー","g":"ベシャメル系","t":"ベシャメルの優しいミルク感に、熟成チーズの香ばしいコクと塩気が溶け合った濃厚でまろやかな味わい","z":"グラタンやオーブン焼きの仕上げに使う。ベシャメルにグリュイエールとパルメザンを加える"},{"f":"Soubise","r":"スービーズ","c":"ソース","m":"バターで色づけずに甘く蒸し煮にした玉ねぎを裏ごしし、ベシャメルソースと生クリームに合わせた白いソース。仔牛や鶏肉、卵料理にやさしく寄り添う","j":"スービーズ","g":"ベシャメル系","t":"じっくり引き出した玉ねぎの自然な甘みと、クリームのなめらかなコクが調和した穏やかで優しい味わい","z":"トマトを加えたスービーズ・トマテもある。古典には米で濃度をつける作り方も"},{"f":"Américaine","r":"アメリケーヌ","c":"ソース","m":"オマール海老などの甲殻類の殻を香味野菜と強火で炒め、コニャックでフランベして白ワインとトマトで煮出し、漉してバターで仕上げたソース。魚介料理の華","j":"アメリケーヌソース","t":"甲殻類の殻から抽出した芳醇で力強い香りと濃厚な旨味に、トマトの酸味とコニャックの余韻が重なる贅沢な味","z":"オマールの料理で有名。名の由来は諸説ある","g":"その他ソース"},{"f":"Rémoulade","r":"レムラード","c":"ソース","m":"マヨネーズにディジョンマスタード、刻んだケッパー・コルニション・パセリ・セルフィーユ・エストラゴンを加えた冷製ソース。根セロリのサラダや冷製魚介に合わせる","j":"レムラード","g":"冷製乳化系","t":"マヨネーズのまろやかなコクに、マスタードの辛味とピクルスの酸味、ハーブの爽やかな香りが効いたキレのある味","z":"セロリラブのサラダ「セロリ・レムラード」でも有名"},{"f":"Gribiche","r":"グリビッシュ","c":"ソース","m":"固ゆで卵の黄身を裏ごしし、マスタード・油・酢で乳化させて刻んだ卵白・コルニション・ケッパー・ハーブを混ぜた冷製ソース。仔牛の頭肉や白身魚、温野菜の定番","j":"グリビッシュ","g":"冷製乳化系","t":"ゆで卵黄ならではのほっくりしたコクと優しい口当たりに、ピクルスとハーブの軽快な酸味・食感がアクセント","z":"固ゆで卵黄で乳化する点がマヨネーズと違う"},{"f":"Rouille","r":"ルイユ","c":"ソース","m":"にんにく、唐辛子、サフラン、パン粉（またはじゃがいも）をオリーブ油や卵黄とすり合わせた赤茶色の南仏ソース。ブイヤベースや魚のスープにクルトンと添える","j":"ルイユ","g":"冷製乳化系","t":"にんにくの力強い香りと唐辛子のピリッとした辛み、サフランの華やかな芳香がスープの魚介の旨味を引き立てる","z":"「rouille」は「錆」の意味。赤茶色の色から"},{"f":"Aïoli","r":"アイヨリ","c":"ソース","m":"すりつぶしたにんにくと卵黄にオリーブ油を少しずつ加えて乳化させた南仏プロヴァンスの冷製ソース。ゆで野菜や塩ダラ、ゆで卵にたっぷり添えて食べる","j":"アイオリ","g":"冷製乳化系","t":"生にんにくのパンチのある芳香と辛みに、オリーブ油のフルーティーなコクが絡み合う力強くクセになる味わい","z":"ゆで野菜や魚と食べるプロヴァンスの料理にも使う"},{"f":"Pistou","r":"ピストゥ","c":"ソース","m":"フレッシュなバジルの葉、にんにく、オリーブ油（好みでチーズ）をすり鉢で潰して作るプロヴァンスの緑のペースト。夏の野菜スープ（スープ・オ・ピストゥ）に溶かす","j":"ピストゥ","t":"摘みたてのバジルの鮮烈で甘い香りと、にんにくの刺激、オリーブ油のまろやかなコクが弾ける爽やかな風味","z":"野菜スープ「スープ・オ・ピストゥ」に溶かす。松の実は入れないのが一般的","g":"合わせバター・薬味"},{"f":"Tapenade","r":"タプナード","c":"ソース","m":"黒オリーブを主役に、アンチョビ、ケッパー、にんにく、オリーブ油を細かく刻み潰した南仏の濃厚ペースト。パンに塗る前菜や、魚・野菜料理のソースとして使う","j":"タプナード","t":"熟成オリーブの深いコクとほろ苦さに、アンチョビの強い旨味と塩気、ケッパーの酸味が凝縮した大人の味わい","z":"名はプロヴァンス語でケッパーを指す語に由来","g":"合わせバター・薬味"},{"f":"Coulis","r":"クーリ","c":"ソース","m":"トマトや赤パプリカなどの野菜、またはフランボワーズやマンゴーなどの果物を加熱または生のまま裏ごしした、つなぎを使わないピュアなソース","j":"クーリ","t":"余計な油脂や粉を使わないため、素材そのものの瑞々しい甘みや酸味、鮮やかな香りがストレートに広がる","z":"トマトのクーリやフランボワーズのクーリなど甘いものも塩味のものもある","g":"その他ソース"},{"f":"Jus","r":"ジュ","c":"ソース","m":"肉をローストやポワレした鍋底の旨味（スュック）をだしやワインで溶かし出し、とろみをつけずに軽く煮詰めたソース。現代フレンチの肉料理の主流","j":"肉汁のソース","t":"口当たりはさらりと軽やかながら、肉の焼けた香ばしさと凝縮した旨味がまっすぐ届く洗練された味わい","z":"「汁」の意味。とろみをつけず旨味を生かす","g":"褐色ソース系"},{"f":"Échalote","r":"エシャロット","c":"食材","m":"小ぶりの玉ねぎ。繊細な香りで、ソースに欠かせない。","j":"エシャロット","g":"野菜","t":"玉ねぎより甘く繊細でまろやかな芳香とほのかな辛味があり、ワインと煮詰めるとソースに洗練された奥行きを出す","z":"ソースの香味野菜の基本。ブール・ブランやボルドレーズに欠かせない　【日本との違い】日本で「エシャロット」と呼ばれる白い野菜は、らっきょうを若採りしたもので別物","d":"ブール・ブラン、ボルドレーズ、ベアルネーズ、マルシャン・ド・ヴァン、ムール・マリニエール"},{"f":"Ciboulette","r":"シブレット","c":"食材","m":"細ねぎに似たハーブ。生で仕上げに使う。","j":"シブレット/チャイブ","g":"ハーブ","t":"細ねぎに似た爽やかで穏やかな香りと軽やかな辛味があり、生で散らすとクリームや卵のコクを引き締める","z":"加熱すると香りが飛ぶので、仕上げに散らす","d":"オムレツ、ヴィシソワーズ、セルヴェル・ド・カニュ、ラヴィゴットソース"},{"f":"Estragon","r":"エストラゴン","c":"食材","m":"タラゴン。アニスに似た香りで、ベアルネーズに使う。","j":"タラゴン","g":"ハーブ","t":"アニスを思わせる甘く華やかな独特の芳香があり、バターや酢の酸味と合わさると洗練された余韻を残す","z":"ベアルネーズに欠かせないハーブ。タラゴンとも呼ぶ","d":"ベアルネーズソース、鶏のエストラゴン風味、ラヴィゴットソース、シャトーブリアンソース"},{"f":"Cerfeuil","r":"セルフィーユ","c":"食材","m":"セルフィーユ。繊細な香りのハーブ。","j":"チャービル","g":"ハーブ","t":"パセリよりはるかに繊細で、ほのかにアニスのような甘い芳香がふわりと立ち、卵や魚料理に上品さを添える","z":"加熱に弱いので仕上げ向き","d":"オムレツ・オ・フィーヌ・ゼルブ、ブール・ブラン・オ・ゼルブ、ベアルネーズソース"},{"f":"Persil","r":"ペルシ","c":"食材","m":"フランス料理で最も身近なハーブ（パセリ）。葉は刻んで仕上げやバターの香り付けに、香りの強い茎はブーケ・ガルニに使う","j":"パセリ","g":"ハーブ","t":"青々とした瑞々しく爽やかな香りとほのかな苦味があり、にんにくやバターの濃厚な風味をすっきり引き締める","z":"平葉種は香りが強い。茎はブーケ・ガルニにも使う","d":"ブール・メートル・ドテル、エスカルゴバター、ペルシヤード、ムール・マリニエール"},{"f":"Thym","r":"タン","c":"食材","m":"タイム。肉や煮込みの定番ハーブ。","j":"タイム","g":"ハーブ","t":"すっと抜ける爽やかさと温かみのあるスパイシーな芳香を持ち、長時間煮込んでも香りが飛ばず奥行きを与える","z":"肉・魚・煮込みに幅広く使う。ブーケ・ガルニの基本","d":"ブーケ・ガルニ、ラタトゥイユ、ブフ・ブルギニョン、ドーブ、仔羊のロースト"},{"f":"Laurier","r":"ローリエ","c":"食材","m":"乾燥させた月桂樹の葉。加熱すると爽やかな芳香が出るため、ブイヨンや煮込み、マリネ液の臭み消しと香り付けに欠かせない","j":"ローリエ","g":"ハーブ","t":"清涼感のある上品でウッディな芳香があり、肉や魚の臭みを和らげながら煮込みやだしに深い輪郭を与える","z":"煮込みの臭み消しに使う。ブーケ・ガルニの一員","d":"ブーケ・ガルニ、ポトフ、クール・ブイヨン、ブフ・ブルギニョン、オニオン・クルテ"},{"f":"Herbes de Provence","r":"エルブ・ド・プロヴァンス","c":"食材","m":"南仏プロヴァンス地方の伝統的な乾燥ハーブのブレンド。肉や魚のグリル、ラタトゥイユ、トマト煮込みに爽やかな南仏の香りを添える","j":"プロヴァンス風ハーブ","g":"ハーブ","t":"太陽を浴びた南仏の乾いたハーブが織りなす爽やかで力強い芳香が、トマトやオリーブ油の料理に夏らしい彩りを添える","z":"タイムやセイボリー、オレガノなどの混合が一般的","d":"ラタトゥイユ、ドーブ、南仏風グリル、魚介のトマト煮込み"},{"f":"Cèpe","r":"セープ","c":"食材","m":"秋が旬の大型の野生きのこ（ヤマドリタケ／イタリア名ポルチーニ）。ソテーやフリカセ、乾燥品のだしまで香り高く重宝される","j":"セープ茸（ポルチーニ）","g":"野菜","t":"ローストナッツや森の落ち葉を思わせる芳醇な芳香と深い旨味、肉厚でしっとりした歯ごたえが魅力","z":"秋を代表するきのこ。乾燥させても旨味が強い","d":"セープ茸のソテー（ペルシヤード）、鴨や牛肉の付け合わせ、セープのフリカセ"},{"f":"Morille","r":"モリーユ","c":"食材","m":"アミガサタケ。春の高級きのこ。","t":"ハチの巣状の傘にソースがよく絡み、大地を思わせる深く気高い香りとぷりっと心地よい弾力がある","z":"春のきのこ。クリームソースとの相性が古典","j":"アミガサタケ","d":"モリーユ茸のクリームソース、ブレス鶏のヴァン・ジョーヌ煮込み、リ・ド・ヴォーのブレゼ","g":"野菜"},{"f":"Girolle","r":"ジロール","c":"食材","m":"アンズタケ。黄色いきのこ。","t":"ほのかにアプリコットのようなフルーティーな芳香と、コリコリと軽快な歯ごたえ、優しい旨味がある","z":"夏から秋に出回る","j":"アンズタケ","d":"ジロール茸のバターソテー、仔牛のフリカセ、ジロールのオムレツ","g":"野菜"},{"f":"Magret","r":"マグレ","c":"食材","m":"フォアグラ用に育てた鴨の胸肉。","t":"赤身ならではの濃い鉄分の旨味と噛みごたえに、カリッと焼いた厚い皮下脂肪の甘みとコクが絶妙に重なる","z":"フォアグラ用に育てた鴨の胸肉。皮目から焼いて脂を出す　【日本との違い】フォアグラ用のミュラール鴨の胸肉で、日本の合鴨より大きく、脂が厚い","j":"鴨の胸肉","d":"マグレ・ド・カナールのロティ、鴨のオレンジソース（ビガラード）、ベリーソース添え","g":"鳥肉、うさぎ肉"},{"f":"Ris de veau","r":"リ・ド・ヴォー","c":"食材","m":"仔牛の喉から胸にある胸腺の肉。成長とともに消える希少な高級部位で、血抜きと薄皮むきの後にムニエルやブレゼに仕立てる","j":"胸腺","g":"臓物","t":"外はカリッと香ばしく中はクリームのようにとろりと滑らかで、クセのない淡白で気品ある旨味が広がる","z":"仔牛の胸腺。下処理で血抜きをするのが欠かせない","d":"リ・ド・ヴォーのムニエル、リ・ド・ヴォーのブレゼ、ヴォローヴァンの具材"},{"f":"Langoustine","r":"ラングスティーヌ","c":"食材","m":"手長エビに似た小型の甲殻類。","j":"ラングスティーヌ（アカザエビの仲間）","g":"魚介類","t":"オマールより繊細で上品な甘みと、ねっとり柔らかくほどける身質を持ち、殻からも優雅な香りが出る","z":"アカザエビの仲間　【日本との違い】日本のアカザエビに近い仲間だが種は別。イタリア語では「スカンピ」","d":"ラングスティーヌのポワレ、ラングスティーヌのラビオリ、ビスク"},{"f":"Coquille Saint-Jacques","r":"コキーユ・サン・ジャック","c":"食材","m":"甘みのある肉厚な貝柱とオレンジ色の卵巣（コライユ）を持つホタテ貝。ポワレやカルパッチョ、貝殻ごと焼くグラタンが定番","j":"ほたてがい","g":"魚介類","t":"ふっくら肉厚な貝柱の濃密な甘みと、オレンジ色の卵巣（コライユ）のほろ苦い旨味がバターやクリームと完璧に合う","z":"サン・ジャック（聖ヤコブ）は巡礼の守護聖人で、貝殻が巡礼のしるし","d":"ホタテのポワレ、コキーユ・サン・ジャックのグラタン、ホタテのカルパッチョ"},{"f":"Bar","r":"バール","c":"食材","m":"ヨーロッパ沿岸で獲れる高級白身魚（スズキの仲間）。クセのない上品な身で、丸ごとの塩釜焼きやポワレ、ヴァプールに仕立てる","j":"すずき","g":"魚介類","t":"きめ細かく上品な白身にクセのない清らかな甘みとほどよい脂があり、皮目を焼くと香ばしさが際立つ","z":"釣りで獲った「バール・ド・リーニュ」が珍重される　【日本との違い】日本のスズキと近い仲間だが、種は別","d":"スズキの塩釜焼き、スズキのポワレ（ブール・ブラン）、スズキのヴァプール"},{"f":"Sole","r":"ソール","c":"食材","m":"ヨーロッパ産の高級白身魚（舌平目）。フランス料理では「魚の王様」と呼ばれ、丸ごとのムニエルや白ワイン蒸しの古典料理が多い","j":"したびらめ","g":"魚介類","t":"極めてきめ細かくしっとりした白身で、雑味のない繊細な甘みがあり、焦がしバターや白ワインソースを最も美しく受け止める","z":"魚料理の王様とされ、ムニエルが古典　【日本との違い】日本で舌平目と呼ばれるシタビラメ類とは科が違う別の魚。身の厚みや風味が異なる","d":"ソール・ムニエール、舌平目のデュグレレ風、舌平目のノルマンディ風、ボン・ファム"},{"f":"Turbot","r":"テュルボ","c":"食材","m":"菱形で大型のカレイ目の高級白身魚（イシビラメ）。骨付きの厚切りをポシェやロティにし、シャンパーニュやオランデーズソースを合わせる","j":"ターボット（イシビラメ）","g":"魚介類","t":"引き締まった弾力のある肉厚な白身と豊かなゼラチン質、気品ある深い旨味があり、大型魚ならではの食べ応えがある","z":"大型の平たい魚。専用の菱形の鍋「テュルボティエール」がある","d":"テュルボのポシェ（オランデーズソース）、テュルボのロティ（シャンパーニュソース）"},{"f":"Anchois","r":"アンショワ","c":"食材","m":"カタクチイワシの塩漬け。アンチョビーとも書く","j":"アンチョビ","g":"魚介類","t":"熟成による力強い塩気と凝縮した魚の旨味が特徴で、少量加えるだけでソースや野菜の甘みを劇的に引き立てる","z":"カタクチイワシ。塩漬けやオイル漬けにして、タプナードやニース風サラダに使う","d":"タプナード、ピサラディエール、ニース風サラダ、ジュヌヴォワーズソース"},{"f":"Endive","r":"アンディーヴ","c":"食材","m":"チコリ。ほろ苦い軟白野菜。","j":"チコリ","g":"野菜","t":"爽やかで心地よいほろ苦さとみずみずしくシャキシャキした歯ざわりがあり、加熱すると甘みが増してとろりとする","z":"暗い所で軟白栽培する。ベルギー発祥とされる","d":"アンディーヴのグラタン（ハム巻き）、アンディーヴとくるみ・ブルーチーズのサラダ"},{"f":"Poireau","r":"ポワロー","c":"食材","m":"白い茎が太い西洋ねぎ（ポロねぎ）。ゆでてヴィネグレットを添える前菜や、ヴィシソワーズ、ポトフ、ブイヨンの香味野菜に欠かせない","j":"西洋ねぎ（ポロねぎ）","g":"野菜","t":"加熱すると驚くほどとろりとなめらかになり、長ねぎにはない上品で深い甘みと穏やかな香りが広がる","z":"「貧乏人のアスパラガス」とも呼ばれる　【日本との違い】日本の長ねぎより太く、白い部分をやわらかく煮込んで甘みを出す。ねぎで代用すると風味が異なる","d":"ヴィシソワーズ、ポワロー・ヴィネグレット、ポトフ、フォン・ド・ヴォライユ"},{"f":"Topinambour","r":"トピナンブール","c":"食材","m":"ごつごつした塊茎を持つ冬の根菜（キクイモ）。デンプンではなくイヌリンを含み、なめらかなポタージュやピューレ、ソテーに使う","t":"アーティチョークやごぼうを思わせる上品な土の香りと優しい甘みがあり、ほくほく滑らかな食感に仕上がる","z":"キクイモ。ポタージュによく使う","j":"キクイモ","d":"トピナンブールのポタージュ（ヴルーテ）、ロースト肉に添えるピューレ、チップス","g":"野菜"},{"f":"Céleri-rave","r":"セルリ・ラーヴ","c":"食材","m":"肥大した白い根を食べるセロリの仲間（セルリアック）。生を千切りにしてレムラードで和える前菜や、肉料理に添えるピューレが定番","j":"根セロリ（セルリアック）","g":"野菜","t":"セロリに似た爽やかな香りとほっくりした自然な甘みがあり、生はシャキッと軽快、加熱すると極めて滑らかになる","z":"生で細切りにしてレムラードで和える「セルリ・レムラード」が定番","d":"セルリ・レムラード、根セロリのピューレ（ジビエや肉の付け合わせ）"},{"f":"Artichaut","r":"アルティショー","c":"食材","m":"大きな花のつぼみを食べる地中海原産の野菜。ゆでてガクの根元にヴィネグレットをつけて味わうほか、花托（フォン）を煮込みや詰め物にする","j":"アーティチョーク","g":"野菜","t":"ほっくり柔らかな食感と、そら豆や栗にも似た上品な甘み・ほのかな渋みがあり、酸味のあるソースと好相性","z":"食べるのはガクの根元と花托の部分","d":"アーティチョークのバリグール風、ゆでアーティチョークのヴィネグレット添え"},{"f":"Câpres","r":"カープル","c":"食材","m":"地中海沿岸に育つフウチョウボクの花のつぼみを酢漬けや塩漬けにした薬味。タルタルステーキやブール・ノワールに爽やかな酸味を添える","j":"ケッパー","g":"調味料・薬味","t":"きりっと鮮烈な酸味と塩気、ハーブを思わせる爽やかな香りがあり、バターや肉・魚のコクを軽やかに引き締める","z":"フウチョウボクのつぼみの酢漬けや塩漬け。ブール・ノワールやタルタルに使う。ケイパーとも書く","d":"レ・オ・ブール・ノワール、ステーク・タルタル、タプナード、レムラードソース、ラヴィゴット"},{"f":"Cornichon","r":"コルニション","c":"食材","m":"小指ほどに育った未熟なきゅうりを酢やハーブで漬けたピクルス。パテやリエット、シャルキュトリの脂をさっぱり切る付け合わせの定番","j":"コルニション","g":"調味料・薬味","t":"シャキッと小気味よい歯ざわりと爽やかな酸味・ほのかなハーブ香があり、パテや肉の脂をさっぱりリセットする","z":"小さなきゅうりの酢漬け。パテやシャルキュトリに添える","d":"シャルキュトリ盛り合わせ、ソース・シャルキュティエール、ソース・ピカント、グリビッシュ"},{"f":"Moutarde de Dijon","r":"ムータルド・ド・ディジョン","c":"食材","m":"ブルゴーニュ地方ディジョンのマスタード。","j":"ディジョンマスタード","g":"調味料・薬味","t":"ぶどう果汁（ヴェルジュ）由来のすっきりした酸味と鼻に抜ける鋭く清涼な辛味があり、乳化作用でソースをまとめる","z":"ブルゴーニュ地方ディジョンの名を冠する。ヴィネグレットの乳化にも使う","d":"ヴィネグレット、ウサギのマスタード煮（ラパン・ア・ラ・ムータルド）、ソース・ロベール、テルミドール"},{"f":"Piment d’Espelette","r":"ピマン・デスプレット","c":"食材","m":"バスク地方の唐辛子。AOP認定。","t":"刺激が強すぎずフルーティーなほのかな甘みと穏やかで温かみのある辛味、赤い彩りが料理を上品に引き立てる","z":"バスク地方エスプレット村周辺産。AOPを取得している","j":"エスプレット唐辛子","d":"ピペラード、バスク風鶏の煮込み（プーレ・バスケーズ）、魚介やフォアグラの仕上げ","g":"スパイス"},{"f":"Fleur de sel","r":"フルール・ド・セル","c":"食材","m":"塩田の表面で結晶する、塩の花。","j":"塩の花","g":"調味料・薬味","t":"結晶がさくっと軽くほどけ、尖りのないまろやかな塩味と海由来のほのかなミネラル・甘みが素材の旨味を引き出す","z":"塩田の表面にできる結晶を手で集める。仕上げ塩に使う","d":"ステーキやフォアグラの仕上げ、ラディ・ブール、塩バターキャラメル"},{"f":"Crème fraîche","r":"クレーム・フレッシュ","c":"食材","m":"乳酸発酵させた生クリーム。","j":"発酵生クリーム","g":"乳製品","t":"乳酸発酵による爽やかで上品な酸味と、舌の上でとろける濃厚でまろやかなコクがあり、加熱しても分離しにくい","z":"加熱しても分離しにくく、ソースの仕上げに使う　【日本との違い】日本の生クリームは発酵させていないので、味や酸味が異なる。サワークリームとも別物","d":"ブランケット、タルト・フランベ、ソース・ノルマンド、サーモンや野菜の仕上げ"},{"f":"Comté","r":"コンテ","j":"コンテ","c":"チーズ","g":"ハード","m":"フランシュ＝コンテ地方ジュラ山脈一帯で造られる牛乳製の大型ハードチーズ（AOP）。熟成期間（4か月〜36か月以上）で個性が大きく変わり、フォンデュや料理にも万能","t":"若いものはミルクの優しい甘み、長期熟成ではアミノ酸の結晶がシャリッと弾け、ローストナッツやキャラメルの深いコクが広がる","z":"フランスで最も生産量の多いAOP。熟成は最低4か月"},{"f":"Époisses","r":"エポワス","j":"エポワス","c":"チーズ","g":"ウォッシュ","m":"ブルゴーニュ地方エポワス村発祥の牛乳製ウォッシュチーズ（AOP）。地元の蒸留酒マール・ド・ブルゴーニュで洗いながら熟成させ、スプーンですくうほど柔らかく仕上げる","t":"表皮は強烈な芳香を放つが、中身は驚くほどクリーミーでとろりと濃厚。マールの華やかな余韻と力強い旨味が広がる","z":"ナポレオンも愛したと伝わる。香りの強さで有名"},{"f":"Pot-au-feu","r":"ポ・トー・フー","c":"料理","m":"牛のすね肉やばら肉などの塊と、にんじん・かぶ・ポロねぎ・じゃがいも等の根菜を香味野菜と長時間煮込んだフランスの代表的家庭料理。スープと具材を分けて楽しむのが伝統","j":"ポトフ","t":"牛肉と根菜の旨味がじっくり溶け合った、体の芯から温まる滋味深くやさしい味わい。粗塩やマスタード、コルニションがよく合う","z":"名は「火にかけた鍋」。スープと肉と野菜を分けて食べ、マスタードや塩を添える","g":"肉・ジビエ料理"},{"f":"Bouillabaisse","r":"ブイヤベース","c":"料理","m":"カサゴやホウボウなど地中海の岩礁魚をサフラン・フェンネル・オリーブ油・トマトとともに強火で煮込んだマルセイユ名物の魚介スープ。ルイユを塗ったパンと魚を添えて食べる","j":"ブイヤベース","t":"何種類もの魚介から出た濃厚で複雑な海の旨味に、サフランとフェンネルの華やかな香りが重なる力強い南仏の味","z":"名は「煮立てて火を弱める」に由来。ルイユとパンを添える","g":"スープ・ポタージュ"},{"f":"Cassoulet","r":"カスレ","c":"料理","m":"白いんげん豆（ランゴ等）に、鴨のコンフィ、豚肉、ソーセージ（トゥールーズ風等）を重ね、土鍋（カソール）で表面に焼き色がつくまでじっくり焼き煮にした南西地方の郷土料理","j":"カスレ","t":"肉の旨味と鴨の脂をたっぷり吸い込んだとろける白いんげん豆と、香ばしく焼けた表面のコクが一体となった食べ応え満点の味","z":"名は土鍋「カソール」から。元祖の座をトゥールーズなど数都市が争う","g":"肉・ジビエ料理"},{"f":"Coq au vin","r":"コック・オ・ヴァン","c":"料理","m":"鶏肉を赤ワインでマリネし、ベーコン・小玉ねぎ・マッシュルームとともにじっくり煮込んだフランスの代表的な郷土料理","j":"鶏の赤ワイン煮","t":"赤ワインの芳醇な渋みと穏やかな酸味に、じっくり煮込んだ鶏肉とベーコン、きのこの深いコクが溶け合った濃厚で奥深い味わい","z":"ブルゴーニュの郷土料理とされ、老鶏をワインで煮たのが始まりといわれる","g":"肉・ジビエ料理"},{"f":"Ratatouille","r":"ラタトゥイユ","c":"料理","m":"なす、ズッキーニ、パプリカ、トマト、玉ねぎなど夏野菜をオリーブ油とハーブでじっくり煮込んだ南仏ニース発祥の野菜料理","j":"ラタトゥイユ","t":"じっくり火を通した夏野菜それぞれの自然な甘みと瑞々しさに、オリーブ油とタイム・バジルの爽やかな香りが調和するやさしい味","z":"ニース周辺が発祥。映画の題名でも知られる","g":"野菜・チーズ・軽食"},{"f":"Blanquette de veau","r":"ブランケット・ド・ヴォー","c":"料理","m":"仔牛肉を焼き色をつけずに白いブイヨンで柔らかく煮込み、卵黄と生クリーム（リエゾン）で白く仕上げるフランスの伝統的煮込み料理","j":"仔牛の白い煮込み","t":"焼き色をつけない仔牛肉の柔らかく淡白な旨味を、卵黄と生クリームのまろやかで優しいコクが包み込む上品な味わい","z":"「白い」の意味。肉を焼き固めず、卵黄とクリームでとろみをつける","g":"肉・ジビエ料理"},{"f":"Quiche lorraine","r":"キッシュ・ロレーヌ","c":"料理","m":"砂糖を入れないパイ生地（パート・ブリゼ）の器に、炒めたベーコン（ラルドン）と卵・生クリームのアパレイユを流し込んで焼き上げたロレーヌ地方の伝統的塩味タルト","j":"キッシュ・ロレーヌ","t":"サクサク香ばしいパイ生地と、ふるふるとろける卵とクリームのまろやかなコク、ベーコンの塩気と燻製香が絶妙に調和する","z":"本来はチーズを入れないとされる。ロレーヌ地方の名物","g":"野菜・チーズ・軽食"},{"f":"Gratin dauphinois","r":"グラタン・ドフィノワ","c":"料理","m":"薄切りにしたじゃがいもを、にんにくをこすりつけた耐熱皿に重ね、生クリームと牛乳（好みでナツメグ）を注いでオーブンでじっくり焼き上げたドーフィネ地方の郷土料理","j":"ドーフィネ風グラタン","t":"じゃがいものでんぷんと生クリームが溶け合ったとろりとなめらかな口当たりに、ほのかなにんにくと焼き目の香ばしさが広がる","z":"本来はチーズを使わず、にんにくをすり込んだ器で焼く","g":"野菜・チーズ・軽食"},{"f":"Steak tartare","r":"ステーク・タルタル","c":"料理","m":"新鮮な赤身の生牛肉を包丁で細かく叩き、ケッパー・コルニション・エシャロット・パセリ・卵黄・マスタード・タバスコ等で調味したビストロ定番の冷製肉料理","j":"タルタルステーキ","t":"生肉ならではのねっとりした新鮮な旨味に、卵黄のまろやかさと薬味・スパイスの爽やかな酸味と刺激が弾けるクセになる味わい","z":"名はタタール人にちなむとされる。新鮮な肉を注文時に刻む","g":"前菜・冷菜・サラダ"},{"f":"Sole meunière","r":"ソール・ムニエール","c":"料理","m":"皮をむいた丸ごとの舌平目に小麦粉を薄くはたき、たっぷりのバターで香ばしく焼き上げて焦がしバター（ブール・ノワゼット）とレモン、パセリをかけた古典魚料理の最高峰","j":"舌平目のムニエル","t":"きめ細かくしっとりした舌平目の上品な甘みに、ヘーゼルナッツ香る焦がしバターのコクとレモンの爽やかな酸味が完璧に調和する","z":"「meunière」は「粉屋の女房風」。粉をまぶして焼く調理法の名","g":"魚介料理"},{"f":"Tournedos Rossini","r":"トゥルヌド・ロッシーニ","c":"料理","m":"厚切りの牛ヒレ肉（トゥルヌド）をバターで焼き、クルトンの上にのせてフォアグラのポワレと黒トリュフを重ね、マデラ酒のペリグーソースを添えた古典の極上料理","j":"トゥルヌド・ロッシーニ","t":"柔らかい牛ヒレの旨味に、とろけるフォアグラの濃厚な脂の甘みとトリュフの気高い芳香が重なり合う、まさに王侯貴族の味わい","z":"美食家の作曲家ロッシーニにちなむ","g":"肉・ジビエ料理"},{"f":"Terrine","r":"テリーヌ","c":"料理","m":"ひき肉やレバー、魚介、野菜などを型（テリーヌ型）に詰めて湯せん焼きなどで加熱し、重しをして冷やし固めて切り分ける料理。前菜の定番として幅広く仕立てられる","j":"テリーヌ","t":"冷やすことで肉や素材の旨味・スパイス・洋酒の香りがぎゅっと引き締まり、しっとり濃厚でワインによく合う味わい","z":"もとは陶製の型の名。型ごと供することもある","g":"前菜・冷菜・サラダ"},{"f":"Rillettes","r":"リエット","c":"料理","m":"豚肉や鴨肉、魚などを香味野菜とともに脂の中でほろほろになるまで長時間煮込み、細かくほぐして脂ごと練り上げた伝統的保存食。バゲットやトーストに塗って楽しむ","j":"リエット","t":"ほぐれた肉の繊維感と旨味に、まろやかな脂のコクとほどよい塩気・香辛料がなじんだ、後を引く素朴で濃厚な味わい","z":"ロワール地方トゥールやサルトのものが有名。パンに塗る","g":"前菜・冷菜・サラダ"},{"f":"Salade niçoise","r":"サラド・ニソワーズ","c":"料理","m":"完熟トマト、ゆで卵、アンチョビ、黒オリーブ（ニソワーズ）、ツナ、ピーマン、ラディッシュなどを盛り合わせ、オリーブ油のドレッシングで味わう南仏ニースの名物サラダ","j":"ニース風サラダ","t":"瑞々しい夏野菜の甘みと酸味に、アンチョビとオリーブの力強い塩気と旨味、ゆで卵のまろやかさが調和する太陽のような味","z":"本場では火を通した野菜を入れない、という人もいる","g":"前菜・冷菜・サラダ"},{"f":"Choucroute","r":"シュークルート","c":"料理","m":"塩漬けにして乳酸発酵させた千切りキャベツを、アルザス産白ワインやジュニパーベリーとともに、塩豚・ベーコン・ソーセージ各種と煮込んだアルザス地方の豪快な郷土料理","j":"シュークルート","t":"発酵キャベツの爽やかで丸みのある酸味が、豚肉やソーセージの濃厚な脂と燻製の旨味を軽やかに引き立てるクセになる味わい","z":"アルザス白ワインやビールと合わせる","g":"肉・ジビエ料理"},{"f":"Mignardises","r":"ミニャルディーズ","c":"コース・その他","m":"フルコースの最後、コーヒーや紅茶とともに供される一口サイズの小菓子（プティ・フール）。マカロン、カヌレ、生チョコなどが並ぶ","j":"プティ・フール（食後の小菓子）","z":"コーヒーや紅茶と一緒に出す","g":"コース・構成"},{"f":"Cocotte","r":"ココット","c":"厨房・道具","m":"熱伝導と保温性に優れた蓋付きの厚手鍋。鋳物ホーロー製などが多く、煮込み（ブレゼやミジョテ）からオーブン調理まで幅広く活躍する","j":"ココット鍋","z":"鋳物のものが多く、そのまま食卓に出せる","g":"調理器具"},{"f":"Sautoir","r":"ソートワール","c":"厨房・道具","m":"底が広く側面が垂直に立ち上がった、浅めの業務用ソテー鍋。肉や魚をソテーしたあと、そのままデグラセしてソースを煮詰める作業に向く","j":"ソテー鍋","z":"直線的な側面で、ソテーしてそのまま煮詰める作業に向く","g":"調理器具"},{"f":"Chinois","r":"シノワ","c":"厨房・道具","m":"細かい金属メッシュを張った円錐形の漉し器（ストレーナー）。フォンやソース、ポタージュを滑らかに漉すために厨房で欠かせない基本道具","j":"円錐形漉し器","z":"「中国人」の意味で、形が中国の帽子に似ることから","g":"調理器具"},{"f":"Tamis","r":"タミ","c":"厨房・道具","m":"木や金属の枠に細かい網を張った丸型の裏漉し器（ふるい）。粉ふるいのほか、ピューレやソースをなめらかに裏漉しするのに使う","j":"ドラム型ふるい","z":"粉ふるいや裏漉しに使う","g":"調理器具"},{"f":"Maryse","r":"マリーズ","c":"厨房・道具","m":"柔軟な先端を持つ調理用のゴムべら（スパチュラ）。ボウルや鍋肌についたソースや生地を無駄なくきれいに集める道具","j":"ゴムべら","z":"ボウルの生地を無駄なくすくえる","g":"調理器具"},{"f":"Bain-marie","r":"バン・マリー","c":"コース・その他","m":"鍋に張った湯の中に別の容器を浮かべ、間接的に穏やかな熱を加える調理法。チョコレートを溶かしたり、プリンやサバイヨンを繊細に温める際に使う","j":"湯せん","z":"名は錬金術師マリアに由来するという説がある","g":"調理基礎・表現"},{"f":"Salamandre","r":"サラマンドル","c":"厨房・道具","m":"上部に強力な熱源を備えた業務用の焼き器（上火グリル）。グラタンやオニオングラタンスープの表面に短時間で香ばしい焼き色をつけるのに使う","j":"サラマンダー","z":"名は火の中に棲むとされた伝説の生き物から","g":"調理器具"},{"f":"Brigade","r":"ブリガード","c":"厨房・道具","m":"料理長（シェフ）を頂点に、副料理長・ソース担当・魚担当・肉担当・野菜担当など各部門が軍隊のように分業・連携するフランス厨房の伝統組織","j":"厨房の組織","z":"エスコフィエが整えた「ブリガード」制度が基本","g":"厨房役職・組織"},{"f":"Sommelier","r":"ソムリエ","c":"ワイン・酒類","m":"レストランでワインの選定・仕入れ・管理から、料理に合わせたペアリングの提案、抜栓・サービスまでを一手に担うワインの専門職","j":"ソムリエ","z":"語源は中世の荷物係に由来するとされる","g":"ソムリエ・テイスティング"},{"f":"Pâte brisée","r":"パート・ブリゼ","c":"デザート","m":"小麦粉・バター・塩・水で作る、砂糖を加えない（またはごく少量の）サクッとしたタルト生地。キッシュや野菜のタルトなど塩味料理のほか、タルト・タタンにも使う","j":"パート・ブリゼ","t":"甘さ控えめで小麦とバターの香ばしさが際立ち、口の中で軽くほろりと砕ける食感があらゆる具材を引き立てる","z":"「砕けた」の意味。キッシュなど塩味のタルトに使う","g":"生地・クリーム・製菓技法"},{"f":"Pâte sablée","r":"パート・サブレ","c":"デザート","m":"小麦粉・バター・砂糖・卵黄で作る、砂のようにほろほろと崩れる甘いタルト生地。フルーツタルトやレモンタルト、焼菓子サブレの土台としてフランス菓子の基本となる","j":"パート・サブレ","t":"リッチなバターの香りと優しい甘みが広がり、サクッと軽やかで口の中で砂のようにほどける繊細な食感が魅力","z":"「砂のような」の意味。フルーツタルトに使う","g":"生地・クリーム・製菓技法"},{"f":"Pâte feuilletée","r":"パート・フイユテ","c":"デザート","m":"小麦粉の生地にバターを包み込み、何度も伸ばして折りたたむことで何百もの薄い層を作る折り込みパイ生地。ミルフィーユやパイ包みに使う","j":"パート・フイユテ","t":"焼き上げると幾重にも浮き上がるパリパリ・サクサクの軽快な層から、上質な発酵バターの芳醇な香りと塩気が豊かに広がる","z":"生地とバターを何度も折りたたんで層にする。ミルフィーユは「千枚の葉」","g":"生地・クリーム・製菓技法"},{"f":"Pâte à choux","r":"パート・ア・シュー","c":"デザート","m":"水・牛乳・バターを沸かして小麦粉を一気に混ぜ、火を通してから卵を加えて練り上げるシュー生地。オーブンで焼くと水蒸気の力で大きく膨らみ、中が空洞になる","j":"パート・ア・シュー","t":"外側は香ばしくさっくりと焼き上がり、中はふわりと軽やかで空洞に詰めたクリームやアイスの風味を邪魔せず引き立てる","z":"「chou」はキャベツ。焼いた形が似ることから","g":"生地・クリーム・製菓技法"},{"f":"Génoise","r":"ジェノワーズ","c":"デザート","m":"全卵と砂糖を湯せんで温めながら共立てにし、薄力粉と溶かしバターを合わせた基本のスポンジ生地。ショートケーキやフレジエの土台になる","j":"ジェノワーズ","t":"きめ細かくふんわりと軽い口当たりに、卵のやさしい甘みと溶かしバターのほのかなコクが広がる、シロップやクリームになじみやすい味","z":"名はイタリアのジェノヴァに由来。卵を温めて泡立てる","g":"生地・クリーム・製菓技法"},{"f":"Crème anglaise","r":"クレーム・アングレーズ","c":"デザート","m":"卵黄と砂糖を混ぜ、バニラを煮出した牛乳を加えてとろみがつくまで（82〜85℃）丁寧に炊いた、さらりとしたカスタードソース。アイスクリームのベースやイル・フロタントに使う","j":"クレーム・アングレーズ","t":"とろりとなめらかな口当たりに、卵黄のやさしいコクと天然バニラの華やかで甘い芳香がふわりと広がる上品な味わい","z":"「英国風クリーム」の意味。加熱しすぎると分離する","g":"生地・クリーム・製菓技法"},{"f":"Crème pâtissière","r":"クレーム・パティシエール","c":"デザート","m":"卵黄・砂糖・小麦粉（またはコーンスターチ）に牛乳とバニラを加えてしっかり炊き上げた濃厚なカスタードクリーム。エクレア、ミルフィーユ、タルトなどフランス菓子の要","j":"クレーム・パティシエール","t":"ぷるんとなめらかで舌に絡みつく濃厚なコクがあり、卵とミルク、バニラの豊かな甘みが広がる王道のクリーム","z":"エクレアやタルトなど、フランス菓子に欠かせない","g":"生地・クリーム・製菓技法"},{"f":"Chantilly","r":"シャンティイ","c":"デザート","m":"よく冷やした生クリームに砂糖とバニラを加えてふんわり泡立てた甘いホイップクリーム。ショートケーキやモンブラン、フルーツ、ホットチョコレートの添え物に欠かせない","j":"シャンティイ","t":"空気を含んだ雲のように軽やかな口溶けで、乳脂肪のミルキーなコクと控えめで上品な甘みが後味よくすっと消える","z":"名はシャンティイ城に由来するという説がある","g":"生地・クリーム・製菓技法"},{"f":"Ganache","r":"ガナッシュ","c":"デザート","m":"細かく刻んだチョコレートに沸騰させた生クリームを注いで乳化させた、なめらかなチョコレートクリーム。トリュフの中身、オペラやマカロンの挟みクリーム、艶がけに広く使う","j":"ガナッシュ","t":"カカオの芳醇な香りとほろ苦さに、生クリームのまろやかなコクが溶け合った、口の中でねっとりとろける濃厚な味わい","z":"弟子の失敗から生まれたという逸話が伝わる","g":"生地・クリーム・製菓技法"},{"f":"Crème brûlée","r":"クレーム・ブリュレ","c":"デザート","m":"卵黄・生クリーム・バニラで作る濃厚なカスタードを低温で焼き冷やし、提供直前にカソナードを振ってバーナーでパリッとキャラメリゼした「焦がしたクリーム」","j":"クレーム・ブリュレ","t":"スプーンで割る香ばしくほろ苦い飴のパリパリ感と、下から現れる冷たくとろり濃厚なバニラカスタードの対比が絶品","z":"「焦がしたクリーム」の意味。表面を割る食感が楽しみ","g":"冷菓・皿盛りデザート"},{"f":"Soufflé","r":"スフレ","c":"デザート","m":"カスタードや果実ピューレ（料理用はベシャメルやチーズ）に固く泡立てたメレンゲを合わせ、型に入れてオーブンで高く膨らませた焼き立て命の菓子・料理","j":"スフレ","t":"焼きたてを頬張るとしゅわっと儚くほどける驚くほど軽やかな食感に、卵とバニラやグランマルニエの芳醇な香りが立ち上る","z":"「膨らんだ」の意味。焼きたてをすぐ食べないとしぼむ","g":"冷菓・皿盛りデザート"},{"f":"Éclair","r":"エクレール","c":"デザート","m":"細長く絞って焼いたシュー生地の中に、チョコレートやコーヒー風味のカスタードクリームをたっぷり詰め、表面にフォンダン（糖衣）を艶やかにかけたフランス定番の菓子","j":"エクレア","t":"香ばしいシューの軽快な食感と、口いっぱいに溢れる濃厚なクリーム、表面のフォンダンのほどよい甘みが一体となる","z":"「稲妻」の意味。名の由来は諸説ある","g":"ケーキ・タルト"},{"f":"Paris-Brest","r":"パリ・ブレスト","c":"デザート","m":"自転車の車輪を模したリング状のシュー生地にアーモンドを散らして焼き、濃厚なプラリネ風味のムースリーヌクリームをたっぷり挟んだパリの象徴的な古典菓子","j":"パリ・ブレスト","t":"さっくり香ばしいシューとローストアーモンドの食感に、ヘーゼルナッツとキャラメル香る濃厚なプラリネクリームが贅沢に広がる","z":"パリ〜ブレスト間の自転車レースを記念したと伝わり、輪は車輪を模す","g":"ケーキ・タルト"},{"f":"Clafoutis","r":"クラフティ","c":"デザート","m":"耐熱皿に種付きのさくらんぼ（または旬の果物）を並べ、卵・牛乳・砂糖・小麦粉のクレープ状生地を流してオーブンで焼き上げたリムーザン地方発祥の素朴な家庭菓子","j":"クラフティ","t":"プリンともちもちした焼き生地の中間のような優しい食感に、卵とミルクの素朴な甘みと焼き込んだ果物の甘酸っぱさが溶け合う","z":"リムーザン地方発祥。伝統的にさくらんぼを使う","g":"焼き菓子・小菓子"},{"f":"Madeleine","r":"マドレーヌ","c":"デザート","m":"ロレーヌ地方コメルシー発祥とされる、帆立貝の殻を模した型で焼く焼き菓子。溶かしバターと卵、レモンの皮が香る素朴な定番","j":"マドレーヌ","t":"外縁は軽くさっくり、中はしっとりふんわりとした口当たりで、上質なバターのコクと爽やかなレモンの香りが広がる優しい甘み","z":"プルーストの小説に登場する菓子として有名","g":"焼き菓子・小菓子"},{"f":"Financier","r":"フィナンシェ","c":"デザート","m":"焦がしバター（ブール・ノワゼット）、アーモンドプードル、卵白、砂糖を混ぜて金塊（延べ棒）型の型で焼き上げた、パリの証券取引所周辺発祥とされる焼き菓子","j":"フィナンシェ","t":"外はカリッと香ばしく中はしっとり濃密な食感で、焦がしバターとアーモンドの芳醇なナッツの香りが口いっぱいに広がる","z":"金塊の形で、金融街の人向けの菓子という説がある","g":"焼き菓子・小菓子"},{"f":"Canelé","r":"カヌレ","c":"デザート","m":"蜜蝋を塗った溝付きの銅型に、ラム酒とバニラを効かせた卵・牛乳の生地を流し込んで高温でじっくり焼き上げた、ボルドー地方の修道院発祥の伝統焼き菓子","j":"カヌレ","t":"焦げた蜜蝋と砂糖によるカリッとほろ苦い外皮と、カスタードのようにもっちりしっとりした中身の対比にラムとバニラが香る","z":"ボルドーの菓子。型に蜜蝋を塗って焼くのが伝統","g":"焼き菓子・小菓子"},{"f":"Praliné","r":"プラリネ","c":"デザート","m":"ローストしたヘーゼルナッツやアーモンドにキャラメルを絡めて冷やし固め、細かく砕いて油分が出るまでペースト状に挽き上げたフランス菓子に欠かせない香り素材","j":"プラリネ","t":"ローストナッツの香ばしいコクとキャラメルのほろ苦い甘みがぎゅっと凝縮された、ねっとりと奥深い芳醇な風味","z":"17世紀の元帥プララン公の料理人が考案したとされる","g":"生地・クリーム・製菓技法"},{"f":"Île flottante","r":"イル・フロタント","c":"デザート","m":"冷たいクレーム・アングレーズの海に、牛乳でふんわりゆでた（ポシェした）メレンゲを島のように浮かべ、カラメルソースとスライスアーモンドをかけた「浮き島」の古典菓子","j":"浮き島","t":"口の中でしゅわっと溶ける雲のように軽いメレンゲに、バニラ香るなめらかなカスタードとほろ苦いカラメルが絶妙に絡み合う","z":"「浮き島」の意味。カラメルをかけることも多い","g":"冷菓・皿盛りデザート"},{"f":"Abaisser","r":"アベセ","c":"調理法","m":"タルト生地やパイ生地などをめん棒で均一な厚さに薄く伸ばす作業。伸ばし終えた生地そのものを「アベス」と呼ぶこともある","j":"生地をのばす","z":"のばす前に生地を休ませると、縮みにくい","g":"下処理・仕込み"},{"f":"À couvert / à découvert","r":"ア・クヴェール / ア・デクヴェール","c":"調理法","m":"鍋に蓋をして蒸気を閉じ込めたまま加熱すること（ア・クヴェール）／蓋をせずに水分を飛ばしながら加熱すること（ア・デクヴェール）。蒸し煮と煮詰めの使い分けの基準","j":"蓋をして／蓋をせずに","z":"蓋をすると蒸気がこもり、外すと水分が飛んで煮詰まる","g":"加熱・火入れ"},{"f":"Adoucir","r":"アドゥスィール","c":"調理法","m":"料理やソースの強すぎる酸味・苦味・塩気を、砂糖やクリーム、バターなどを少量加えて角を取り、まろやかに整えること","j":"やわらげる","z":"砂糖やクリーム、バターを少量加えて角を取る","t":"尖った酸味や苦味の角が取れ、舌当たりの丸い調和のとれたまろやかな味わいに整う","g":"調味・仕上げ"},{"f":"Aigre-doux","r":"エーグル・ドゥ","c":"調理法","m":"甘味と酸味が調和した味わい、またはその仕立て（ガストリックなど）。鴨や豚肉に柑橘やベリーを合わせる料理によく用いられる","j":"甘酸っぱい","z":"鴨に果物を合わせる料理やガストリックによく使われる","t":"カラメルや果実の甘みと酢・柑橘の爽やかな酸味が響き合い、脂の濃い肉料理を軽やかに引き立てる","g":"調味・仕上げ"},{"f":"Ailler","r":"アイエ","c":"調理法","m":"仔羊のローストなどににんにくの薄切りを差し込んで風味を移したり、サラダボウルやグラタン皿、焼きパンににんにくの切り口をこすりつけて香りだけを添える技法","j":"にんにくの香りをつける","z":"にんにくをボウルにこすりつけて、香りだけをうつす方法もある","t":"にんにくを直接食べずとも、ほのかで上品な芳香が料理全体や器からふわりと立ち上る","g":"調味・仕上げ"},{"f":"Allonger","r":"アロンジェ","c":"調理法","m":"煮詰まりすぎて濃くなったソースやスープに、だし・ブイヨン・水・クリームなどの液体を少しずつ足して、ちょうどよい濃度と塩加減に伸ばし整える作業","j":"のばす","z":"ソースが濃すぎるときに、だしや水で調整する","g":"調味・仕上げ"},{"f":"À l’anglaise","r":"ア・ラングレーズ","c":"調理法","m":"2つの意味を持つ調理法。①野菜や魚を塩湯でシンプルにゆでる「イギリス風」②肉や魚に小麦粉・溶き卵・パン粉の順で衣をつけて揚げ焼きにする衣付けの技法","j":"水だけでゆでる／衣をつけて揚げる","z":"衣は小麦粉、溶き卵、パン粉の順につける","t":"①は素材本来の素朴な甘みが活き、②はサクッと香ばしい衣が中のジューシーな旨味を包み込む","g":"加熱・火入れ"},{"f":"Aplatir","r":"アプラティール","c":"調理法","m":"仔牛肉や鶏胸肉のエスカロップなどを、ラップの間にはさんで肉叩き（バット）で均一な厚さに叩き伸ばす下処理。筋を切り、短時間でムラなく火を通すために行う","j":"肉を叩いて平らにする","z":"ラップではさんで叩くと破れにくい","t":"筋が断たれて柔らかく口当たりがよくなり、強火でさっと焼いてもパサつかずしっとり仕上がる","g":"下処理・仕込み"},{"f":"Appareil","r":"アパレイユ","c":"コース・その他","m":"キッシュの卵液、クレープやマドレーヌの生地、スフレのベースなど、焼成や加熱の直前まで混ぜ合わせて用意した生地種・液状の素の総称","j":"アパレイユ（生地種）","z":"プリンやキッシュ、クレープなど、混ぜ合わせた液状の素","g":"調理基礎・表現"},{"f":"Arroser","r":"アロゼ","c":"調理法","m":"ローストやポワレの途中で、鍋底にたまった焼き汁や溶かしバターをスプーンで何度も食材に回しかける技法。乾燥を防ぎ香ばしい照りを出す","j":"回しかける","z":"ローストでは焼き汁をかけ続けて、香りと照りをつける","t":"表面は香ばしく艶やかな焼き色がつき、焼き汁やバターの風味が幾重にも重なってしっとりジューシーに仕上がる","g":"調味・仕上げ"},{"f":"Assaisonner","r":"アセゾネ","c":"調理法","m":"塩・こしょうをはじめ、ハーブやスパイス、酸味を加えて料理の味付けをバランスよく整えること。仕上げだけでなく調理の途中で段階的に行うのが基本","j":"味を整える","z":"最後だけでなく、途中でも少しずつ行う","t":"素材の甘みや旨味の輪郭がくっきり際立ち、全体の味がぴたりと引き締まる","g":"調味・仕上げ"},{"f":"Battre","r":"バットル","c":"調理法","m":"泡立て器などで卵や生クリームを空気を含ませるように混ぜる・泡立てること。また、肉をたたいて筋を切り厚みを整える意味でも使う","j":"泡立てる・たたく","z":"卵白を泡立てるときは、油分がボウルにつかないようにする","g":"下処理・仕込み"},{"f":"Blondir","r":"ブロンディール","c":"調理法","m":"玉ねぎやエシャロット、小麦粉（ルー）などを弱火〜中火のバターで焦がさないよう注意しながら、ごく淡い黄金色（ブロンド色）に色づくまで炒める技法","j":"薄く色づける","z":"玉ねぎやエシャロットを焦がさず炒めて、ソースや煮込みの土台にする","t":"焦げの苦味を出さずに香味野菜の甘みとほのかな香ばしさを引き出し、上品なソースや煮込みの土台を作る","g":"加熱・火入れ"},{"f":"Bleu","r":"ブルー","c":"コース・その他","m":"表面だけを強火でさっと焼き固め、中心はほぼ生のまま温める程度の最もレアな焼き加減。赤身の牛肉ステーキで好まれる","j":"ブルー（超レア）","t":"生肉に近いとろりとした柔らかさと、鉄分を感じるフレッシュな赤身の旨味","z":"ステーキの焼き加減で最も生に近い","g":"火入れ・食感"},{"f":"Brider","r":"ブリデ","c":"調理法","m":"丸鶏や鴨、塊肉が加熱中に形崩れせず均一に火が通るよう、タコ糸（フィセル）で脚や翼を胴体に密着させてきれいに縛り整える下処理","j":"糸で縛る","z":"加熱中に形が崩れず、火も均一に通る","g":"下処理・仕込み"},{"f":"Canapé","r":"カナペ","c":"コース・その他","m":"小さく切ったトーストやクラッカーの上に、スモークサーモン・フォアグラ・チーズ・パテなどを彩りよくのせた一口サイズの前菜・おつまみ","j":"カナッペ","z":"名は「長椅子（ソファ）」に由来。パンの上に具がのる姿から","t":"カリッと香ばしいパンの土台に、塩気や旨味の濃い具材が調和し、シャンパーニュや食前酒と軽やかに楽しめる","g":"調理基礎・表現"},{"f":"Canneler","r":"カヌレ","c":"調理法","m":"専用器具（カヌルール）を使い、レモンやオレンジの皮、にんじんやきゅうりの外周に等間隔の縦溝を彫る飾り切り。輪切りにすると花びらのような断面になる","j":"縦に溝を彫る","z":"菓子の「カヌレ」は、この「溝のある」という意味の語から来ている","g":"切り方・成形"},{"f":"Caramel","r":"カラメル","c":"コース・その他","m":"砂糖に少量の水を加えて（または砂糖のみで）170℃前後まで加熱し、香ばしい褐色に焦がした飴状のもの。プリンの底やソース、菓子の香り付けに使う","j":"カラメル","t":"砂糖の甘みが焦げることで生まれる、ほろ苦く香ばしい大人のコクと芳醇な香りが料理や菓子に深みを添える","z":"砂糖を170℃前後に加熱すると色づく","g":"調理基礎・表現"},{"f":"Chambrer","r":"シャンブレ","c":"調理法","m":"冷蔵庫から出したバターやチーズ、赤ワインなどを食べる・使う前に室温に置いて適温に戻すこと。香りや食感を最大限に引き出すための工程","j":"室温に戻す","z":"バターやチーズ、ワインにも使う語","g":"下処理・仕込み"},{"f":"Chemiser","r":"シュミゼ","c":"調理法","m":"テリーヌ型やタルト型、プリン型の内側に、ベーコン・パイ生地・ゼリー・薄切り野菜・カラメルなどを隙間なくきれいに敷き詰める工程","j":"型に敷き詰める","z":"テリーヌ型にベーコンを敷く場合などに使う","g":"下処理・仕込み"},{"f":"Clouter","r":"クルテ","c":"調理法","m":"皮をむいた玉ねぎにローリエの葉を添え、クローブ（丁子）を数本刺し留める（オニオン・クルテ）技法。ベシャメル用の牛乳やポトフのブイヨンに穏やかな香りを移す","j":"クローブを刺す","z":"ローリエとクローブを刺した玉ねぎ（オニオン・クルテ）は、ベシャメルの風味づけに使う","t":"クローブとローリエの上品で温かみのあるスパイス香が、乳製品や肉の臭みを消して奥行きを添える","g":"下処理・仕込み"},{"f":"Croûton","r":"クルトン","c":"コース・その他","m":"食パンやバゲットを角切りや薄切りにして、バターや油でカリッと香ばしく焼いたもの。ポタージュやシーザーサラダ、魚のスープに添える","j":"クルトン","t":"噛むとカリッと軽快で、バターと焼いたパンの香ばしさが広がる","z":"スープやサラダにのせる","g":"調理基礎・表現"},{"f":"Décanter","r":"デカンテ","c":"調理法","m":"液体を静かに置いて濁りや澱（おり）を底に沈め、澄んだ上澄みだけを別容器へ移すこと。澄ましバター作りや熟成ワインのデカンタージュに使う","j":"上澄みを分ける","z":"ワインでは、澱を分けて別の容器に移すことも指す","g":"下処理・仕込み"},{"f":"Décortiquer","r":"デコルティケ","c":"調理法","m":"エビやカニ、貝類などの硬い殻や、そら豆・ナッツの皮を丁寧に取り除く下処理。外した甲殻類の殻はソースやビスクのだしに活用する","j":"殻をむく","z":"えびやかになどの殻は、だしに取っておく","g":"下処理・仕込み"},{"f":"Découper","r":"デクペ","c":"調理法","m":"焼き上げた塊肉や丸鶏、大きな魚などを、食べやすい大きさ・美しい断面に切り分けること。客席のワゴン上で行うサービスも指す","j":"切り分ける","z":"ロースト肉は休ませてから切り分ける","g":"切り方・成形"},{"f":"Dégorger","r":"デゴルジェ","c":"調理法","m":"仔牛の胸腺（リ・ド・ヴォー）や脳などの内臓肉を流水にさらして血抜きをしたり、なすやきゅうりに塩を振って余分な水分やアク・えぐみを引き出す下処理","j":"血や水分、アクを抜く","z":"内臓肉は水に浸して血を抜く","t":"血生臭さや雑味、えぐみが取り除かれ、すっきり上品で澄んだ素材の味わいに整う","g":"下処理・仕込み"},{"f":"Dégraisser","r":"デグレセ","c":"調理法","m":"煮込みやフォン、ソースの表面に浮き上がってきた余分な油脂を、お玉や紙で丁寧にすくい取ること。雑味を除きキレのある味に仕上げる","j":"脂を除く","z":"冷やして固まった脂は、簡単に取れる","g":"下処理・仕込み"},{"f":"Délayer","r":"デレイエ","c":"調理法","m":"小麦粉やコーンスターチ、ペースト状の調味料などを、少量の水やだし・牛乳で少しずつ溶いてなめらかに伸ばす下作業","j":"溶きのばす","z":"粉類はだまにならないよう、少しずつ液体で溶く","g":"下処理・仕込み"},{"f":"Démouler","r":"デムレ","c":"調理法","m":"プリンやババロア、テリーヌ、焼き菓子などを、形を崩さないように型からきれいに外して皿へ取り出すこと","j":"型から取り出す","z":"少し温めたり湯にくぐらせると、取り出しやすい","g":"調味・仕上げ"},{"f":"Dénoyauter","r":"デノワイヨテ","c":"調理法","m":"さくらんぼ、オリーブ、プラム、デーツなど、果肉の中心にある硬い種を取り除く下処理","j":"種を除く","z":"さくらんぼ用の専用器具がある","g":"下処理・仕込み"},{"f":"Désosser","r":"デゾセ","c":"調理法","m":"肉や魚から骨を丁寧に取り外す下処理。鶏の丸ごと骨抜き（バロティーヌ用）や、魚の三枚おろし・中骨抜きなどに使う","j":"骨を外す","z":"骨を抜いた鶏を詰め物で巻く「バロティーヌ」などに使う","g":"下処理・仕込み"},{"f":"Dessaler","r":"デサレ","c":"調理法","m":"塩ダラ（モリュ）や塩漬け豚肉、ケッパーなどをたっぷりの水や牛乳に浸して、余分な塩分を抜く下処理","j":"塩抜きをする","z":"塩ダラは水を替えながら、1〜2日ほど浸す","g":"下処理・仕込み"},{"f":"Détailler","r":"デタイエ","c":"調理法","m":"伸ばしたパイ生地やクッキー生地を抜き型で抜いたり、肉や野菜を一定の大きさ・形に細かく切り分けること","j":"切り分ける・型で抜く","z":"生地を型で抜くときにも使う","g":"切り方・成形"},{"f":"Dorer","r":"ドレ","c":"調理法","m":"パイ包み焼きやブリオッシュ、ガレット・デ・ロワなどの表面に、少量の水や牛乳で溶いた卵黄を刷毛で塗り、オーブンで艶やかな黄金色の焼き色をつける仕上げ工程","j":"卵黄を塗る","z":"卵黄に少量の水や牛乳を混ぜると、つやのある焼き色になる","t":"表面にパリッと香ばしい焼き目と食欲をそそる美しい光沢が生まれる","g":"調味・仕上げ"},{"f":"Dresser","r":"ドレセ","c":"調理法","m":"完成した料理やソース、付け合わせをバランスよく美しく皿に盛り付ける仕上げの工程","j":"盛りつける","z":"皿の縁は、布巾で拭いてから出す","g":"調味・仕上げ"},{"f":"Duxelles","r":"デュクセル","c":"コース・その他","m":"マッシュルームなどのきのことエシャロットを細かくみじん切りにし、バターで水分が完全に飛ぶまでじっくり炒め詰めた詰め物・ソース用の旨味ベース","j":"デュクセル","t":"水分を飛ばして凝縮させたきのこの芳醇な森の香りと強い旨味に、エシャロットとバターの甘みが溶け合った濃厚な味","z":"名は17世紀の侯爵デュクセルにちなむとされる。ウェリントンや詰め物に使う","g":"調理基礎・表現"},{"f":"Ébullition","r":"エビュリスィヨン","c":"コース・その他","m":"液体が沸点に達して大きく泡立って沸騰した状態。だしを取る際は沸騰させず、パスタをゆでる際は沸騰を保つなど火加減の基準になる","j":"沸騰","z":"沸騰させるか直前で止めるかで仕上がりが変わる。クリーム系のソースは沸騰させると分離しやすい","g":"調理基礎・表現"},{"f":"Écailler","r":"エカイエ","c":"調理法","m":"魚の体表にあるうろこを包丁やうろこ取りで丁寧に取り除く下処理。また、レストランで生牡蠣を開けて提供する専門職も指す","j":"うろこを取る","z":"牡蠣を開ける人（エカイエ）も同じ語で呼ぶ","g":"下処理・仕込み"},{"f":"Écosser","r":"エコセ","c":"調理法","m":"グリーンピースやそら豆、いんげん豆などのさやを割り、中の豆を取り出す下処理","j":"さやから出す","z":"グリーンピースやそらまめに使う","g":"下処理・仕込み"},{"f":"Écraser","r":"エクラゼ","c":"調理法","m":"にんにくやじゃがいも、ベリー類などを包丁の腹やフォーク、マッシャーで押しつぶす作業。香りを引き出したり粗いピューレにする際に使う","j":"押しつぶす","z":"にんにくは包丁の腹でつぶすと、香りが出る","g":"下処理・仕込み"},{"f":"Écumer","r":"エキュメ","c":"調理法","m":"ブイヨンや煮込み、ジャムなどを加熱した際に表面に浮くアクや泡、不純物を網じゃくしやお玉でこまめにすくい取ること","j":"アクをすくう","z":"ブイヨンは、アクをこまめに取ると澄む","g":"下処理・仕込み"},{"f":"Égoutter","r":"エグテ","c":"調理法","m":"ゆでた野菜やパスタ、揚げた食材、水切りするチーズなどをザルや網に上げ、余分な水分や油をしっかり切ること","j":"水気を切る","z":"ゆでた野菜は、ザルにあげてしっかり切る","g":"下処理・仕込み"},{"f":"Émincer","r":"エマンセ","c":"調理法","m":"玉ねぎ、きのこ、肉などを均一な厚さに薄切り（スライス）にすること。火の通りをそろえ、口当たりを良くする基本の切り方","j":"薄切りにする","z":"玉ねぎは繊維に沿って切ると、加熱しても形が残る","g":"切り方・成形"},{"f":"Émonder","r":"エモンデ","c":"調理法","m":"トマトや桃、アーモンドなどを熱湯にさっとくぐらせてから冷水に取り、薄皮をつるりとむく下処理","j":"湯むきする","z":"トマトは先に十字の切り込みを入れる。モンデとも言う","g":"下処理・仕込み"},{"f":"Enrober","r":"アンロベ","c":"調理法","m":"食材の表面全体をソース、衣、溶かしチョコレート、キャラメルなどでムラなく包み込むように覆うこと","j":"全体を覆う","z":"チョコレートでコーティングする意味でも使う","g":"調味・仕上げ"},{"f":"Épaissir","r":"エペスィール","c":"調理法","m":"ルー、ブール・マニエ、卵黄（リエゾン）、コーンスターチ、あるいは煮詰めによって、ソースやスープにほどよいとろみをつけること","j":"とろみをつける","z":"ルー、ブール・マニエ、リエゾン、煮詰めなど方法がいくつもある","g":"調味・仕上げ"},{"f":"Escalope","r":"エスカロップ","c":"コース・その他","m":"仔牛肉や鶏胸肉、サーモンなどを薄くそぎ切りにした切り身。肉は叩いて厚みを均一にし、短時間でソテーやカツレツに仕立てる","j":"エスカロップ（薄切り肉）","z":"叩いて薄くし、短時間で焼く","g":"調理基礎・表現"},{"f":"Escaloper","r":"エスカロペ","c":"調理法","m":"肉や魚、大型のきのこなどを包丁を斜めに寝かせて薄いそぎ切りにすること。断面を広くすることで火が均一に早く通る","j":"そぎ切りにする","z":"「エスカロップ（薄切り肉）」の語源","g":"切り方・成形"},{"f":"Étouffée","r":"エトゥフェ","c":"コース・その他","m":"厚手の鍋にぴったり蓋をして蒸気を逃がさず、食材自身の水分とごく少量の液体だけでじっくり蒸し煮にする調理スタイル（ア・レトゥフェ）","j":"蒸し煮","z":"蓋をして素材の水分で煮る","t":"素材の水分と香りが逃げないため、野菜や肉本来の瑞々しい甘みと旨味がそのまま凝縮したしっとり柔らかな味わい","g":"調理基礎・表現"},{"f":"Étuver","r":"エテュヴェ","c":"調理法","m":"野菜や肉・魚を鍋に入れ、バターとごく少量の水分（または素材自身の水分のみ）でぴったり蓋をして、色づけずに弱火でじっくり蒸し煮にする調理法","j":"蒸し煮にする","z":"色づけず、少量の水分で蓋をして火を通す","t":"素材の水分と甘みが逃げずに凝縮され、しっとりと柔らかくやさしい味わいに仕上がる","g":"加熱・火入れ"},{"f":"Faisander","r":"フェザンデ","c":"調理法","m":"狩猟したキジやヤマウズラ、野うさぎなどのジビエを、羽毛や皮つきのまま低温の風通しのよい場所で数日〜1週間ほど吊るして寝かせ、肉を熟成させる伝統技法","j":"熟成させる","z":"名は雉（フェザン）に由来する","t":"硬い繊維がほぐれて驚くほど柔らかくなり、ジビエならではの濃厚な旨味と芳醇で奥深い熟成香が引き出される","g":"下処理・仕込み"},{"f":"Farcir","r":"ファルスィール","c":"調理法","m":"丸鶏や野菜（トマト・ズッキーニ等）、イカなどの内側をくり抜いて、ひき肉やデュクセルなどの詰め物（ファルス）を詰める調理法","j":"詰め物をする","z":"詰め物は「ファルス」と呼ぶ","g":"下処理・仕込み"},{"f":"Fariner","r":"ファリネ","c":"調理法","m":"魚や肉の水分を拭き取ってから表面に薄く小麦粉をまぶす下処理。ムニエルで香ばしい焼き色をつけたり、煮込みに自然なとろみをつける","j":"小麦粉をまぶす","z":"ムニエルでは、余分な粉を落としてから焼く","g":"下処理・仕込み"},{"f":"Fouet","r":"フエ","c":"厨房・道具","m":"卵白や生クリームの泡立て、ソースの乳化や攪拌に使う金属製の泡立て器（ホイッパー）","j":"泡立て器","z":"ワイヤーが多いほど細かく泡立つ","g":"調理器具"},{"f":"Frémir","r":"フレミール","c":"調理法","m":"鍋の中のブイヨンやソース、ポシェ用の液を、ぐらぐら沸騰させず表面がかすかに揺らぐ程度（85〜95℃前後）の静かな火加減に保つこと","j":"沸騰直前で保つ","z":"表面がかすかに揺れる程度。アクが出にくく、澄んだだしが取れる","t":"アクや濁りが出にくいためだしが透き通り、肉や魚も硬くならずしっとり柔らかく仕上がる","g":"加熱・火入れ"},{"f":"Fricassée","r":"フリカセ","c":"コース・その他","m":"鶏肉や仔牛肉を焼き色をつけずに軽く炒め、白ワインや白いブイヨンで煮込んでから生クリームと卵黄で白く仕上げる伝統的な白い煮込み料理","j":"フリカセ","t":"柔らかく煮えた肉のやさしい旨味と、クリームとだしのまろやかで上品なコクが調和したほっとする味わい","z":"鶏や仔牛を白く炒めて煮込み、クリームでつなぐ","g":"調理基礎・表現"},{"f":"Frire","r":"フリール","c":"調理法","m":"たっぷりの油を高温に熱し、食材を揚げて加熱する調理法。衣をつけて揚げるベニエや、じゃがいものフリットなどに使う","j":"揚げる","z":"油の温度が低いと、衣が油を吸う","t":"高温の油で手早く揚げることで、外側はカリッと香ばしく、内側は水分を保ってジューシーに仕上がる","g":"加熱・火入れ"},{"f":"Garnir","r":"ガルニール","c":"調理法","m":"主菜となる肉や魚の皿に、野菜のグラッセやピューレなどの付け合わせ（ガルニチュール）を彩りよく添えること。また、タルト型やシューにクリームを詰める作業も指す","j":"付け合わせを添える","z":"付け合わせは「ガルニチュール」と呼ぶ","g":"調味・仕上げ"},{"f":"Glacer","r":"グラセ","c":"調理法","m":"にんじんや小玉ねぎをバター・砂糖・少量のだしで煮詰めて艶を出すこと。また、料理の表面にソースをかけて焼き色をつけたり、菓子に糖衣をかけることも指す","j":"照りをつける","z":"にんじんなどを砂糖とバターで煮て、つやを出す調理も指す","t":"煮詰めたバターと砂糖の照りが素材を包み、まろやかな甘みと香ばしい艶のある味わいに仕上がる","g":"調味・仕上げ"},{"f":"Grumeau","r":"グリュモー","c":"コース・その他","m":"小麦粉や片栗粉を液体に加えた際、うまく混ざりきらずに粒状に固まってしまったダマのこと","j":"だま","z":"粉は液体に少しずつ加えて混ぜると防げる","g":"調理基礎・表現"},{"f":"Hacher","r":"アシェ","c":"調理法","m":"パセリやにんにく、玉ねぎ、肉などを包丁やミンサーで細かくみじん切り・ひき肉にすること","j":"みじん切りにする","z":"ひき肉は「ヴィアンド・アシェ」と呼ぶ","g":"切り方・成形"},{"f":"Inciser","r":"アンスィゼ","c":"調理法","m":"鴨の皮目や魚の身、焼く前のパン生地などに包丁やナイフで浅く切り込みを入れること。脂を落としやすくし、火の通りや見栄えを整える","j":"切り込みを入れる","z":"鴨の皮目に格子状に入れると、焼くときに脂が出やすい","g":"切り方・成形"},{"f":"Incorporer","r":"アンコルポレ","c":"調理法","m":"泡立てた卵白やバター、スパイスなどの材料を、ベースとなる生地やソースへムラなく丁寧に混ぜ込むこと","j":"混ぜ込む","z":"泡立てた卵白は、底から返すように切り混ぜる","g":"下処理・仕込み"},{"f":"Macédoine","r":"マセドワーヌ","c":"コース・その他","m":"にんじん・かぶ・じゃがいも・いんげんなどを5mmほどの小さな角切りにしてゆで、マヨネーズやバターで和えた彩り豊かな取り合わせ（果物の角切りも指す）","j":"マセドワーヌ","z":"名はマケドニアにちなみ、さまざまな具の取り合わせを表すとされる","t":"小さく切りそろえた数種の野菜や果物の軽快な歯ざわりと、それぞれの甘み・酸味がひと口ごとに楽しく広がる","g":"調理基礎・表現"},{"f":"Macérer","r":"マセレ","c":"調理法","m":"果物やドライフルーツなどを洋酒やシロップ、果汁にしばらく漬け込み、香りと風味をじっくり染み込ませる手法","j":"漬け込む","z":"果物を酒や砂糖に漬けて、デザートに使う","t":"洋酒やシロップの芳醇な香りと甘みが果物の芯までじっくり染み込み、奥行きのある華やかな風味になる","g":"下処理・仕込み"},{"f":"Médaillon","r":"メダイヨン","c":"コース・その他","m":"牛・仔牛のヒレ肉やフォアグラ、オマール海老の尾などを、メダルのように美しい円形や楕円形の厚切りに整えた切り身・盛り付けスタイル","j":"メダイヨン","z":"名は「メダル」から。ヒレ肉やロブスターに使う","g":"調理基礎・表現"},{"f":"Monder","r":"モンデ","c":"調理法","m":"トマトや桃、ナッツ類などを熱湯にくぐらせて薄皮をむく下処理（エモンデと同義）","j":"湯むきする","z":"アーモンドの薄皮をむく場合にも使う。エモンデとも言う","g":"下処理・仕込み"},{"f":"Mouiller","r":"ムイエ","c":"調理法","m":"炒めた肉や香味野菜の入った鍋に、水・ワイン・ブイヨン・フォンなどの液体を注ぎ入れ、煮込みやスープ・ソースの煮汁を作る基本工程","j":"液体を加える","z":"ワインやフォンを注いで煮汁を作る","g":"下処理・仕込み"},{"f":"Mouillette","r":"ムイエット","c":"コース・その他","m":"細長くスティック状に切ったトーストやパン。半熟卵（ウフ・ア・ラ・コック）のとろりとした黄身につけて食べるフランスの定番スタイル","j":"ムイエット","z":"「濡らす」から。半熟卵の黄身をつけて食べる","g":"調理基礎・表現"},{"f":"Paner","r":"パネ","c":"調理法","m":"肉や魚、コロッケなどにパン粉（シャプリュール）の衣をつける作業。小麦粉・溶き卵・パン粉の順につけるのが基本","j":"パン粉をつける","z":"「ア・ラングレーズ」の手順で衣をつけることが多い","g":"下処理・仕込み"},{"f":"Pétrir","r":"ペトリール","c":"調理法","m":"パン生地やブリオッシュ、パスタ生地などを手やミキサーでしっかりこねて、滑らかさとコシ（グルテン）を引き出す工程","j":"こねる","z":"パン生地は、グルテンができるまでこねる","g":"下処理・仕込み"},{"f":"Pincée","r":"パンセ","c":"コース・その他","m":"親指と人差し指で軽くつまめるくらいの、ごく少量の塩やスパイスを表す計量の目安","j":"ひとつまみ","z":"塩やスパイスの量を表す、親指と人差し指でつまむ量","g":"調理基礎・表現"},{"f":"Piquer","r":"ピケ","c":"調理法","m":"肉に細切りの背脂やにんにくを差し込むこと。また、タルト生地が焼成中に膨らまないようフォークで小さな空気穴をあける作業も指す","j":"刺す","z":"豚の背脂を刺す「ラルデ」や、フォークで穴をあける意味でも使う","g":"下処理・仕込み"},{"f":"Poêler","r":"ポワレ","c":"調理法","m":"本来は厚手の鍋に油脂と香味野菜を入れ、蓋をして蒸し焼きにする調理法。日本ではフライパンで皮目をパリッと焼くソテーを指すことが多い","j":"蓋をして蒸し焼きにする","z":"日本の料理では「ポワレ」が、皮をパリッと焼くソテーを指すことも多い","t":"古典の蒸し焼きはしっとり香ばしく、現代のフライパン焼きは皮がパリパリ、身はふっくらジューシーに仕上がる","g":"加熱・火入れ"},{"f":"Pommade","r":"ポマード","c":"コース・その他","m":"バターを室温に置いて、軟膏（ポマード）のように指がすっと入るほど柔らかく練り上げた状態。パウンドケーキやクレーム・ダマンド作りに欠かせない","j":"ポマード状","z":"バターを室温でやわらかくし、お菓子の生地に使う","g":"調理基礎・表現"},{"f":"Rafraîchir","r":"ラフレシール","c":"調理法","m":"ゆでた野菜や卵などをすぐに氷水や冷水にとって急冷すること。余熱による火の通りすぎを防ぎ、鮮やかな色と食感を保つ","j":"冷水で冷やす","z":"ゆでた野菜を氷水で冷やして、色を止める","g":"下処理・仕込み"},{"f":"Ragoût","r":"ラグー","c":"コース・その他","m":"一口大に切った肉や魚介、野菜を炒めてからだしやワインでじっくり煮込んだ料理の総称。ナヴァランやシヴェなども含まれる","j":"ラグー","t":"じっくり煮込んだ肉や野菜の旨味が煮汁にたっぷり溶け出し、とろりと濃厚で奥深いコクが具材に染み込んだ味わい","z":"「食欲を取り戻させる」という意味の動詞に由来","g":"調理基礎・表現"},{"f":"Réchauffer","r":"レショフェ","c":"調理法","m":"あらかじめ調理しておいた料理やソースを、風味や食感を損なわないよう適切な温度・方法で温め直すこと","j":"温め直す","z":"ソースは沸騰させず、穏やかに温め直す","g":"加熱・火入れ"},{"f":"Relever","r":"ルルヴェ","c":"調理法","m":"こしょうやカイエンペッパー、マスタード、酢、レモン汁、ハーブなどを少量加えて、ぼんやりした料理やソースの味にきりっとした輪郭とアクセントをつけること","j":"風味を引き立てる","z":"酢やレモン、スパイスで味の輪郭を出す","t":"酸味やスパイスの刺激が味全体を引き締め、キレのあるメリハリの効いた印象に変わる","g":"調味・仕上げ"},{"f":"Remuer","r":"ルミュエ","c":"調理法","m":"鍋底が焦げ付かないよう、また素材やとろみが均一に混ざるよう、木べらや泡立て器でソースや煮込みをかき混ぜること","j":"かき混ぜる","z":"ソースは鍋底からゆっくり混ぜる","g":"下処理・仕込み"},{"f":"Revenir","r":"ルヴニール","c":"調理法","m":"煮込みなどの前工程として、肉や香味野菜を少量の油脂で軽く炒め、表面に香ばしい焼き色と風味をつけること","j":"軽く炒める","z":"「ファール・ルヴニール」は、煮込みの最初に焼き色をつける工程","t":"表面の香ばしい焼き色が煮込み全体やソースに深いコクと食欲をそそる香りをもたらす","g":"加熱・火入れ"},{"f":"Rissoler","r":"リソレ","c":"調理法","m":"強火の油脂で肉やじゃがいもなどの表面をこんがりときつね色に焼き上げること。香ばしさとカリッとした食感を生む","j":"強火で焼き色をつける","z":"表面をこんがり色づける","t":"外側はきつね色にカリッと香ばしく、中はホクホク・ジューシーに焼き上がる","g":"加熱・火入れ"},{"f":"Saignant","r":"セニャン","c":"コース・その他","m":"表面は香ばしく焼き、中心部は鮮やかな赤色で温かく肉汁がたっぷり残るレアの焼き加減。赤身肉のステーキで最も人気が高い","j":"レア","t":"ジューシーで柔らかく、肉本来のフレッシュな旨味が口いっぱいに広がる","z":"「血の滴る」の意味","g":"火入れ・食感"},{"f":"Saupoudrer","r":"ソプードレ","c":"調理法","m":"粉砂糖、ココア、小麦粉、おろしチーズ、刻みハーブなどを料理や菓子の表面に雪のように薄く振りかけること","j":"振りかける","z":"粉砂糖やチーズを上から振る","g":"調味・仕上げ"},{"f":"Singer","r":"サンジェ","c":"調理法","m":"炒めた肉や野菜に小麦粉を薄く振り入れ、粉臭さがなくなるまで軽く炒めてから液体（ワインやだし）を注ぎ、煮込みにとろみをつけるフランスの伝統技法","j":"小麦粉を振る","z":"炒めた肉や野菜に小麦粉を振って、煮汁にとろみをつける","t":"煮汁に自然なとろみと香ばしいコクが生まれ、具材にソースがしっかり絡むようになる","g":"調味・仕上げ"},{"f":"Suc","r":"スュック","c":"コース・その他","m":"肉や魚を焼いた際に鍋底にこびりつく、旨味が凝縮した褐色の焼き汁・焦げ目のこと。ワインやだしで溶かし出し（デグラセ）ソースの核にする","j":"肉汁","z":"焼いた鍋底につく焼き汁。デグラセしてソースに使う","g":"調理基礎・表現"},{"f":"Suer","r":"スュエ","c":"調理法","m":"刻んだ玉ねぎやポロねぎ、きのこなどに少量の塩とバターを加え、蓋をして弱火で色づけずに「汗をかかせる」ように水分と甘みを引き出す基本技法","j":"汗をかかせる","z":"玉ねぎを色づけず水分を出して、甘みを引き出す","t":"焦げの苦味を出さずに野菜本来の澄んだ甘みと旨味を最大限に引き出せる","g":"加熱・火入れ"},{"f":"Tailler","r":"タイエ","c":"調理法","m":"野菜や肉をジュリエンヌやブリュノワーズなど、料理の目的に合わせて一定の大きさ・形に切りそろえること","j":"切り整える","z":"形をそろえると、火の通りが均一になる","g":"切り方・成形"},{"f":"Tomber","r":"トンベ","c":"調理法","m":"ほうれん草や玉ねぎ、トマトなどの水分が多い野菜をバターや油で加熱し、水分を飛ばしてかさがぐっと減り、くったり柔らかくなるまで炒め煮にすること","j":"水分を出して煮つめる","z":"ほうれん草や玉ねぎ、トマトのかさが減るまで加熱する","t":"余分な水っぽさが抜けて野菜の甘みと旨味がぎゅっと凝縮し、しっとり滑らかな口当たりになる","g":"加熱・火入れ"},{"f":"Tourte","r":"トゥルト","c":"コース・その他","m":"丸い型にパイ生地を敷き、肉・ジビエ・魚介・きのこなどの具材を詰めて上から生地の蓋をかぶせて焼くパイ料理","j":"トゥルト","z":"名は丸いパンを意味する言葉に由来。ジビエやきのこを詰める","g":"調理基礎・表現"},{"f":"Tremper","r":"トランペ","c":"調理法","m":"乾燥豆や干しきのこを水に戻したり、ババやサヴァランの生地にシロップをたっぷり染み込ませるため液体に浸すこと","j":"浸す","z":"乾物や豆を水に戻すときに使う","g":"下処理・仕込み"},{"f":"Tronçon","r":"トロンソン","c":"コース・その他","m":"うなぎや大型の白身魚、サーモンなどを骨付きのまま厚めの輪切り（筒切り）にした切り方。ポシェや煮込みで身崩れしにくい","j":"筒切り","z":"大きな魚を骨付きのまま輪切りにする","g":"調理基礎・表現"},{"f":"Trou normand","r":"トル・ノルマン","c":"コース・その他","m":"ノルマンディ地方の伝統で、フルコースの途中でりんごの蒸留酒カルヴァドス（またはソルベに注いだもの）を少量飲み、胃をすっきりさせる口直し","j":"トル・ノルマン","t":"カルヴァドスの芳醇なりんごの香りとキレのあるアルコール感が口中の脂をさっぱり洗い流し、次の皿への食欲を呼び戻す","z":"「ノルマンディの穴」の意味。お腹に隙間を作り次の料理に備える","g":"コース・構成"},{"f":"Palourde","r":"パルルド","j":"あさり","c":"食材","g":"魚介類","t":"ほどよい甘みとぷりっとした身質、そして澄んで力強い貝のだしが白ワインやハーブと溶け合う","z":"白ワイン蒸しやスープに向く。アサリに近いが種は異なる","m":"ヨーロッパ沿岸で獲れる二枚貝。日本のアサリに近い食材で、白ワイン蒸しや貝だしを取る料理に使う","d":"パルルドの白ワイン蒸し（マリニエール）、貝類のナージュ、魚のスープ"},{"f":"Chinchard","r":"シャンシャール","j":"あじ","c":"食材","g":"魚介類","t":"脂は控えめながら青魚らしい引き締まった旨味とコクがあり、酢や柑橘・白ワインの酸味と好相性","z":"アジの仲間。マリネや焼き物に使う","m":"ヨーロッパ沿岸で獲れる青魚。アジの仲間で、マリネやグリル、酢漬けなどに用いる","d":"アジのエスカベッシュ（南蛮漬け風）、マリネ、グリル"},{"f":"Lotte","r":"ロット","j":"あんこう","c":"食材","g":"魚介類","t":"ロブスターにも例えられる締まった弾力とプリッとした食感、淡白ながら噛むほどに上品な甘みがある","z":"アンコウ。身が肉のようなので「海の仔牛」に例えられることもある","m":"深海性の白身魚（アンコウ）。フランスでは主に尾の身を使い、ローストや煮込みに仕立てる","d":"アンコウのロティ、アンコウのアメリケーヌソース、ブイヤベース、ブランケット"},{"f":"Calamar / calmar","r":"カラマール","j":"いか","c":"食材","g":"魚介類","t":"ほどよい弾力と噛むほどに広がるやさしい甘みがあり、トマトやにんにく、ハーブの風味をよく吸い込む","z":"詰め物（ファルシ）や輪切りのフリットに向く","m":"軟体動物のイカ類。胴に詰め物をするファルシや、輪切りのフライ、炒め物に幅広く使う","d":"イカのファルシ（詰め物煮込み）、カラマールのフリット、プロヴァンス風ソテー"},{"f":"Seiche","r":"セッシュ","j":"こういか","c":"食材","g":"魚介類","t":"肉厚でねっとりとした濃い甘みと旨味があり、じっくり煮込むと驚くほど柔らかく墨のコクと溶け合う","z":"墨を使った煮込みが地中海沿岸に多い","m":"甲（骨）を持つ大型のコウイカ。身が厚く、地中海沿岸ではイカ墨を使った煮込みが定番","d":"コウイカの墨煮、南仏風トマト煮込み、グリル（ペルシヤード添え）"},{"f":"Encornet","r":"アンコルネ","j":"やりいか","c":"食材","g":"魚介類","t":"身が薄く柔らかで、淡く繊細な甘みがあり、さっと火を通すだけで軽快で上品な口当たりに仕上がる","z":"小型のイカ。詰め物や軽い炒めに向く","m":"細長い形をした小型のヤリイカ。身が柔らかく、詰め物やソテー、フリットに向く","d":"ヤリイカのファルシ、ヤリイカのソテー（ペルシヤード）、フリット"},{"f":"Sardine","r":"サルディーヌ","j":"いわし","c":"食材","g":"魚介類","t":"青魚ならではの豊かな脂の甘みと濃い旨味があり、炭火の香ばしさやオリーブ油・レモンと絶妙に合う","z":"ブルターニュの缶詰は高級品として知られ、年号入りの缶もある","m":"大西洋や地中海で獲れるイワシ。新鮮なものはグリルやマリネに、油漬けの缶詰も名産","d":"イワシのグリル、イワシのマリネ、ブルターニュ風オイルサーディン"},{"f":"Raie","r":"レ","j":"えい","c":"食材","g":"魚介類","t":"軟骨周りにゼラチン質が豊富で、身は繊維に沿ってほろりと繊細にほぐれ、クセのない淡白な旨味がある","z":"ブール・ノワールで食べるのが古典","m":"軟骨魚類のエイ。主にヒレ（翼）の部分をクール・ブイヨンでゆでて食べる","d":"レ・オ・ブール・ノワール（エイの焦がしバター）、エイのグルノーブル風"},{"f":"Crevette","r":"クルヴェット","j":"小えび","c":"食材","g":"魚介類","t":"ぷりっと弾ける軽快な食感と親しみやすい甘みがあり、殻を炒めると香ばしく濃厚な甲殻類の旨味が出る","z":"サラダや前菜、ビスクの風味づけに使う","m":"小ぶりのエビの総称。ゆでて前菜やサラダに使うほか、殻からソースやビスクのだしを取る","d":"小エビのカクテル（前菜）、ビスク、ジョワンヴィルソース、サラダ"},{"f":"Gambas","r":"ガンバス","j":"ガンバス（大型のえび）","c":"食材","g":"魚介類","t":"身が厚く食べ応えがあり、噛むと濃密な甘みとジューシーな旨味が弾け、グリルやフランベで香ばしさが倍増する","z":"グリルやフランベに向く。名はスペイン語由来","m":"大型のクルマエビ類。見栄えがよく食べ応えがあるため、グリルやフランベ、ソテーにする","d":"ガンバスのグリル、ガンバスのフランベ（パスティスやコニャック風味）、ポワレ"},{"f":"Huître","r":"ユイットル","j":"かき","c":"食材","g":"魚介類","t":"潮の清らかな磯の香りとクリーミーでミルキーな甘みが口いっぱいに広がり、レモンやエシャロット酢が味を引き締める","z":"生食は9月から4月ごろが目安とされ、「Rのつく月」と言われる","m":"二枚貝のカキ。フランスでは主に生食（レモンやエシャロット酢添え）やグラタンで味わう","d":"生牡蠣（エシャロットビネガー添え）、牡蠣のシャンパーニュグラタン、ノルマンドソース"},{"f":"Rascasse","r":"ラスカス","j":"かさご","c":"食材","g":"魚介類","t":"締まった白身に上品な旨味があり、特に骨や頭から驚くほど力強く芳醇な魚のだしが引き出される","z":"ブイヤベースに欠かせない魚の一つ。トゲが鋭い","m":"地中海の岩礁に棲むカサゴの仲間。骨から豊かなだしが出るため、ブイヤベースに欠かせない","d":"ブイヤベース、スープ・ド・ポワソン"},{"f":"Crabe","r":"クラブ","j":"カニ（総称）","c":"食材","g":"魚介類","t":"繊細にほぐれる身のやさしい甘みと濃厚なミソのコクがあり、殻はスープやソースに深い芳香を与える","z":"殻はビスクやソースのだしに使う","m":"カニ類の総称。ほぐした身を前菜やサラダにするほか、殻はビスクや甲殻類ソースの土台になる","d":"カニとアボカドのレムラード、ビスク、カニのテリーヌ"},{"f":"Tourteau","r":"トゥルトー","j":"イチョウガニ","c":"食材","g":"魚介類","t":"ぎっしり詰まったほぐし身の濃厚な甘みと、クリーミーでコク深いミソの旨味がマヨネーズや柑橘とよく合う","z":"ブルターニュ産が名高い。ゆでて冷やして食べる","m":"甲羅が丸く大きなイチョウガニ。ブルターニュ地方の名産で、塩ゆでにして冷製で食べることが多い","d":"イチョウガニの冷製（マヨネーズ添え）、海の幸の盛り合わせ（プラトー・ド・フリュイ・ド・メール）"},{"f":"Brochet","r":"ブロシェ","j":"カワカマス（パイク）","c":"食材","g":"魚介類","t":"川魚らしいクセのない淡白で繊細な白身で、すり身にするとクリームや甲殻類ソースのコクを美しく引き立てる","z":"すり身にした「クネル・ド・ブロシェ」が名物","m":"ヨーロッパの河川や湖に棲む大型の淡水魚（カワカマス）。小骨が多いためすり身にして使う","d":"クネル・ド・ブロシェ（ナンテュアソース）、カワカマスのブール・ブラン"},{"f":"Carrelet","r":"カルレ","j":"プレイス（カレイの仲間）","c":"食材","g":"魚介類","t":"クセのない淡白で柔らかな白身にほのかな甘みがあり、バターの香ばしさやレモン・ケッパーと軽やかに調和する","z":"ムニエルやバター焼きに向く","m":"ヨーロッパ沿岸で広く獲れるカレイの仲間（プレイス）。ムニエルやフィレのポシェなどに用いる","d":"カレイのムニエル、フィレの白ワイン蒸し（デュグレレ風）"},{"f":"Limande","r":"リマンド","j":"ダブ（小型のカレイ）","c":"食材","g":"魚介類","t":"小ぶりながらきめ細かく柔らかな白身で、淡白な中に優しい甘みがあり、丸ごと焼くと骨周りの旨味が楽しめる","z":"小型のカレイ。丸ごとムニエルにすることが多い","m":"小ぶりで身の薄いカレイの仲間（ダブ）。扱いやすく、丸ごとのムニエルやフリットに向く","d":"リマンドのムニエル、フィレのフリット（グジョネット）"},{"f":"Saumon","r":"ソモン","j":"さけ","c":"食材","g":"魚介類","t":"豊かな脂がのったとろりとなめらかな赤橙色の身で、生・半生・燻製・パイ包みとどの火入れでもコクが際立つ","z":"ミ・キュイ、マリネ、燻製など使い方が広い","m":"大西洋などで獲れるサケ。生食のカルパッチョや燻製、ミ・キュイ、パイ包みなど用途が広い","d":"サーモンのミ・キュイ、サーモン・ア・ロゼイユ、サーモン・アン・クルート、グラヴラックス"},{"f":"Maquereau","r":"マクロー","j":"さば","c":"食材","g":"魚介類","t":"青魚特有の豊かな脂と力強い旨味があり、白ワインやシードルビネガー、マスタードの酸味と抜群の相性を見せる","z":"白ワインで煮た「マクロー・オ・ヴァン・ブラン」が定番","m":"大西洋や北海で獲れるサバ。白ワイン煮やマリネ、グリルなど酸味のある仕立てがよく合う","d":"マクロー・オ・ヴァン・ブラン（サバの白ワイン煮）、サバのマリネ、マスタードソース焼き"},{"f":"Roussette","r":"ルセット","j":"小型のサメ","c":"食材","g":"魚介類","t":"軟骨魚で小骨がなく、引き締まった淡白な白身でクセが少ないため、濃厚なソースや揚げ物によくなじむ","z":"小型のサメ。市場では「ソーモネット」の名で売られることがある","m":"食用にされる小型のサメ（トラザメの仲間）。骨が少なく扱いやすいため、煮込みやフリットに使う","d":"ルセットのケッパーソース煮込み、フリット、マトロート"},{"f":"Daurade / dorade","r":"ドラッド","j":"たい","c":"食材","g":"魚介類","t":"きめ細かく上品な甘みとほどよい脂のコクがあり、丸ごと焼くと皮の香ばしさと骨周りの旨味が引き立つ","z":"塩釜焼きやオーブン焼きが定番　【日本との違い】日本のマダイとは別種","m":"地中海や大西洋で獲れるタイの仲間（ヨーロッパヘダイなど）。塩釜焼きや丸ごとのオーブン焼きが定番","d":"タイの塩釜焼き、プロヴァンス風オーブン焼き、カルパッチョ"},{"f":"Pageot","r":"パジョ","j":"まだい","c":"食材","g":"魚介類","t":"クセのない上品で淡白な白身にほのかな甘みがあり、オリーブ油や白ワイン、トマトの軽やかな仕立てによく合う","z":"地中海や大西洋で獲れる、鯛の仲間　【日本との違い】日本のマダイとは属が違い、チダイに近い仲間","m":"大西洋や地中海で獲れる赤みがかったタイの仲間。クセが少なく、ポワレやアクアパッツァ風の煮込みに使う","d":"パジョのポワレ（ソース・ヴィエルジュ）、地中海風オーブン焼き"},{"f":"Poulpe","r":"プルプ","j":"たこ","c":"食材","g":"魚介類","t":"しっかりとした弾力と噛むほどに溢れる凝縮した旨味があり、じっくり煮込むと驚くほど柔らかく仕上がる","z":"地中海沿岸の料理でよく使う。たたいてやわらかくしてから調理する","m":"地中海沿岸で親しまれるタコ。柔らかく下ゆでしてから、マリネやトマト煮込み、グリルに仕立てる","d":"タコの南仏風トマト煮込み、タコのサラダ・マリネ、グリル"},{"f":"Sabre","r":"サーブル","j":"たちうお","c":"食材","g":"魚介類","t":"繊細でふっくら柔らかな白身に上品な脂がのっており、焼くと皮目が香ばしく身はほろりとほどける","z":"細長い銀色の魚。切り身にして焼くことが多い","m":"銀色の帯のように細長い白身魚（タチウオ）。切り身にしてムニエルやポワレ、巻き焼きに使う","d":"タチウオのムニエル、タチウオのポーピエット（巻き焼き）、ポワレ"},{"f":"Cabillaud","r":"キャビヨー","j":"たら","c":"食材","g":"魚介類","t":"クセがなくふっくらと層になってほぐれる純白の身で、バターソースからトマト・ハーブソースまで万能に合う","z":"生のタラ。塩漬けは「モリュ」と呼ぶ","m":"北大西洋で獲れる生のタラ。クセ ル・ブラン、魚介のマリネに欠かせない","d":"ヴィネグレット、ブール・ブラン、ベアルネーズ、マリネ"},{"f":"Vinaigre de cidre","r":"ヴィネーグル・ド・シードル","j":"シードルヴィネガー","c":"食材","g":"調味料・薬味","t":"りんご酒由来のまろやかでフルーティーな酸味とやさしい芳香があり、豚肉や魚、サラダに柔らかなアクセントを添える","z":"ノルマンディでよく使われ、魚や豚肉のソースに合う","m":"りんご酒（シードル）から造る醸造酢。ノルマンディ地方の名産で、豚肉や魚、サラダの酸味付けに使う","d":"ノルマンディ風ソース、サラダのヴィネグレット、豚肉のデグラセ"},{"f":"Vinaigre balsamique","r":"ヴィネーグル・バルサミック","j":"バルサミコ酢","c":"食材","g":"調味料・薬味","t":"長期熟成によるシロップのような濃厚な甘みと丸みのある芳醇な酸味があり、数滴で肉や果実の格を上げる","z":"イタリア・モデナ産が有名。伝統的なものは長期熟成させる","m":"ぶどうの搾り汁を煮詰めて木樽で熟成させた黒褐色の酢。ソースの隠し味やサラダ、デザートの仕上げに使う","d":"フォアグラのポワレ、鴨のローストのソース、いちごやチーズの仕上げ"},{"f":"Farine de blé","r":"ファリーヌ・ド・ブレ","j":"小麦粉","c":"食材","g":"調味料・薬味","z":"【日本との違い】フランスの小麦粉は灰分の量でT45やT55などに分類される。日本の薄力粉・強力粉とは区分が異なる","t":"素朴でやさしい小麦の甘みと香りがあり、炒めることで香ばしいルーに、焼くことでサクサクやもっちりの生地になる","m":"小麦を挽いた粉。フランスでは用途別に灰分（T45〜T150など）で分類され、菓子・パン・ルーに使い分ける","d":"ルー、ベシャメル、クレープ、タルト生地、ムニエル"},{"f":"Fécule de maïs","r":"フェキュル・ド・マイス","j":"コーンスターチ","c":"食材","g":"調味料・薬味","t":"素材の味を邪魔しない無味・無臭の軽やかさで、ソースやカスタードにダマになりにくい滑らかなとろみを与える","z":"ソースやクリームを、とろりと固める","m":"とうもろこしから抽出したデンプン。ダマになりにくく軽いとろみがつくため、ソースやカスタードに使う","d":"クレーム・パティシエール、ジェノワーズ、軽いソースのとろみ付け"},{"f":"Sucre","r":"シュクル","j":"さとう","c":"食材","g":"調味料・薬味","t":"雑味の少ないすっきりした甘みで菓子作りの基本となるほか、カラメルに焦がすとほろ苦いコクに変化する","z":"フランスの砂糖は、甜菜（ビート）由来が中心","m":"料理や製菓に使う甘味料（砂糖）の総称。フランスでは主に甜菜（ビート）から作られる","d":"クレーム・ブリュレ、キャラメル、ガストリック、タルト・タタン"},{"f":"Sucre blanc","r":"シュクル・ブラン","j":"白さとう","c":"食材","g":"調味料・薬味","t":"クセのない澄んだ甘みで卵や乳製品・果実の繊細な香りをまっすぐ引き立て、メレンゲやシロップの土台になる","z":"グラニュー糖や、粉砂糖（シュクル・グラス）などがある","m":"精製度の高い白い砂糖。グラニュー糖や上白糖、粉砂糖などがあり、菓子作りや料理の調味の基本になる","d":"メレンゲ、クレーム・アングレーズ、マカロン、シャンティイ"},{"f":"Sucre roux","r":"シュクル・ル","j":"褐色さとう","c":"食材","g":"調味料・薬味","t":"さとうきびや糖蜜由来のまろやかで深みのあるコクと香ばしい甘みがあり、焼き菓子や煮込みに奥行きを与える","z":"黒糖やブラウンシュガーを指す","m":"精製を抑えた茶色い砂糖の総称。きび糖やブラウンシュガーにあたり、焼き菓子や煮込みのコク出しに使う","d":"クレーム・ブリュレ（表面のキャラメリゼ）、タルト・タタン、パン・デピス"},{"f":"Sel","r":"セル","j":"しお","c":"食材","g":"調味料・薬味","t":"素材の甘みや旨味の輪郭をくっきり引き出す味の要。海塩はまろやかで奥行きがあり、精製塩はすっきり効く","z":"調理中は精製塩、仕上げはフルール・ド・セルなどと使い分ける","m":"料理の味付けの基本となる塩。精製 ンドゥイユ入り）、冷製シャルキュトリ前菜"},{"f":"Pâté de foie","r":"パテ・ド・フォワ","j":"レバー・ペースト","c":"食材","g":"肉","t":"レバーの濃厚な旨味とコクを脂と洋酒・香辛料がなめらかに包み込み、バゲットに塗るだけで豊かな満足感がある","z":"パンに塗って食べる","m":"豚や鶏、鴨などのレバーに脂や香味野菜、酒を加えて練り上げたペースト。パンに塗って前菜として楽しむ","d":"パテ・ド・カンパーニュ、鶏レバーのムース、前菜のタルティーヌ"},{"f":"Coquelet","r":"コクレ","j":"若どり","c":"食材","g":"鳥肉、うさぎ肉","t":"若鶏ならではの驚くほど柔らかくきめ細かい肉質で、淡白でクセがなく皮をパリッと焼くと上品な旨味が広がる","z":"小ぶりな若鶏。丸ごと焼いて、一人分にできる","m":"生後1〜2か月ほどの小ぶりな若鶏。骨付きのまま丸ごとローストやグリルにして、一人前の主菜に仕立てる","d":"コクレの丸ごとロティ、若鶏のディアブル風グリル"},{"f":"Cuisse","r":"キュイス","j":"もも肉","c":"食材","g":"鳥肉、うさぎ肉","m":"鶏・兎などの後ろ脚のもも肉","t":"胸肉より脂と筋が適度にあって旨味が濃く、ローストや煮込みにしてもパサつかずしっとりジューシーに仕上がる","z":"ローストや煮込みに向く","d":"鴨のコンフィ、コック・オ・ヴァン、鶏もも肉のフリカセ"},{"f":"Aile","r":"エル","j":"手羽","c":"食材","g":"鳥肉、うさぎ肉","t":"パリッと香ばしい皮の旨味と骨周りのジューシーな身を持ち、ゼラチン質が多いためだしにも豊かなコクを与える","z":"だしにも使う","m":"鶏や鴨などの手羽（翼）の部分。ローストやコンフィにするほか、ゼラチン質が多いためフォン・ド・ヴォライユのだしにも重宝する","d":"フォン・ド・ヴォライユ、手羽のコンフィ、フリカセ"},{"f":"Oie","r":"オワ","j":"がちょう","c":"食材","g":"鳥肉、うさぎ肉","t":"鴨に似てさらにふくよかで濃厚な旨味と芳醇な脂のコクがあり、脂で焼いたじゃがいもは格別の香ばしさになる","z":"ガチョウの脂は、じゃがいもを焼くのに使う","m":"大型の水鳥（ガチョウ）。フォアグラの生産に用いられるほか、肉はローストやコンフィに、脂はじゃがいも焼きに使う","d":"ガチョウのコンフィ、ガチョウのロティ（栗詰め）、ポム・サルラデーズ"},{"f":"Pintade","r":"パンタード","j":"ほろほろちょう","c":"食材","g":"鳥肉、うさぎ肉","t":"鶏肉より引き締まった肉質で、ほのかにジビエを思わせる上品な野趣と濃い旨味があり、クリームやきのこと好相性","z":"日本では「ほろほろ鳥」の名で、流通が少ない","m":"アフリカ原産の家禽（ホロホロ鳥）。鶏より野趣があり、胸肉やもも肉をローストやクリーム煮、ブレゼに仕立てる","d":"ホロホロ鳥のロティ、ホロホロ鳥のキャベツ蒸し煮、クリームソース"},{"f":"Dinde","r":"ダンド","j":"しちめんちょう","c":"食材","g":"鳥肉、うさぎ肉","t":"淡白で締まった肉質ながらじっくり焼き上げると豊かな旨味が出て、栗や香味野菜の詰め物の風味をよく吸い込む","z":"クリスマスに栗の詰め物をして丸ごとローストするのが伝統","m":"北米原産の大型家禽（七面鳥）。クリスマスなどの祝宴で、栗やひき肉を詰めて丸ごとローストするのが伝統","d":"クリスマスの七面鳥の丸ごとロースト（栗のファルス詰め）"},{"f":"Caille","r":"カイユ","j":"うずら","c":"食材","g":"鳥肉、うさぎ肉","t":"小ぶりながらしっとり柔らかな身と繊細な旨味・ほのかな野趣があり、ぶどうやフォアグラと合わせると気品ある味になる","z":"丸ごとのローストや詰め物に向く。【日本との違い】日本では卵用が主で、肉用は流通が少ない","m":"手のひらほどの小型の鳥（ウズラ）。丸ごとローストしたり、骨を抜いてフォアグラなどを詰めて焼き上げる","d":"ウズラのロティ（ぶどうソース）、フォアグラ詰めウズラのパイ包み"},{"f":"Lapin","r":"ラパン","j":"うさぎ肉","c":"食材","g":"鳥肉、うさぎ肉","t":"脂肪が少なく淡白で鶏肉に似た優しい旨味があり、マスタードや白ワイン、ハーブの風味が芯ま ゼに多用される","d":"ブイヤベース、フェンネルのブレゼ（魚料理の付け合わせ）、柑橘とフェンネルのサラダ"},{"f":"Navet","r":"ナヴェ","j":"かぶ","c":"食材","g":"野菜","t":"生ではみずみずしくほのかな辛味があり、じっくり煮込むととろけるように柔らかく上品な甘みが広がる","z":"日本のかぶと近い仲間","m":"アブラナ科の根菜（カブ）。小ぶりで細長い品種が多く、バターと砂糖で艶よく煮るグラッセやナヴァランに欠かせない","d":"ナヴァラン、ポトフ、かぶのグラッセ、かぶのポタージュ"},{"f":"Potiron","r":"ポティロン","j":"かぼちゃ","c":"食材","g":"野菜","t":"ほくほくとした素朴な甘みと水分多めの柔らかな果肉で、裏ごしすると驚くほど滑らかで優しいコクが出る","z":"ポタージュに向く。【日本との違い】品種が多く、日本のかぼちゃとは食感が異なるものが多い","m":"西洋カボチャの総称。水分が多くなめらかに潰れるため、ポタージュやピューレ、グラタンの材料として親しまれる","d":"かぼちゃのポタージュ（ヴルーテ）、かぼちゃのグラタン、ピューレ"},{"f":"Chou","r":"シュ","j":"キャベツ","c":"食材","g":"野菜","t":"加熱するほどに芯から甘い旨味が引き出され、肉やベーコンの脂をたっぷり吸い込むととろりと奥深い味になる","z":"シュークルートの原料でもある","m":"アブラナ科の結球野菜（キャベツ）。生食のほか、詰め物をして煮るファルシやシュークルート、ポトフの具材に使う","d":"シュークルート、ガルビュール、ポトフ、シュー・ファルシ（ロールキャベツ）"},{"f":"Concombre","r":"コンコンブル","j":"きゅうり","c":"食材","g":"野菜","t":"みずみずしく極めてさっぱりとした淡白な風味で、種を除いて加熱すると驚くほど柔らかく繊細な口当たりになる","z":"皮がなめらかで、太いものが多い。【日本との違い】日本のきゅうりのようなイボは少ない","m":"ウリ科の野菜（きゅうり）。フランス産は太く長めで種を取って使うことが多く、クリーム和えや冷製スープ、ソテーにもする","d":"きゅうりのクリーム和え、ガスパチョ、きゅうりのバターソテー（魚料理の付け合わせ）"},{"f":"Petit pois","r":"プチ・ポワ","j":"グリーンピース","c":"食材","g":"野菜","t":"春の新豆ならではの瑞々しくやさしい甘みとプチッと弾ける食感があり、バターやレタスと蒸し煮にすると格別","z":"レタスや小玉ねぎと蒸し煮にする「ア・ラ・フランセーズ」が古典","m":"さやから出した若いえんどう豆（グリーンピース）。春の付け合わせとしてレタスと蒸し煮にしたり、鮮やかなピューレやスープにする","d":"プチ・ポワ・ア・ラ・フランセーズ（レタスと小玉ねぎの蒸し煮）、グリーンピースのポタージュ"},{"f":"Cresson","r":"クレソン","j":"クレソン","c":"食材","g":"野菜","t":"ピリッと鼻に抜ける心地よい辛味と爽やかなほろ苦さがあり、焼いた赤身肉の脂をすっきりと引き立てる","z":"ポタージュや肉料理の付け合わせに使う","m":"清流に育つアブラナ科の葉野菜。肉料理の付け合わせやサラダのほか、鮮やかな緑色のポタージュにするのが定番","d":"クレソンのポタージュ、ステーキの付け合わせ、ソース・ヴェルト"},{"f":"Haricot vert","r":"アリコ・ヴェール","j":"さやいんげん","c":"食材","g":"野菜","t":"シャキッと歯切れのよい食感と若々しい青い香り、ほのかな甘みがあり、バターやにんにくと和えるだけで絶品","z":"細いものほど高級とされる","m":"若いさやを食べるインゲン豆。フランスでは特に細い品種（アリコ・ヴェール・ファン）が好まれ、塩ゆでしてバターソテーやサラダにする","d":"いんげんのバターソテー（ペルシヤード）、ニース風サラダ、ジャルディニエール"},{"f":"Courgette","r":"クルジェット","j":"ズッキーニ","c":"食材","g":"野菜","t":"クセのない淡白でみずみずしい果肉で、オリーブ油やトマト、にんにくの旨味をたっぷり吸い込むととろりと甘くなる","z":"ラタトゥイユに欠かせない。花も食べる","m":"カボチャの仲間（ズッキーニ）。ラタトゥイユやグリル、薄切りのソテーのほか、花に詰め物をする料理も名高い","d":"ラタトゥイユ、ズッキーニのファルシ、花ズッキーニのフリット"},{"f":"Patate douce","r":"パタット・ドゥース","j":"さつまいも","c":"食材","g":"野菜","t":"加熱するとねっとり濃密な甘みとほくほく感が生まれ、バターやスパイス、オレンジの香りと驚くほどよく合う","z":"ポタージュやピューレに使う。フランスでは比較的新しく広まった","m":"ヒルガオ科の甘い根菜（さつまいも）。オレンジ色の果肉の品種が多く、ポタージュやピューレ、ローストの付け合わせに使う","d":"さつまいものポタージュ、ロースト肉に添えるピューレ、グラタン"},{"f":"Pomme de terre","r":"ポム・ド・テール","j":"じゃがいも","c":"食材","g":"野菜","t":"品種によってほくほくした素朴な甘みからねっとり濃密なコクまで多彩で、バターやクリーム・肉の脂を自在に受け止める","z":"品種で用途が分かれる。パルマンティエが普及に尽力した　【日本との違い】フランスでは、ねっとり系のラットやシャルロット、ほくほく系のビンチェなどを使い分ける。日本の男爵やメークインとは品種が違う","m":"フランス料理の付け合わせの要となる芋類。グラタン、ピューレ、フリットなど料理に合わせてねっとり系・ほくほく系を使い分ける","d":"グラタン・ドフィノワ、タルティフレット、ポム・フリット、ヴィシソワーズ、アッシ・パルマンティエ"},{"f":"Radis noir","r":"ラディ・ノワール","j":"黒大根","c":"食材","g":"野菜","t":"日本の大根より身が引き締まり、ピリッと鮮烈な辛味とほのかな土の香りがあり、良質なバターと塩で驚くほどまろやかになる","z":"薄切りにして、サラダやおつまみにする","m":"外皮が黒く中身が白い冬の大根。辛味がしっかりしており、薄切りにして塩やバターを添えるほか、ポタージュにも使う","d":"黒大根の薄切りサラダ（バター＆塩添え）、黒大根のポタージュ"},{"f":"Oignon","r":"オニョン","j":"たまねぎ","c":"食材","g":"野菜","t":"生ではシャキッと辛味があるが、じっくり炒めることで驚くほど濃厚で香ばしい甘みに変わり、フランス料理の味の核となる","z":"飴色に炒めてオニオングラタンスープに使う","m":"フランス料理の味の土台となる香味野菜。ミルポワやオニオングラタンスープ、ソースのベースなどあらゆる料理に使う","d":"オニオングラタンスープ、ピサラディエール、ミルポワ、ソース・スービーズ、ソース・リヨネーズ"},{"f":"Maïs","r":"マイス","j":"とうもろこし","c":"食材","g":"野菜","t":"プチッと弾ける軽快な食感とジューシーで明るい甘みがあり、冷製スープやバターソテーにするとコクが際立つ","z":"缶詰やサラダにもよく使う。【日本との違い】夏にゆでて丸かじりする習慣は少ない","m":"イネ科の穀物野菜（とうもろこし）。フランスでは粒をサラダや冷製スープに使うほか、粉にしてポレンタなどにも加工する","d":"とうもろこしの冷製ポタージュ、ポレンタ、サラダ"},{"f":"Aubergine","r":"オベルジーヌ","j":"なす","c":"食材","g":"野菜","t":"淡白でスポンジのように油やトマトの旨味を吸い込み、じっくり火を通すととろけるようにクリーミーな食感になる","z":"ラタトゥイユやグラタンに使う。【日本との違い】大ぶりのなすが多く、日本の長なすとは形が違う","m":"ナス科の夏野菜。南仏料理のラタトゥイユやキャビア・ドーベルジーヌ（焼きなすのペースト）、グラタンに欠かせない","d":"ラタトゥイユ、キャビア・ドーベルジーヌ（焼きなすのペースト）、グラタン"},{"f":"Carotte","r":"キャロット","j":"にんじん","c":"食材","g":"野菜","t":"加熱するほどに鮮やかな甘みとまろやかな香りが引き出され、バターやオレンジ・クミンと合わせると一層華やぐ","z":"ミルポワの基本の野菜","m":"甘味のある根菜（にんじん）。ミルポワの基本材料のほか、千切りサラダ（キャロット・ラペ）やグラッセ、ヴィシー風煮込みに使う","d":"キャロット・ラペ、にんじんのグラッセ、ミルポワ、ポトフ、ヴィシー風にんじん"},{"f":"Betterave","r":"ベットラーヴ","j":"ビーツ","c":"食材","g":"野菜","t":"大地の穏やかな香りと驚くほど濃厚でやさしい甘みがあり、酢や柑橘・山羊チーズの酸味と絶妙に調和する","z":"ゆでたものを酢で和える前菜が定番","m":"鮮やかな赤紫色の根菜（テーブルビート）。丸ごとゆでたりローストしてから皮をむき、サラダや前菜、ソースの色付けに使う","d":"ビーツのヴィネグレットサラダ、ビーツと山羊チーズの前菜、ボルシチ風スープ"},{"f":"Poivron","r":"ポワヴロン","j":"ピーマン/パプリカ","c":"食材","g":"野菜","t":"直火で皮をむいてじっくり炒めると青臭さが消え、とろりと濃厚な甘みとフルーティーな香りが引き出される","z":"ピペラードやラタトゥイユに使う。皮は直火で焼いてむく","m":"赤・黄・緑などのパプリカ・ピーマン類。直火で皮を焼いてむき、ラタトゥイユやピペラード、ムースに仕立てる","d":"ピペラード、ラタトゥイユ、ガスパチョ、パプリカのムース、ソース・アンダルーズ"},{"f":"Brocoli","r":"ブロコリ","j":"ブロッコリー","c":"食材","g":"野菜","t":"ほのかな甘みとほどよい歯ごたえ、穏やかな青い香りがあり、クリームやチーズと合わせるとまろやかに引き立つ","z":"ゆでて、ピューレやグラタンにする","m":"つぼみと茎を食べるアブラナ科の野菜。塩ゆでして付け合わせにするほか、なめらかなピューレやクリームグラタンに使う","d":"ブロッコリーのピューレ、ブロッコリーのグラタン（モルネーソース）、温野菜"},{"f":"Épinard","r":"エピナール","j":"ほうれんそう","c":"食材","g":"野菜","t":"やわらかな甘みとほのかな鉄分・ほろ苦さがあり、バターや生クリーム、ナツメグと合わせると上品なコクが生まれる","z":"「フロランティーヌ」と付く料理はほうれん草を使う","m":"鉄分豊富な葉野菜（ほうれん草）。バターでソテーして肉や魚の付け合わせにしたり、卵や魚と合わせる「フロランティーヌ風」に使う","d":"フロランティーヌ風（卵や魚のほうれん草グラタン）、ほうれん草のバターソテー、ソース・ヴェルト"},{"f":"Champignon de Paris","r":"シャンピニオン・ド・パリ","j":"マッシュルーム","c":"食材","g":"野菜","t":"穏やかでクセのない森の香りと豊かな旨味があり、生ではシャキッと香ばしく、炒め詰めると濃厚なコクが出る","z":"デュクセルの主材料。シャンピニョン・ド・パリとも書く","m":"パリ近郊の採石場跡で栽培が始まったマッシュルーム。デュクセルやクリームソース、生の薄切りサラダなど幅広く使う","d":"デュクセル、ソース・シャスール、ブフ・ブルギニョン、マッシュルームのポタージュ"},{"f":"Chou de Bruxelles","r":"シュ・ド・ブリュッセル","j":"めキャベツ","c":"食材","g":"野菜","t":"芽キャベツ特有の心地よいほろ苦さと締まった食感があり、加熱すると中心から甘みが引き立ちベーコンや栗とよく合う","z":"ベルギーの首都ブリュッセルにちなむ名","m":"茎に小さな玉がびっしりつくキャベツの仲間（芽キャベツ）。ゆでてからベーコンや栗とバターソテーにして冬の付け合わせにする","d":"芽キャベツとベーコン・栗のバターソテー、ポトフ"},{"f":"Radis","r":"ラディ","j":"ラディッシュ","c":"食材","g":"野菜","t":"瑞々しくパリッと弾ける食感とピリッとした爽やかな辛味があり、有塩バターと粗塩をのせると絶品のおつまみになる","z":"バターと塩で食べる「ラディ・ブール」が定番","m":"赤白の丸い小カブ状の二十日大根。生のまま塩と良質なバターをつけて食べるのが、フランスの春の前菜の定番","d":"ラディ・ブール（ラディッシュのバター＆塩添え）、ニース風サラダ"},{"f":"Salade iceberg","r":"サラド・イスベルグ","j":"アイスバーグ（玉レタス）","c":"食材","g":"野菜","t":"水分たっぷりでパリパリと軽快な歯ざわりがあり、クセのない淡白な味わいが酸味のあるドレッシングを引き立てる","z":"淡白で、ドレッシングが合う","m":"丸く結球したシャキシャキの玉レタス。生サラダのベースとして、ヴィネグレットなど酸味のあるドレッシングと合わせる","d":"グリーンサラダ（ヴィネグレット添え）、サンドイッチ"},{"f":"Abricot","r":"アブリコ","j":"あんず","c":"食材","g":"果物","t":"完熟ならではの華やかな芳香とぎゅっと詰まった甘酸っぱさがあり、加熱すると酸味が際立ち焼き菓子や鴨肉に映える","z":"ジャムやタルトによく使う","m":"初夏が旬のオレンジ色の核果（あんず）。生のままタルトやクラフティに焼き込むほか、ジャムにして菓子の艶出し（ナパージュ）に使う","d":"あんずのタルト、クラフティ、あんずのコンポート、ナパージュ（艶出しジャム）"},{"f":"Fraise","r":"フレーズ","j":"いちご","c":"食材","g":"果物","t":"華やかで甘い芳香とみずみずしい甘酸っぱさがあり、生クリームやカスタード、シャンパーニュと完璧に調和する","z":"春から初夏が旬。タルトやクリームと合わせる","m":"春から初夏を代表する赤い果実（いちご）。生食やタルト、フレジエ、クーリにするほか、バルサミコ酢や黒こしょうと合わせることもある","d":"フレジエ、いちごのタルト、いちごのスープ（ミント風味）、シャルロット"},{"f":"Figue","r":"フィグ","j":"いちじく","c":"食材","g":"果物","t":"ねっとり濃密な蜜のような甘みと種のプチプチした食感があり、塩気のある生ハムやフォアグラ、鴨肉の脂と絶妙に合う","z":"生ハムやフォアグラと相性がよい","m":"夏から秋に熟す果実（いちじく）。タルトやコンポートなどの菓子だけでなく、生ハムやフォアグラ、鴨肉に添える料理も定番","d":"いちじくと生ハムの前菜、鴨胸肉といちじくのロティ、いちじくのタルト"},{"f":"Orange","r":"オランジュ","j":"オレンジ","c":"食材","g":"果物","t":"華やかで太陽のような柑橘の芳香とジューシーな甘酸っぱさ、皮のほろ苦さが鴨の脂やチョコレートと抜群の相性を見せる","z":"皮もソースやデザートの香りづけに使う","m":"香り高い柑橘類。果汁や皮を鴨のオレンジ煮（ビガラード）やクレープ・シュゼット、マルテーズソース、焼き菓子の香り付けに使う","d":"カナール・ア・ロランジュ、クレープ・シュゼット、オランジェット、ソース・マルテーズ"},{"f":"Olive","r":"オリーヴ","j":"オリーブ","c":"食材","g":"果物","t":"塩漬けによる力強い塩気と豊かな油分のコク、ほのかなほろ苦さがあり、南仏の魚やトマト料理に深い輪郭を与える","z":"ニヨン産などが有名。塩漬けや油漬けにして使う","m":"地中海沿岸で栽培される果実。塩漬けやオイル漬けにしてアペリティフやタプナード、ニース風サラダに使うほか、油を搾る","d":"タプナード、ピサラディエール、ニース風サラダ、鶏とオリーブの煮込み"},{"f":"Pamplemousse","r":"パンプルムース","j":"グレープフルーツ","c":"食材","g":"果物","t":"弾けるようなみずみずしい酸味とほのかな爽やかな苦味があり、カニやアボカド、ホタテの甘みを鮮やかに引き立てる","z":"ルビー色の品種もある","m":"大ぶりの柑橘（グレープフルーツ）。アボカドやカニと合わせる冷製前菜や、サラダ、ソルベ、ソースの酸味付けに用いる","d":"カニとアボカド・グレープフルーツの前菜、ソルベ、柑橘のサラダ"},{"f":"Cassis","r":"カシス","j":"くろすぐり","c":"食材","g":"果物","t":"きりっと鮮烈な酸味と深く妖艶なベリーの芳香があり、リキュールやソースにするとジビエや鴨の濃い旨味を引き立てる","z":"ディジョンの「クレーム・ド・カシス」が有名。白ワインで割るとキール","m":"黒紫色の小さなベリー（黒すぐり）。リキュール（クレーム・ド・カシス）の原料になるほか、ムースやジビエのソースに使う","d":"キール（クレーム・ド・カシス）、カシスのソルベ・ムース、鴨や鹿のベリーソース"},{"f":"Cerise","r":"スリーズ","j":"さくらんぼ","c":"食材","g":"果物","t":"甘酸っぱくジューシーな果肉と華やかな芳香があり、焼いたりフランベするとキルシュのような芳醇なコクが増す","z":"クラフティは種ごと焼くのが伝統的とされる","m":"初夏の赤い果実（さくらんぼ）。クラフティやコンポート、ジュビレなどの菓子のほか、鴨肉と合わせる甘酸っぱいソースにも使う","d":"さくらんぼのクラフティ、スリーズ・ジュビレ、フォレ・ノワール、鴨のチェリーソース"},{"f":"Grenade","r":"グルナード","j":"ざく
