    var m=x.match(/^(.*?)[（(](.*?)[）)]\s*$/);
    if(!m){addKey(x,idx,2);return}
    if(m[2].length<=2&&/[一-龠]/.test(m[1]))return;
    addKey(m[1],idx,2);if(/^[ァ-ヶー・]{3,}$/.test(m[2]))addKey(m[2],idx,3);
  });
});
function fz(s){return s.replace(/ゔぁ/g,"ば").replace(/ゔぃ/g,"び").replace(/ゔぇ/g,"べ").replace(/ゔぉ/g,"ぼ").replace(/ゔ/g,"ぶ").replace(/[ーっ]/g,"")}
var FZ={},ALIAS={"アントレコート":"Entrecôte","フォワグラ":"Foie gras","ミルフイユ":"Mille-feuille","ミルフィーユ":"Mille-feuille","ケッパー":"Câpres","セロリラブ":"Céleri-rave","シャンピニオン・ド・パリ":"Champignon de Paris","マンステールチーズ":"Munster","玉葱":"Oignon","玉ねぎ":"Oignon","シュー":"Pâte à choux","シュー生地":"Pâte à choux","サーモン":"Saumon","ソーセージ":"Saucisse","メレンゲ":"Meringue","デミグラス":"Demi-glace","デミ・グラス":"Demi-glace","マデラ":"Madère","マデラ酒":"Madère","ルッコラ":"Roquette","フリット":"Frit","アンチョビー":"Anchois","ケイパー":"Câpres"};
Object.keys(KM).forEach(function(k){if(!KM[k].kana||!KM[k].kat)return;var x=fz(k);(FZ[x]=FZ[x]||[]).push(k)});
function fzOne(x){var g=FZ[x],i,t=-1,c;if(!g)return -1;
  for(i=0;i<g.length;i++){c=KM[g[i]].c;if(c.length!==1||(t>-1&&t!==c[0]))return -1;t=c[0]}return t}
function addAlias(raw,t,kat){var k=nstr(raw).replace(/\s+/g," ").trim();if(!k||KM[k]||t<0)return;KM[k]={p:2,c:[t],kat:kat,kana:kat}}
D.forEach(function(e){["m","t","d","z"].forEach(function(f){var s=e[f];if(!s)return;
  (s.match(/[ァ-ヶー・]{3,}/g)||[]).forEach(function(run){var n=nstr(run),t,m,core,c;if(KM[n])return;
    t=fz(n).length>2?fzOne(fz(n)):-1;
    if(t<0&&(m=run.match(/^(.+?)ソース$|^ソース[・･](.+)$/))){core=nstr(m[1]||m[2]);c=KM[core];t=c&&c.c.length===1?c.c[0]:fzOne(fz(core));if(t>-1&&D[t].c!=="ソース")t=-1}
    if(t>-1)addAlias(run,t,true);
  });
})});
Object.keys(ALIAS).forEach(function(a){var t=-1;D.forEach(function(e,i){if(t<0&&e.f===ALIAS[a])t=i});addAlias(a,t,/^[ァ-ヶー・]+$/.test(a))});
D.forEach(function(e,idx){if(e.c!=="調理法"||!e.j)return;e.j.split(/[\/／]/).forEach(function(x){
  var b=x.replace(/[（(].*$/,"").trim(),m;
  if((m=b.match(/^(.+[えけせてねべめれげぜでへぺ])る$/))&&m[1].length>=3)addKey(m[1],idx,4);
  else if((m=b.match(/^(.+)する$/))&&/[一-龠]/.test(m[1])&&m[1].length>=3)addKey(m[1],idx,4);
})});
Object.keys(KM).forEach(function(k){(BK[k.charAt(0)]=BK[k.charAt(0)]||[]).push(k)});
Object.keys(BK).forEach(function(c){BK[c].sort(function(a,b){return b.length-a.length})});
function links(t,self,seen){
  var ns,mp=[],out=[],p=0,i,b,k,kk,st,en,ok,sl,m;
  ns=nstr(t,mp);
  while(p<ns.length){
    b=BK[ns.charAt(p)];kk=null;
    if(b)for(i=0;i<b.length;i++){k=b[i];
      if(ns.substr(p,k.length)!==k)continue;
      st=mp[p];en=mp[p+k.length-1]+1;ok=true;m=KM[k];sl=t.slice(st,en);
      if(/^[a-z0-9]/.test(k)&&p>0&&/[a-z0-9]/.test(ns.charAt(p-1)))ok=false;
      if(/[a-z0-9]$/.test(k)&&/[a-z0-9]/.test(ns.charAt(p+k.length)))ok=false;
      if(ok&&BN[k]&&t.substr(en,BN[k].length)===BN[k])ok=false;
      if(ok&&BP[k]&&st>0&&t.charAt(st-1)===BP[k])ok=false;
      if(ok&&m.kana){
        if(m.kat){if(!/^[ァ-ヶー・ ]+$/.test(sl)||(st>0&&/[ァ-ヶー・＝]/.test(t.charAt(st-1)))||(en<t.length&&/[ァ-ヶー・＝]/.test(t.charAt(en))))ok=false}
        else if(!/^[ぁ-ゖァ-ヶー・ ]+$/.test(sl))ok=false;
        else if(/[ァ-ヶ]/.test(sl)&&((st>0&&/[ァ-ヶー・＝]/.test(t.charAt(st-1)))||(en<t.length&&/[ァ-ヶー・＝]/.test(t.charAt(en)))))ok=false;
      }
      if(ok){kk=k;break}
    }
    if(kk){var tg=pick(KM[kk].c,kk,t,st,en,self);
      if(tg>=0&&tg!==self&&!seen[tg]&&!SK[D[self].f+"|"+kk]){seen[tg]=1;out.push([st,en,tg])}
      p+=kk.length;
    }else p++;
  }
  return out;
}

/* ---- 検索インデックス・逆引き生成 ---- */
D.forEach(function(e,idx){
  e.i=idx;
  e.fn=norm(e.f);e.rn=norm(e.r);e.jn=norm(e.j||"");
  e.k=norm([e.f,e.r,e.j,e.c,e.g,e.m,e.t,e.d,e.z].join(" "));
  e.lk={};
  ["m","t","d","z"].forEach(function(f){if(e[f])e.lk[f]=links(e[f],idx,{})});
});
var BL={};
D.forEach(function(e){["m","t","d","z"].forEach(function(f){(e.lk[f]||[]).forEach(function(L){(BL[L[2]]=BL[L[2]]||[]).push(e.i)})})});
Object.keys(BL).forEach(function(k){BL[k]=BL[k].filter(function(v,i,a){return a.indexOf(v)===i})});

/* ---- 関連度スコア計算 ---- */
function score(e,qs){
  var s=0,i,q;
  for(i=0;i<qs.length;i++){
    q=qs[i];
    if(e.fn===q||e.rn===q||e.jn===q)s+=100;
    else if(e.fn.indexOf(q)===0||e.rn.indexOf(q)===0||e.jn.indexOf(q)===0)s+=40;
    else if(e.fn.indexOf(q)>-1||e.rn.indexOf(q)>-1||e.jn.indexOf(q)>-1)s+=15;
    else s+=1;
  }
  return s;
}

/* ---- サブカテゴリチップ描画 ---- */
function renderSubchips(){
  var sc=$("subchips");sc.innerHTML="";
  if(!st.c||st.fav)return;
  var gs=[];
  D.forEach(function(e){if(e.c===st.c&&e.g&&gs.indexOf(e.g)<0)gs.push(e.g)});
  if(gs.length<2)return;
  [""].concat(gs).forEach(function(g){
    var b=document.createElement("button");
    b.type="button";
    b.textContent=g||"すべて";
    b.setAttribute("aria-pressed",String(st.g===g));
    b.onclick=function(){st.g=g;renderSubchips();render()};
    sc.appendChild(b);
  });
}

/* ---- 一覧描画 ---- */
function render(){
  var rawQ=st.q.trim();
  $("clr").className=rawQ?"on":"";
  var qs=rawQ?rawQ.split(/[\s　]+/).map(norm).filter(Boolean):[];
  var r=D.filter(function(e){
    if(st.fav&&!FAV[favKey(e)])return false;
    if(st.c&&e.c!==st.c)return false;
    if(st.g&&e.g!==st.g)return false;
    for(var i=0;i<qs.length;i++){if(e.k.indexOf(qs[i])<0)return false}
    return true;
  });
  if(qs.length){
    r.sort(function(a,b){
      var d=score(b,qs)-score(a,qs);
      return d!==0?d:a.f.localeCompare(b.f,"fr");
    });
  }else{
    r.sort(function(a,b){return a.f.localeCompare(b.f,"fr")});
  }
  QNS=qs;
  $("cnt").textContent=r.length===D.length?"全 "+D.length+" 件":r.length+" 件（全 "+D.length+" 件中）";
  $("list").innerHTML=r.length?r.map(function(e){
    var s=e.c==="ソース",bl=BL[e.i]||[],isF=!!FAV[favKey(e)];
    var blHtml="";
    if(bl.length){
      blHtml='<dt>登場する項目</dt><dd class="bl">'+
        bl.slice(0,8).map(function(i){return '<a class="xl" href="#e'+i+'" data-i="'+i+'">'+esc(D[i].r)+'</a>'}).join('、')+
        (bl.length>8?' <button type="button" class="more-bl" data-i="'+e.i+'">ほか'+(bl.length-8)+'件を表示</button>':'')+
        '</dd>';
    }
    return '<div class="e" id="e'+e.i+'">'+
      '<div class="acts">'+
        (HAS_TTS?'<button type="button" class="ico spk" data-f="'+esc(e.f)+'" aria-label="フランス語を読み上げる" title="発音を聞く">🔊</button>':'')+
        '<button type="button" class="ico fav'+(isF?' fav-on':'')+'" data-i="'+e.i+'" aria-label="お気に入り" title="お気に入り">'+(isF?'★':'☆')+'</button>'+
      '</div>'+
      '<div class="eh">'+
        '<span class="fr">'+hl(e.f,qs)+'</span>'+
        '<span class="kn">'+hl(e.r,qs)+'</span>'+
        '<button type="button" class="tg" data-c="'+esc(e.c)+'" data-g="'+esc(e.g||"")+'" title="この分類で絞り込む">'+hl(e.c+(e.g?"（"+e.g+"）":""),qs)+'</button>'+
      '</div>'+
      '<dl>'+
        row("日本語名",e.j&&e.j!==e.r?e.j:"")+
        row(s?"中身":"意味",e.m,e,"m")+
        row("味",e.t,e,"t")+
        row("代表料理",e.d,e,"d")+
        row("豆知識",e.z,e,"z")+
        blHtml+
      '</dl></div>';
  }).join(""):'<p class="no">見つかりません。別の綴りやカタカナ、スペース区切りでも試してください。</p>';
}

/* ---- カテゴリチップ生成 ---- */
var ch=$("chips");
function buildChips(){
  ch.innerHTML="";
  var favCnt=Object.keys(FAV).length;
  var items=[{c:"",fav:false,label:"すべて"},{c:"",fav:true,label:"★ お気に入り"+(favCnt?" ("+favCnt+")":"")}]
    .concat(ORD.filter(function(c){return D.some(function(e){return e.c===c})}).map(function(c){return{c:c,fav:false,label:c}}));
  items.forEach(function(p){
    var b=document.createElement("button");
    b.type="button";
    b.textContent=p.label;
    b.dataset.c=p.c;
    b.dataset.fav=p.fav?"1":"0";
    b.setAttribute("aria-pressed",String(st.fav===p.fav&&st.c===p.c));
    b.onclick=function(){
      st.c=p.c;st.g="";st.fav=p.fav;
      sync();renderSubchips();render();
    };
    ch.appendChild(b);
  });
}
function sync(){
  Array.prototype.forEach.call(ch.children,function(b){
    var isFav=b.dataset.fav==="1";
    b.setAttribute("aria-pressed",String(st.fav===isFav&&(st.c||"")===(b.dataset.c||"")));
  });
}

/* ---- 音声読み上げ ---- */
function speak(text,btn){
  if(!HAS_TTS)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,"").split("/")[0].trim());
  u.lang="fr-FR";u.rate=0.92;
  u.onstart=function(){btn.classList.add("playing")};
  u.onend=u.onerror=function(){btn.classList.remove("playing")};
  speechSynthesis.speak(u);
}

/* ---- 検索入力・クリア ---- */
$("q").addEventListener("input",function(e){st.q=e.target.value;render()});
$("clr").onclick=function(){$("q").value="";st.q="";render();$("q").focus()};

/* ---- ジャンプ・履歴管理 ---- */
function show(i){
  var el=$("e"+i);if(!el)return;
  document.documentElement.style.setProperty("--bh",document.querySelector(".bar").offsetHeight+"px");
  if(el.scrollIntoView)el.scrollIntoView();
  el.classList.remove("fl");void el.offsetWidth;el.classList.add("fl");
  setTimeout(function(){el.classList.remove("fl")},2500);
}
var hn=0,hx=0;
function navUp(){$("nav").className=hx>0?"on":"";$("nb").disabled=hn<=0;$("nf").disabled=hn>=hx}
$("nb").onclick=function(){history.back()};
$("nf").onclick=function(){history.forward()};
function go(i){
  try{history.replaceState({q:st.q,c:st.c,g:st.g,fav:st.fav,y:window.pageYOffset,n:hn},"")}catch(x){}
  st.q="";st.c="";st.g="";st.fav=false;$("q").value="";
  sync();renderSubchips();render();
  hn++;hx=hn;navUp();
  try{history.pushState({q:"",c:"",g:"",fav:false,t:i,n:hn},"")}catch(x){}
  show(i);
}

/* ---- リスト内クリックイベント（リンク・タグ・お気に入り・発音・全件展開） ---- */
$("list").addEventListener("click",function(ev){
  var t=ev.target;
  var a=t.closest&&t.closest("a.xl");
  if(a&&!ev.ctrlKey&&!ev.metaKey&&!ev.shiftKey){ev.preventDefault();go(+a.getAttribute("data-i"));return}
  var spk=t.closest&&t.closest("button.spk");
  if(spk){speak(spk.getAttribute("data-f"),spk);return}
  var fav=t.closest&&t.closest("button.fav");
  if(fav){
    var idx=+fav.getAttribute("data-i"),k=favKey(D[idx]);
    if(FAV[k])delete FAV[k];else FAV[k]=1;
    saveFav();buildChips();render();return;
  }
  var tg=t.closest&&t.closest("button.tg");
  if(tg){
    st.fav=false;st.c=tg.getAttribute("data-c")||"";st.g=tg.getAttribute("data-g")||"";
    sync();renderSubchips();render();window.scrollTo({top:0,behavior:"smooth"});return;
  }
  var mb=t.closest&&t.closest("button.more-bl");
  if(mb){
    var bi=+mb.getAttribute("data-i"),bl=BL[bi]||[];
    mb.parentNode.innerHTML=bl.map(function(i){return '<a class="xl" href="#e'+i+'" data-i="'+i+'">'+esc(D[i].r)+'</a>'}).join('、');
  }
});

try{history.scrollRestoration="manual"}catch(x){}
window.addEventListener("popstate",function(ev){
  var s=ev.state;if(!s)return;
  hn=s.n||0;navUp();
  st.q=s.q||"";st.c=s.c||"";st.g=s.g||"";st.fav=!!s.fav;
  $("q").value=st.q;sync();renderSubchips();render();
  if(s.t!=null)show(s.t);else window.scrollTo(0,s.y||0);
});

/* ---- おまかせ・テーマ切替・トップへ戻る・キー操作 ---- */
$("rnd").onclick=function(){go(Math.floor(Math.random()*D.length))};
$("top").onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
window.addEventListener("scroll",function(){$("top").className=window.pageYOffset>400?"on":""},{passive:true});

var thm=$("thm");
function isDark(){var v=document.documentElement.getAttribute("data-theme");return v==="dark"||(!v&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
function themeLabel(){thm.textContent=isDark()?"☀ ライトモード":"🌙 ダークモード"}
try{var lt=localStorage.getItem("fd_theme");if(lt)document.documentElement.setAttribute("data-theme",lt)}catch(x){}
thm.onclick=function(){var nx=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("fd_theme",nx)}catch(x){}themeLabel()};
themeLabel();

document.addEventListener("keydown",function(e){
  if(e.key==="/"&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||"")){e.preventDefault();$("q").focus()}
});
$("q").addEventListener("keydown",function(e){if(e.key==="Escape"){$("q").value="";st.q="";render()}});

buildChips();
render();
</script>
