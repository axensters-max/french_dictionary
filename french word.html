,"g":"厨房役職・組織"},{"f":"Carte","r":"カルト","j":"メニュー表","c":"サービス・接客","m":"レストランで提供している料理や飲み物の一覧表（メニュー表）。ここから単品ずつ選ぶ注文方式を「ア・ラ・カルト」と呼ぶ","z":"「ア・ラ・カルト」は、この表から選ぶ方式。【日本との違い】日本で言う「メニュー」は、フランスでは「カルト」","g":"メニュー・注文"},{"f":"Menu","r":"ムニュ","j":"コース・定食","c":"サービス・接客","m":"前菜・主菜・デザートなどの構成と定価があらかじめ決まっているコース料理（定食）。フランスではメニュー表そのものではなく「コース」を指す","z":"フランスで「ムニュ」は、メニュー表ではなくセットのコースを指す。【日本との違い】表そのものは「カルト」","g":"メニュー・注文"},{"f":"Formule","r":"フォルミュール","j":"セットメニュー","c":"サービス・接客","m":"「前菜＋主菜」や「主菜＋デザート」など、2品または3品を自由に組み合わせてお得な定額で楽しめるセットメニュー。平日のランチタイムによく見られる","z":"ランチによく見られる","g":"メニュー・注文"},{"f":"Suggestion","r":"シュジェスチョン","j":"本日のおすすめ","c":"サービス・接客","m":"定番メニューとは別に、旬の食材や仕入れ状況に合わせてシェフが用意する「本日のおすすめ料理」","z":"黒板などで案内される","g":"メニュー・注文"},{"f":"Entremets","r":"アントルメ","j":"アントルメ","c":"コース・その他","m":"現代フランス料理では食後のデザート（特にホールケーキや温冷の菓子）を指す。歴史的にはコースの料理と料理の間に出された軽い一皿を意味した","z":"「アントルメ」は「料理の間」の意味","g":"コース・構成"},{"f":"Mise en bouche","r":"ミーズ・アン・ブーシュ","j":"最初の一口","c":"コース・その他","m":"コースの最初、注文後や食前酒とともに提供される一口サイズの小さな料理。「アミューズ・ブーシュ」とほぼ同義で、店の世界観を最初に伝える挨拶の一皿","z":"「アミューズ・ブーシュ」とほぼ同じ意味","g":"コース・構成"},{"f":"Accord mets et vins","r":"アコール・メ・エ・ヴァン","j":"料理とワインの相性","c":"ワイン・酒類","m":"料理の味・香り・質感とワインの個性を調和させる組み合わせ（ペアリング）。コースの各皿に最適なワインを合わせる提案を指す","z":"「マリアージュ」とも言う。ペアリングにあたる","g":"ソムリエ・テイスティング"},{"f":"Vin au verre","r":"ヴァン・オ・ヴェール","j":"グラスワイン","c":"ワイン・酒類","m":"ボトル（ブテイユ）単位ではなく、グラス1杯から気軽に注文できるワイン。料理一皿ごとに白・赤を変えたり、少量だけ楽しみたいときに重宝する","z":"ボトル（ブテイユ）を開けずに楽しめる","g":"ソムリエ・テイスティング"},{"f":"Carte des vins","r":"カルト・デ・ヴァン","j":"ワインリスト","c":"ワイン・酒類","m":"レストランで提供しているワインを産地・品種・価格帯ごとにまとめた一覧表。ソムリエが料理や好みに合わせて案内する","z":"ソムリエが案内する","g":"ソムリエ・テイスティング"},{"f":"Droit de bouchon","r":"ドロワ・ド・ブション","j":"抜栓料","c":"ワイン・酒類","m":"客がレストランへ自分のワインを持ち込んだ際、店側で抜栓・グラス用意・サービスを行うことに対して支払う料金（日本の「持ち込み料」にあたる）","z":"日本の「持ち込み料」にあたる","g":"ソムリエ・テイスティング"},{"f":"Eau plate / gazeuse","r":"オー・プラット／ガズーズ","j":"炭酸なし／炭酸入りの水","c":"サービス・接客","m":"レストランでミネラルウォーターを注文する際の基本区分。「オー・プラット」は炭酸なしの軟水・硬水、「オー・ガズーズ」は発泡性の炭酸水を指す","z":"「オー・プラット」と「オー・ガズーズ」で注文する","g":"メニュー・注文"},{"f":"Carafe d’eau","r":"カラフ・ドー","j":"水のデカンタ","c":"サービス・接客","m":"水道水を入れてテーブルへ運ばれるガラスの水差し（デカンタ）。フランスの飲食店では法律で無料提供が定められており、頼めば気軽に出してもらえる","z":"フランスでは、頼めば出してもらえる。【日本との違い】日本のように最初から出るとは限らない","g":"メニュー・注文"},{"f":"Service compris","r":"セルヴィス・コンプリ","j":"サービス料込み","c":"サービス・接客","m":"メニューの表示価格にあらかじめサービス料（通常15%前後）が含まれていること。フランスでは税込・サービス料込み表示が原則となっている","z":"フランスでは、サービス料込みの表示が基本。【日本との違い】日本ではサービス料を別途加算する店が多い","g":"接客・マナー"},{"f":"Pourboire","r":"プールボワール","j":"チップ","c":"サービス・接客","m":"良いサービスを受けた際に感謝の気持ちとしてテーブルやスタッフに渡す心づけ（チップ）。フランスではサービス料込みのため任意","z":"フランスでは任意で、少額を置くことが多い","g":"接客・マナー"},{"f":"Addition","r":"アディシオン","j":"お会計","c":"サービス・接客","m":"食事を終えた後にテーブルへ運ばれるお会計の伝票・請求書。席で会計を済ませるのがフランスのレストランの基本マナー","z":"「ラディシオン、シルヴプレ」で会計を頼む","g":"接客・マナー"},{"f":"Guéridon","r":"ゲリドン","j":"サービスワゴン","c":"サービス・接客","m":"客席のテーブル脇まで運んで使うキャスター付きの小型サービスワゴン。ローストの切り分け、クレープのフランベ、チーズやデザートの提供演出に用いる","z":"フランベや切り分けに使う","g":"食器・卓上"},{"f":"Découpage","r":"デクパージュ","j":"客席での切り分け","c":"サービス・接客","m":"丸焼きの鶏や塊肉、丸ごとの舌平目やスズキなどを、客席のゲリドン（ワゴン）上でサービススタッフが鮮やかな手さばきで切り分け取り分ける伝統サービス","z":"ゲリドンの上で行う","g":"接客・マナー"},{"f":"Cloche","r":"クロッシュ","j":"銀のドーム型の蓋","c":"サービス・接客","m":"皿に盛られた温かい料理を覆う銀色などのドーム型の蓋。保温と香りの閉じ込めを兼ね、テーブル全員の前で同時に一斉に開ける華やかな演出に使われる","z":"全員の料理に、同時に開ける演出に使う","g":"食器・卓上"},{"f":"Rince-doigts","r":"ランス・ドワ","j":"フィンガーボウル","c":"サービス・接客","m":"オマール海老やカニ、アーティチョークなど手を使って食べる料理の際、指先を洗い臭みを取るために供される水を張った小鉢。レモンの輪切りを浮かべることが多い","z":"手で食べる甲殻類などのときに出す。レモンを浮かべることがある","g":"食器・卓上"},{"f":"Bouillon","r":"ブイヨン","j":"ブイヨン","c":"ソース","m":"肉・鶏・魚介や香味野菜、ハーブを水からじっくり煮出して漉した澄んだだし汁の総称。ポトフの煮汁のようにそのままスープとして味わうほか、煮込みやソースのベースになる","t":"素材の持ち味がやさしく溶け出した、雑味の少ないあっさりとした上品な旨味","z":"フランス料理のだしの総称。素材をゆでた汁そのものを指すことも多い","g":"だし・ベース"},{"f":"Fond","r":"フォン","j":"フォン","c":"ソース","m":"牛・仔牛・鶏・魚の骨や筋を香味野菜とともに時間をかけて煮出した、フランス料理のソースの骨格となる基本のだし。素材と焼き色の有無で白・褐色に分かれる","t":"骨のゼラチン質と素材の旨味がじっくり引き出されており、煮詰めるほどに深いコクとまろやかなとろみが生まれる","z":"フォン・ド・ヴォー（仔牛）、フォン・ド・ヴォライユ（鶏）のように素材名を付けて呼ぶ","g":"だし・ベース"},{"f":"Morue","r":"モリュ","j":"塩ダラ","c":"食材","g":"魚介類","m":"タラを塩漬けして乾燥させたもの","t":"塩漬け・乾燥による強い塩気と凝縮したタラの深い旨味があり、丁寧に塩抜きするとふっくら柔らかく滋味豊かな味になる","z":"使う前に塩抜きする。ブランダードの材料。生のタラはカビヨーと呼ぶ","d":"ブランダード・ド・モリュ、塩ダラのアイオリ、アクラ（フリット）"},{"f":"Céleri","r":"セルリ","j":"セロリ","c":"食材","g":"野菜","m":"爽やかな香りを持つ茎セロリ。玉ねぎ・にんじんとともにミルポワを構成する基本の香味野菜で、ブイヨンや煮込み、サラダに広く使う","t":"清涼感のある爽やかな青い香りとシャキシャキした瑞々しい歯ざわりがあり、煮込むと甘く上品な旨味のだしが出る","z":"ミルポワに欠かせない。根を食べる根セロリ（セルリ・ラーヴ）とは部位が違う","d":"ミルポワ、ポトフ、ブイヨン、フォン・ド・ヴォー、サラダ"},{"f":"Larder","r":"ラルデ","j":"脂を刺す","c":"調理法","m":"専用の針（ラルドワール）を使い、牛赤身やジビエなど脂肪の少ない塊肉の内部に細切りの豚の背脂（ラルドン）を縫い込むように差し込む古典技法","z":"ピケの一種。乾燥しやすい赤身肉に向く","t":"加熱中に内側から豚脂がじゅわっと溶け出し、赤身肉でもパサつかずしっとりコク深く焼き上がる","g":"下処理・仕込み"},{"f":"Farce","r":"ファルス","j":"詰め物","c":"コース・その他","m":"丸鶏や野菜、パイ、パスタの中に詰めるために、ひき肉・レバー・魚のすり身・きのこ・ハーブなどを刻んで調味し練り合わせた「詰め物」の総称","z":"動詞はファルスィール（詰め物をする）","g":"調理基礎・表現"},{"f":"Garniture","r":"ガルニチュール","j":"付け合わせ","c":"コース・その他","m":"主菜となる肉や魚料理の皿に添える野菜のグラッセ、じゃがいものピューレ、きのこのソテー、穀物などの付け合わせ。味と栄養、彩りのバランスを整える","z":"動詞はガルニール（付け合わせを添える）","g":"調理基礎・表現"},{"f":"Flan","r":"フラン","j":"フラン","c":"デザート","m":"卵・牛乳・生クリーム・砂糖・バニラを混ぜた濃厚なカスタード液を型（またはパイ生地を敷いた型）に流し込み、表面に焼き色がつくまでしっかり焼き上げたパリのパン屋定番菓子","t":"表面の香ばしい焼き目と、ぷるんと弾力がありつつなめらかな口溶けに、バニラと卵の素朴で優しい甘みが広がる親しみやすい味","z":"タルト生地に流して焼くフラン・パティシエがパリの定番","g":"ケーキ・タルト"},{"f":"Croquant","r":"クロカン","j":"クロカン","c":"コース・その他","m":"クルスティヤンよりさらにしっかりとした「カリッ・ザクッ」と硬めの歯ごたえ、またはその食感を活かしたアーモンド入りの焼き菓子（クロカン）を指す","z":"クルスティヤンより硬く、歯ごたえの強いものを指す","t":"噛みしめるとザクッと小気味よい音が響き、ローストしたナッツや焦がし砂糖の香ばしい甘みが広がる","g":"火入れ・食感"},{"f":"Pré-salé","r":"プレ・サレ","j":"プレ・サレ","c":"食材","g":"肉","m":"塩分を含んだ牧草地で育った羊の肉","t":"潮風を受けた牧草で育つため肉質が極めてきめ細かく柔らかで、臭みが少なくほのかな塩気と繊細な旨味・甘みが広がる","z":"モン・サン・ミシェル湾岸の仔羊がAOPに認定されている","d":"プレ・サレ仔羊のロティ（ジゴ・キャレ）、ハーブ焼き"},{"f":"Quenelle","r":"クネル","j":"クネル","c":"料理","m":"カワカマス（ブロシェ）などの白身魚や鶏肉のすり身に、パン・卵・クリームを混ぜて楕円形に整え、ゆでてからナンテュアソースなどでオーブン焼きにするリヨンの名物料理","t":"はんぺんよりはるかに繊細でふわりと軽く、口の中でとろけるなめらかな食感に濃厚な甲殻類ソースが絡み合う上品な味","z":"リヨンのクネル・ド・ブロシェ（カワカマス）が名物","g":"魚介料理"},{"f":"Boutargue","r":"ブタルグ","j":"ブタルグ（からすみ）","c":"食材","g":"魚介類","m":"ボラなどの卵巣を塩漬けして乾燥させたもの","t":"ボラの卵巣を熟成させた濃厚でねっとりした旨味と力強い塩気・磯の香りがあり、薄切りやパスタの仕上げで存在感を放つ","z":"南仏の名産で、日本のからすみにあたる。薄く切ってアペリティフに、すりおろしてパスタにも使う","d":"ブタルグの薄切り（アペリティフ）、ブタルグのスパゲッティ、前菜のアクセント"},{"f":"Gruyère","r":"グリュイエール","j":"グリュイエール","c":"チーズ","g":"ハード","m":"スイスおよびフランス国境のアルプス山岳地帯で造られる大型の牛乳製ハードチーズ（スイス産はAOP、フランス産はIGP）。フォンデュやオニオングラタンスープ、クロック・ムッシュに欠かせない","t":"引き締まった生地に熟成由来の豊かな旨味が凝縮され、ナッツや焦がしバターを思わせる香ばしい甘みと深いコクが長く続く","z":"フォンデュやグラタンの定番。スイス産はAOP、フランス産はIGP"},{"f":"Papillote","r":"パピヨット","j":"包み焼き","c":"調理法","m":"白身魚やホタテ、鶏肉を香味野菜・ハーブ・白ワインとともにクッキングシートやアルミホイルで密閉して包み、オーブンで蒸し焼きにする調理法（アン・パピヨット）","t":"袋の中で蒸気と香りが循環するため身がふっくら柔らかく仕上がり、開けた瞬間に豊かな芳香が広がる","z":"開けた瞬間に香りが立つので、包んだまま客席に出すこともある","g":"加熱・火入れ"},{"f":"Monter","r":"モンテ","j":"バターで仕上げる","c":"調理法","m":"仕上げのソースに冷たいバターを少しずつ加えて乳化させ、とろみと艶を出すこと（モンテ・オ・ブール）。また、卵白や生クリームを泡立ててふんわり立ち上げることも指す","t":"ソースはビロードのように滑らかで艶やかなコクが増し、泡立てたクリームやメレンゲは軽やかに仕上がる","z":"「モンテ・オ・ブール」が代表的。熱すぎると分離するので、加えるのは仕上げの瞬間","g":"調味・仕上げ"},{"f":"Marquer","r":"マルケ","j":"焼き目をつける","c":"調理法","m":"グリルで美しい網目の焼き目をつけたり、煮込みやローストの本加熱に入る前に肉や魚の表面に香ばしい焼き色をつける下焼き工程","t":"香ばしい焼き目が見た目の食欲をそそるとともに、料理全体に奥行きのある風味を添える","z":"煮込み料理でも、先にマルケしてから煮ると色と香りが付く","g":"加熱・火入れ"},{"f":"Foncer","r":"フォンセ","j":"生地を敷く","c":"調理法","m":"タルト型やパテ型の内側に伸ばした生地をぴったり敷き込む作業。また、ブレゼ用の厚手鍋の底に香味野菜やベーコンの薄切りを敷き詰めて焦げ付きを防ぐ工程も指す","z":"タルト生地を型に敷く作業もフォンセと呼ぶ","g":"下処理・仕込み"},{"f":"Lier","r":"リエ","j":"とろみをつなぐ","c":"調理法","m":"ルー、ブール・マニエ、卵黄と生クリーム（リエゾン）、コーンスターチ、またはジビエの血などを使い、さらさらした煮汁やスープに滑らかなとろみをつけて全体をつなぐ工程","z":"ルー、卵黄、クリーム、ブール・マニエなどがつなぎ役になる","t":"口当たりがまろやかにまとまり、ソースが食材によく絡んで旨味の余韻が長く続くようになる","g":"調味・仕上げ"},{"f":"En croûte","r":"アン・クルート","j":"パイ包み焼き","c":"料理","m":"サーモンや牛ヒレ肉、パテなどの主材料にデュクセルやハーブを重ね、折り込みパイ生地で包んでオーブンで黄金色に焼き上げた華やかな仕立て（パイ包み焼き）","t":"バター香るサクサクのパイ生地を割ると、中に閉じ込められた素材のジューシーな旨味と芳醇な香りが一気に立ち上る","z":"サーモンのパイ包み（サーモン・アン・クルート）が代表的","g":"肉・ジビエ料理"},{"f":"Onglet","r":"オングレ","j":"ハラミ","c":"食材","g":"肉","m":"牛の横隔膜の筋肉（日本のハラミ／サガリにあたる希少部位）。赤身の旨味が強く、エシャロットソースを添えたステーキがビストロの名物","t":"横隔膜ならではの驚くほど柔らかな肉質と、赤身の濃い鉄分の旨味があり、レアに焼くとジューシーな肉汁が溢れ出す","z":"ビストロで愛される部位。日本のハラミに当たる","d":"オングレ・ア・レシャロット（ハラミのステーキ・エシャロットソース）、ステーク・フリット"},{"f":"Bavette","r":"バヴェット","j":"バヴェット","c":"食材","g":"肉","m":"牛の腹まわりの細長い赤身肉（カイノミやフラップミート周辺）。繊維が粗く噛みごたえがあり、レア〜ミディアムレアのステーキに人気","t":"繊維がやや粗めで噛みごたえがあり、噛めば噛むほど赤身の力強い旨味とジューシーな肉汁が広がる肉好きに愛される味","z":"ステーキ・フリットにも使われる、ビストロの定番部位","d":"バヴェット・ア・レシャロット、ステーク・フリット、マルシャン・ド・ヴァン"},{"f":"Queue de bœuf","r":"クー・ド・ブフ","j":"牛テール","c":"食材","g":"肉","m":"牛の尾のぶつ切り。骨とゼラチン質が極めて豊富で、赤ワイン煮込みやポトフ、濃厚なコンソメやソースのだしに欠かせない","t":"骨周りの濃厚な旨味とたっぷりのゼラチン質が長時間煮込むことでとろりとほどけ、煮汁に極上のコクと艶をもたらす","z":"長時間煮込んでスープや煮込みに使う。ポトフの具にもなる","d":"牛テールの赤ワイン煮込み、ポトフ、テールスープ（コンソメ）"},{"f":"Côte de bœuf","r":"コート・ド・ブフ","j":"骨付きリブロース","c":"食材","g":"肉","m":"牛の骨付きリブロースを、厚切りで焼くもの","t":"厚切りならではの赤身の力強い旨味と、骨周りから滲み出る濃厚な脂のコク・香ばしさが豪快に楽しめるステーキの王様","z":"2〜3人で分け合う豪快な一皿として出されることが多い","d":"コート・ド・ブフのグリエ（ベアルネーズ／ボルドレーズソース＆フライドポテト添え）"},{"f":"Endives","r":"アンディーヴ","j":"チコリ","c":"食材","g":"野菜","m":"光を遮って軟白栽培した紡錘形の白い葉野菜（チコリ）。生のサラダにするほか、ハムを巻いてベシャメルと焼くグラタンが北仏の定番","t":"軟白栽培による瑞々しくシャキッとした歯ざわりと心地よいほろ苦さがあり、加熱すると甘く柔らかくなりチーズと好相性","z":"日本ではチコリの名でも売られる。グラタンやサラダに使う","d":"アンディーヴのハム巻きグラタン、アンディーヴとくるみ・ブルーチーズのサラダ"},{"f":"Rouget","r":"ルージェ","j":"ヒメジの仲間","c":"食材","g":"魚介類","m":"地中海沿岸で獲れる鮮やかな赤い岩礁魚の総称（ヒメジの仲間）。鱗や皮目が香ばしく、ポワレやブイヤベースに欠かせない高級魚","t":"香ばしく焼き上げた皮目の芳香と、ほろりと繊細で上品な甘みのある身、濃厚な肝の旨味が南仏料理で愛される","z":"ブイヤベースに入る魚の一つ。代表種はルージェ・バルベ","d":"ルージェのポワレ（南仏風）、ブイヤベース、ルージェのプロヴァンス風"},{"f":"Lieu","r":"リュー","j":"スケトウダラの仲間","c":"食材","g":"魚介類","m":"大西洋で獲れるタラ科の白身魚（ポラックの仲間）。タラより手頃でクセがなく、ムニエルやグラタン、ブランダードなどに幅広く使う","t":"タラに似てクセのない淡白でふっくらした白身で、ほろりとほぐれやすくバターソースやクリーム、グラタンによくなじむ","z":"リュー・ノワール（黒）とリュー・ジョーヌ（黄）がある","d":"リューのポワレ（ブール・ブラン）、ムニエル、フィッシュグラタン"},{"f":"Praire","r":"プレール","j":"プレール","c":"食材","g":"魚介類","m":"丸く厚みのある殻を持つ二枚貝（ヌノメガイの仲間）。生のままレモンを絞って海の幸の盛り合わせにするほか、香草バター焼きにする","t":"肉厚でぷりっとした弾力があり、噛むほどに清らかな磯の香りと濃い貝の旨味が溢れ、生でも香草焼きでも絶品","z":"生でレモンを絞って食べることが多い","d":"プレールの生食（レモン添え）、プレールの香草バター焼き（ファルシ）"},{"f":"Bigorneau","r":"ビゴルノー","j":"小型の巻貝","c":"食材","g":"魚介類","m":"大西洋岸の岩場に生息する親指ほどの小さな巻貝（タマキビ）。香草入りの塩湯でゆで、ピンで身を引き出してマヨネーズを添える前菜の定番","t":"小ぶりながらコリッと引き締まった弾力と力強い磯の香り・ほろ苦い旨味があり、ゆでてマヨネーズをつけると止まらない","z":"ゆでて、針で身を取り出して食べる。前菜の盛り合わせに添える","d":"ビゴルノーの塩ゆで（マヨネーズ添え）、海の幸の盛り合わせ"},{"f":"Soupe de poissons","r":"スープ・ド・ポワソン","j":"魚のスープ","c":"料理","m":"カサゴやホウボウなど小魚・岩礁魚を丸ごと香味野菜、トマト、サフラン、にんにくと煮込み、骨ごとしっかり裏ごしした南仏定番の濃厚な魚介スープ。ルイユとチーズを添える","t":"魚の骨や身から絞り出した凝縮感たっぷりの濃い海の旨味に、サフランとトマトの香りが溶け合った力強く奥深い味わい","z":"ルイユとチーズ、クルトンを添えるのが南仏式","g":"スープ・ポタージュ"},{"f":"Blanquette","r":"ブランケット","j":"仔牛のクリーム煮","c":"料理","m":"仔牛肉や鶏肉、魚介を焼き色をつけずに白いブイヨンで柔らかく煮込み、卵黄と生クリーム（リエゾン）で白くクリーミーに仕上げたフランスの伝統的煮込み料理の総称","t":"素材のやさしい旨味とクリームのまろやかで上品なコクが調和し、仕上げのレモン汁が後味を軽やかに整える味わい","z":"「ブランケット・ド・ヴォー」が代表格。肉に焼き色をつけないのが約束","g":"肉・ジビエ料理"},{"f":"Quiche","r":"キッシュ","j":"キッシュ","c":"料理","m":"型に敷いた塩味のパイ生地（パート・ブリゼ）に、卵・生クリーム・牛乳の卵液（アパレイユ）とベーコン・野菜・魚介・チーズなどの具材を流して焼き上げた郷土料理","t":"香ばしくサクサクした生地と、ふんわりなめらかな卵とクリームのコク、具材の旨味が一体となった温かくても冷めても美味しい味","z":"ロレーヌ風（キッシュ・ロレーヌ）は、ベーコン入りが本式","g":"野菜・チーズ・軽食"},{"f":"Vol-au-vent","r":"ヴォローヴァン","j":"ヴォローヴァン","c":"料理","m":"折り込みパイ生地を高く膨らむカップ型に焼き上げ、中に鶏肉・リ・ド・ヴォー・魚介・きのこなどの濃厚なクリーム煮をたっぷり詰めた「風に飛ぶ」ほど軽い古典料理","t":"驚くほどサクッと軽やかにほどけるバター香るパイ生地と、中からとろり溢れ出す濃厚でクリーミーな具材の対比が絶妙","z":"名は「風に飛ぶ」の意。その軽さを表した名前","g":"肉・ジビエ料理"},{"f":"Bouchée à la reine","r":"ブーシェ・ア・ラ・レーヌ","j":"ブーシェ・ア・ラ・レーヌ","c":"料理","m":"直径数センチの一人用サイズに焼いた小さなパイの器に、鶏肉・きのこ・クネルなどの白いクリーム煮（ア・ラ・レーヌ）を詰めた「王妃のひと口」の名を持つ温かい前菜","t":"香ばしく繊細なパイの軽快な食感と、鶏ときのこの旨味が詰まった上品でクリーミーな中身がひと口ごとに広がる贅沢な味","z":"「王妃のひと口」の名の通り。ヴォローヴァンの小型版","g":"前菜・冷菜・サラダ"},{"f":"Fraisier","r":"フレジエ","j":"フレジエ","c":"デザート","m":"アーモンド香るスポンジ（ジェノワーズ）にキルシュのシロップを打ち、新鮮な苺と濃厚なムースリーヌクリーム（カスタード＋バター）を重ねた、フランスの春を代表する苺ケーキ","t":"日本のショートケーキよりはるかにリッチで、バター香る濃厚なクリームのコクと瑞々しい苺の甘酸っぱさ、キルシュの余韻が調和する","z":"側面に苺の断面を見せる飾りつけが定番","g":"ケーキ・タルト"},{"f":"Savarin","r":"サヴァラン","j":"サヴァラン","c":"デザート","m":"ドーナツ状のリング型で焼いた発酵生地に、ラム酒やキルシュを効かせたシロップをたっぷり染み込ませ、中央の穴に生クリームや季節の果物を飾った華やかな伝統菓子","t":"ひと口ごとにじゅわりと溢れる芳醇な洋酒シロップの甘みと香り、しっとりほどける生地に軽やかなクリームと果実が爽やかに合う","z":"名は美食家ブリア=サヴァランから。ババ・オ・ロムの親戚","g":"ケーキ・タルト"},{"f":"Tuile","r":"チュイル","j":"チュイル","c":"デザート","m":"アーモンドスライスやゴマ、オレンジ果汁などを混ぜた生地を薄く広げて焼き、熱いうちにめん棒などの上にのせて屋根瓦（チュイル）のように湾曲させた繊細な焼き菓子","t":"薄くパリッと軽快な歯ざわりから、ローストしたアーモンドやバターの香ばしさがふわりと広がり、冷菓の添え物に欠かせない","z":"名は屋根瓦（チュイル）の形から。アイスやムースに添える","g":"焼き菓子・小菓子"},{"f":"Croissant","r":"クロワッサン","j":"クロワッサン","c":"コース・その他","m":"発酵させたパン生地にたっぷりのバターを幾層にも折り込み、三日月形に巻いて焼き上げたフランスを代表するヴィエノワズリー（菓子パン）","t":"外側ははらはらと崩れるほどサクサク香ばしく、中はしっとり柔らかな層から上質な発酵バターの芳醇な香りが広がる","z":"原型はオーストリアの菓子で、フランスで発達した","g":"パン・カフェ"},{"f":"Pain au chocolat","r":"パン・オ・ショコラ","j":"パン・オ・ショコラ","c":"コース・その他","m":"クロワッサンと同じバター折り込み生地で、細長いビターチョコレートの棒（バトン）を2本包んで四角く焼き上げた、フランスの朝食やおやつの定番パン","t":"バターが豊かに香るサクサクの層と、焼くことでほどよく柔らかくなったほろ苦いチョコレートの甘みが絶妙に調和する","z":"南西部では「ショコラティーヌ」と呼ぶ","g":"パン・カフェ"},{"f":"Brin d’amour","r":"ブラン・ダムール","j":"ブラン・ダムール","c":"チーズ","m":"コルシカ島特産の、ローズマリー・セイボリー・ジュニパーベリー・唐辛子など島のハーブ（マキ）を表面にびっしりまぶした羊乳チーズ。見た目も香りも南国らしい逸品","t":"羊乳のまろやかで優しい甘みとしっとりした口当たりに、表面のドライハーブの爽やかでスパイシーな芳香が溶け込んだ個性的な味","z":"名は「愛の小枝」。表面のハーブが香りを移す","g":"白カビ"},{"f":"Amuse-gueule","r":"アミューズ・グール","j":"アミューズ・グール","c":"コース・その他","m":"食前酒（アペリティフ）のお供として指でつまんで楽しむ、一口サイズの軽いおつまみ。アミューズ・ブーシュとほぼ同義だが、ややくだけた親しみやすい表現","t":"小さくても塩気やスパイス、チーズのコクなどがはっきり効いており、お酒の味わいを心地よく引き立てる","z":"アミューズ・ブーシュとほぼ同じ意味。グールは「口」の砕けた言い方","g":"コース・構成"},{"f":"Couvert","r":"クヴェール","j":"クヴェール","c":"サービス・接客","m":"テーブルにセッティングされた皿・ナイフ・フォーク・グラス・ナプキンなど一人分の食器一式。レストランでは予約や来客の人数（○名様分）を数える単位にも使う","z":"レストランでは「○名様分」の人数もクヴェールで数える","g":"食器・卓上"},{"f":"Kir","r":"キール","j":"キール","c":"ワイン・酒類","m":"辛口の白ワイン（本来はブルゴーニュのアリゴテ）に、ディジョン名物のクレーム・ド・カシスを少量加えたフランス定番の食前酒カクテル。シャンパーニュ版はキール・ロワイヤル","t":"白ワインのすっきりした酸味にカシスの甘酸っぱいベリー香が溶け合った、軽やかで飲みやすい華やかな味わい","z":"名は元ディジョン市長のキール氏から。シャンパンで作るとキール・ロワイヤル","g":"酒類・リキュール"},{"f":"Socca","r":"ソッカ","j":"ソッカ","c":"料理","m":"ひよこ豆の粉を水・オリーブ油・塩で溶き、大きな銅板や鉄板で薄くこんがり焼き上げたニース名物のクレープ風ストリートフード。黒こしょうをたっぷり振って熱々を手で食べる","t":"縁はカリッと香ばしく中はもっちり柔らかな食感で、ひよこ豆の素朴な甘みとオリーブ油の香り、黒こしょうの刺激が後を引く","z":"大きな鉄板で焼き、黒こしょうを振って熱々を手で食べる","g":"野菜・チーズ・軽食"},{"f":"Champagne","r":"シャンパーニュ","j":"シャンパーニュ","c":"ワイン・酒類","m":"フランス北部シャンパーニュ地方で、厳格な規定と瓶内二次発酵（トラディショナル方式）によって造られる世界最高峰の発泡ワイン。祝宴や食前酒の王道","t":"きめ細かく長く立ち上る泡立ちと、冷涼な産地ならではのきりっとした酸味、熟成によるブリオッシュやナッツのような芳醇な香り","z":"「シャンパン」は日本での略称。決められた産地以外はシャンパーニュと名乗れない","g":"産地"},{"f":"Chardonnay","r":"シャルドネ","j":"シャルドネ","c":"ワイン・酒類","m":"ブルゴーニュ原産で世界中で栽培される白ワインの女王。シャブリの辛口白からコート・ド・ボーヌの樽熟成白、シャンパーニュの原料まで土地と醸造で多彩な表情を見せる","t":"冷涼な土地では青りんごや柑橘とシャープなミネラル感、温暖な土地や樽熟成では熟した果実やバター・ヘーゼルナッツの豊かなコクが出る","z":"世界中で栽培される。シャブリもシャンパンも、この品種が軸になる","g":"品種"},{"f":"Pinot noir","r":"ピノ・ノワール","j":"ピノ・ノワール","c":"ワイン・酒類","m":"ブルゴーニュ地方を代表する高貴な黒ブドウ品種。果皮が薄く栽培が極めて難しいが、土地（テロワール）の個性を繊細に映し出す世界最高峰の赤ワインを生む","t":"若いうちはさくらんぼやラズベリーの華やかな果実味と穏やかな渋み、熟成が進むと森の下草やきのこ、トリュフを思わせる複雑で気高い香りが広がる","z":"繊細で栽培が難しく、手のかかる品種として知られる","g":"品種"},{"f":"Sauvignon blanc","r":"ソーヴィニヨン・ブラン","j":"ソーヴィニヨン・ブラン","c":"ワイン・酒類","m":"ロワール地方（サンセール等）とボルドー地方を代表する爽やかな白ブドウ品種。魚介の前菜やハーブを使った料理、山羊チーズ（シェーヴル）との相性が抜群","t":"グレープフルーツや青りんご、摘みたてのハーブや芝生を思わせる鮮烈で青い香りと、口中をきりっと引き締める爽快な酸味が特徴","z":"サンセールやプイィ・フュメの主役","g":"品種"},{"f":"Cabernet Sauvignon","r":"カベルネ・ソーヴィニヨン","j":"カベルネ・ソーヴィニヨン","c":"ワイン・酒類","m":"ボルドー左岸（メドック等）の主役であり世界で最も広く栽培される黒ブドウ品種。粒が小さく果皮が厚いため色素とタンニンが豊富で、何十年もの長期熟成に耐える","t":"カシスやブラックベリーの濃い果実味に杉やピーマン、樽由来のバニラ香が重なり、力強い渋みと堂々たる骨格を持つ重厚な味わい","z":"晩熟で粒が小さく、長期熟成に向く","g":"品種"},{"f":"Merlot","r":"メルロー","j":"メルロー","c":"ワイン・酒類","m":"ボルドー右岸（サン・テミリオンやポムロール）の主役となる黒ブドウ品種。カベルネ・ソーヴィニヨンとブレンドされることも多く、ワインに丸みと親しみやすさを与える","t":"熟したプラムやブラックチェリーのふくよかな果実味に、ベルベットのように滑らかで柔らかなタンニン（渋み）が調和するまろやかな味わい","z":"名はクロウタドリ（メール）に由来するといわれる","g":"品種"},{"f":"Syrah","r":"シラー","j":"シラー","c":"ワイン・酒類","m":"ローヌ北部を代表する黒ブドウ品種。濃い色調とスパイス香を持つ力強い赤ワインを生み、ジビエや胡椒を効かせた肉料理によく合う","t":"黒こしょうやスミレ、ブラックベリーの凝縮した果実味と力強い渋みがあり、ジビエや胡椒の肉料理と抜群に合う","z":"南半球では「シラーズ」の名で知られる","g":"品種"},{"f":"Gamay","r":"ガメイ","j":"ガメイ","c":"ワイン・酒類","m":"ブルゴーニュ南部のボジョレー地方を代表する黒ブドウ品種。渋みが穏やかで果実味豊かな軽快な赤ワインを生み、冷やしても楽しめる","t":"イチゴやラズベリーを思わせる愛らしい果実香と穏やかな渋みがあり、軽快で親しみやすい飲み口","z":"ボジョレー・ヌーヴォーは、この品種の新酒","g":"品種"},{"f":"Gewurztraminer","r":"ゲヴェルツトラミネール","j":"ゲヴェルツトラミネール","c":"ワイン・酒類","m":"アルザス地方を代表するピンクがかった果皮の白ブドウ品種。華やかな香りとふくよかな甘み・コクがあり、フォアグラやマンステールチーズと好相性","t":"ライチやバラの花、白こしょうを思わせる華やかでエキゾチックな芳香と、ふくよかでまろやかな甘み・コク","z":"「ゲヴェルツ」はドイツ語でスパイスの意味","g":"品種"},{"f":"Riesling","r":"リースリング","j":"リースリング","c":"ワイン・酒類","m":"アルザス地方やドイツなど冷涼な産地で真価を発揮する高貴な白ブドウ品種。キレのある辛口から長期熟成する極甘口（貴腐ワイン）まで幅広く、魚介やシュークルートに好相性","t":"白い花や白桃、レモンのような凛とした芳香と、背筋が伸びるような鋭く美しい酸味、熟成で現れる独特のペトロール（鉱物）香が魅力","z":"貴腐ワインにもなる、息の長い品種","g":"品種"},{"f":"Chenin blanc","r":"シュナン・ブラン","j":"シュナン・ブラン","c":"ワイン・酒類","m":"ロワール地方を代表する白ブドウ品種。豊かな酸を核に、キレのある辛口から発泡ワイン、長期熟成する甘口貴腐ワインまで多彩に造られる","t":"洋梨や花梨、ハチミツの豊かな香りに芯のある美しい酸が通り、辛口から極甘口まで長く楽しめる","z":"辛口から甘口、発泡まで幅広いスタイルになる","g":"品種"},{"f":"Viognier","r":"ヴィオニエ","j":"ヴィオニエ","c":"ワイン・酒類","m":"ローヌ北部（コンドリューなど）を代表する白ブドウ品種。白い花や黄桃のような華やかな香りと、まろやかでボリュームのある口当たりが特徴","t":"アプリコットや黄桃、白い花のような芳醇な香りと、酸が穏やかでとろりとまろやかなボリューム感","z":"コンドリューは、この品種の単一ワインで知られる","g":"品種"},{"f":"Muscat","r":"ミュスカ","j":"ミュスカ","c":"ワイン・酒類","m":"古代ギリシャ・ローマ時代から栽培される「マスカット」系の芳香ブドウ品種の総称。アルザスの辛口白から南仏の天然甘口ワイン（ヴァン・ドゥー・ナチュレル）まで多彩","t":"生食用マスカットをそのまま頬張ったような瑞々しく華やかな果実香と、白い花やハチミツを思わせる愛らしい甘みが広がる","z":"生食用ブドウの香りが、そのままワインに出る","g":"品種"},{"f":"Bordeaux","r":"ボルドー","j":"ボルドー","c":"ワイン・酒類","m":"フランス南西部に広がる世界最大級のワイン銘醸地。カベルネ・ソーヴィニヨンやメルローをブレンドする赤ワインが中心で、白の辛口・甘口（ソーテルヌ）も世界最高峰","t":"複数品種のブレンドが生み出す均整の取れた堂々たる骨格と、長期熟成によって花開く気品ある複雑な渋み・果実味が特徴","z":"川の左岸はカベルネ主体、右岸はメルロー主体と覚えると整理しやすい","g":"産地"},{"f":"Bourgogne","r":"ブルゴーニュ","j":"ブルゴーニュ","c":"ワイン・酒類","m":"フランス中東部に位置し、赤はピノ・ノワール、白はシャルドネの単一品種で世界最高峰のワインを生む聖地。小さな畑（クリマ）ごとの細かな格付けが特徴","t":"土地のわずかな違いがそのまま味に表れる繊細でエレガントなスタイルで、豊かな酸と美しい果実味、熟成による官能的な香りが魅力","z":"畑ごとの格付け（クリマ）が細かく分かれる","g":"産地"},{"f":"Alsace","r":"アルザス","j":"アルザス","c":"ワイン・酒類","m":"ドイツ国境に接するフランス北東部の白ワイン銘醸地。細長いフルート型の瓶と、ブドウ品種名を前面に出したラベルが特徴","t":"ブドウ品種ごとの華やかな芳香とはっきりした果実味、引き締まった酸が魚介や豚肉・チーズに幅広く合う","z":"ラベルの主役は品種名。リースリングやゲヴェルツトラミネールが中心","g":"産地"},{"f":"Vallée de la Loire","r":"ヴァレ・ド・ラ・ロワール","j":"ロワール","c":"ワイン・酒類","m":"フランス最長のロワール川流域に東西に広がる銘醸地。ミュスカデ、サンセール、ヴーヴレ、シノンなど、辛口白・ロゼ・軽快な赤・発泡・甘口まで驚くほど多彩なワインを産する","t":"冷涼な気候を反映した爽やかでキレのある酸味と瑞々しい果実味を持つものが多く、魚介や野菜、山羊チーズなど幅広い料理に寄り添う","z":"サンセール、ヴーヴレ、シノンなど顔ぶれが多彩","g":"産地"},{"f":"Vallée du Rhône","r":"ヴァレ・デュ・ローヌ","j":"ローヌ","c":"ワイン・酒類","m":"ローヌ川沿いに広がる南仏の銘醸地。急斜面の北部はシラー主体の赤とヴィオニエの白、太陽に恵まれた南部はグルナッシュ主体の力強いブレンド赤やロゼ（タヴェル）で名高い","t":"黒こしょうやハーブ（ガリッグ）のスパイシーな芳香と、太陽の恵みを感じる凝縮した果実味・力強い飲み応えが特徴","z":"シャトーヌフ・デュ・パプが南部の頂点","g":"産地"},{"f":"Médoc","r":"メドック","j":"メドック","c":"ワイン・酒類","m":"ボルドーのジロンド川左岸に広がる赤ワインの銘醸地区。カベルネ・ソーヴィニヨン主体の力強く長期熟成するグラン・ヴァンを多く生む","t":"カシスや杉を思わせる気品ある香りとしっかりしたタンニンを持ち、熟成とともに複雑さを増す堂々たる赤","z":"1855年の格付けで知られる。マルゴーやポイヤックを含む","g":"産地"},{"f":"Saint-Émilion","r":"サン・テミリオン","j":"サン・テミリオン","c":"ワイン・酒類","m":"ボルドー右岸を代表する歴史あるワイン産地およびその赤ワイン。メルローを主体にカベルネ・フランをブレンドするスタイルが多く、中世の石畳の村ごと世界遺産に登録されている","t":"左岸のメドックに比べて渋みが穏やかで口当たりが柔らかく、熟したプラムやベリーの豊かな果実味とふくよかなコクが早くから楽しめる","z":"石畳の村そのものが世界遺産に登録されている","g":"産地"},{"f":"Sauternes","r":"ソテルヌ","j":"ソテルヌ","c":"ワイン・酒類","m":"ボルドー南部で貴腐ブドウから造られる世界最高峰の甘口白ワイン産地。フォアグラのテリーヌやロックフォールチーズとの組み合わせが古典","t":"ハチミツやアプリコット、マーマレードのような濃密な甘みがありながら、澄んだ酸が後味を気高く引き締める","z":"朝霧が貴腐菌を育てる。シャトー・ディケムが頂点とされる","g":"産地"},{"f":"Chablis","r":"シャブリ","j":"シャブリ","c":"ワイン・酒類","m":"ブルゴーニュ最北端の冷涼な地区で、石灰質土壌（キンメリジャン）からシャルドネ100%で造られる辛口白ワインの代名詞。生牡蠣や魚介の前菜との相性は世界的に有名","t":"火打ち石を思わせる清冽なミネラル感と、柑橘のようにきりっと引き締まった酸味が特徴の、澄み渡るほど清涼な辛口","z":"牡蠣との相性の良さで知られる","g":"産地"},{"f":"Côte de Nuits","r":"コート・ド・ニュイ","j":"コート・ド・ニュイ","c":"ワイン・酒類","m":"ブルゴーニュ地方の北半分を占め、ピノ・ノワールから世界最高峰の赤ワインを生む銘醸地区。数多くのグラン・クリュ（特級畑）が連なる","t":"赤い果実から森の下草・トリュフへと変化する複雑な芳香と、しなやかで力強い骨格を持つ最高峰の赤","z":"ジュヴレ・シャンベルタンやヴォーヌ・ロマネを含む","g":"産地"},{"f":"Côte de Beaune","r":"コート・ド・ボーヌ","j":"コート・ド・ボーヌ","c":"ワイン・酒類","m":"ブルゴーニュ地方の南半分を占め、シャルドネから世界最高峰の辛口白ワインを生む銘醸地区。ふくよかでミネラル豊かな白が名高い","t":"豊かな果実味と樽由来のバターやヘーゼルナッツの芳香、石灰質土壌の清冽なミネラル感が調和する白","z":"ムルソーやピュリニー・モンラッシェを含む","g":"産地"},{"f":"Beaujolais","r":"ボジョレー","j":"ボジョレー","c":"ワイン・酒類","m":"ブルゴーニュ南部に広がるガメイ種の銘醸地。毎年11月第3木曜日解禁の新酒「ボジョレー・ヌーヴォー」で有名だが、10の特級村（クリュ・デュ・ボジョレー）には熟成型の名品も多い","t":"イチゴやチェリーを思わせるフレッシュで華やかな果実味と、渋みが少なく軽快でチャーミングな飲み口が特徴","z":"新酒ヌーヴォーで有名だが、クリュの熟成型もある","g":"産地"},{"f":"Châteauneuf-du-Pape","r":"シャトーヌフ・デュ・パプ","j":"シャトーヌフ・デュ・パプ","c":"ワイン・酒類","m":"ローヌ南部を代表する歴史ある赤ワインの銘醸地。丸い小石が敷き詰められた畑から、太陽の恵みを感じる力強く複雑なワインが造られる","t":"熟した黒果実と南仏ハーブ、スパイスの濃厚で温かみのある風味と高いアルコール感が生む重厚な赤","z":"最大で13品種のブレンドが認められている","g":"産地"},{"f":"Sancerre","r":"サンセール","j":"サンセール","c":"ワイン・酒類","m":"ロワール川上流域の丘陵地帯で、ソーヴィニヨン・ブランから造られる辛口白ワインの銘醸地（少量のピノ・ノワールの赤・ロゼもある）。地元の山羊チーズ「クロタン」との相性は古典","t":"ハーブや柑橘、白い花の鮮烈な香りと、石灰質土壌由来のシャープな酸味・ミネラル感が際立つ洗練された辛口","z":"地元の山羊チーズ、クロタンとの組み合わせが古典","g":"産地"},{"f":"Terroir","r":"テロワール","j":"テロワール","c":"ワイン・酒類","m":"土壌・地質・日照・標高・気候、さらに人の栽培技術まで含めた「その土地ならではの生育環境と個性の総称」。フランスワインやチーズの味わいを語る上で最も重要な概念","z":"「土地の味」を指す、ワインの中心概念","g":"醸造・格付け"},{"f":"Appellation","r":"アペラシオン","j":"原産地呼称","c":"ワイン・酒類","m":"ワインやチーズ、農産物の原産地と伝統的な製法・品質を法律で厳格に保証する原産地呼称制度（フランスのAOC、EU共通のAOPが代表）。産地が狭いほど規定が厳しい","z":"等級が上ほど地域が狭く、決まりが細かくなる","g":"醸造・格付け"},{"f":"Cru","r":"クリュ","j":"クリュ","c":"ワイン・酒類","m":"優れたワインを生み出す特定の格付け畑（栽培地）、またはその畑のブドウから造られたワインを指す語。格付けの階級としてグラン・クリュ（特級）やプルミエ・クリュ（一級）がある","z":"もとの意味は「栽培地」。グラン・クリュは「偉大な畑」","g":"醸造・格付け"},{"f":"Grand cru","r":"グラン・クリュ","j":"グラン・クリュ","c":"ワイン・酒類","m":"フランスワインの格付けにおける最高位（特級）の畑、またはそのワイン。ブルゴーニュやアルザス、シャンパーニュでは優れた畑・村そのものに与えられる最高の名誉","z":"地方ごとに指す範囲が違う。ブルゴーニュでは畑の最上位","g":"醸造・格付け"},{"f":"Premier cru","r":"プルミエ・クリュ","j":"プルミエ・クリュ","c":"ワイン・酒類","m":"フランスのワイン格付けにおける「一級」の畑またはそのワイン。ブルゴーニュでは最上位のグラン・クリュに次ぐ高い評価の区画を指す","z":"ブルゴーニュでは、グラン・クリュの下、村名の上の等級","g":"醸造・格付け"},{"f":"Millésime","r":"ミレジム","j":"ミレジム","c":"ワイン・酒類","m":"ワインの原料となったブドウの「収穫年（ヴィンテージ）」のこと。フランスでは年ごとの日照や降雨量の差がブドウの熟度に大きく影響し、その年ならではの個性と熟成力を決める","z":"年ごとの天候が味に残る。当たり年、外れ年という言い方の元","g":"醸造・格付け"},{"f":"Cépage","r":"セパージュ","j":"ブドウ品種","c":"ワイン・酒類","m":"ワインの原料となるブドウの品種のこと。シャルドネやピノ・ノワールなど、品種の個性がワインの香りや骨格を大きく左右する","z":"ラベルに品種名を出すかどうかは、産地の流儀による","g":"醸造・格付け"},{"f":"Assemblage","r":"アッサンブラージュ","j":"アッサンブラージュ","c":"ワイン・酒類","m":"複数のブドウ品種、異なる畑や樽、あるいは複数年の原酒を絶妙な比率でブレンド（調合）して理想のバランスを創り上げる醸造技法。ボルドーやシャンパーニュの味づくりの要","z":"ボルドーやシャンパンの味づくりの要","g":"醸造・格付け"},{"f":"Élevage","r":"エルヴァージュ","j":"エルヴァージュ","c":"ワイン・酒類","m":"アルコール発酵を終えた若いワインを、木樽やステンレスタンク、アンフォラなどで一定期間寝かせて育てる熟成工程。容器の種類や期間によって香り・渋みの丸み・質感が大きく変わる","z":"樽かタンクか、期間の長さで香りと質感が変わる","g":"醸造・格付け"},{"f":"Barrique","r":"バリック","j":"バリック","c":"ワイン・酒類","m":"主にボルドーで標準として使われる容量225リットルのオーク製熟成小樽（ブルゴーニュのピエスは228リットル）。緩やかな酸素供給と新樽由来の香りでワインに骨格と複雑さを与える","z":"新樽の比率で、バニラやトーストの香りの強さが変わる","g":"醸造・格付け"},{"f":"Vendange","r":"ヴァンダンジュ","j":"収穫","c":"ワイン・酒類","m":"ワイン造りのためにブドウを収穫すること、またその収穫期（主に秋）。収穫時期の見極めがワインの酸味と糖度のバランスを決める","z":"手摘みか機械か、遅摘みかでワインのスタイルが決まる","g":"醸造・格付け"},{"f":"Fermentation malolactique","r":"フェルマンタシオン・マロラクティック","j":"マロラクティック発酵","c":"ワイン・酒類","m":"アルコール発酵の後に乳酸菌の働きで、シャープなリンゴ酸をまろやかな乳酸へと変える二次発酵。赤ワインのほとんどと、ふくよかな白ワイン（ブルゴーニュ白等）で行われる","z":"酸がまろやかになり、バターのような香りが出る","g":"醸造・格付け"},{"f":"Tanin","r":"タナン","j":"タンニン","c":"ワイン・酒類","m":"黒ブドウの果皮や種子、熟成用のオーク樽からワインに溶け出すポリフェノール由来の渋み成分。赤ワインに力強い骨格と長期熟成に耐える保存性を与える","z":"熟成の骨格になる。若いワインほど強く感じる","g":"ソムリエ・テイスティング"},{"f":"Bouquet","r":"ブーケ","j":"ブーケ","c":"ワイン・酒類","m":"ワインが樽や瓶の中で長期間熟成することによって生まれる、ドライフルーツ・スパイス・トリュフ・なめし革などの複雑で奥深い香り。若いワインの果実香（アローム）と区別する","z":"若いワインの香りは「アローム」、熟成した香りは「ブーケ」と言い分ける","g":"ソムリエ・テイスティング"},{"f":"Robe","r":"ローブ","j":"ローブ","c":"ワイン・酒類","m":"グラスに注いだワインの色調・濃淡・透明度・粘性などの外観全般（直訳は「ドレス」）。縁の色合いを見ることで、品種の特徴や熟成の進み具合を推測できる","z":"グラスを傾けて縁の色を見ると、熟成の進み具合が推測できる","g":"ソムリエ・テイスティング"},{"f":"Nez","r":"ネ","j":"香り（ネ）","c":"ワイン・酒類","m":"テイスティングにおいてグラスから立ち上るワインの香り全般（直訳は「鼻」）。グラスを回す前の静かな「第一のネ」と、スワリングして開かせる「第二のネ」を順に見極める","z":"静かな状態の「第一のネ」と、グラスを回して立つ「第二のネ」を取り分ける","g":"ソムリエ・テイスティング"},{"f":"Dégustation","r":"デギュスタシオン","j":"テイスティング","c":"ワイン・酒類","m":"ワインの品質や個性を、視覚（外観）・嗅覚（香り）・味覚（味わい・バランス・余韻）の順に五感を使って丁寧に評価・鑑賞するテイスティングの手順","z":"外観、香り、味わい、余韻の順に見る","g":"ソムリエ・テイスティング"},{"f":"Décantation","r":"デカンタシオン","j":"デカンタージュ","c":"ワイン・酒類","m":"ボトルからガラス製容器（デカンタ）へワインを静かに移し替えるサービス技法。長期熟成赤ワインの澱（おり）を取り除く目的と、若いワインに空気を触れさせて香りを開く目的がある","z":"滓を除く目的と、若いワインに空気を触れさせる目的がある","g":"ソムリエ・テイスティング"},{"f":"Bouchonné","r":"ブショネ","j":"ブショネ","c":"ワイン・酒類","m":"天然コルクに含まれる汚染物質（TCA）がワインに移り、湿った段ボールやカビのような不快な臭いがついてしまった欠陥状態。ソムリエのテイスティングで確認されれば新しいボトルに交換される","z":"原因はコルク中の成分TCA。店では交換の対象になる欠陥臭","g":"ソムリエ・テイスティング"},{"f":"Brut","r":"ブリュット","j":"ブリュット","c":"ワイン・酒類","m":"シャンパーニュやクレマンなど発泡ワインの「辛口」を表す表示（残糖12g/L未満）。食前酒から食事中まで幅広く合わせられる定番スタイル","z":"甘さの段階のひとつ。ドゥミ・セックは中甘口に当たる","g":"種類・スタイル"},{"f":"Demi-sec","r":"ドゥミ・セック","j":"ドゥミ・セック","c":"ワイン・酒類","m":"発泡ワインの「中甘口〜甘口」を表す表示（残糖32〜50g/L）。やさしい甘みがあり、フルーツタルトなどデザートと合わせるのに向く","z":"「半分の辛口」という意味だが、実際はほのかな甘みがある","g":"種類・スタイル"},{"f":"Moelleux","r":"ムワルー","j":"ムワルー","c":"ワイン・酒類","m":"辛口と極甘口の中間にあたる、やわらかな甘みを持つ白ワイン（ロワールのシュナン・ブラン等）の味わい表示。フォアグラやブルーチーズ、フルーツ系デザートと好相性","z":"ロワールのシュナン・ブランによく使われる","g":"種類・スタイル"},{"f":"Blanc de blancs","r":"ブラン・ド・ブラン","j":"ブラン・ド・ブラン","c":"ワイン・酒類","m":"黒ブドウを使わず、白ブドウ（シャンパーニュではシャルドネ100%が代表）のみで造られる発泡ワイン（直訳は「白の中の白」）。魚介の前菜や食前酒に最適","z":"シャンパンでは、シャルドネ100%を指すことが多い","t":"繊細でエレガントな酸味と柑橘・白い花の清らかな香り、シャープで澄み切ったキレのある余韻が特徴","g":"種類・スタイル"},{"f":"Crémant","r":"クレマン","j":"クレマン","c":"ワイン・酒類","m":"シャンパーニュ地方以外のフランス各地（アルザス、ブルゴーニュ、ロワール、リムー等）で、シャンパーニュと同じ瓶内二次発酵方式によって造られる高品質な発泡ワインの総称","z":"アルザスやブルゴーニュ、ロワールのものが知られる","t":"きめ細かな泡と各産地のブドウ品種を活かした爽やかな果実味があり、手頃ながら本格的な飲み応えを楽しめる","g":"種類・スタイル"},{"f":"Vin rouge","r":"ヴァン・ルージュ","j":"赤ワイン","c":"ワイン・酒類","m":"黒ブドウを果皮や種子ごと発酵させ、色素と渋み成分（タンニン）をしっかり抽出した赤ワイン。軽快なボジョレーから重厚なボルドーまで肉料理やチーズと幅広く合わせる","t":"ベリーやプラムの豊かな果実味に、果皮と樽由来の心地よい渋みと酸味が骨格を与える奥深い味わい","z":"色と渋みは、皮から出る","g":"種類・スタイル"},{"f":"Vin rosé","r":"ヴァン・ロゼ","j":"ロゼワイン","c":"ワイン・酒類","m":"黒ブドウを短時間だけ果皮に接触させて淡いピンク色を引き出したり、直接圧搾して造るロゼワイン。南仏プロヴァンス産が代表的で、冷やして夏の前菜や魚介・肉まで万能に合う","t":"イチゴや柑橘を思わせる軽やかでフレッシュな果実味と、きりっと爽やかな酸味、ほのかなドライ感が心地よい","z":"赤と白を混ぜて作るのは、シャンパンなど一部だけ","g":"種類・スタイル"},{"f":"Château","r":"シャトー","j":"シャトー","c":"ワイン・酒類","m":"ボルドー地方を中心に使われる、自社畑を所有しブドウ栽培から醸造・瓶詰めまでを一貫して行うワイン生産者（エステート）の単位。城館がなくても歴史的単位として名乗る","z":"城でなくてもシャトーを名乗る。ラベルの格として読む","g":"醸造・格付け"},{"f":"Saint-Paulin","r":"サン・ポーラン","j":"サン・ポーラン","c":"チーズ","g":"セミハード","m":"ロワール地方の修道院で生まれた牛乳製のセミハードチーズ。オレンジ色の表皮とクセのない柔らかな生地で、誰にでも食べやすい","t":"弾力のあるしっとりした生地から、クセのない穏やかでミルキーな甘みとやさしい塩気が広がる、誰でも食べやすい味わい","z":"もとは修道院のチーズ。オレンジ色の皮が目印"},{"f":"Port-Salut","r":"ポール・サリュ","j":"ポール・サリュ","c":"チーズ","g":"セミハード","m":"マイエンヌ県の修道院で生まれた牛乳製のセミハードチーズ。弾力がありまろやかで、フルーツや軽い赤ワインと気軽に合わせられる","t":"クセが少なく穏やかで、弾力のあるなめらかな口当たりにミルクのまろやかなコクとほのかな酸味が調和する優しい味わい","z":"修道院で作られたのが始まり。日本でもなじみのある味"},{"f":"Chaumes","r":"ショーム","j":"ショーム","c":"チーズ","g":"ウォッシュ","m":"フランス南西部で造られる牛乳製のウォッシュチーズ。鮮やかなオレンジ色の皮を持つが香りは穏やかで、ウォッシュ入門としても人気","t":"ウォッシュ特有の強いクセはなく香りは穏やかで、しっとり柔らかな生地からバターのようなまろやかなコクと旨味が広がる","z":"オレンジ色の皮。ウォッシュタイプの入門にも向く"},{"f":"Délice de Bourgogne","r":"デリス・ド・ブルゴーニュ","j":"デリス・ド・ブルゴーニュ","c":"チーズ","g":"白カビ","m":"ブルゴーニュ地方で造られる、牛乳にたっぷり生クリームを加えて乳脂肪分75%に仕上げたトリプルクリームの白カビチーズ。シャンパーニュやフルーティーな白ワインと好相性","t":"まるで極上のホイップバターのように濃厚でとろける口溶けに、生クリームの豊かな甘みとほのかな酸味が重なる贅沢な味わい","z":"生クリームを加えた贅沢な白カビ。名は「ブルゴーニュの喜び」"},{"f":"Boulette d’Avesnes","r":"ブーレット・ダヴェンヌ","j":"ブーレット・ダヴェンヌ","c":"チーズ","g":"ウォッシュ","m":"北フランス・アヴェンヌ地方の牛乳製ウォッシュチーズ。パプリカやハーブ、こしょうを練り込んだ円錐形で、強烈な香りとパンチの効いた味が特徴","t":"強烈で個性的な発酵香に、練り込んだパプリカ・タラゴン・こしょうのスパイシーな刺激と濃厚なコクが弾けるパンチのある味わい","z":"マロワルの生地にハーブやスパイスを混ぜ、円錐形に固めたもの"},{"f":"Gaperon","r":"ガプロン","j":"ガプロン","c":"チーズ","g":"セミハード","m":"オーヴェルニュ地方のドーム型をした牛乳製セミハードチーズ。生地ににんにくと粗挽き黒こしょうが練り込まれており、ビールや赤ワインに合う","t":"しっとりした生地から、にんにくの食欲をそそる芳香と粗挽き黒こしょうのピリッとした刺激、まろやかなミルクのコクが広がる","z":"ドーム形が目印。もとはバターミルクで作られた"},{"f":"Brousse","r":"ブルース","j":"ブルース","c":"チーズ","g":"フレッシュ","m":"プロヴァンスやコルシカ島で羊乳や山羊乳（またはそのホエイ）から造られる、熟成させない白いフレッシュチーズ。蜂蜜やオレンジ花水をかけてデザートにするのが南仏流","t":"空気を含んだようにふんわり軽やかで優しい口溶けに、羊・山羊乳ならではのほのかな甘みと清らかなミルクの風味が広がる","z":"蜂蜜をかけて、デザートにもする"},{"f":"Cervelle de canut","r":"セルヴェル・ド・カニュ","j":"セルヴェル・ド・カニュ","c":"チーズ","g":"フレッシュ","m":"水切りしたフロマージュ・ブランに、刻みエシャロット・シブレット・パセリ・白ワイン・オリーブ油・酢を混ぜ合わせたリヨンの郷土チーズ料理。パンやゆでじゃがいもに添える","t":"フレッシュチーズの爽やかな酸味とクリーミーさに、エシャロットとハーブの清涼な香り・辛味が効いたワインが進む軽快な味","z":"名は「絹織り職人の脳みそ」。リヨンの大衆食堂（ブション）の定番"},{"f":"Pâte molle","r":"パット・モル","j":"パット・モル","c":"チーズ","m":"加熱や強い圧搾をせずに水分を多く残して造る、柔らかい生地のチーズの総称。表皮の仕上げによって「白カビ（ブリ、カマンベール）」と「ウォッシュ（エポワス等）」に分かれる","z":"ブリやカマンベールが代表。表皮の種類でさらに分かれる","t":"しっとりと柔らかく、熟成が進むにつれて中心までとろりとクリーミーで濃厚なコクが増す","g":"チーズ用語"},{"f":"Pâte pressée","r":"パット・プレッセ","j":"パット・プレッセ","c":"チーズ","m":"凝乳（カード）を型に入れて重しで圧搾し、水分をしっかり抜いて造るチーズの総称。非加熱圧搾（サン・ネクテール等）と加熱圧搾（コンテ、ボーフォール等）に分かれる","z":"コンテやカンタルのように、長期熟成に向くものが多い","t":"水分が少なく締まった食感で、噛むほどにナッツや果実を思わせる旨味とコクが広がる","g":"チーズ用語"},{"f":"Pâte persillée","r":"パット・ペルシエ","j":"パット・ペルシエ","c":"チーズ","m":"凝乳にアオカビの胞子を加え、熟成中に針で空気穴をあけて内部に大理石状の青カビを育てたチーズの総称（ブルーチーズ）。ロックフォールやフルム・ダンベールが代表格","z":"ロックフォールやフルム・ダンベールが代表","t":"青カビ特有のピリッとした刺激としっかりした塩気、乳脂肪の濃厚なコクが調和する","g":"チーズ用語"},{"f":"Croûte fleurie","r":"クルート・フルーリ","j":"クルート・フルーリ","c":"チーズ","m":"熟成中にチーズの表面をふんわりと覆う、白いカビ（ペニシリウム・カマンベルティ等）の表皮のこと。内部のタンパク質を分解して中心まで柔らかく熟成させる働きがある","z":"「花の咲いた皮」の意味。ブリやカマンベールの白い皮","t":"表皮はふんわりと柔らかく、ほのかにマッシュルームや湿った藁を思わせる穏やかな香りがある","g":"チーズ用語"},{"f":"Croûte lavée","r":"クルート・ラヴェ","j":"クルート・ラヴェ","c":"チーズ","m":"熟成中に塩水やマール・シードル・ワインなどで表面を繰り返し洗い、リネンス菌を育てて赤オレンジ色に仕上げた表皮のこと。マンステールやエポワスに代表される","z":"マンステールやエポワスの、香りの強いオレンジ色の皮","t":"表皮は独特の強い香りを放つが、中身はねっとりと濃厚で旨味が濃いものが多い","g":"チーズ用語"},{"f":"Lait cru","r":"レー・クリュ","j":"生乳","c":"チーズ","m":"低温殺菌（パストリゼ）を行わず、搾ったままの生きた乳酸菌や酵素を残した生乳のこと。フランスの伝統的なAOPチーズの多くで義務付けられており、土地の個性を生む","z":"AOPチーズの多くで使われる。風味は豊かだが、管理が難しい","t":"加熱殺菌した乳に比べて香りが豊かで奥行きがあり、牧草や土地ごとの個性がそのまま味に表れる","g":"チーズ用語"},{"f":"Affinage","r":"アフィナージュ","j":"アフィナージュ","c":"チーズ","m":"成形・加塩した若いチーズを熟成庫（カーヴ）で温度・湿度を管理しながら育て、香りや食感を引き出す最終工程。専門の熟成士（アフィヌール）の腕が仕上がりを大きく左右する","z":"熟成の専門職は「アフィヌール」。温度と湿度の管理が味を決める","t":"熟成の度合いによって、若いうちは爽やかでミルキー、進むほどに塩気とコク、複雑な香りが深まる","g":"チーズ用語"},{"f":"Fromage fermier","r":"フロマージュ・フェルミエ","j":"フロマージュ・フェルミエ","c":"チーズ","m":"酪農家が自らの農場で搾った単一の群れの乳だけを使い、農場の工房で一貫して手造りする農家製チーズ。工場製（ラティエ）に比べ生産量は少ないが、季節と土地の個性が色濃い","z":"各地の乳を集める「ラティエ（工場製）」と区別される","t":"季節や牧草の変化がそのまま反映された、力強く個性豊かなミルクの風味と余韻がある","g":"チーズ用語"},{"f":"Allergie","r":"アレルジー","j":"アレルギー","c":"サービス・接客","m":"特定の食材（卵・乳・小麦・甲殻類・ナッツ等）に対する食物アレルギーのこと。レストランでは注文前に確認し、内容の差し替えで対応する","z":"接客では最初に確認する項目。「アレルギーはありますか」と聞くのが定番","g":"食事制限・表示"},{"f":"Sans","r":"サン","j":"〜なし","c":"サービス・接客","m":"「〜なしで／〜抜きで」を意味する前置詞。アレルギーや好みの対応で「サン・グルテン（グルテンフリー）」「サン・ザルコール（ノンアルコール）」のようにメニューや接客で頻出する","z":"「サン・グルテン（グルテンなし）」のように使う。反対はアヴェック","g":"食事制限・表示"},{"f":"Avec","r":"アヴェック","j":"〜入り","c":"サービス・接客","m":"「〜と一緒に／〜入りで」を意味する前置詞。付け合わせやソース、氷の有無などを伝える際に使い、反対語は「サン（〜なし）」","z":"反対はサン（〜なし）","g":"食事制限・表示"},{"f":"Chaud","r":"ショー","j":"温かい","c":"サービス・接客","m":"料理や飲み物が「温かい・熱い」状態を表す基本語。温前菜（アントレ・ショード）やホットワイン（ヴァン・ショ）などの表記に使われる","z":"料理の温度の基本語。反対はフロワ（冷たい）","g":"食事制限・表示"},{"f":"Froid","r":"フロワ","j":"冷たい","c":"サービス・接客","m":"料理や飲み物が「冷たい」状態を表す基本語。冷前菜（アントレ・フロワド）や冷製ソースなど、温度帯を区別する表記に使われる","z":"冷製料理や、冷たい飲み物を指す。反対はショー（温かい）","g":"食事制限・表示"},{"f":"Épicé","r":"エピセ","j":"辛い","c":"サービス・接客","m":"唐辛子やこしょう、各種スパイスが効いた「辛い・スパイシーな」状態を表す語。辛さの度合いを確認する際に使い、「トロ・エピセ」で辛すぎるという意味になる","z":"辛さの確認でよく使う。「トロ・エピセ」で辛すぎる","g":"食事制限・表示"},{"f":"Végétarien","r":"ヴェジェタリヤン","j":"ベジタリアン","c":"サービス・接客","m":"肉や魚を食べない菜食主義の人、またはその人向けの料理。卵や乳製品は摂る場合が多く、動物性食品を一切摂らない完全菜食は「ヴェガン（Végan）」と呼んで区別する","z":"卵や乳製品は食べる人が多い。完全に植物性のみは、ヴェガンと呼ぶ","g":"食事制限・表示"},{"f":"Gluten","r":"グルテン","j":"グルテン","c":"サービス・接客","m":"小麦・大麦・ライ麦などに含まれるたんぱく質の一種で、パンやパスタの弾力の素になる。近年はアレルギーや体質配慮で「サン・グルテン（グルテンフリー）」の要望が増えている","z":"アレルギー対応で確認が増えている。「サン・グルテン」がグルテンフリーの意味","g":"食事制限・表示"},{"f":"Halal","r":"ハラル","j":"ハラル","c":"サービス・接客","m":"イスラム教の戒律において「許された」食品や調理法のこと。豚肉やアルコール（調理用のワインやみりん等も含む）を一切使わず、規定の方法で処理された肉のみを用いる","z":"酒と豚肉が禁じられるのが基本","g":"食事制限・表示"},{"f":"Fait maison","r":"フェ・メゾン","j":"自家製","c":"サービス・接客","m":"既製品や冷凍の半製品を使わず、生の食材からその店の厨房で一から手作りした料理であることを示すフランスの公式表示","z":"メニューに書くと、手作りの証になる表示","g":"メニュー・注文"},{"f":"Du jour","r":"デュ・ジュール","j":"本日の","c":"サービス・接客","m":"メニューで「本日の〜」を意味する表現。その日の仕入れに合わせて内容が変わる日替わりの一皿やスープ、鮮魚料理に付く","z":"「プラ・デュ・ジュール」が本日の一皿、「スープ・デュ・ジュール」が本日のスープ","g":"メニュー・注文"},{"f":"Scorsonère","r":"スコルソネール","j":"黒サルシフィ","c":"食材","g":"野菜","m":"サルシフィに似た、黒い皮の根菜","z":"白いサルシフィに対して「黒サルシフィ」と呼ばれる","t":"ごぼうに似た穏やかな土の香りとほのかな甘みがあり、加熱するとほっくり柔らかく仕上がる","d":"黒サルシフィのクリーム煮、バターソテー、フリット"},{"f":"Crosne","r":"クローヌ","j":"チョロギ","c":"食材","g":"野菜","m":"巻貝のようにくびれた小さな白い塊茎を食べる冬の根菜（チョロギ）。フランスでは塩ゆでにしてバターでソテーし、肉や魚の付け合わせにする","z":"日本のチョロギと同じ植物。フランスのクローヌ村で栽培が広まった","t":"シャキシャキとした軽快な歯ざわりと、ほのかにアーティチョークやゆり根を思わせる上品な甘み","d":"チョロギのバターソテー（ペルシヤード）、肉・魚料理の冬の付け合わせ"},{"f":"Laitue","r":"レテュ","j":"レタス","c":"食材","g":"野菜","m":"柔らかな葉を持つ結球・半結球のレタス全般。生サラダの基本となるほか、グリーンピースと一緒に蒸し煮にするなど加熱料理にも使う","z":"サラダの基本。葉を1枚ずつはがして使うことが多い","t":"みずみずしくシャキッとした食感で、クセがなく淡白な中にごくわずかなほろ苦さがある","d":"グリーンサラダ（ヴィネグレット）、プチ・ポワ・ア・ラ・フランセーズ（蒸し煮）"},{"f":"Trévise","r":"トレヴィーズ","j":"トレビス","c":"食材","g":"野菜","m":"赤紫の葉を持つ、チコリの仲間","t":"チコリ系ならではのきりっと引き締まったほろ苦さとシャキッとした歯ざわりがあり、グリルにすると甘みと香ばしさが増す","z":"サラダの彩りと、苦みのアクセントに使う","d":"トレビスと柑橘・くるみのサラダ、トレビスのグリル（バルサミコ風味）"},{"f":"Chou rouge","r":"シュー・ルージュ","j":"紫キャベツ","c":"食材","g":"野菜","m":"アントシアニンを含む赤紫色のキャベツ。千切りにして酢でマリネしたサラダや、りんご・赤ワインと煮込んでジビエや鴨の付け合わせにする","z":"酢に触れると色が鮮やかになる。マリネや煮込みに","t":"普通のキャベツより歯ごたえがしっかりしており、甘みの中にわずかな辛みとコクがある","d":"紫キャベツのりんご・赤ワイン煮込み（ジビエや鴨の付け合わせ）、マリネサラダ"},{"f":"Chou frisé","r":"シュー・フリゼ","j":"ちりめんキャベツ","c":"食材","g":"野菜","m":"縮れた葉のキャベツ。ケールに近い","z":"ポトフやスープなど、煮込みに向く","t":"葉に厚みがあり煮崩れしにくく、加熱すると濃い甘みとキャベツらしい旨味が引き立つ","d":"ポトフ、シュー・ファルシ（ロールキャベツ）、ガルビュール、ホロホロ鳥のキャベツ煮"},{"f":"Romanesco","r":"ロマネスコ","j":"ロマネスコ","c":"食材","g":"野菜","m":"黄緑色の、渦巻き状のつぼみを持つ野菜","t":"カリフラワーに似たやさしい甘みとブロッコリーのようなコリッとした心地よい歯ごたえがあり、ナッツのようなほのかな香ばしさも魅力","z":"カリフラワーとブロッコリーの仲間。幾何学的な見た目が特徴","d":"ロマネスコの温野菜（オランデーズ添え）、グラタン、バターソテー"},{"f":"Butternut","r":"バターナッツ","j":"バターナッツ","c":"食材","g":"野菜","m":"ひょうたんのような形をした淡いオレンジ色の西洋かぼちゃ。繊維が少なく極めてなめらかに仕上がるため、秋冬のポタージュやローストの定番","t":"ねっとりなめらかで、バターとナッツを思わせる濃厚な甘みがある","z":"ポタージュの定番。バターとナッツを思わせる風味が名の由来","d":"バターナッツのポタージュ（ヴルーテ）、ロースト、グラタン"},{"f":"Haricot blanc","r":"アリコ・ブラン","j":"白いんげん豆","c":"食材","g":"穀類","m":"インゲン豆のうち皮が白い乾燥豆の総称（ランゴ、タルブ豆など）。長時間煮込んでも煮崩れしにくく、カスレや羊肉料理の付け合わせの主役","z":"カスレの主役。タルブ産やココ・ド・パンポルが有名","t":"ほくほくとなめらかな口当たりで、豆のやさしい甘みがあり肉や脂の旨味をよく吸い込む","d":"カスレ、ガルビュール、白いんげん豆のトマト煮込み"},{"f":"Trompette de la mort","r":"トロンペット・ド・ラ・モール","j":"黒ラッパタケ","c":"食材","g":"野菜","m":"秋から晩秋に森で採れる真っ黒なラッパ形の野生きのこ（クロラッパタケ）。乾燥させても香りが強く、ソースやリゾット、魚介の付け合わせに珍重される","t":"トリュフにも例えられる芳醇な森の香りと、噛むほどに広がる深い旨味","z":"「死のラッパ」という物騒な名だが、美味な食用きのこ","d":"黒ラッパタケのクリームソース、ジビエや白身魚の付け合わせ、リゾット"},{"f":"Pied-de-mouton","r":"ピエ・ド・ムートン","j":"ピエ・ド・ムートン","c":"食材","g":"野菜","m":"傘の裏に、小さな針が並ぶきのこ","t":"コリコリと心地よい弾力のある歯ごたえと、ほのかにスパイシーで森を思わせる上品な芳香・旨味があり煮込みでも崩れにくい","z":"名は「羊の足」。日本のウスタケに近い仲間","d":"ピエ・ド・ムートンのバターソテー、仔牛や鶏のフリカセ、ジビエの付け合わせ"},{"f":"Pleurote","r":"プレロット","j":"ヒラタケ","c":"食材","g":"野菜","m":"大きな扇形の傘を持つきのこの総称（ヒラタケやエリンギの仲間）。ソテーやフリカセ、クリームソースなど肉・魚どちらの付け合わせにも万能","z":"しめじのような使い方をする。エリンギもこの仲間","t":"クセが少なく穏やかな旨味と、ほどよい弾力のあるしっとりした歯ごたえが特徴","d":"ヒラタケのソテー（ペルシヤード）、鶏のクリーム煮、オムレツ"},{"f":"Pruneau","r":"プリュノー","j":"プルーン","c":"食材","g":"果物","m":"西洋スモモ（プラム）を乾燥させたドライフルーツ（プルーン）。コンポートやタルト（ファー・ブルトン）のほか、豚肉や兎の赤ワイン煮に甘みとコクを添える","t":"乾燥によってプラムの甘みと穏やかな酸味がぎゅっと凝縮され、赤ワインや紅茶で戻すととろりと芳醇なコクが出る","z":"アジャン産が最高級とされる。肉の煮込みにも使う","d":"ファー・ブルトン（ブルターニュの焼き菓子）、豚肉やウサギのプルーン煮込み"},{"f":"Griotte","r":"グリオット","j":"グリオット","c":"食材","g":"果物","m":"酸味の強い、サクランボの品種","t":"普通のさくらんぼよりはるかに鮮烈で鋭い酸味と濃い赤い果汁を持ち、キルシュやチョコレート、鴨肉と抜群の相性を誇る","z":"ソースやリキュール、菓子に使う","d":"フォレ・ノワール（黒い森のケーキ）、グリオットのクラフティ、鴨のチェリーソース"},{"f":"Mûre","r":"ミュール","j":"ブラックベリー","c":"食材","g":"果物","m":"夏から秋にかけて黒紫色に熟す木いちご（ブラックベリー）。ジャムやタルト、クーリにするほか、ジビエの甘酸っぱいソースにも用いられる","t":"濃い甘みの中にほどよい酸味とベリー特有の芳醇な香りがある","z":"フランボワーズ（ラズベリー）の近縁","d":"ブラックベリーのタルト、クーリ、ジビエ（鹿・鴨）の甘酸っぱいソース"},{"f":"Myrtille","r":"ミルティーユ","j":"ブルーベリー","c":"食材","g":"果物","m":"山野に自生する青黒い小さなベリー（ブルーベリー／ビルベリー）。タルトやジャム、ソースに広く使われ、特に野生種は風味が濃い","t":"甘みと爽やかな酸味がぎゅっと詰まった濃い果実味があり、特に野生種は目が覚めるほど芳醇な香りと深い色合いを持つ","z":"タルトの定番。野生種は色も香りも濃い","d":"タルト・オ・ミルティーユ（アルプス地方名物）、コンフィチュール、ジビエのソース"},{"f":"Citron vert","r":"シトロン・ヴェール","j":"ライム","c":"食材","g":"果物","m":"爽やかな香りと鋭い酸味を持つ緑色の柑橘（ライム）。魚介のカルパッチョやセビーチェ風の冷前菜、トロピカルなデザートの仕上げに使う","t":"レモンより鋭く清涼感あふれる爽やかな酸味と青い芳香があり、魚介の前菜やトロピカルなデザートを鮮やかに引き締める","z":"レモンとは別種。魚介やカクテルに","d":"魚介のカルパッチョ・セビーチェ、ライムのタルト、ソルベ・グラニテ"},{"f":"Fruit de la passion","r":"フリュイ・ド・ラ・パシオン","j":"パッションフルーツ","c":"食材","g":"果物","m":"香り高い果汁とプチプチした種を持つ南国果実（パッションフルーツ）。ムースやソルベ、マカロンのほか、ホタテや白身魚のソースにも使われる","t":"華やかで鮮烈な南国の芳香ときゅっと目が覚める強い甘酸っぱさ、種のカリッとした食感がクリームやチョコに映える","z":"名は「受難の果実」。花の形がキリストの受難を思わせることから","d":"パッションフルーツのムース・マカロン、ホタテや白身魚のソース"},{"f":"Kaki","r":"カキ","j":"柿","c":"食材","g":"果物","m":"秋が旬のオレンジ色の果実（柿）。フランスでもデザートやコンポート、生ハムやフォアグラと合わせる秋の冷前菜として親しまれている","z":"日本の柿が伝わったもの。渋柿を甘くしたものも売られる","t":"ねっとりとなめらかな果肉で、酸味がほとんどなく濃厚でやさしい甘みがある","d":"柿と生ハム・ブッラータの冷前菜、柿のコンポート、秋のデザート"},{"f":"Pistache","r":"ピスタシュ","j":"ピスタチオ","c":"食材","g":"ナッツ類","m":"鮮やかな緑色の実を持つ高級ナッツ（ピスタチオ）。アイスクリームやマカロンなどの菓子のほか、パテやテリーヌの断面の彩りと食感に欠かせない","z":"菓子やシャルキュトリに使う","t":"香ばしくまろやかなナッツのコクと、青々とした上品で華やかな香りがある","d":"パテ・アン・クルート、ピスタチオのアイスクリーム・マカロン・フレジエ"},{"f":"Pignon","r":"ピニョン","j":"松の実","c":"食材","g":"ナッツ類","m":"松かさから採れるクリーム色の小さな種子（松の実）。軽く煎ってサラダやバジルペースト、南仏風の煮込みや菓子のトッピングに使う","z":"サラダやペーストに使う","t":"ほのかな松脂のような香りと、油分の多いクリーミーでやさしい甘みがある","d":"ピストゥ・バジルソース、南仏風サラダ、プロヴァンス風野菜煮込み"},{"f":"Raisin sec","r":"レザン・セック","j":"干しぶどう","c":"食材","g":"果物","m":"ブドウを乾燥させたもの（レーズン）","z":"菓子やパン、クスクスに使う","t":"ぶどうの甘みと酸味がぎゅっと凝縮され、噛むほどに芳醇な果実味とコクが広がる","d":"パン・オ・レザン、クスクスの付け合わせ（甘い玉ねぎ煮）、ガトー・バスク風"},{"f":"Lièvre","r":"リエーヴル","j":"野うさぎ","c":"食材","g":"肉","m":"野生のうさぎ。家うさぎより野性味が強い","t":"家うさぎとは一線を画す力強く野性味あふれる濃い赤身の旨味と芳香があり、血と赤ワインで煮込むと極上の深みになる","z":"血でつなぐ煮込み「シヴェ」の主役","d":"野うさぎのシヴェ、リエーヴル・ア・ラ・ロワイヤル（王室風煮込み）"},{"f":"Sanglier","r":"サングリエ","j":"猪","c":"食材","g":"肉","m":"秋から冬に狩猟される野生の猪（イノシシ）の肉。豚より赤身が濃く引き締まっており、赤ワインでマリネしてからドーブやシヴェに仕立てる","t":"野生ならではの力強く引き締まった赤身の旨味と独特の野趣があり、赤ワインでマリネして煮込むとほろりと深いコクになる","z":"子猪はマルカッサンと呼ぶ","d":"猪のシヴェ、猪のドーブ（赤ワイン煮込み）、猪のパテ・テリーヌ"},{"f":"Marcassin","r":"マルカッサン","j":"子猪","c":"食材","g":"肉","m":"生後半年から1年未満の若い猪（ウリボウ／子猪）の肉。成獣の猪よりはるかに柔らかくクセが少ないため、ローストやポワレで楽しめる","t":"成獣の猪よりはるかに柔らかくクセの少ない赤身で、ジビエらしい上品な旨味とほんのり甘い脂がローストで引き立つ","z":"幼い時期は体に縞模様がある","d":"子猪のロティ（ポワヴラード／グラン・ヴヌールソース）、子猪のポワレ"},{"f":"Cerf","r":"セルフ","j":"鹿","c":"食材","g":"肉","m":"秋から冬のジビエを代表する鹿（特に雄鹿）の肉。高タンパク・低脂肪で、背肉のローストにポワヴラードやグラン・ヴヌールソースを合わせるのが古典","t":"脂肪が少なくきめ細かな美しい赤身で、鉄分を感じる上品で濃い旨味があり、赤ワインとベリーのソースが完璧に調和する","z":"雌鹿はビッシュと呼ぶ。秋のジビエの代表","d":"鹿背肉のロティ（グラン・ヴヌールソース）、鹿肉のシヴェ"},{"f":"Gésier","r":"ジェジエ","j":"砂肝","c":"食材","g":"鳥肉、うさぎ肉","m":"鴨やガチョウ、鶏の砂嚢（すなぎも）。フランス南西部では塩漬けにして脂で柔らかく煮た「砂肝のコンフィ」を温かいサラダにのせるのが名物","t":"コリコリと心地よい歯ごたえがあり、コンフィにするとしっとり濃厚な旨味になる","z":"コンフィにしてサラダに載せるのが、南西部風","d":"砂肝のコンフィの温かいサラダ（ペリゴール風／ガスコーニュ風サラダ）"},{"f":"Boudin blanc","r":"ブーダン・ブラン","j":"白いソーセージ","c":"食材","g":"肉","m":"白身の肉とパン、牛乳で作る白い腸詰め","t":"鶏や仔牛などの白身肉と牛乳・生クリームが織りなす驚くほどふんわり滑らかな口当たりと、上品でまろやかなコクが魅力","z":"クリスマスの定番。黒いブーダン・ノワールと対になる","d":"ブーダン・ブランのソテー（りんごのソテーやトリュフソース添え・クリスマスの定番）"},{"f":"Jambon de Bayonne","r":"ジャンボン・ド・バイヨンヌ","j":"バイヨンヌの生ハム","c":"食材","g":"肉","m":"フランス南西部バイヨンヌ周辺で造られる伝統的な生ハム（IGP）。地元の塩と穏やかな気候で長期熟成させ、前菜やピペラードに添える","t":"穏やかな塩気と長期熟成による奥深い旨味、口の中でとろける甘い脂があり、バスク料理やメロンと絶妙に調和する","z":"アドゥール川流域の塩で仕込む。AOPの生ハム","d":"ピペラード（バイヨンヌ産生ハム添え）、生ハムメロン、前菜のシャルキュトリ"},{"f":"Jambon cru","r":"ジャンボン・クリュ","j":"生ハム","c":"食材","g":"肉","m":"塩漬けして乾燥・熟成させた、ハムの総称","z":"バイヨンヌなど、産地ものが多い","t":"ほどよい塩気と脂の甘み、長期熟成ならではの凝縮した旨味と芳醇な香りがある","d":"生ハムメロン、いちじくと生ハムの前菜、シャルキュトリ盛り合わせ"},{"f":"Lardon","r":"ラルドン","j":"ベーコンの角切り","c":"食材","g":"肉","m":"豚バラ肉を短冊状に切ったもの","z":"サラダやキッシュ、煮込みの旨味出しに使う","t":"炒めると脂が溶け出して香ばしく、燻製の香りと塩気が料理全体に深い旨味を加える","d":"キッシュ・ロレーヌ、サラド・リヨネーズ、ブフ・ブルギニョン、タルティフレット"},{"f":"Fromage de tête","r":"フロマージュ・ド・テット","j":"豚頭肉のテリーヌ","c":"食材","g":"肉","m":"豚の頭肉を、ゼリーで固めたテリーヌ","z":"名前にフロマージュ（チーズ）とあるが、チーズではない","t":"ゼラチン質のぷるんとした食感と豚肉の濃い旨味、香草や酢のさっぱりした後味が調和する","d":"フロマージュ・ド・テットの冷前菜（グリビッシュ／ラヴィゴットソース＆コルニション添え）"},{"f":"Lamproie","r":"ランプロワ","j":"ヤツメウナギ","c":"食材","g":"魚介類","m":"あごを持たない原始的な魚（ヤツメウナギ）。春にジロンド川を遡上するものが名産で、血と赤ワインで煮込むボルドー風が歴史的古典料理","t":"うなぎにも似た豊かな脂と力強く個性的な濃い旨味があり、赤ワインと自身の血・ポロねぎで煮込むと重厚なコクになる","z":"赤ワイン煮（ランプロワ・ア・ラ・ボルドレーズ）がボルドーの古典","d":"ランプロワ・ア・ラ・ボルドレーズ（ヤツメウナギのボルドー風赤ワイン煮）"},{"f":"Sandre","r":"サンドル","j":"パイクパーチ","c":"食材","g":"魚介類","m":"ヨーロッパの川や湖に棲む大型の淡水魚（パイクパーチ）。小骨が少なく身が美しい白身で、ロワール地方ではブール・ブランを添えて味わう","t":"川魚特有の泥臭さがなく、きめ細かく淡白で上品な甘みがある","z":"ロワールなどの川魚。ベール・ブランで出す","d":"サンドルのポワレ（ブール・ブラン／ブール・ナンテ添え）、白ワイン煮"},{"f":"Éperlan","r":"エペルラン","j":"キュウリウオ","c":"食材","g":"魚介類","m":"ワカサギに似た銀色の小さな魚（キュウリウオ）。頭や骨ごと小麦粉をまぶしてカリッと揚げ、レモンを絞って前菜やおつまみに食べる","t":"淡白で繊細な白身にほのかにきゅうりのような清涼な香りがあるとされ、丸ごと揚げるとカリッと香ばしく骨ごと美味しい","z":"フライにして、丸ごと食べる","d":"エペルランのフリット（レモン・タルタルソース添え）"},{"f":"Merlan","r":"メルラン","j":"メルラン","c":"食材","g":"魚介類","m":"大西洋や北海で広く獲れるタラ科の白身魚。身が極めて繊細で柔らかく、丸ごと揚げたりムニエル、クネルのすり身として親しまれる","t":"クセのない極めて柔らかく繊細な白身で、揚げると外はサクサク中はふわりとほどける軽やかな口当たりになる","z":"自分の尾をくわえた姿で揚げる「メルラン・アン・コレール」が古典","d":"メルラン・アン・コレール（尾をくわえた姿揚げ）、ムニエル、クネル"},{"f":"Églefin","r":"エグルファン","j":"ハドック","c":"食材","g":"魚介類","m":"北大西洋で獲れるタラ科の白身魚（ハドック）。鮮魚のほか、塩漬けにして燻製にしたスモークハドックを牛乳でポシェする料理が定番","z":"燻製でも知られ、オレンジ色に色付けされることが多い","t":"淡白でふっくらした上品な白身で、燻製にすると香ばしい風味とほどよい塩気が加わる","d":"スモークハドックの牛乳ポシェ（ポーチドエッグ添え）、ブランダード風"},{"f":"Étrille","r":"エトリーユ","j":"エトリーユ","c":"食材","g":"魚介類","m":"大西洋沿岸で獲れる小型のワタリガニの仲間。身は少ないが殻から驚くほど濃厚なだしが出るため、ビスクや魚のスープの要になる","t":"小ぶりながら凝縮した強い甘みと、甲殻類ならではの豊かな香りがある","z":"ビスクやスープの出汁に使う","d":"スープ・ド・ポワソン、カニのビスク、甲殻類のアメリケーヌソース"},{"f":"Coque","r":"コック","j":"コック貝","c":"食材","g":"魚介類","m":"放射状の筋が入った小さな丸い二枚貝（トリガイの仲間）。砂抜きをして白ワインとエシャロットでさっと蒸し、前菜やパスタに使う","z":"砂抜きして、白ワイン蒸しなどにする","t":"小ぶりながら磯の香りと貝の旨味が濃く、ぷりっとした歯ごたえがある","d":"コック貝の白ワイン蒸し（マリニエール）、貝類のナージュ"},{"f":"Pétoncle","r":"ペトンクル","j":"ペトンクル","c":"食材","g":"魚介類","m":"ホタテ貝（コキーユ・サン・ジャック）に似た一回り小さな二枚貝。手頃で扱いやすく、バターソテーやグラタン、魚介ソースの具材に重宝する","t":"ホタテより小ぶりながら貝柱の甘みと旨味が濃く、ぷりっとした食感","z":"帆立貝（コキーユ・サン・ジャック）より一回り小さい","d":"ペトンクルのバターソテー（ペルシヤード）、コキーユのグラタン、魚介のフリカセ"},{"f":"Badiane","r":"バディアン","j":"八角","c":"食材","g":"調味料・薬味","m":"星形に開いた果実のスパイス（八角／スターアニス）。甘い芳香を持ち、鴨や豚の煮込み、洋梨のコンポート、ホットワインの香り付けに使う","z":"アニス・エトワレとも言う。同じものを指す","t":"アニスに似た甘く華やかな強い香りがあり、少量で煮込みやデザートに奥行きを与える","d":"ヴァン・ショ（ホットワイン）、洋梨やいちじくのコンポート、豚肉の煮込み"},{"f":"Girofle","r":"ジロフル","j":"クローブ","c":"食材","g":"調味料・薬味","m":"香辛料クローブ（丁子）の木","z":"実のつぼみは「クルー・ド・ジロフル」。玉ねぎに刺して煮込みに入れる","t":"甘くスパイシーで刺激的な強い香りがあり、肉の臭みを消して温かみのある風味を添える","d":"オニオン・クルテ（ベシャメル用）、ポトフ、シュークルート、カトル・エピス"},{"f":"Muscade","r":"ムスカード","j":"ナツメグ","c":"食材","g":"調味料・薬味","m":"ニクズクの種子（ナツメグ）。すりおろしてほんの少量加えると、ベシャメルソースやグラタン・ドフィノワ、ひき肉料理の風味がぐっと引き締まる","z":"種を削って使う。ベシャメルや、じゃがいもの隠し味に","t":"甘く温かみのある上品なスパイシーさで、乳製品やじゃがいものまろやかさを引き立てる","d":"ベシャメルソース、グラタン・ドフィノワ、キッシュ・ロレーヌ、ほうれん草のクリーム煮"},{"f":"Baies roses","r":"ベ・ローズ","j":"ピンクペッパー","c":"食材","g":"調味料・薬味","m":"コショウボクの赤い実を乾燥させた彩りのよい香辛料（ピンクペッパー）。サーモンのマリネやフォアグラ、白いソースに散らしてアクセントにする","t":"辛味は極めて穏やかで、ほんのり甘くフルーティーな芳香があり、噛むと軽やかに弾けて白いソースや魚介に彩りを添える","z":"実はコショウの仲間ではない。彩りにも使う","d":"サーモンのマリネ、フォアグラのテリーヌ、白身魚のカルパッチョ、クリームソース"},{"f":"Quatre-épices","r":"カトル・エピス","j":"カトルエピス","c":"食材","g":"調味料・薬味","m":"こしょう・ナツメグ・シナモン・クローブ（またはしょうが）の4種を合わせたフランスの伝統的混合スパイス。パテやソーセージ、パン・デピスに欠かせない","z":"配合は店ごとに違うが、コショウ、ナツメグ、シナモン、クローブが基本","t":"甘さと辛さが調和した温かみのある複雑な香りで、豚肉加工品や煮込みに深みを出す","d":"パテ・ド・カンパーニュ、テリーヌ、リエット、パン・デピス"},{"f":"Sarrasin","r":"サラザン","j":"そば","c":"食材","g":"穀類","m":"ブルターニュ地方などで広く栽培される穀物（そば）。挽いたそば粉は名物のガレットの生地になり、炒った実（カシャ）は料理の食感のアクセントにも使う","z":"ブルターニュのガレットは、そば粉が本式","t":"素朴で香ばしい穀物の香りとわずかなほろ苦さがあり、焼くとカリッともっちり仕上がる","d":"ブルターニュ風そば粉のガレット（コンプレット）、そば粉のブリニ"},{"f":"Huile de noix","r":"ユイル・ド・ノワ","j":"くるみ油","c":"食材","g":"調味料・薬味","m":"焙煎したくるみの実から搾った香り高い植物油。熱に弱いため加熱せず、マーシュやアンディーヴのサラダ、山羊チーズの仕上げにかけて味わう","t":"焙煎くるみならではの芳醇で香ばしいナッツの香りと深いコク、ほのかな渋みがあり、秋冬のサラダやチーズを格上げする","z":"ペリゴールの名物。サラダやチーズにかける","d":"マーシュやアンディーヴのサラダ、山羊チーズの仕上げ、かぼちゃのポタージュの仕上げ"},{"f":"Huile de noisette","r":"ユイル・ド・ノワゼット","j":"ヘーゼルナッツ油","c":"食材","g":"調味料・薬味","m":"焙煎したヘーゼルナッツから搾った黄金色の高級オイル。加熱せず、きのこや根菜のサラダ、魚介の前菜やスープの仕上げに数滴垂らして香りを添える","t":"芳醇で香ばしいナッツの香りと、まろやかで上品なコクがある","z":"仕上げに数滴垂らす","d":"きのこや根菜のサラダ、ホタテや白身魚の前菜の仕上げ、ポタージュの香り付け"},{"f":"Vinaigre de xérès","r":"ヴィネーグル・ド・ケレス","j":"シェリー酢","c":"食材","g":"調味料・薬味","m":"スペイン・ヘレス地方のシェリー酒を木樽で熟成させて造るワインビネガー。角のない深いコクがあり、ヴィネグレットや肉のジュの隠し味に重宝される","t":"まろやかながら芯のある酸味と、木樽熟成ならではの芳醇なコクがある","z":"スペイン・ヘレス産。ガスパチョにも使う","d":"ガスパチョ、ヴィネグレット、肉のジュやデグラセの隠し味、レンズ豆のサラダ"},{"f":"Vergeoise","r":"ヴェルジョワーズ","j":"ヴェルジョワーズ","c":"食材","g":"調味料・薬味","m":"北部フランスの、しっとりした色つき砂糖","z":"ワッフルやタルトに使う。カソナードに近い","t":"しっとりとした口溶けで、カラメルや黒糖を思わせるまろやかでコク深い甘みがある","d":"北仏のワッフル、タルト・オ・シュクル（砂糖のタルト）、クレーム・ブリュレ"},{"f":"Cassonade","r":"カソナード","j":"カソナード","c":"食材","g":"調味料・薬味","m":"さとうきび由来の粗い結晶を持つ茶色い砂糖。クレーム・ブリュレの表面に振ってバーナーで焦がすと、香ばしくパリッとした飴の層ができる","z":"クレーム・ブリュレの表面に使うこともある","t":"ザクザクとした粒感と、さとうきび由来の香ばしくコクのあるすっきりした甘みが特徴","d":"クレーム・ブリュレの表面のキャラメリゼ、タルト・タタン、焼き菓子"},{"f":"Sirop d’érable","r":"シロ・デラブル","j":"メープルシロップ","c":"食材","g":"調味料・薬味","m":"カエデの樹液を煮詰めたシロップ","t":"カエデの樹液を煮詰めた琥珀色の自然な甘みと、ほのかにスモーキーで木を思わせる芳醇な香りが焼き菓子や肉に合う","z":"カナダ産が有名。クレープにかける","d":"クレープ、パンケーキ、鴨や豚肉のローストの照り焼き"},{"f":"Œufs en meurette","r":"ウフ・アン・ムーレット","j":"卵の赤ワイン煮","c":"料理","m":"ブルゴーニュ産赤ワインとエシャロット、ベーコン、マッシュルームで作る濃厚なムーレットソースに、とろりとしたポーチドエッグと焼きパンを合わせたブルゴーニュの郷土料理","t":"赤ワインの芳醇な酸味とコク深いソースに、割ったポーチドエッグの濃厚な黄身がとろりと絡み合い、まろやかで奥深い味わいに変わる","z":"ムーレットは、赤ワイン煮込みのソースの名","g":"前菜・冷菜・サラダ"},{"f":"Brandade","r":"ブランダード","j":"ブランダード","c":"料理","m":"塩抜きしてゆでた塩ダラ（モリュ）をほぐし、オリーブ油と牛乳・にんにくを混ぜてなめらかに練り上げた南仏ニームの郷土ペースト。パンに塗るほか、じゃがいもとグラタンにもする","t":"塩ダラの凝縮した旨味とほどよい塩気に、オリーブ油のまろやかなコクとにんにくの香りが溶け合ったクリーミーで後を引く味","z":"南仏ニームの名物。じゃがいもを混ぜることも多い","g":"魚介料理"},{"f":"Pipérade","r":"ピペラード","j":"ピペラード","c":"料理","m":"赤・緑のパプリカ、完熟トマト、玉ねぎ、にんにくをオリーブ油でくったり甘くなるまで炒め煮にし、名産のエスプレット唐辛子で風味を調えたバスク地方の郷土料理","z":"溶き卵を流し込んで半熟にまとめたり、バイヨンヌ産生ハムや鶏肉と合わせて食べるのがバスクの定番","t":"じっくり火を通したパプリカとトマトの濃厚な甘酸っぱさに、エスプレット唐辛子の穏やかな辛味と香りが心地よい","g":"野菜・チーズ・軽食"},{"f":"Raie au beurre noir","r":"レ・オ・ブール・ノワール","j":"エイの焦がしバター","c":"料理","m":"エイのヒレ（翼）をクール・ブイヨンでふっくらゆで、濃い茶色まで焦がしたバターに酢とケッパー、パセリを加えたブール・ノワールソースをたっぷりかけた古典魚料理","z":"ケッパーとレモンが決め手","t":"ほろりとほぐれるエイの淡白な身に、香ばしい焦がしバターのコクとケッパーの酸味が絶妙に合う","g":"魚介料理"},{"f":"Homard thermidor","r":"オマール・テルミドール","j":"オマールのテルミドール","c":"料理","m":"半割りにしたオマール海老の身を取り出し、白ワイン・マスタード・ベシャメル・チーズを合わせたテルミドールソースと和えて殻に戻し、オーブンでこんがり焼いた豪華料理","t":"プリッとしたオマール海老の濃厚な甘みに、マスタード香るクリーミーなソースと焼きチーズの香ばしいコクが重なる至福の味","z":"名はフランス革命暦の「テルミドール（熱月）」から","g":"魚介料理"},{"f":"Gibier","r":"ジビエ","j":"ジビエ","c":"コース・その他","m":"秋から冬にかけて狩猟によって得られる鹿・猪・野うさぎ・ヤマウズラ・キジ・青首鴨など野生鳥獣の肉の総称。適切な熟成（フェザンデ）を経て赤ワインソース等で味わう冬の醍醐味","z":"秋が旬。寝かせて旨味を引き出すフェザンデが伝統の技","t":"飼育肉に比べて脂肪が少なく引き締まった赤身で、鉄分を感じる力強い旨味と野山を思わせる独特の芳醇な野趣がある","g":"調理基礎・表現"},{"f":"Civet","r":"シヴェ","j":"シヴェ","c":"料理","m":"野うさぎや鹿、猪などのジビエを赤ワインと香味野菜でマリネしてじっくり煮込み、仕上げに動物の血（またはレバー）を加えて濃厚なとろみをつけたフランスの古典煮込み","z":"野うさぎのシヴェが、古典中の古典","t":"赤ワインと血のとろみが生み出す極めて濃厚で奥深いコクと、ジビエならではの力強い旨味","g":"肉・ジビエ料理"},{"f":"Galantine","r":"ガランティーヌ","j":"ガランティーヌ","c":"料理","m":"骨を抜いた鶏や鴨、仔牛などの肉にひき肉やフォアグラ、ピスタチオを詰めて筒状に巻き、ブイヨンで煮てから冷やし、澄んだアスピック（ゼリー）で覆った伝統的冷製料理","z":"温製のバロティーヌと、対になる","t":"冷やすことで肉の旨味とスパイス、澄んだゼリーの風味が引き締まった、しっとり上品な味わい","g":"前菜・冷菜・サラダ"},{"f":"Pâté","r":"パテ","j":"パテ","c":"料理","m":"豚肉やレバー、鴨肉、ジビエなどを細かく刻み・練り、スパイスや洋酒を加えて型やパイ生地に詰めて焼き上げたシャルキュトリの代表料理。冷やして切り分け前菜に供する","z":"パイ生地で包むと「パテ・アン・クルート」","t":"肉やレバーの濃厚な旨味に脂のコクとハーブ・酒の香りがなじんだ、食べ応えのある味わい","g":"前菜・冷菜・サラダ"},{"f":"Nage","r":"ナージュ","j":"ナージュ","c":"ソース","m":"白ワインと香味野菜（にんじん・ポロねぎ・セロリ等）、ハーブの香り豊かなだし汁で魚介を軽く煮る調理法、およびその煮汁。魚介を「泳がせる」ようにスープごと供する","z":"「泳がせる（ナジェ）」ように、煮汁ごと皿に出す","t":"白ワインと香味野菜、魚介の旨味が溶け合った、澄んで軽やかながら風味豊かな味わい","g":"だし・ベース"},{"f":"Marinade","r":"マリナード","j":"マリネ液","c":"ソース","m":"肉や魚を調理前に漬け込むための調味液。ワインや酢の酸味、油、香味野菜やハーブを組み合わせ、臭みを消しつつ下味をつけ肉を柔らかくする","z":"酸、油、香草が基本。下味と保存の両役を担う","t":"酸味と油、ハーブやスパイスの香りが素材に染み込み、臭みを和らげつつ風味を豊かにする","g":"だし・ベース"},{"f":"Jus de veau","r":"ジュ・ド・ヴォー","j":"仔牛のジュ","c":"ソース","m":"焼いた仔牛の骨や端肉と香味野菜から取っただしを、小麦粉などのつなぎを使わずにじっくり煮詰めた澄んだ肉ソース。現代フレンチの肉料理で最も多用される","z":"フォン・ド・ヴォーを、さらに詰めたもの","t":"つなぎを使わないため口当たりは軽やかで、仔牛の骨と肉の旨味がまっすぐ濃く広がる","g":"だし・ベース"},{"f":"Brioche","r":"ブリオッシュ","j":"ブリオッシュ","c":"コース・その他","m":"水を使わずたっぷりのバターと卵、牛乳、砂糖で仕込む、黄金色のふんわりとしたリッチな発酵パン。朝食やフォアグラの添え物、菓子パンの土台として幅広く愛される","t":"口の中でほろりとほどけるほど柔らかく軽やかな食感に、上質なバターの芳醇な香りと卵のほのかな甘みが贅沢に広がる","z":"丸い頭のついた形（ブリオッシュ・ア・テット）が古典","g":"パン・カフェ"},{"f":"Vin blanc","r":"ヴァン・ブラン","j":"白ワイン","c":"ワイン・酒類","g":"種類・スタイル","m":"主に白ブドウ（または黒ブドウの果汁のみ）を果皮を取り除いて発酵させたワイン。キリッとした辛口から樽熟成のふくよかな白、極甘口まで幅広く魚介やチーズに合う","t":"柑橘やりんご、白い花のような爽やかな香りと清涼な酸味が特徴で、樽熟成ではバターやナッツの豊かなコクが加わる","z":"フランス料理では飲み物としてだけでなく、ブール・ブランやムール貝の蒸し煮など調理にも欠かせない"},{"f":"Blanc de noirs","r":"ブラン・ド・ノワール","j":"ブラン・ド・ノワール","c":"ワイン・酒類","g":"種類・スタイル","m":"ピノ・ノワールやムニエなど黒ブドウのみを用い、果皮の色素が移らないよう優しく搾った果汁から造る白い発泡ワイン（直訳は「黒の中の白」）","t":"ブラン・ド・ブランよりふくよかでコクがあり、赤い果実や洋梨を思わせる豊かな果実味としっかりした骨格が特徴","z":"シャンパーニュの代表的なスタイルのひとつ。肉料理や熟成チーズとも合わせやすい"},{"f":"Sec","r":"セック","j":"辛口","c":"ワイン・酒類","g":"種類・スタイル","m":"発酵時にブドウの糖分をほぼすべてアルコールに変えた「辛口」のワイン表示。なお、シャンパーニュなど発泡ワインの「Sec」はブリュットよりやや甘め（残糖17〜32g/L）を指す","t":"甘みを抑えたすっきりキレのある飲み口で、食事の味を邪魔せず幅広い料理と合わせやすい","z":"フランス語で「乾いた」の意味。発泡ワインで辛口を頼むときは「ブリュット」を選ぶのが基本"},{"f":"Vin doux naturel","r":"ヴァン・ドゥー・ナチュレル","j":"天然甘口ワイン","c":"ワイン・酒類","g":"種類・スタイル","m":"発酵途中のブドウ果汁にグレープスピリッツを加えて発酵を止め、ブドウ本来の自然な甘みを残した酒精強化ワイン（略称VDN）。南仏バニュルスやリヴザルト、ミュスカが有名","t":"レーズンやいちじく、カラメルを思わせる濃密な甘みと高いアルコール感があり、チョコレート菓子やブルーチーズと好相性","z":"バニュルスはチョコレートとのマリアージュの定番として知られる"},{"f":"Vin chaud","r":"ヴァン・ショ","j":"ホットワイン","c":"ワイン・酒類","g":"種類・スタイル","m":"赤ワイン（アルザスでは白ワイン版もある）に、シナモン・クローブ・八角などのスパイス、オレンジの皮、砂糖や蜂蜜を加えて温めた冬の定番ドリンク","t":"温めたワインのまろやかな甘みと、シナモンや柑橘の芳醇なスパイス香が体の芯からほっと温める","z":"フランスのクリスマスマーケット（マルシェ・ド・ノエル）に欠かせない冬の風物詩"},{"f":"Grenache","r":"グルナッシュ","j":"グルナッシュ","c":"ワイン・酒類","g":"品種","m":"南仏ローヌ南部（シャトーヌフ・デュ・パプ等）やラングドック、プロヴァンスを代表する黒ブドウ品種。太陽の恵みをたっぷり受けて糖度が高く、ブレンドの主軸となる","t":"熟したラズベリーやいちごジャム、白こしょうのような温かみのある豊かな果実味とまろやかな渋みが特徴","z":"スペイン原産で現地名はガルナッチャ。南仏のロゼや甘口バニュルスにも欠かせない"},{"f":"Cabernet Franc","r":"カベルネ・フラン","j":"カベルネ・フラン","c":"ワイン・酒類","g":"品種","m":"ロワール地方（シノン、ブルグイユ等）の赤ワインの主役であり、ボルドー右岸（サン・テミリオン等）ではメルローとブレンドされる重要な黒ブドウ品種","t":"ラズベリーやスミレの華やかな香りに、ほのかなハーブや鉛筆の芯を思わせる爽やかな風味とキメ細かい渋みが調和する","z":"カベルネ・ソーヴィニヨンの親にあたる品種として知られる"},{"f":"Pinot gris","r":"ピノ・グリ","j":"ピノ・グリ","c":"ワイン・酒類","g":"品種","m":"アルザス地方の高貴4品種（ノーブル品種）のひとつ。灰紫色を帯びた果皮を持ち、ふくよかな辛口から遅摘みの甘口まで造られ、フォアグラや白身肉、きのこ料理と好相性","t":"洋梨や桃、蜂蜜、ほのかな燻製香を思わせるリッチでまろやかな厚みがあり、穏やかな酸と長い余韻が魅力","z":"ピノ・ノワールの突然変異種。イタリアでは「ピノ・グリージョ」の名で軽快な白になる"},{"f":"Provence","r":"プロヴァンス","j":"プロヴァンス","c":"ワイン・酒類","g":"産地","m":"地中海沿岸に広がる南仏の銘醸地で、生産量の大半を占める辛口ロゼワインの世界的聖地。ブイヤベースやラタトゥイユ、ニース風サラダなど南仏料理と最高の相性を誇る","t":"淡いサーモンピンクの色調で、白桃や柑橘、南仏ハーブを思わせる軽やかで爽快な辛口の味わいが中心","z":"バンドール地区ではムールヴェードル主体の長期熟成する力強い赤ワインも名高い"},{"f":"Jura","r":"ジュラ","j":"ジュラ","c":"ワイン・酒類","g":"産地","m":"ブルゴーニュの東、スイス国境の山岳地帯に広がる個性派ワインの産地。名産の黄ワイン（ヴァン・ジョーヌ）や干しぶどうの甘口（ヴァン・ド・パイユ）、コンテチーズとの相性で名高い","t":"産膜酵母由来のナッツやスパイスの香りを持つ独特の白から、淡い色合いで滋味深い赤まで通好みの個性が光る","z":"サヴァニャン、プールサール、トゥルソーなどこの土地ならではの土着品種が守られている"},{"f":"Pomerol","r":"ポムロール","j":"ポムロール","c":"ワイン・酒類","g":"産地","m":"ボルドー右岸のサン・テミリオンに隣接する小さな銘醸地区。メルローを主体に、世界で最も高価な赤ワインのひとつ「ペトリュス」をはじめ珠玉の赤ワインを生む","t":"ベルベットのように極めて滑らかで濃密な口当たりに、黒トリュフやプラム、スミレを思わせる官能的な芳香が広がる","z":"ボルドーの主要産地の中で唯一、公式の格付け制度を持たない地区としても知られる"},{"f":"Domaine","r":"ドメーヌ","j":"ドメーヌ","c":"ワイン・酒類","g":"醸造・格付け","m":"主にブルゴーニュやロワール、ローヌなどで使われる、自社畑を所有してブドウの栽培から醸造・熟成・瓶詰めまでを一貫して行う生産者（造り手）の名称","z":"ボルドーの「シャトー」にあたる概念。一方、ブドウやワインを買い付けて造る商社は「ネゴシアン」と呼ぶ"},{"f":"AOC / AOP","r":"アー・オー・セー／アー・オー・ペー","j":"原産地統制呼称","c":"ワイン・酒類","g":"醸造・格付け","m":"フランスの「原産地統制呼称（AOC）」およびEU統一基準の「原産地呼称保護（AOP）」。産地・品種・収穫量・製法など厳格な規定を満たしたワインやチーズのみ名乗れる最高位の保証","z":"フランスのワインラベルでは伝統的な「AOC（Appellation d’Origine Contrôlée）」表記も広く使われている"},{"f":"Arôme","r":"アローム","j":"アロマ（果実香）","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ブドウ品種そのものやアルコール発酵に由来する、若いワインに感じられるフレッシュな香り（柑橘、ベリー、花、ハーブなど）。熟成で生まれる複雑な香り「ブーケ」と区別する","z":"テイスティングでは第一アロマ（品種由来）と第二アロマ（発酵由来）に分けて表現することもある"},{"f":"Longueur en bouche","r":"ロンギュール・アン・ブーシュ","j":"余韻（フィニッシュ）","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインを飲み込んだあとに、口の中や鼻の奥に心地よい香りや風味がどれほど長く留まり続けるかを表す品質評価の指標（フィナーレとも呼ぶ）","z":"余韻の長さは「コーダリー（秒数）」という単位で数えることもあり、優れたワインほど余韻が長い"},{"f":"Négociant","r":"ネゴシアン","j":"ワイン商・買い付け生産者","c":"ワイン・酒類","g":"醸造・格付け","m":"契約農家からブドウや果汁、熟成前のワインを買い付け、自社の蔵で醸造・熟成・瓶詰め・販売までを行うワイン商。ブルゴーニュやボルドーで重要な役割を担う","z":"自社畑のみで造る「ドメーヌ」と対比される。近年は自社畑も持つ優秀なネゴシアンも多い"},{"f":"Vendanges tardives","r":"ヴァンダンジュ・タルディヴ","j":"遅摘み","c":"ワイン・酒類","g":"醸造・格付け","m":"通常の収穫期を過ぎてもブドウを樹に残し、過熟や貴腐によって糖度とエキス分を極限まで高めてから収穫する製法、およびその甘口ワイン。アルザス地方の公式規定が名高い","t":"熟したアプリコットや蜂蜜、花梨のような濃密な甘みと芳醇な香りに、冷涼産地ならではの美しい酸が調和する","z":"アルザスではリースリングやゲヴェルツトラミネールなどの高貴4品種のみに認められる"},{"f":"Pourriture noble","r":"プリチュール・ノーブル","j":"貴腐","c":"ワイン・酒類","g":"醸造・格付け","m":"完熟した白ブドウの果皮に貴腐菌（ボトリティス・シネレア）が付着し、水分だけが蒸発して糖度と芳香が極度に凝縮する現象。ソーテルヌなどの世界最高峰の甘口ワインを生む","t":"マーマレードや蜂蜜、ドライアプリコット、サフランを思わせる気高く濃密な甘みと複雑な余韻を生む","z":"朝霧と午後の晴天が揃う特定の川沿いの産地でのみ発生する、自然の奇跡と呼ばれる現象"},{"f":"Sur lie","r":"シュール・リー","j":"シュール・リー（澱の上で熟成）","c":"ワイン・酒類","g":"醸造・格付け","m":"アルコール発酵後に沈殿した酵母の澱（リー）を取り除かず、春先まで澱と一緒にタンクや樽で熟成させる醸造法。ロワール地方の白ワイン「ミュスカデ」の伝統技法","t":"酵母由来のまろやかな旨味と厚み、かすかにピチピチとした微発泡のフレッシュな爽快感が加わる","z":"フランス語で「澱（lie）の上（sur）」の意味。生牡蠣や貝類の前菜と抜群の相性を見せる"},{"f":"Méthode traditionnelle","r":"メトード・トラディショネル","j":"瓶内二次発酵方式","c":"ワイン・酒類","g":"醸造・格付け","m":"ベースとなる白ワインを瓶詰めし、糖分と酵母を加えて瓶の中で二次発酵させ、きめ細かな泡と熟成香を育てる伝統的製法。シャンパーニュやクレマンに用いられる","t":"タンク発酵にはない繊細で長く続く泡立ちと、酵母熟成によるブリオッシュやナッツのような奥深いコクが生まれる","z":"かつて「シャンパーニュ方式」と呼ばれたが、産地保護のため現在はシャンパーニュ以外ではこの表記を使う"},{"f":"Biodynamie","r":"ビオディナミ","j":"ビオディナミ農法","c":"ワイン・酒類","g":"醸造・格付け","m":"化学農薬や化学肥料を使わない有機栽培をさらに進め、月の満ち欠けや天体のリズム、独自の自然調合剤を用いて土壌とブドウの生命力を引き出す農業手法","z":"ロマネ・コンティなどフランス屈指のトップドメーヌでも広く実践されている"},{"f":"Vin nature","r":"ヴァン・ナチュール","j":"自然派ワイン","c":"ワイン・酒類","g":"種類・スタイル","m":"有機・ビオディナミ栽培のブドウを野生酵母で自然発酵させ、酸化防止剤（亜硫酸塩）の添加や濾過を極力行わずに造るワイン。パリのビストロや現代フレンチで人気が高い","t":"無濾過ならではのやや濁った外観や、生き生きとした瑞々しい果実味、体にすっと染み込むような独特の滋味深さが特徴","z":"フランスでは「ヴァン・ナチュレル」とも呼ばれる。温度管理に繊細で、開栓後の香り変化も楽しみのひとつ"},{"f":"Vin orange","r":"ヴァン・オランジュ","j":"オレンジワイン","c":"ワイン・酒類","g":"種類・スタイル","m":"白ブドウを赤ワインのように果皮や種ごと漬け込んで発酵（マセラシオン）させることで、美しい琥珀色・オレンジ色を引き出したワイン。現代フレンチのペアリングでも注目される","t":"白ワインの爽やかな酸味と香りがありながら、果皮由来の心地よい渋み（タンニン）と紅茶や杏のような複雑なコクを持つ","z":"ジョージアの伝統製法が起源。白では負け、赤では重すぎる料理やスパイス・発酵食材に驚くほど合う"},{"f":"Non millésimé","r":"ノン・ミレジメ","j":"ノンヴィンテージ（NV）","c":"ワイン・酒類","g":"種類・スタイル","m":"単一の収穫年ではなく、複数年の原酒（リザーヴワイン）をブレンドして造るシャンパーニュなどのワイン。毎年変わらないメゾンの理想のスタイルを安定して表現する","z":"優れた年だけ単一年で造る「ミレジメ（ヴィンテージ）」と区別され、メゾンの看板商品として流通量の大半を占める"},{"f":"Extra brut","r":"エクストラ・ブリュット","j":"極辛口（発泡ワイン）","c":"ワイン・酒類","g":"種類・スタイル","m":"シャンパーニュやクレマンなどの発泡ワインで、通常のブリュット（12g/L未満）よりさらに残糖を抑えた「極辛口」（残糖0〜6g/L）の表示。補糖ゼロは「ブリュット・ナチュール」と呼ぶ","t":"甘みを極限まで削ぎ落としたシャープで研ぎ澄まされた酸味とミネラル感が際立ち、生牡蠣や繊細な魚介に抜群に合う","z":"近年、気候温暖化でブドウの熟度が上がったこともあり、辛口志向の愛飲家やレストランで人気が高まっている"},{"f":"Sémillon","r":"セミヨン","j":"セミヨン","c":"ワイン・酒類","g":"品種","m":"ボルドー地方の白ワインを支える主要白ブドウ品種。果皮が薄く貴腐菌がつきやすいためソーテルヌの極甘口ワインの主役となるほか、ソーヴィニヨン・ブランと混ぜて辛口白も造る","t":"蜂蜜や蜜蝋、黄桃、いちじくのようなふくよかでまろやかな厚みがあり、熟成すると驚くほど複雑な芳香を放つ","z":"ソーテルヌでは約8割を占める中核品種。辛口ボルドー白ではソーヴィニヨン・ブランにコクと余韻を与える"},{"f":"Aligoté","r":"アリゴテ","j":"アリゴテ","c":"ワイン・酒類","g":"品種","m":"ブルゴーニュ地方でシャルドネに次ぐ第2の白ブドウ品種。手頃で親しみやすい辛口白ワイン「ブルゴーニュ・アリゴテ」を生み、食前酒キールの本来のベースワインとしても知られる","t":"青りんごやレモンを思わせるフレッシュできりっと引き締まった高い酸味があり、エスカルゴや前菜を爽やかに引き立てる","z":"ブズロン村（Bouzeron）はアリゴテ100%で村名AOCが認められた唯一の産地"},{"f":"Meunier","r":"ムニエ","j":"ムニエ（ピノ・ムニエ）","c":"ワイン・酒類","g":"品種","m":"シャンパーニュ地方の主要3品種（シャルドネ、ピノ・ノワール、ムニエ）のひとつとなる黒ブドウ。霜に強くマルヌ渓谷を中心に広く栽培され、ブレンドに親しみやすさを与える","t":"洋梨やりんご、赤いベリーを思わせるふくよかでフルーティーな果実味と柔らかい口当たりが特徴","z":"葉の裏に白い産毛があり小麦粉をかぶったように見えるため、「粉屋（meunier）」の名がついた"},{"f":"Muscadet","r":"ミュスカデ","j":"ミュスカデ","c":"ワイン・酒類","g":"産地","m":"ロワール川河口の大西洋岸（ナント周辺）で、ムロン・ド・ブルゴーニュ種から造られる辛口白ワインの銘醸地。澱の上で熟成させる「シュール・リー」製法が定番","t":"潮風を思わせる清冽なミネラル感ときりっとした酸味、軽快な飲み口があり、生牡蠣やムール貝、ブール・ブランの魚料理と定番の相性","z":"「ミュスカデ・セーヴル・エ・メーヌ」が最も有名な上位アペラシオン"},{"f":"Meursault","r":"ムルソー","j":"ムルソー","c":"ワイン・酒類","g":"産地","m":"ブルゴーニュ地方コート・ド・ボーヌを代表する、シャルドネ100%の世界最高峰辛口白ワインの銘醸村。特級畑はないが、一級畑・村名クラスでも世界的な名声を誇る","t":"ヘーゼルナッツや焦がしバター、ブリオッシュを思わせるふくよかでリッチな香りと、厚みのあるクリーミーなコク・長い余韻が魅力","z":"バターや生クリームを使った魚料理（ソール・ムニエール、オマール）やブレス鶏のクリーム煮と至高のマリアージュを見せる"},{"f":"Cru classé","r":"クリュ・クラッセ","j":"格付けシャトー・畑","c":"ワイン・酒類","g":"醸造・格付け","m":"公的なワイン格付け制度によって公式に等級を与えられた優れた生産者や畑の総称。特に1855年のパリ万博に合わせて制定されたボルドー・メドックの格付け（第1〜5級）が名高い","z":"メドック1級にはシャトー・マルゴー、ラフィット、ラトゥール、オー・ブリオン、ムートン・ロートシルトの五大シャトーが並ぶ"},{"f":"Dégorgement","r":"デゴルジュマン","j":"澱抜き","c":"ワイン・酒類","g":"醸造・格付け","m":"シャンパーニュなどの瓶内二次発酵で瓶口に集めた酵母の澱（おり）を、瓶の首ごと凍らせて王冠を外し、内部のガス圧で一気に吹き飛ばして取り除く重要工程","z":"デゴルジュマンの日付が裏ラベルに記載されることもあり、熟成やフレッシュさの目安になる"},{"f":"Dosage","r":"ドザージュ","j":"補糖（ドザージュ）","c":"ワイン・酒類","g":"醸造・格付け","m":"シャンパーニュなどの澱抜き（デゴルジュマン）の直後、減った分を補うためにワインと砂糖を溶かした「リキュール・デクスペディシオン」を加え、最終的な甘辛度を調整する工程","z":"この添加量によって、エクストラ・ブリュット、ブリュット、ドゥミ・セックなどのスタイルが決まる"},{"f":"Chef sommelier","r":"シェフ・ソムリエ","j":"ソムリエ長","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"レストランの飲料部門全体を統括する最高責任者。ワインリストの編成、セラーの在庫・熟成管理、料理長とのペアリング構築、VIP接客とスタッフ育成を担う","z":"星付きレストランでは厨房の料理長（シェフ）や給仕長（メートル・ドテル）と並ぶ三本柱の要職"},{"f":"Tastevin","r":"タストヴァン","j":"タストヴァン（利き酒用銀皿）","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"表面に凹凸が刻まれた浅い銀製の利き酒用カップ。かつて薄暗い地下セラーでろうそくの光を反射させてワインの色調や透明度を確認するために使われた、ソムリエの伝統的な象徴","z":"現在もソムリエのバッジや襟章のモチーフとして世界中で親しまれている"},{"f":"Panier","r":"パニエ","j":"ワインバスケット","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"長期熟成した赤ワインのボトルを横倒しのまま静かに運び、底に沈んだ澱（おり）を舞い上げずに抜栓・注ぐために用いる籐や金属製の専用かご","z":"セラーで寝かせていた角度を保ったまま客席へ運び、キャンドルの光で澱を見極めながらデカンタージュする"},{"f":"Carafe","r":"カラフ","j":"カラフ（デカンタ・水差し）","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインを移し替えて空気に触れさせたり澱を分けるためのガラス製デカンタ（カラフ・ア・ヴァン）。また、ビストロで量り売りワイン（ヴァン・アン・カラフ）や水道水を入れる水差しも指す","z":"若いワインの香りを開く作業を「カラファージュ（carafage）」と呼ぶこともある"},{"f":"Sabrage","r":"サブラージュ","j":"サーベル抜栓","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"シャンパーニュの瓶の合わせ目に沿ってサーベル（剣）の背を勢いよく滑らせ、瓶口をコルクごとスパッと弾き飛ばして開ける祝宴の華やかな抜栓パフォーマンス","z":"ナポレオン時代の騎兵隊が戦勝祝いに馬上でシャンパーニュを開けた故事に由来すると伝わる"},{"f":"Frapper","r":"フラペ","j":"急冷する","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"シャンパーニュや白ワイン、グラスを氷と水（さらに塩を加えることも）の入ったワインクーラーに入れ、短時間でしっかり冷やすサービス技法","z":"氷だけよりも氷水に浸すほうがボトル全体が均一かつ素早く冷えるのがソムリエの基本"},{"f":"Cuvée","r":"キュヴェ","j":"キュヴェ（特別醸造・ロット）","c":"ワイン・酒類","g":"醸造・格付け","m":"本来は「発酵槽（cuve）一杯分」のワインを指す語。転じて、特定の区画や厳選ブドウで造った特別銘柄（プレスティージュ・キュヴェ）や、シャンパーニュの一番搾り果汁を意味する","z":"シャンパーニュでは最も品質の高い一番搾り（2,050L）を「キュヴェ」、二番搾りを「タイユ」と呼び分ける"},{"f":"Attaque","r":"アタック","j":"アタック（第一印象）","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインを口に含んだ瞬間に感じる最初の印象を表すテイスティング用語。「軽やかなアタック」「力強いアタック」「シャープなアタック」のように味わい評価の起点となる","z":"テイスティングでは「アタック（入口）→中盤の広がり→余韻（フィニッシュ）」の3段階で味わいを捉える"},{"f":"Corps","r":"コール","j":"ボディ・骨格","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインを口に含んだときの厚み、重厚感、飲み応え（英語のボディにあたる）を表すテイスティング用語。アルコール度数、エキス分、タンニン、酸の量によって決まる","z":"「ライトボディ」「ミディアム」「フルボディ」の基準となり、料理の重さと合わせるペアリングの重要な軸"},{"f":"Minéralité","r":"ミネラリテ","j":"ミネラル感","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"シャブリやサンセール、シャンパーニュなどの白ワインによく表現される、火打ち石・チョーク・濡れた石・ほのかな塩味を思わせる引き締まった清冽な風味の印象","t":"果実味だけでなく、口中をきりっと引き締める塩味や石のような硬質な余韻があり、生牡蠣や魚介料理と抜群に響き合う","z":"土壌のミネラルがそのまま味になるわけではないが、冷涼な石灰質土壌のワインを語る際の定番表現"},{"f":"Équilibre","r":"エキリーブル","j":"バランス・調和","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインを構成する「甘味・酸味・渋み（タンニン）・アルコール・果実味」のすべての要素が突出せず美しく釣り合っている状態。優れたワインの最重要条件とされる","z":"どんなに濃厚でも酸が足りなければ重く感じ、エキリーブルが取れたワインほど飲み疲れず料理と寄り添う"},{"f":"Oxydation","r":"オキシダシオン","j":"酸化","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインが過剰に酸素と触れ、色が茶色っぽく褪せて焼きりんごやシェリーのような香りへ変化した状態。通常は劣化とされるが、ヴァン・ジョーヌやマデラ酒では意図的に魅力として活かす","z":"抜栓後しばらく置いたワインや、保存状態が悪くコルクが乾いたボトルで起きやすい"},{"f":"Réduction","r":"レデュクシオン","j":"還元（還元臭）","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"醸造や瓶熟成中に酸素が極端に不足した状態で生じる化学反応。マッチの擦り火や硫黄、ゆで卵に似た香り（還元臭）が出ることがあり、デカンタージュやスワリングで開かせると消える場合が多い","z":"料理用語の「レデュクシオン（煮詰め）」と同じ綴りだが、ワインでは酸素不足による状態を指す"},{"f":"Garde","r":"ガルド","j":"熟成能力・長期保存","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインをセラーで何年も寝かせて熟成させられるポテンシャル。長期熟成向きの偉大なワインを「ヴァン・ド・ガルド（vin de garde）」と呼ぶ","z":"メドックの格付け赤、コート・ド・ニュイの特級、ソーテルヌ、アルザスのリースリングなどが代表格"},{"f":"Magnum","r":"マグナム","j":"マグナムボトル（1.5L）","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"通常の標準ボトル（750ml）のちょうど2本分にあたる容量1.5リットルの大瓶。ワイン容量に対する瓶内の空気比率が小さいため、熟成が緩やかで綺麗に長熟するとされる","z":"パーティーの演出として映えるだけでなく、愛好家の間では「熟成に理想的なサイズ」として珍重される"},{"f":"Température de service","r":"タンペラチュール・ド・セルヴィス","j":"提供適温","c":"ワイン・酒類","g":"ソムリエ・テイスティング","m":"ワインの香り・酸・渋みのバランスが最も美しく開く理想のサーブ温度。シャンパーニュは6〜8℃、辛口白は8〜12℃、軽めの赤は13〜15℃、重厚な赤は16〜18℃が目安","z":"冷やしすぎると香りが閉じ、高すぎるとアルコール感が浮くため、ソムリエが最も神経を使うポイントのひとつ"},{"f":"Cognac","r":"コニャック","j":"コニャック","c":"ワイン・酒類","g":"酒類・リキュール","m":"フランス南西部コニャック地方で、白ワイン（主にユニ・ブラン種）を銅製単式蒸留器で2回蒸留し、オーク樽で長期熟成させた世界最高峰のブランデー（AOC）。食後酒やフランベに欠かせない","t":"ドライフルーツやバニラ、スパイス、ランシオ（熟成香）が幾重にも重なる気高く芳醇な香りと、ベルベットのように滑らかな余韻","z":"熟成年数によりVS、VSOP、XOなどに格付けされる。アメリケーヌソースやパテ、ステーキのフランベにも多用される"},{"f":"Armagnac","r":"アルマニャック","j":"アルマニャック","c":"ワイン・酒類","g":"酒類・リキュール","m":"フランス南西部ガスコーニュ地方で造られるフランス最古のブランデー（AOC）。主に1回蒸留で造るためブドウ本来の個性が力強く残り、フォアグラや鴨料理の香り付け・食後酒として愛される","t":"コニャックより野性味と力強いコクがあり、プルーンやローストナッツ、焦がしキャラメルのような芳醇で温かみのある余韻が広がる","z":"単一収穫年の「ヴィンテージ・アルマニャック」が豊富な点も魅力。プルーンのアルマニャック漬けは南西地方の名物"},{"f":"Calvados","r":"カルヴァドス","j":"カルヴァドス","c":"ワイン・酒類","g":"酒類・リキュール","m":"ノルマンディ地方特産の、りんご酒（シードル）を蒸留してオーク樽で熟成させたアップルブランデー（AOC）。コースの口直し「トル・ノルマン」や食後酒、りんご菓子・ノルマンディ風料理に欠かせない","t":"若いものはフレッシュなりんごの爽やかな芳香、長期熟成では焼きりんごやシナモン、バニラのような濃密でまろやかなコクが広がる","z":"ペイ・ドージュ地区産は単式2回蒸留による最高級品。カマンベールやポン・レヴェックなど地元チーズとも抜群に合う"},{"f":"Marc","r":"マール","j":"マール（粕取りブランデー）","c":"ワイン・酒類","g":"酒類・リキュール","m":"ワインを搾ったあとのブドウの果皮や種（搾りかす＝マール）を発酵・蒸留して造る伝統的なブランデー。ブルゴーニュ産やシャンパーニュ産が名高く、食後酒やチーズの洗浄酒に使う","t":"ブドウの果皮由来の力強く野趣ある芳香と高いアルコール感、樽熟成による香ばしくキレのある深い余韻が特徴","z":"イタリアの「グラッパ」にあたるフランスのお酒。エポワスチーズの表皮を洗う「マール・ド・ブルゴーニュ」が有名"},{"f":"Eau-de-vie","r":"オー・ド・ヴィ","j":"オー・ド・ヴィ（果実蒸留酒）","c":"ワイン・酒類","g":"酒類・リキュール","m":"直訳で「命の水」を意味する蒸留酒の総称。フランス料理・製菓では特に、洋梨（ポワール・ウィリアムス）・木いちご（フランボワーズ）・プラム（ミラベル）などを無色透明に蒸留した香り高い果実酒を指す","t":"甘みは一切ないドライな飲み口ながら、グラスから溢れるほど鮮烈でピュアな果実の芳香が鼻腔を駆け抜ける","z":"アルザス地方が名産地。食後酒としてキンキンに冷やして飲むほか、ソルベやムース、フルーツコンポートの香り付けに重宝される"},{"f":"Kirsch","r":"キルシュ","j":"キルシュ（さくらんぼの蒸留酒）","c":"ワイン・酒類","g":"酒類・リキュール","m":"さくらんぼを種ごと発酵させて蒸留した無色透明のオー・ド・ヴィ（果実ブランデー）。アルザスやドイツ黒い森が名産地で、チーズフォンデュ、フレジエ、スリーズ・ジュビレに欠かせない","t":"さくらんぼの華やかな香りに、種由来のほのかなアーモンド（杏仁）のような気品ある芳香が重なるすっきりドライな風味","z":"「キルシュヴァッサー」とも呼ばれる。チーズフォンデュの仕上げに少量加えると香りが引き締まり消化も助ける"},{"f":"Cidre","r":"シードル","j":"シードル（りんご酒）","c":"ワイン・酒類","g":"酒類・リキュール","m":"ノルマンディ地方やブルターニュ地方特産の、りんご果汁を自然発酵させた低アルコール（2〜6%前後）の発泡酒。そば粉のガレットやクレープ、カマンベールチーズの定番の相棒","t":"みずみずしいりんごの甘酸っぱさと軽快な泡立ち、ほのかな渋みがあり、辛口（ブリュット）から甘口（ドゥ）まで爽やかに楽しめる","z":"ブルターニュのクレープリーでは陶器の器「ボレ（bolée）」に注いで飲むのが伝統スタイル。洋梨版の「ポワレ（Poiré）」もある"},{"f":"Pastis","r":"パスティス","j":"パスティス","c":"ワイン・酒類","g":"酒類・リキュール","m":"南仏マルセイユ発祥の、スターアニス（八角）・フェンネル・リコリス（甘草）などのハーブで香り付けした食前酒。水で割ると白濁するのが特徴で、南仏のカフェのアペリティフの代名詞","t":"アニスとハーブの清涼で甘くスパイシーな芳香が口いっぱいに広がり、水と氷で割ると驚くほどすっきり爽やかに飲める","z":"リカール（Ricard）やペルノ（Pernod）が代表銘柄。ブイヤベースやガンバスのフランベの香り付けにも使われる"},{"f":"Chartreuse","r":"シャルトリューズ","j":"シャルトリューズ","c":"ワイン・酒類","g":"酒類・リキュール","m":"アルプス山麓のグランド・シャルトリューズ修道院の修道士たちが、130種類もの薬草とスパイスを秘伝の配合で造る「リキュールの女王」。力強い緑（ヴェール）と穏やかな黄（ジョーヌ）がある","t":"複雑で神秘的なハーブ・スパイスの芳香と蜂蜜のようなまろやかな甘み、高いアルコール感が織りなす唯一無二の深い余韻","z":"製法を知る修道士は常に数名のみと伝えられる。食後酒のほか、チョコレート菓子やジビエ・魚料理のソースの隠し味にも使う"},{"f":"Grand Marnier","r":"グラン・マルニエ","j":"グラン・マルニエ","c":"ワイン・酒類","g":"酒類・リキュール","m":"熟成コニャックをベースに、カリブ海産ビターオレンジの果皮のエキスをブレンドしてオーク樽で熟成させたフランスを代表する高級オレンジリキュール。製菓とフランベの王道","t":"ビターオレンジの華やかで甘酸っぱい芳香とほろ苦さに、コニャック由来の重厚な樽香とまろやかな甘みが溶け合うリッチな味わい","z":"クレープ・シュゼットのフランベやスフレ・オ・グラン・マルニエに欠かせない。コルドン・ルージュ（赤帯）が定番"},{"f":"Cointreau","r":"コアントロー","j":"コアントロー","c":"ワイン・酒類","g":"酒類・リキュール","m":"ロワール地方アンジェ発祥の、スイートオレンジとビターオレンジの果皮から蒸留した無色透明のオレンジリキュール（トリプルセック／ホワイトキュラソーの代表格）","t":"グラン・マルニエより軽やかで透明感があり、鮮烈でピュアなオレンジの香りとキレのある上品な甘みが特徴","z":"色の影響を出したくないムース、マカロン、フルーツマリネ、焼き菓子の香り付けにフランス菓子職人が愛用する"},{"f":"Crème de cassis","r":"クレーム・ド・カシス","j":"クレーム・ド・カシス","c":"ワイン・酒類","g":"酒類・リキュール","m":"ブルゴーニュ地方ディジョン名産の、黒すぐり（カシス）の実をアルコールに浸漬し砂糖を加えて造る濃密な果実リキュール。白ワインで割る「キール」の要となる","t":"カシス本来の濃厚で甘酸っぱいベリーの果実味と深い香り、とろりとしたシロップのような甘みが特徴","z":"カシスの使用量と品質基準を満たした「カシス・ド・ディジョン」はIGP認定を受けている。デザートソースや鴨料理にも使う"},{"f":"Rhum","r":"ラム","j":"ラム酒","c":"ワイン・酒類","g":"酒類・リキュール","m":"さとうきびの搾り汁や糖蜜を発酵・蒸留して造るスピリッツ。フランスでは海外県マルティニークやグアドループ産の「アグリコル・ラム」が特に愛され、フランス菓子の香り付けの王道","t":"樽熟成したダークラムはバニラやキャラメル、トロピカルフルーツを思わせる甘く芳醇な芳香と深いコクを持つ","z":"カヌレ、ババ・オ・ラム、モンブラン、バナナのフランベなど、フランス菓子で最も使用頻度の高い洋酒のひとつ"},{"f":"Vin de Porto","r":"ヴァン・ド・ポルト","j":"ポートワイン","c":"ワイン・酒類","g":"酒類・リキュール","m":"ポルトガル・ドウロ川流域で発酵途中のワインにブランデーを加えて造る世界三大酒精強化ワインのひとつ。フランスでは食前酒・食後酒のほか、メロンやフォアグラ、鴨ソースに定番として使われる","t":"ルビーは熟したベリーの濃厚な甘み、長期樽熟成のトウニーはナッツやドライフルーツ、キャラメルの芳醇でまろやかなコクが広がる","z":"フランスはポートワインの世界最大の消費国のひとつ。ロックフォールやスティルトンなどブルーチーズとの相性も至高"},{"f":"Vin de Madère","r":"ヴァン・ド・マデール","j":"マデラ酒","c":"ワイン・酒類","g":"酒類・リキュール","m":"ポルトガル領マデイラ島で酒精強化と加熱熟成を経て造られる世界三大酒精強化ワインのひとつ。フランス古典料理ではマデラ酒ソースやペリグーソース、フォアグラの風味付けに不可欠","t":"加熱熟成ならではの焦がしカラメルやローストナッツ、オレンジピールの複雑な芳香と、豊かな酸味に支えられた長い余韻が特徴","z":"すでに酸化・加熱熟成されているため抜栓後も劣化しにくく、食前酒（辛口）から食後酒（甘口）、調理用まで万能に活躍する"},{"f":"Xérès","r":"シェレス","j":"シェリー酒","c":"ワイン・酒類","g":"酒類・リキュール","m":"スペイン南部アンダルシア地方ヘレス周辺で造られる世界三大酒精強化ワインのひとつ（フランス語読みでシェレス）。ソレラシステムによる熟成で極辛口フィノから極甘口ペドロ・ヒメネスまで多彩","t":"辛口フィノはアーモンドや潮風を思わせるキレのある風味、オロロソはくるみやスパイス香る重厚なコクを持つ","z":"フランス料理ではコンソメスープの香り付け（仕上げに数滴）や、クリームソース、シェリービネガーの原料として親しまれる"},{"f":"Vermouth","r":"ヴェルムート","j":"ベルモット","c":"ワイン・酒類","g":"酒類・リキュール","m":"白ワインをベースにニガヨモギや数多くの薬草・スパイス・柑橘の皮で香り付けしたフレーバードワイン。フランス産辛口（ノイリー・プラット等）は食前酒のほか魚介ソースの隠し味に重宝される","t":"爽やかなハーブとスパイスの複雑な芳香に、心地よいほろ苦さとワインの酸味が調和した洗練された大人の味わい","z":"南仏マルセイヤン発祥の辛口「ノイリー・プラット」は、名だたるフレンチシェフが魚介の白ワインソースに愛用する名酒"},{"f":"Pineau des Charentes","r":"ピノ・デ・シャラント","j":"ピノ・デ・シャラント","c":"ワイン・酒類","g":"酒類・リキュール","m":"コニャック地方で、発酵前の新鮮なブドウ果汁に熟成コニャックを加えて樽熟成させた伝統的な甘口ワイン（ミステル／AOC）。冷やして食前酒やメロン・フォアグラと楽しむのが現地流","t":"フレッシュなブドウの瑞々しい甘みと蜂蜜・ドライフルーツの香りに、コニャック由来の芳醇な樽香とまろやかなコクが溶け合う","z":"16世紀にワイン職人が誤ってコニャックの入った樽にブドウ果汁を注いだ偶然から生まれたという逸話が伝わる"},{"f":"Lillet","r":"リレ","j":"リレ","c":"ワイン・酒類","g":"酒類・リキュール","m":"ボルドー地方ポデンサックで造られる、ボルドーワインに柑橘果実（スイート＆ビターオレンジ等）の浸漬酒をブレンドして熟成させた伝統的アペリティフワイン。白（ブラン）・ロゼ・赤がある","t":"オレンジの花や蜂蜜、砂糖漬け柑橘の華やかな香りに、キナ皮由来のほのかなほろ苦さが調和した軽やかで上品な甘口","z":"映画『007』のカクテル「ヴェスパー」の材料としても有名。氷とオレンジスライスを添えて食前酒として楽しまれる"},{"f":"Kir royal","r":"キール・ロワイヤル","j":"キール・ロワイヤル","c":"ワイン・酒類","g":"酒類・リキュール","m":"ディジョン名物のクレーム・ド・カシスに、白ワインではなくシャンパーニュを注いで仕上げる華やかな食前酒カクテル。「王室のキール」の名にふさわしい祝宴のアペリティフの王道","t":"シャンパーニュのきめ細かな泡とシャープな酸味に、カシスの甘酸っぱいベリー香と美しいルビー色が溶け合う優雅な味わい","z":"シャンパーニュの代わりにクレマンを使うと「キール・ペティヤン」や「キール・ブルギニョン」と呼ばれることもある"},{"f":"Service à la française","r":"セルヴィス・ア・ラ・フランセーズ","j":"フランス式サービス","c":"サービス・接客","g":"接客・マナー","m":"大皿に盛った料理をサービススタッフが左側から差し出し、客自身がサーバーを使って取り分ける古典的な給仕方式。18世紀までの宮廷では一度に全皿を並べる形式を指した","z":"現代のコース料理で主流の一皿ずつ順に供する方式は「ロシア式サービス」と呼ばれる"},{"f":"Service à la russe","r":"セルヴィス・ア・ラ・リュス","j":"ロシア式サービス","c":"サービス・接客","g":"接客・マナー","m":"前菜・魚・肉・デザートと、温かい料理を最適な温度で一皿ずつ順番に提供するサービス方式。19世紀にロシア大使がパリへ広め、現代のフランス料理コースの基本となった","z":"厨房で皿に美しく盛り付けて出す「ア・ラシェット（盛り付けサービス）」へと発展した"},{"f":"Vestiaire","r":"ヴェスティエール","j":"クローク（外套預かり所）","c":"サービス・接客","g":"接客・マナー","m":"レストランの入口付近に設けられた、客のコートや大きな荷物・傘を預かるクローク。高級店では着席前にスタッフが預かり、帰りに席または入口で差し出す","z":"席の背もたれにコートを掛けず、入店時に預けるのがフランス料理店のスマートなマナー"},{"f":"Nappe","r":"ナップ","j":"テーブルクロス","c":"サービス・接客","g":"食器・卓上","m":"テーブルに掛ける布製のクロス。高級フランス料理店では、衝撃と音を和らげるアンダークロス（モルトン）の上に、糊の利いた白いリネンのナップを二重に掛けるのが正統","z":"フランスでは白クロスのある正統派レストランを「テーブル・ナペ（table nappée）」と呼んで格を示すこともある"},{"f":"Serviette","r":"セルヴィエット","j":"ナプキン","c":"サービス・接客","g":"食器・卓上","m":"食事中に膝に広げ、口元や指先を軽く押さえるための布製ナプキン。中座するときは椅子の上に軽く畳んで置き、食後は畳みすぎずテーブルの左側に置くのがマナー","z":"きれいに畳み直してテーブルに置くと「サービスに不満があった」という合図になるため、軽くまとめる程度にする"},{"f":"Flûte","r":"フリュート","j":"フルートグラス","c":"サービス・接客","g":"食器・卓上","m":"シャンパーニュやクレマンなどの発泡ワインを注ぐ、細長く背の高いグラス。泡の立ち上る美しさを眺められ、炭酸が抜けにくい形状になっている","z":"近年は熟成シャンパーニュの香りを開くため、少し膨らみのあるチューリップ型や白ワイングラスで供する店も増えている"},{"f":"Réservation","r":"レゼルヴァシオン","j":"予約","c":"サービス・接客","g":"接客・マナー","m":"レストランの席を事前に確保すること。フランスでは星付き店から人気ビストロまで予約が基本で、アレルギーや記念日の要望もこの段階で伝えておくとスムーズ","z":"無断キャンセル（ノーショー）を防ぐため、近年はクレジットカード登録を求める店も多い"},{"f":"Mandoline","r":"マンドリーヌ","j":"マンドリン（業務用スライサー）","c":"厨房・道具","g":"調理器具","m":"じゃがいも・きゅうり・トリュフなどの野菜を、均一な極薄切りや千切り、ワッフル状（ゴーフル）に素早く切り出せるステンレス製の業務用スライサー","z":"弦楽器のマンドリンに形が似ることからこの名がついた。切れ味が鋭いため指の保護具を使う"},{"f":"Poche à douille","r":"ポッシュ・ア・ドゥイユ","j":"絞り袋と口金","c":"厨房・道具","g":"調理器具","m":"クリーム、メレンゲ、シュー生地、マッシュポテトなどを詰めて先端の口金（ドゥイユ）から美しく絞り出す円錐形の袋。製菓だけでなく料理の盛り付けにも多用される","z":"丸口金、星口金、モンブラン用、サントノレ用など口金の形で仕上がりが大きく変わる"},{"f":"Casserole","r":"カスロール","j":"片手鍋","c":"厨房・道具","g":"調理器具","m":"長い柄が1本ついた、厨房で最も使用頻度の高い基本の片手鍋。ソースの煮詰め、バター溶かし、少量のゆで物・ポシェまであらゆる作業に活躍する","z":"熱伝導のよい銅鍋（内側スズ引き・ステンレス張り）がフランス厨房の憧れとされる"},{"f":"Poêle","r":"ポワル","j":"フライパン","c":"厨房・道具","g":"調理器具","m":"底が平らで縁が外側に斜めに開いた焼き物用の片手鍋（フライパン）。ソテーやムニエル、オムレツ、クレープ焼きなど強火で香ばしく焼き上げる調理に使う","z":"鉄製（黒皮鉄板）のフライパンは油をなじませて育て、肉や魚の皮をパリッと焼くのに最適"},{"f":"Mortier","r":"モルティエ","j":"すり鉢（乳鉢）","c":"厨房・道具","g":"調理器具","m":"大理石・木・陶器などで作られた厚手のすり鉢。すりこぎ（ピロン）と対で使い、にんにく・バジル・スパイスを香り高くすり潰してアイオリやピストゥを作る","z":"ミキサーと違い刃の摩擦熱が出ないため、ハーブやオリーブ油の繊細な香りを損なわずに仕上げられる"},{"f":"Couteau d’office","r":"クトー・ドフィス","j":"ペティナイフ","c":"厨房・道具","g":"調理器具","m":"刃渡り8〜10cmほどの小回りの利く小型包丁。果物や野菜の皮むき、面取り（トゥルネ）、飾り切り、にんにくの芽取りなど繊細な手元作業に欠かせない","z":"料理人が最初に手になじませる基本の包丁のひとつ。大型の万能包丁は「クトー・ド・シェフ（牛刀）」と呼ぶ"},{"f":"Cercle","r":"セルクル","j":"セルクル（底なし丸型）","c":"厨房・道具","g":"調理器具","m":"底のない金属製の円筒リング型。タルトやムースケーキの成形に使うほか、タルタルステーキや野菜の前菜を皿の上で美しい円柱形に盛り付ける際にも重宝する","z":"フランス語で「円・輪」の意味。四角い型は「カードル（cadre）」と呼んで区別する"},{"f":"Siphon","r":"シフォン","j":"エスプーマ用サイフォン","c":"厨房・道具","g":"調理器具","m":"液体に亜酸化窒素（N2O）ガスを高圧で溶け込ませ、ノズルからふんわり軽い泡（エスプーマ）として絞り出す密閉調理器具。現代フレンチのソースや冷菓で広く活躍する","z":"スペインのエル・ブジで広まり、現在は温製・冷製の軽いソースやシャンティイ作りに定番となった"},{"f":"Paupiette","r":"ポーピエット","j":"ポーピエット（薄切り肉の包み焼き）","c":"料理","m":"薄く叩いた仔牛肉・牛肉・白身魚（舌平目など）の切り身で、ひき肉やデュクセルなどの詰め物（ファルス）をくるりと巻き、糸で縛ってブレゼやポシェにした古典料理","t":"外側の肉や魚が詰め物の旨味を逃さず包み込み、煮汁やソースが染み込んでしっとりジューシーに仕上がる","z":"家庭料理でも定番の仔牛のポーピエット（ポーピエット・ド・ヴォー）は、外側に豚の背脂を巻くことが多い","g":"肉・ジビエ料理"},{"f":"Pithiviers","r":"ピティヴィエ","j":"ピティヴィエ","c":"料理","m":"丸い折り込みパイ生地で具材を包み、表面に渦巻き状の美しい模様を刻んで焼き上げたロワレ県ピティヴィエ発祥のパイ料理。アーモンドクリーム詰めの菓子版と、鴨・ジビエ・フォアグラを詰めた豪華な料理版がある","t":"バター香るサクサクのパイを割ると、料理版はジビエとフォアグラの濃密な旨味、菓子版は香ばしいアーモンドの甘みが広がる","z":"料理版のピティヴィエは、現代の星付きフランス料理店でも秋のジビエ季節の花形として人気が高い","g":"肉・ジビエ料理"},{"f":"Aligot","r":"アリゴ","j":"アリゴ","c":"料理","m":"なめらかなマッシュポテトに、熟成前の新鮮なチーズ「トム・フレッシュ」（ライヨールやカンタルの凝乳）とにんにく、バターを加えて鍋で力強く練り上げたオーブラック高原の郷土料理","t":"お餅のように長く糸を引くもっちり滑らかな食感に、じゃがいもの甘みとチーズの優しいコク、ほのかなにんにくが香る","z":"ソーセージや鴨・牛肉のローストの付け合わせとして、高い位置から糸を引かせて盛り付けるのが本場流","g":"野菜・チーズ・軽食"},{"f":"Tarte flambée","r":"タルト・フランベ","j":"タルト・フランベ（フラムクーヘン）","c":"料理","m":"ごく薄く伸ばしたパン生地に、フロマージュ・ブランとクレーム・フレッシュを塗り、薄切り玉ねぎとベーコン（ラルドン）を散らして高温の窯でカリッと焼いたアルザス名物","t":"パリパリと香ばしい極薄生地に、酸味のある白いクリーム、甘い玉ねぎと燻製ベーコンの塩気が軽快に調和する","z":"アルザス語では「フラムクーヘン（Flammekueche）」。アルザス白ワインやビールとともに手でつまんで食べる","g":"野菜・チーズ・軽食"},{"f":"Cromesquis","r":"クロメスキ","j":"クロメスキ（一口クリームコロッケ）","c":"料理","m":"濃厚なソースやフォアグラ、煮込み肉、チーズなどを一口大に冷やし固め、衣をつけてカリッと揚げたフランス版コロッケ。口に入れると中から熱い液体が弾ける仕立てが現代フレンチで人気","t":"外はサクッと香ばしく、噛んだ瞬間に中からとろりと濃厚な旨味や香りが一気に溢れ出す驚きの食感","z":"ポーランド起源とされ、19世紀にフランス古典料理へ取り入れられた。アミューズ・ブーシュの定番","g":"前菜・冷菜・サラダ"},{"f":"Nage","r":"ナージュ","j":"ナージュ（香草スープ仕立て）","c":"料理","m":"白ワイン、香味野菜（ミルポワ）、ハーブ、スパイスで取った香り高いクール・ブイヨンの中で、オマール海老やホタテ、白身魚を優しく火入れし、その煮汁ごとスープ仕立てで供する料理","t":"魚介の澄んだ旨味とハーブ・白ワインの爽やかな芳香が溶け合った、バターやクリーム控えめの極めて洗練された軽やかな味","z":"「ア・ラ・ナージュ（泳ぐように）」の意味。1970年代のヌーヴェル・キュイジーヌで一躍定番となった","g":"魚介料理"},{"f":"Sous-vide","r":"スー・ヴィッド","j":"真空調理","c":"調理法","m":"食材と少量の調味料・ハーブを専用袋に入れて真空密閉し、湯せんやスチームコンベクションで設定温度（例：58℃など）を精密に保ちながら加熱する現代フレンチの革新技法","t":"肉汁や香りが一切逃げず、中心から端まで均一に驚くほどしっとり柔らかくジューシーに仕上がる","z":"1970年代にフランス人シェフ、ジョルジュ・プラリュがフォアグラの歩留まり改善のために開発したのが始まり","g":"加熱・火入れ"},{"f":"Basse température","r":"バス・タンペラチュール","j":"低温調理","c":"調理法","m":"通常のローストよりはるかに低い温度帯（55〜80℃前後）のオーブンや湯せんで、時間をかけてじっくり中心まで均一に火を通す現代フレンチの火入れ技法","t":"たんぱく質が硬く縮みにくいため、赤身肉や白身魚が驚くほどきめ細かくしっとり瑞々しい食感に仕上がる","z":"仕上げに強火のフライパンで表面だけ香ばしく焼き目をつけて（セジール）食感の対比を出すことが多い","g":"加熱・火入れ"},{"f":"Émulsion","r":"エミュルシオン","j":"乳化・泡ソース","c":"調理法","m":"本来混ざり合わない油と水分を細かく分散させて一体化させる「乳化」（マヨネーズやブール・ブランの原理）。また現代フレンチでは、ハンドブレンダーで空気を含ませて泡立てた軽いソースも指す","t":"口当たりがふんわり軽くビロードのように滑らかになり、素材の香りが空気と一緒にふわりと華やかに広がる","z":"魚介のだしや甲殻類のビスクを泡立てたエミュルシオンは、現代フレンチの盛り付けの定番","g":"調味・仕上げ"},{"f":"Espuma","r":"エスプーマ","j":"エスプーマ（ムース状の泡）","c":"調理法","m":"野菜のピューレやだし、クリーム、果汁などをサイフォンに入れ、亜酸化窒素ガスを充填してきめ細かなムース状の泡に仕立てる現代ガストロノミーの技法","t":"空気のように軽く舌の上で瞬時にほどけ、重さを感じさせずに素材の濃厚な風味と香りだけを鮮やかに届ける","z":"スペイン語で「泡」の意味。じゃがいもやトリュフの温かいエスプーマがアミューズや前菜で人気","g":"調味・仕上げ"},{"f":"Pâte sucrée","r":"パート・シュクレ","j":"パート・シュクレ（甘いタルト生地）","c":"デザート","m":"ポマード状のバターに粉砂糖・全卵・アーモンドプードル・小麦粉を順に混ぜて作る、サクサクと歯切れのよい甘いタルト生地。パート・サブレよりしっかりした焼き上がりになる","t":"香ばしく軽快なサクサク食感とアーモンド・バターの豊かな甘みがあり、みずみずしいフルーツタルトの土台を支える","z":"フランス語で「砂糖入りの生地」の意味。水分を吸いにくいため、カスタードやフルーツをのせるタルトに最適","g":"生地・クリーム・製菓技法"},{"f":"Crème mousseline","r":"クレーム・ムースリーヌ","j":"クレーム・ムースリーヌ","c":"デザート","m":"炊き上げたカスタードクリーム（クレーム・パティシエール）に、たっぷりのバターを加えて空気を含ませながら白っぽく滑らかに立てた濃厚なクリーム。フレジエやパリ・ブレストの要","t":"バタークリームのコクとカスタードのまろやかさを併せ持ち、冷やすとしっかり保形しつつ口の中でとろける贅沢な味","z":"料理用の「ソース・ムースリーヌ（オランデーズ＋生クリーム）」とは全く別の製菓用クリーム","g":"生地・クリーム・製菓技法"},{"f":"Crème diplomate","r":"クレーム・ディプロマット","j":"クレーム・ディプロマット","c":"デザート","m":"カスタードクリーム（クレーム・パティシエール）に、泡立てた生クリーム（シャンティイ）と少量のゼラチンをさっくり合わせた、軽やかでなめらかなクリーム","t":"カスタードの豊かな卵とバニラの風味を保ちながら、生クリームのふんわり軽い口溶けですっきりと食べやすい","z":"ゼラチンを入れない場合は「クレーム・レジェール」と呼ぶ。シュークリームやタルト、ミルフィーユに大活躍","g":"生地・クリーム・製菓技法"},{"f":"Nappage","r":"ナパージュ","j":"ナパージュ（艶出しゼリー）","c":"デザート","m":"フルーツタルトやケーキの表面に刷毛で薄く塗り、美しい光沢を出すと同時に果物の乾燥や変色を防ぐ透明またはあんず風味のゼリー状コーティング","t":"ほのかな甘酸っぱさとつるんとした口当たりで、フルーツのみずみずしさと見栄えをぐっと引き立てる","z":"調理法の「ナペ（覆う）」に由来。市販のペクチン製ナパージュのほか、あんずジャムを煮詰めて作るのも古典","g":"生地・クリーム・製菓技法"},{"f":"Glaçage","r":"グラサージュ","j":"グラサージュ（艶がけ）","c":"デザート","m":"ケーキやムースの表面を、鏡のように滑らかに艶やかに覆うチョコレート・ココア・果実・砂糖衣のコーティング、およびその仕上げ作業","t":"とろりとなめらかな口溶けと濃厚なカカオや果実の風味が、ムース全体の味を華やかに引き締める","z":"鏡面仕上げの「グラサージュ・ミロワール」は現代パティスリーの象徴的テクニック","g":"生地・クリーム・製菓技法"},{"f":"Tempérage","r":"タンペラージュ","j":"テンパリング（温度調節）","c":"デザート","m":"溶かしたクーベルチュールチョコレートの温度を精密に上げ下げして、カカオバターの結晶を最も安定した状態に整える製菓の必須技法","t":"正しくテンパリングしたチョコは美しい艶とパキッと小気味よい歯切れ、口の中で瞬時にとろける極上の口溶けになる","z":"温度管理を誤ると表面が白く曇る（ブルーム現象）ため、ショコラティエの腕の見せどころ","g":"生地・クリーム・製菓技法"},{"f":"Forêt-Noire","r":"フォレ・ノワール","j":"黒い森のケーキ","c":"デザート","m":"ココアのスポンジ生地にキルシュ（さくらんぼの蒸留酒）を効かせたシロップを打ち、酸味のあるグリオットチェリーとたっぷりの生クリーム、削りチョコレートを重ねた名菓","t":"ビターなココアとミルキーな生クリーム、グリオットの鮮烈な酸味とキルシュの芳醇な香りが響き合う大人の味わい","z":"ドイツ南西部の「黒い森（シュヴァルツヴァルト）」に由来し、アルザスやフランス全土のパティスリーで定番","g":"ケーキ・タルト"},{"f":"Far breton","r":"ファー・ブルトン","j":"ファー・ブルトン","c":"デザート","m":"卵・牛乳・砂糖・小麦粉・バターの濃厚な生地に、ラム酒や紅茶で戻したプルーン（干しプラム）を入れてオーブンでこんがり焼き上げたブルターニュ地方の伝統郷土菓子","t":"カヌレとプリンの中間のようなもっちりしっとりした食感に、バニラ香る素朴な甘みとプルーンの甘酸っぱさが溶け合う","z":"もとは小麦粥を指す言葉で、現在もブルターニュの家庭やパン屋で毎日焼かれる素朴な名物","g":"焼き菓子・小菓子"},{"f":"Gâteau basque","r":"ガトー・バスク","j":"ガトー・バスク","c":"デザート","m":"アーモンド入りの厚めのサブレ生地の中に、ラム酒香るカスタードクリームまたは名産の黒さくらんぼのジャムを詰めて、表面に格子模様を描いて焼き上げたバスク地方の伝統菓子","t":"外側はザクッと香ばしくほろほろ崩れるリッチなバター生地、中はしっとり濃厚なクリームや果実の甘酸っぱさが広がる","z":"バスク地方では「エチェコ・ビシュコチャ（家の菓子）」と呼ばれ、家庭ごとに秘伝のレシピが伝わる","g":"ケーキ・タルト"},{"f":"Tarte Bourdaloue","r":"タルト・ブルダルー","j":"洋梨のタルト（ブルダルー）","c":"デザート","m":"サクサクのタルト生地に濃厚なアーモンドクリーム（クレーム・ダマンド）を敷き、シロップ煮にした洋梨を放射状に並べて香ばしく焼き上げた19世紀パリ発祥の古典タルト","t":"みずみずしく甘い洋梨と、焼き込んでふっくら香ばしくなったアーモンドクリーム・バター生地が完璧に調和する王道の味","z":"名はパリのブルダルー通りにあった菓子店に由来する。温めてバニラアイスを添えても絶品","g":"ケーキ・タルト"},{"f":"Pâte de fruits","r":"パート・ド・フリュイ","j":"パート・ド・フリュイ（果実ゼリー菓子）","c":"デザート","m":"あんず、フランボワーズ、パッションフルーツ、マルメロなどの濃厚な果実ピューレを砂糖とペクチンで煮詰めて固め、グラニュー糖をまぶしたフランス伝統のフルーツゼリー菓子","t":"ひと口噛むと果汁そのものを凝縮したような鮮烈な甘酸っぱさと華やかな香りが広がり、ねっちり柔らかくほどける","z":"レストランの食後の小菓子（ミニャルディーズ）やギフトの定番。ゼラチンではなく果実由来のペクチンで固めるのが本式","g":"焼き菓子・小菓子"},{"f":"Baguette","r":"バゲット","j":"バゲット（フランスパン）","c":"コース・その他","g":"パン・カフェ","m":"小麦粉・水・塩・イーストのみで作る、細長い杖（バゲット）形のフランスを代表する食事パン。レストランの食卓に必ず供され、ソースを拭ったりチーズと合わせて楽しむ","t":"焼き立てのパリパリと香ばしい外皮（クルート）と、もっちり気泡を含んだ内層（ミ）の小麦本来の豊かな甘みが魅力","z":"伝統製法を守る「バゲット・ド・トラディション」は添加物不使用。料理のソースをパンで拭うのはフランスでは美味しいの合図"},{"f":"Pain de campagne","r":"パン・ド・カンパーニュ","j":"カンパーニュ（田舎パン）","c":"コース・その他","g":"パン・カフェ","m":"小麦粉にライ麦粉や全粒粉を混ぜ、天然酵母（ルヴァン）でじっくり発酵させて大きく丸く焼き上げた「田舎風パン」。パテやリエット、熟成チーズ、煮込み料理と抜群の相性","t":"厚く香ばしい外皮と、ルヴァン種由来のほのかな酸味・穀物の深い旨味があり、噛むほどに味わいが広がる","z":"大きく焼くことで水分が保たれ日持ちがよい。薄くスライスしてタルティーヌ（オープンサンド）の土台にも使う"},{"f":"Fougasse","r":"フーガス","j":"フーガス","c":"コース・その他","g":"パン・カフェ","m":"オリーブ油を練り込んだパン生地を平たく伸ばし、葉脈のような切れ目を入れて焼き上げた南仏プロヴァンスの伝統パン。オリーブ、アンチョビ、ベーコン、ハーブを混ぜ込むことが多い","t":"外はカリッと香ばしく中はもっちりしており、オリーブ油の芳香と具材の塩気がアペリティフやスープにぴったり","z":"古代ローマの灰焼きパンが起源で、イタリアのフォカッチャの親戚にあたる"},{"f":"Pain d’épices","r":"パン・デピス","j":"パン・デピス（香辛料のパン）","c":"コース・その他","g":"パン・カフェ","m":"ライ麦粉や小麦粉にたっぷりの蜂蜜と、シナモン・アニス・ナツメグ・クローブ・しょうがなどのスパイスを加えて焼き上げたディジョンやアルザス名物の伝統菓子パン","t":"しっとり濃密な口当たりに、蜂蜜の深い甘みと温かみのある華やかなスパイスの香りが広がる","z":"おやつとして食べるだけでなく、薄く焼いてフォアグラのテリーヌやポワレに添えるのがフランス料理の王道マリアージュ"},{"f":"Blinis","r":"ブリニ","j":"ブリニ","c":"コース・その他","g":"パン・カフェ","m":"そば粉や小麦粉にイースト・卵・牛乳を加えて小さく丸く焼き上げた、ロシア起源のふんわりしたミニパンケーキ。フランスではキャビアやスモークサーモン、クレーム・フレッシュをのせる前菜の定番","t":"ほんのり温かくもっちり柔らかな食感と素朴な風味が、キャビアやサーモンの塩気・クリームのコクを上品に引き立てる","z":"シャンパーニュのアペリティフのお供として高級レストランから家庭のパーティーまで幅広く愛される"},{"f":"Kougelhopf","r":"クグロフ","j":"クグロフ","c":"コース・その他","g":"パン・カフェ","m":"斜めのうねりが入った王冠のような専用陶器型で焼き上げるアルザス地方の伝統発酵菓子パン。レーズンとアーモンド入りの甘い型が定番だが、ベーコンとくるみを入れた塩味版もある","t":"ブリオッシュに似たふんわり軽い食感に、バターとラム酒漬けレーズンの芳醇な甘み、香ばしいアーモンドが調和する","z":"オーストリアから嫁いだマリー・アントワネットが愛し、フランス宮廷へ広めたという逸話がある"},{"f":"Expresso","r":"エスプレッソ","j":"エスプレッソ","c":"コース・その他","g":"パン・カフェ","m":"極細挽きの深煎りコーヒー豆に高い圧力をかけて短時間で抽出した濃厚なコーヒー。フランスのレストランやカフェで「アン・カフェ（un café）」と頼めば通常これが出てくる","t":"きめ細かな黄金色の泡（クレマ）の下から、凝縮した香ばしい苦味と芳醇なコクが力強く広がり食後の口を締める","z":"フランス語では「expresso」または「espresso」。小ぶりのドゥミタスカップで供される"},{"f":"Café allongé","r":"カフェ・アロンジェ","j":"アロンジェ（長めのエスプレッソ）","c":"コース・その他","g":"パン・カフェ","m":"エスプレッソにお湯を足すか抽出湯量を増やして、日本のホットコーヒーに近い飲みやすさに伸ばしたスタイル（「アロンジェ」は「伸ばす」の意味）","t":"エスプレッソの香ばしい風味を保ちながら苦味と濃度が穏やかになり、食後にゆっくり味わいたいときに最適","z":"濃いエスプレッソが苦手な人がフランスのレストランで食後のコーヒーを頼む際の定番フレーズ"},{"f":"Tisane","r":"ティザンヌ","j":"ハーブティー（煎じ茶）","c":"コース・その他","g":"パン・カフェ","m":"ヴェルヴェーヌ（レモンバーベナ）、カモミール、ミント、リンデン（菩提樹）などの乾燥またはフレッシュハーブを湯で抽出したノンカフェインのハーブティー（アンフュジョンとも呼ぶ）","t":"カフェインがなく穏やかで清涼な草花の香りが広がり、ディナー後の胃を優しく休めてリラックスさせてくれる","z":"高級フランス料理店では、フレッシュハーブをワゴンから選んで目の前で淹れてくれる「アンフュジョン・サービス」も人気"},{"f":"Chocolat chaud","r":"ショコラ・ショー","j":"ホットチョコレート","c":"コース・その他","g":"パン・カフェ","m":"上質なビターチョコレートを温めた牛乳と生クリームでじっくり溶かし込んだ、パリの老舗カフェやサロンドテ名物の濃厚なホットチョコレート","t":"日本のココアよりはるかに濃密でとろりとしており、カカオ本来の芳醇なほろ苦さとまろやかな甘みが体を温める","z":"パリのアンジェリーナなどが名高く、無糖のシャンティイ（生クリーム）を別添えして浮かべながら楽しむのが定番"},{"f":"Limonade","r":"リモナード","j":"リモナード（炭酸レモン飲料）","c":"コース・その他","g":"パン・カフェ","m":"フランスで最も親しまれる無色透明の甘みのある炭酸レモン飲料（日本のサイダーに近い）。そのまま飲むほか、シロップやビールと割るカクテルのベースとしてカフェに欠かせない","t":"きめ細かな炭酸と爽やかなレモンの香り、すっきりした甘みで食事の前後を軽やかに潤す","z":"リモナードにミントやグレナディンのシロップを加えたノンアルドリンクを「ディアボロ（Diabolo）」、ビールと割ると「パナシェ」と呼ぶ"},{"f":"Mocktail","r":"モクテル","j":"モクテル（ノンアルカクテル）","c":"コース・その他","g":"パン・カフェ","m":"果実の搾り汁、ハーブ、スパイス、お茶、出汁などを組み合わせて、本格的なカクテルやワインに匹敵する複雑な味わいに仕立てたノンアルコールドリンク","t":"甘すぎず酸味・渋み・ハーブの香りを巧みに重ねることで、料理との繊細なペアリングを楽しめる","z":"近年は星付きフランス料理   e.r.split(/[\/／]/).forEach(function(x){addKey(x,idx,1)});
