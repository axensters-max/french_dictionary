ろ","c":"食材","g":"果物","t":"宝石のような粒がプチッと弾け、爽やかな甘酸っぱさとほのかな渋みがサラダやデザートに華やかなアクセントを添える","z":"飾りやソースに使う","m":"ルビー色の粒がぎっしり詰まった果実（ざくろ）。粒をサラダやデザートの彩りに散らしたり、果汁をシロップ（グレナディン）やソースにする","d":"ざくろとサラダの前菜、グレナディンシロップ、デザートの彩り"},{"f":"Pastèque","r":"パステーク","j":"すいか","c":"食材","g":"果物","t":"シャリッと涼やかでみずみずしい甘みが喉を潤し、塩気のあるチーズやミント・ライムと合わせると驚くほど洗練される","z":"デザートやサラダに使う","m":"水分豊富な夏の大型果実（すいか）。デザートやソルベのほか、フェタチーズやミントと合わせる夏の冷製サラダにも使われる","d":"すいかとフェタチーズ・ミントの冷製サラダ、すいかのグラニテ・ソルベ"},{"f":"Nectarine","r":"ネクタリーヌ","j":"ネクタリン","c":"食材","g":"果物","t":"桃に似て芳醇な甘みとジューシーな果肉を持ち、皮ごと食べても滑らかで程よい酸味が焼き菓子や肉料理に映える","z":"桃の仲間","m":"皮に産毛がなく滑らかな桃の仲間。生食のほか、ポシェやタルト、グリルにして肉料理の付け合わせにも用いる","d":"ネクタリンのタルト、ポシェ（白ワイン煮）、鴨のローストの付け合わせ"},{"f":"Banane","r":"バナーヌ","j":"バナナ","c":"食材","g":"果物","t":"ねっとり濃密な甘みとトロピカルな甘い芳香があり、バターとラム酒でキャラメリゼすると香ばしく大人の味になる","z":"フランスではアンティル諸島産が多い","m":"熱帯産の甘い果実（バナナ）。フランスではフランベやタルト、クレームと合わせるデザートに広く使われる","d":"バナナのフランベ（ラム酒風味）、バナナのタルト、クレープ"},{"f":"Raisin","r":"レザン","j":"ぶどう","c":"食材","g":"果物","t":"みずみずしい甘みと上品な酸味が調和し、ワインの原料となるほか、うずらや魚の白ワインソース（ヴェロニク風）にも映える","z":"ワイン用と食用で、品種が違う","m":"ワインの原料としても重要な果実（ぶどう）。食用種はデザートやチーズの添え物のほか、うずらなど鳥料理のソースにも加える","d":"舌平目のヴェロニク風（ぶどう添え）、ウズラのぶどう煮込み、チーズの添え物"},{"f":"Prune","r":"プリュヌ","j":"プラム","c":"食材","g":"果物","t":"ジューシーで甘酸っぱい果肉と豊かな香りがあり、オーブンで焼くと酸味と甘みがぎゅっと凝縮してタルトに最適","z":"アジャン産の干しプラム（プリュノー）が有名","m":"夏から秋に出回るスモモ類（プラム）。タルトやジャムにするほか、乾燥させたプルーンは豚肉やジビエの煮込みに合わせる","d":"プラムのタルト、クラフティ、プリュノー（干しプルーン）の赤ワイン煮"},{"f":"Mangue","r":"マング","j":"マンゴー","c":"食材","g":"果物","t":"とろけるように滑らかな果肉と濃密な甘み・華やかな南国の芳香があり、ライムやパッションフルーツの酸味と好相性","z":"ソースやデザートに使う","m":"トロピカルな芳香を持つ南国果実（マンゴー）。ムースやソルベ、タルトのほか、フォアグラや魚介の前菜に甘酸っぱいアクセントとして添える","d":"マンゴーのムース・ソルベ、フォアグラやホタテの前菜のソース、タルト"},{"f":"Clémentine","r":"クレマンティーヌ","j":"クレメンティン","c":"食材","g":"果物","t":"種が少なく皮が薄い冬の柑橘で、酸味が穏やかでジューシーな甘い芳香がサラダや冷菓に軽やかな彩りを添える","z":"コルシカ産が有名","m":"種が少なく皮がむきやすい冬の小さな柑橘（クレメンティン）。生食やソルベ、サラダ、コンフィチュールに使う","d":"クレメンティンのソルベ、コンフィチュール、冬のサラダ"},{"f":"Melon","r":"ムロン","j":"メロン","c":"食材","g":"果物","t":"芳醇で華やかな甘い芳香ととろけるようなジューシーな果肉を持ち、生ハムの塩気やポートワインと合わせると極上の前菜になる","z":"南仏のカヴァイヨン産が有名","m":"夏を代表する芳香豊かな果実（メロン）。フランスでは果肉がオレンジ色のシャランテ種が主流で、生ハムやポートワインと前菜にする","d":"生ハムメロン、メロンのポートワイン添え、メロンの冷製スープ"},{"f":"Pêche","r":"ペーシュ","j":"もも","c":"食材","g":"果物","t":"みずみずしく芳醇な甘い芳香と程よい酸味があり、シロップ煮やローストにすると果肉の甘みが一層引き立つ","z":"デザートに使う。【日本との違い】日本の桃より硬めで、酸味のあるものが多い","m":"夏が旬の果実（もも）。白桃・黄桃があり、シロップ煮にしてピーチ・メルバにするほか、コンポートやタルトに仕立てる","d":"ペーシュ・メルバ、白桃のコンポート、桃のタルト・ソルベ"},{"f":"Framboise","r":"フランボワーズ","j":"ラズベリー","c":"食材","g":"果物","t":"華やかで気品ある芳香ときゅっと引き締まった鮮やかな酸味があり、チョコレートやバニラ、フォアグラと抜群の相性を誇る","z":"ソースやクーリにする。傷みやすい","m":"鮮やかな赤い木いちご（ラズベリー）。タルトやムースの彩り、裏ごししたクーリにするほか、酢に漬けてフランボワーズビネガーにもする","d":"フランボワーズのクーリ、ペーシュ・メルバ、タルト・オ・フランボワーズ、フランボワーズ酢"},{"f":"Pomme","r":"ポム","j":"りんご","c":"食材","g":"果物","t":"品種によってシャキッと爽やかな酸味からねっとり甘いものまで多彩で、バターでキャラメリゼすると芳醇なコクが出る","z":"ノルマンディではシードルやカルヴァドスの原料になる","m":"通年出回る果実（りんご）。タルト・タタンやコンポートなど菓子の定番であるほか、ブダン・ノワールや豚肉料理の付け合わせに欠かせない","d":"タルト・タタン、りんごのタルト、ブダン・ノワールの付け合わせ、ノルマンディ風料理"},{"f":"Citron","r":"シトロン","j":"レモン","c":"食材","g":"果物","t":"きりっと鮮烈な酸味と清涼感あふれる爽やかな香りがあり、魚料理の仕上げからタルトまで料理と菓子の双方で不可欠","z":"地中海沿岸のマントン産が名高い","m":"酸味と香りの基本となる柑橘（レモン）。魚介やムニエルの仕上げ、オランデーズソース、タルト・オ・シトロンなど料理と菓子の双方で活躍する","d":"タルト・オ・シトロン、ソール・ムニエール、オランデーズソース、ブール・メートル・ドテル"},{"f":"Amande","r":"アマンド","j":"アーモンド","c":"食材","g":"ナッツ類","t":"ローストすると芳醇な香ばしさとほのかな甘みが引き立ち、粉末は焼き菓子にしっとりしたコクと豊かな風味を与える","z":"クレーム・ダマンドやマカロンの材料","m":"フランス菓子に欠かせないナッツ。粉末（アーモンドプードル）にしてマカロンやフィナンシェに、スライスは魚のムニエルにも添える","d":"マカロン、フィナンシェ、クレーム・ダマンド、ガレット・デ・ロワ、トリュイット・オ・ザマンド"},{"f":"Châtaigne","r":"シャテーニュ","j":"栗","c":"食材","g":"ナッツ類","z":"【日本との違い】日本の栗は大粒で、フランスの栗とは品種が異なる","t":"ほくほくとした優しい甘みと秋らしい素朴な香りがあり、塩味のポタージュやジビエ・七面鳥の詰め物に深いコクを添える","m":"秋の味覚の栗（主に野生種や小粒の総称）。ゆでてピューレやスープにしたり、七面鳥やジビエの詰め物、付け合わせに使う","d":"栗のポタージュ（ヴルーテ）、七面鳥の栗詰めロースト、ジビエの付け合わせ"},{"f":"Marron","r":"マロン","j":"マロン（大粒の栗）","c":"食材","g":"ナッツ類","t":"大粒でほくほくとした濃密な甘みと豊かな風味があり、シロップ漬けやクリームに仕立てると格別の贅沢な味わいになる","z":"マロン・グラッセの材料。殻をむくのに手間がかかる","m":"大粒で実が割れにくい栽培種の栗（マロン）。砂糖漬けのマロン・グラッセやモンブラン用のクリームなど、高級菓子の材料になる","d":"モンブラン、マロン・グラッセ、マロンクリームのデザート"},{"f":"Noix","r":"ノワ","j":"くるみ","c":"食材","g":"ナッツ類","m":"くるみ。同じ綴りで、仔牛の内ももの部位も指す","t":"香ばしい油分の深いコクと薄皮由来の心地よいほろ苦さ・渋みがあり、ブルーチーズやアンディーヴのサラダと抜群に合う","z":"ペリゴール産が有名","d":"アンディーヴとくるみ・ロックフォールのサラダ、くるみ油、ガトー・オ・ノワ"},{"f":"Noix de coco","r":"ノワ・ド・ココ","j":"ココナツ","c":"食材","g":"ナッツ類","t":"トロピカルで甘い芳香と豊かな油分のコクがあり、焼き菓子の香ばしさからカレー系ソースのまろやかさまで幅広く活躍する","z":"削ったものをデザートや菓子に使う","m":"ココヤシの実の白い胚乳部分。乾燥させて削ったものやココナッツミルクを、焼き菓子やムース、カレー系ソースに用いる","d":"ロシェ・ココ（焼き菓子）、ブラン・マンジェ風冷菓、インド風カレーソース"},{"f":"Cacahuète","r":"カカウェット","j":"ピーナッツ","c":"食材","g":"ナッツ類","t":"香ばしい焙煎香と濃厚な油分のコクがあり、砕いてキャラメルやチョコレートと合わせるとカリッと後を引く風味になる","z":"ソースやお菓子に使う","m":"マメ科の種子（落花生／ピーナッツ）。焙煎してアペリティフのおつまみにするほか、砕いて菓子や油の原料にする","d":"アペリティフのおつまみ、落花生油（フリット用）、プラリネやヌガー"},{"f":"Noisette","r":"ノワゼット","j":"ヘーゼルナッツ/ハシバミ","c":"食材","g":"ナッツ類","t":"焙煎すると驚くほど華やかで芳醇な香ばしさと濃い甘みが立ち上り、チョコレートや焦がしバターと至高の相性を生む","z":"ブール・ノワゼットの名の由来","m":"ヨーロッパで古くから親しまれるナッツ（ヘーゼルナッツ）。焙煎してプラリネや焼き菓子、サラダのトッピング、オイルの原料にする","d":"パリ・ブレスト（プラリネ）、ヘーゼルナッツ油、ジャンドゥーヤ、焼き菓子"},{"f":"Haricot","r":"アリコ","j":"いんげんまめ","c":"食材","g":"乾燥豆","t":"ほくほくとなめらかな口当たりとやさしい豆の甘みがあり、肉やベーコン・トマトの旨味をよく吸い込んで一体になる","z":"乾燥させたものは、水に戻して煮込む","m":"インゲン豆類の総称。乾燥豆は一晩水に戻してから香味野菜と煮込み、肉料理の付け合わせやスープに使う","d":"カスレ、いんげん豆のトマト煮込み、ガルビュール、豆のサラダ"},{"f":"Haricot rouge","r":"アリコ・ルージュ","j":"赤いんげん","c":"食材","g":"乾燥豆","t":"皮がしっかりして煮崩れしにくく、ほくほくした食感と白豆より力強いコクがあり、赤ワイン煮込みやサラダに映える","z":"赤ワイン煮や、サラダに使う","m":"赤い皮を持つインゲン豆（キドニービーンズなど）。煮崩れしにくく、赤ワイン煮込みやサラダ、スープの具材にする","d":"赤いんげん豆の赤ワイン煮込み、豆のサラダ、スープ"},{"f":"Lingot","r":"ランゴ","j":"白いんげん","c":"食材","g":"乾燥豆","t":"皮が薄く中身はとろけるようにほくほく柔らかく、鴨脂や豚肉の濃い旨味を吸い込むことで極上のコクに仕上がる","z":"カスレに使う白いんげんの代表","m":"細長く大粒の白いんげん豆。皮が薄く煮崩れにくいため、南西地方の郷土料理カスレに最もよく使われる品種","d":"カスレ（トゥールーズ風／カステルノーダリ風）、白いんげんの煮込み"},{"f":"Flageolet","r":"フラジョレ","j":"フラジョレ（緑のいんげん豆）","c":"食材","g":"乾燥豆","t":"小粒で極めてきめ細かくクリーミーな口当たりと繊細な甘みがあり、仔羊のローストの肉汁を吸わせると至高の付け合わせになる","z":"仔羊のローストの付け合わせが定番","m":"完熟前に収穫して乾燥させた淡い緑色のインゲン豆。きめ細かい食感で、仔羊のロースト（ジゴ）の付け合わせが古典的な定番","d":"ジゴ・ダニョー（仔羊もも肉のロースト・フラジョレ添え）"},{"f":"Pois cassé","r":"ポワ・カセ","j":"割りえんどう豆","c":"食材","g":"乾燥豆","t":"素朴でほくほくした優しい甘みと青い香りがあり、ベーコンと煮て裏ごしするととろり濃厚な緑のスープになる","z":"ポタージュ・サン・ジェルマンの材料","m":"乾燥えんどう豆の皮をむいて二つ割りにしたもの。水戻し不要で煮えやすく、ポタージュ・サン・ジェルマンやピューレに使う","d":"ポタージュ・サン・ジェルマン（割りえんどう豆のポタージュ）、ピューレ"},{"f":"Fève","r":"フェーヴ","j":"そらまめ","c":"食材","g":"乾燥豆","t":"春らしい瑞々しい青い香りとほくほくした甘み・わずかなほろ苦さがあり、生ハムやペコリーノ、ミントと好相性","z":"ガレット・デ・ロワの小さな人形も「フェーヴ」と呼ぶ","m":"春が旬のそら豆（または乾燥そら豆）。若いものは生のままサラダや塩ゆでに、乾燥品はスープやピューレに使う","d":"そら豆と生ハムのサラダ、春野菜のフリカセ、そら豆のピューレ"},{"f":"Pois chiche","r":"ポワ・シッシュ","j":"ひよこまめ","c":"食材","g":"乾燥豆","t":"ほくほくとした優しい甘みとナッツのような香ばしさがあり、挽いて焼くと外はカリッと中はもっちり香ばしくなる","z":"南仏のソッカやパニスは、ひよこ豆の粉から作る","m":"くちばしのような突起がある丸い豆（ひよこ豆）。クスクスの煮込みやサラダにするほか、挽いた粉は南仏のソッカの原料になる","d":"ソッカ（ニース名物）、パニス、クスクスの煮込み、ひよこ豆のサラダ"},{"f":"Lentille","r":"ランティーユ","j":"レンズまめ","c":"食材","g":"乾燥豆","t":"煮崩れしにくくほくほくした食感と、大地の素朴な香り・深い旨味があり、塩豚や鴨の脂、ヴィネグレットと絶妙に合う","z":"ル・ピュイ産のレンズ豆が名高い","m":"平たい円盤形の小さな豆（レンズ豆）。水戻しせずに短時間で煮えるため、塩豚の煮込みや温かいサラダ、ポタージュに多用される","d":"プティ・サレ・オ・ランティーユ（塩豚とレンズ豆の煮込み）、レンズ豆の温かいサラダ、ポタージュ"},{"f":"Abondance","r":"アボンダンス","j":"アボンダンス","c":"チーズ","g":"セミハード","m":"オート＝サヴォワ地方でアボンダンス牛の生乳のみから造られる牛乳製セミハードチーズ（AOP）。側面がわずかにくぼんだ形が特徴で、溶かして郷土料理ベルトーにも使う","t":"しなやかで弾力のある生地から、牧草やドライフルーツ、ヘーゼルナッツを思わせる穏やかな甘みと上品なコクが広がる","z":"アボンダンス牛の乳だけで作るAOP"},{"f":"Babybel","r":"ベビーベル","j":"ベビーベル","c":"チーズ","g":"ブランド品","m":"フランスのベル社が製造する、真っ赤なワックスで包まれた一口サイズの丸型セミハードチーズ。携帯しやすく、おやつや気軽なアペリティフとして世界中で親しまれる","t":"クセが一切なく、ほどよい弾力とミルキーでマイルドな塩気が子どもから大人まで食べやすい親しみやすい味わい","z":"赤いワックスは食べられず、むいて遊ぶ子も多い"},{"f":"Banon","r":"バノン","j":"バノン","c":"チーズ","g":"シェーヴル","m":"プロヴァンス地方バノン村周辺で造られる山羊乳のソフトチーズ（AOP）。栗の葉で丁寧に包みラフィア紐で結んで熟成させるため、葉のタンニンが生地に移る","t":"栗の葉のほのかな森の香りと柔らかな渋みに、山羊乳ならではの爽やかな酸味とねっとり濃厚なコクが調和した個性的な味","z":"ラフィアの紐で結ぶ伝統の包み方でAOP"},{"f":"Beaufort","r":"ボーフォール","j":"ボーフォール","c":"チーズ","g":"ハード","m":"サヴォワ地方のアルプス高地で造られる牛乳製の大型ハードチーズ（AOP）。夏山の放牧乳で造る「シャレー・ダルパージュ」は最高級とされ、フォンデュにも欠かせない","t":"きめ細かくしっとりした生地に、山の花や果実、焦がしバターやナッツを思わせる華やかで濃厚な甘みと長い余韻がある","z":"「グリュイエールの王子」の異名。フォンデュにも"},{"f":"Beaumont","r":"ボーモン","j":"ボーモン","c":"チーズ","g":"セミハード","m":"オート＝サヴォワ地方で造られる牛乳製のセミハードチーズ。洗いながら熟成させた淡いオレンジ色の表皮と、なめらかな生地が特徴","t":"クセが少なく穏やかでミルキーなコクがあり、しなやかで口当たりのよい生地からほのかなナッツの風味が漂う","z":"クセが少なく、サヴォワのチーズ入門向き"},{"f":"Bleu d’Auvergne","r":"ブルー・ドーヴェルニュ","j":"ブルー・ドーヴェルニュ","c":"チーズ","g":"青カビ","m":"中央高地オーヴェルニュ地方原産の牛乳製青カビチーズ（AOP）。青カビが均等に入り、ソースやドレッシングにも広く使われる","t":"しっとりなめらかな口溶けに、しっかりした塩気と青カビのスパイシーな刺激、バターのように豊かなコクが広がる","z":"1845年ごろ農夫ルーセルがライ麦パンのカビで作ったと伝わる"},{"f":"Bleu de Bresse","r":"ブルー・ド・ブレス","j":"ブルー・ド・ブレス","c":"チーズ","g":"青カビ","m":"ブレス地方で造られる牛乳製のソフトな青カビチーズ。白カビに覆われた表皮とクリーミーな生地を持ち、穏やかで食べやすい","t":"青カビの刺激はごく穏やかで、白カビチーズのようにとろりとクリーミーな口当たりとやさしい塩気が楽しめる","z":"1950年ごろ誕生の比較的新しいブルー"},{"f":"Bleu des Causses","r":"ブルー・デ・コース","j":"ブルー・デ・コース","c":"チーズ","g":"青カビ","m":"南仏コース高原の天然洞窟で熟成させる牛乳製青カビチーズ（AOP）。ロックフォールと同じ製法を牛乳で仕立てたもので、力強い赤ワインや甘口白ワインと好相性","t":"しっかりとした塩気と青カビのスパイシーな刺激がありながら、牛乳ならではのまろやかなコクとキレのある後味が魅力","z":"天然の洞窟で熟成させるAOP"},{"f":"Bleu du Vercors-Sassenage","r":"ブルー・デュ・ヴェルコール・サスナージュ","j":"ブルー・デュ・ヴェルコール・サスナージュ","c":"チーズ","g":"青カビ","m":"ローヌ＝アルプ地方ヴェルコール山地で造られる牛乳製青カビチーズ（AOP）。圧搾せずに柔らかく仕上げるため青カビが穏やかに広がり、地元のクルミや白ワインに合う","t":"ミルキーでやさしくまろやかな口当たりに、青カビのほのかな苦みとナッツのような香ばしさが溶け込む上品な味","z":"ブルーとしては穏やかで入門向き"},{"f":"Boursin","r":"ブルサン","j":"ブルサン","c":"チーズ","g":"ブランド品","m":"ノルマンディ地方発祥の、生クリームを加えたフレッシュチーズにガーリックと細ねぎ・パセリなどのハーブを練り込んだ人気ブランドチーズ。バゲットやクラッカーに塗って楽しむ","t":"ほろりと軽やかでクリーミーな口溶けに、フレッシュなにんにくとハーブの爽やかな香り・塩気が広がる後を引く味わい","z":"「パンにワイン、ブルサン」のCMで有名"},{"f":"Brie","r":"ブリ","j":"ブリ/ブリー","c":"チーズ","g":"白カビ","m":"パリ近郊イル＝ド＝フランス地方原産の大型で平たい牛乳製白カビチーズ。モー産（ブリ・ド・モー）やムラン産が特に名高く、赤ワインやシャンパーニュと好相性","t":"若いうちはミルキーで穏やか、熟成が進むととろりとした濃厚なコクにマッシュルームやヘーゼルナッツの芳醇な香りが加わる","z":"「チーズの王」。ウィーン会議でブリ・ド・モーが一位になったと伝わる"},{"f":"Brillat-Savarin","r":"ブリヤ・サヴァラン","j":"ブリヤ・サヴァラン","c":"チーズ","g":"白カビ","m":"ブルゴーニュやノルマンディで造られる、牛乳にたっぷり生クリームを加えたトリプルクリームの白カビチーズ。シャンパーニュやベリーのコンフィチュールと絶妙に合う","t":"バターや濃厚な生クリームを思わせるリッチでなめらかな口溶けに、フレッシュな酸味とほのかな塩気が爽やかさを添える","z":"美食家ブリア＝サヴァランにちなむ名"},{"f":"Brocciu","r":"ブロッチュ","j":"ブロッチュ","c":"チーズ","g":"フレッシュ","m":"コルシカ島特産の、羊乳や山羊乳のホエイ（乳清）に新鮮な乳を加えて温め固めたフレッシュチーズ（AOP）。そのまま食べるほか、オムレツや伝統菓子フィアドーネにも使う","t":"リコッタに似たふんわりと軽やかな口当たりで、雑味のない優しいミルクの甘みとほのかな塩気が広がる素朴な味わい","z":"コルシカ菓子ファディオーネにも使う"},{"f":"Cabécou","r":"カベクー","j":"カベクー","c":"チーズ","g":"シェーヴル","m":"南仏ミディ＝ピレネー地方で造られる小さな円盤型の山羊乳チーズ。焼いて温かいままサラダ（サラド・ド・シェーヴル・ショー）にのせる食べ方もビストロの定番","t":"しっとり柔らかく口溶けがよい生地に、山羊乳のやさしい酸味とヘーゼルナッツを思わせる香ばしいコクが広がる","z":"名はオック語の「山羊」に由来するとされる"},{"f":"Cancoillotte","r":"カンコワイヨット","j":"カンコワイヨット","c":"チーズ","g":"スプレッド","m":"フランシュ＝コンテ地方伝統の、脱脂乳の熟成凝乳（メトン）に水とバターを加えて加熱し、とろりとしたペースト状に溶かした低脂肪チーズ。にんにくや白ワイン風味もある","t":"見た目よりはるかに軽やかで、ほのかな発酵の酸味とまろやかなコクがあり、温めるとじゃがいもやパンに心地よく絡む","z":"温めてじゃがいもにかけて食べる"},{"f":"Cantal","r":"カンタル","j":"カンタル","c":"チーズ","g":"ハード","m":"オーヴェルニュ地方で古代から造られる大型の牛乳製ハードチーズ（AOP）。熟成期間によってジュンヌ（若）・アントル・ドゥ・ヴュー（中・長期）に分かれる","t":"若いものはみずみずしくミルキーで穏やか、熟成が進むにつれてほろりと締まり、バターのコクとスパイシーな旨味が深まる","z":"フランス最古級のチーズで、約2000年の歴史という"},{"f":"Cazelle de Saint-Affrique","r":"カゼル・ド・サン・タフリック","j":"カゼル・ド・サン・タフリック","c":"チーズ","g":"フレッシュ","m":"ミディ＝ピレネー地方サン・タフリック産の羊乳製フレッシュチーズ。熟成させずに楽しむため、羊乳本来の優しい甘みが活きている","t":"熟成させない羊乳ならではのまろやかでやさしい甘みに、ヨーグルトのような爽やかな酸味が重なる軽やかな味わい","z":"ロックフォールの産地に近い町のチーズ"},{"f":"Chabichou du Poitou","r":"シャビシュー・デュ・ポワトゥー","j":"シャビシュー・デュ・ポワトゥー","c":"チーズ","g":"シェーヴル","m":"フランス西部ポワトゥー地方で造られる、上に向かってわずかにすぼまった小さな円柱形の山羊乳チーズ（AOP）。ロワールやポワトゥーの爽やかな白ワインと好相性","t":"きめ細かくしっとりした生地に、柑橘のような爽やかな酸味とミネラル感があり、熟成すると締まってコクと旨味が増す","z":"名はアラビア語の山羊に由来するとの説がある"},{"f":"Chamois d’or","r":"シャモワ・ドール","j":"シャモワ・ドール","c":"チーズ","g":"ブランド品","m":"フランスで広く親しまれる牛乳製の白カビ系ソフトチーズ。口当たりが極めて滑らかでクセがなく、パンや果物と気軽に楽しめる","t":"驚くほどなめらかでクリーミーな口当たりで、クセや強い香りがなく、まろやかなミルクのコクと優しい塩気が広がる","z":"名は「金のシャモア（カモシカ）」の意味"},{"f":"Chaource","r":"シャウルス","j":"シャウルス","c":"チーズ","g":"白カビ","m":"シャンパーニュ地方シャウルス村周辺で造られる牛乳製白カビチーズ（AOP）。雪のように白い表皮を持ち、地元のシャンパーニュとの相性は定番中の定番","t":"中心部はほろりと爽やかな酸味があり、表皮の近くはとろりとクリーミー。ミルクの甘みとマッシュルームの香りが上品に調和する","z":"産地はオーブ県のシャウルス村"},{"f":"Chevrotin","r":"シュヴロタン","j":"シュヴロタン","c":"チーズ","g":"シェーヴル","m":"サヴォワ地方アルプス山麓で造られる、珍しいウォッシュタイプの山羊乳チーズ（AOP）。塩水で洗いながら熟成させるため、淡いピンクがかったオレンジ色の表皮になる","t":"表皮のほどよい芳香と山羊乳の穏やかな酸味に、しっとりなめらかな生地のまろやかなコクとほのかなナッツ感が広がる","z":"表皮を洗って熟成させる山羊乳チーズは珍しい"},{"f":"Coulommiers","r":"クロミエ","j":"クロミエ","c":"チーズ","g":"白カビ","m":"イル＝ド＝フランス地方クロミエ村原産の牛乳製白カビチーズ。ブリ・ド・モーより小ぶりで厚みがあり、熟成がやや早くまろやかな味わいで日常的に親しまれる","t":"ブリに比べて塩気やクセが穏やかで、ミルキーでとろりとした優しいコクとほのかなきのこの香りがバランスよく広がる","z":"「ブリの小さな兄弟」とも呼ばれる"},{"f":"Crottin de Chavignol","r":"クロタン・ド・シャヴィニョル","j":"クロタン・ド・シャヴィニョル","c":"チーズ","g":"シェーヴル","m":"ロワール地方サンセール近郊のシャヴィニョル村で造られる小ぶりな円筒形の山羊乳チーズ（AOP）。若い段階から乾いて硬くなる熟成段階まで、好みの熟度で楽しめる","t":"若いうちはしっとりミルキーで爽やかな酸味、熟成が進むと締まった食感になり、凝縮した塩気と香ばしいナッツ風味が際立つ","z":"名は「馬糞」の意味。サンセールの白ワインが定番"},{"f":"Emmental","r":"エメンタール","j":"エメンタール/エメンタラー","c":"チーズ","g":"ハード","m":"フランシュ＝コンテ地方などで造られる、大きな気孔（チーズアイ）が特徴の牛乳製大型ハードチーズ。加熱するとよく伸びて溶けるため、グラタンやフォンデュに欠かせない","t":"クセが少なく穏やかで、ミルクのやさしい甘みとフルーティーで香ばしいナッツのような風味がバランスよく広がる","z":"穴は発酵時の炭酸ガスでできる"},{"f":"Emmental de Savoie","r":"エメンタール・ド・サヴォワ","j":"エメンタール・ド・サヴォワ","c":"チーズ","g":"ハード","m":"サヴォワ地方の牧草で育った牛の無殺菌生乳から造られる大型ハードチーズ（IGP）。一般的なエメンタールより風味が豊かで、そのままでも加熱料理でも存在感がある","t":"しなやかで弾力ある生地に、生乳ならではのまろやかでフルーティーな甘みと芳醇なコクが広がり、後味もすっきり上品","z":"グラタンなど加熱料理にも向く"},{"f":"Faisselle","r":"フェセル","j":"フェセル","c":"チーズ","g":"フレッシュ","m":"水切り用の穴あき容器（フェセル）に入れてホエイを自然に切りながら固めた、熟成させないフレッシュチーズ。牛・山羊・羊乳があり、食後のデザートにもハーブ和えにも使う","t":"ぷるんと瑞々しく軽やかな口溶けに、さっぱりとした爽やかな酸味と作りたてのミルクのやさしい甘みが広がる","z":"砂糖やはちみつ、ジャムをかけてデザートに"},{"f":"Ficello","r":"フィセロ","j":"フィセロ","c":"チーズ","g":"ブランド品","m":"ベル社が製造する、細長いスティック状に個包装されたさけるタイプのナチュラルチーズ。おやつやサラダのトッピングとしてフランスの家庭で広く親しまれている","t":"クセがまったくなく、しこしことした楽しい食感とマイルドでミルキーな優しい塩気が特徴","z":"個包装で子どものおやつに人気"},{"f":"Fourme d’Ambert","r":"フルム・ダンベール","j":"フルム・ダンベール","c":"チーズ","g":"青カビ","m":"オーヴェルニュ地方アンベール周辺で造られる背の高い円筒形の牛乳製青カビチーズ（AOP）。フランス最古級のブルーの一つで、甘口ワインや赤ワイン、ソースにも好相性","t":"青カビチーズの中でも塩気と刺激が穏やかで、しっとりクリーミーな口当たりの中にほのかな甘みと森の香りが広がる","z":"ブルーの入門に最適。fourmeは「型」が語源"},{"f":"Fourme de Montbrison","r":"フルム・ド・モンブリゾン","j":"フルム・ド・モンブリゾン","c":"チーズ","g":"青カビ","m":"ロワール県モンブリゾン周辺の山岳地帯で造られる円筒形の牛乳製青カビチーズ（AOP）。フルム・ダンベールの兄弟分だが、塩を生地に混ぜ込んで造るためより穏やかに仕上がる","t":"しっとりきめ細かい生地で青カビの刺激は控えめ。素朴なミルクの甘みとほのかなきのこの香りが調和する優しい味","z":"フルム・ダンベールの兄弟分"},{"f":"La Vache qui rit","r":"ラ・ヴァッシュ・キ・リ","j":"笑う牛","c":"チーズ","g":"プロセス","m":"フランシュ＝コンテ地方ジュラ発祥、ベル社を代表する三角形の個包装プロセスチーズ。常温保存しやすく、パンに塗るほかスープやマッシュポテトのコク出しにも使われる","t":"なめらかで柔らかくパンに塗りやすい口当たりで、クセのないクリーミーでマイルドなミルクのコクと塩気が広がる","z":"1921年に商標登録。笑う赤い牛のロゴで有名"},{"f":"Laguiole","r":"ライヨール","j":"ラギオール","c":"チーズ","g":"ハード","m":"南仏オーブラック高原の放牧牛乳から造られる大型ハードチーズ（AOP）。カンタルと同じ製法だが高地の牧草による豊かな風味を持ち、郷土料理アリゴの主材料にもなる","t":"締まった生地を噛みしめるほどに、爽やかな酸味とバター・ヘーゼルナッツの濃厚なコク、山の草花の香りが広がる","z":"同名の村はナイフの産地としても有名"},{"f":"Langres","r":"ラングル","j":"ラングル","c":"チーズ","g":"ウォッシュ","m":"シャンパーニュ地方ラングル高原で造られる、熟成中に反転させないことで頂部がくぼんだ牛乳製ウォッシュチーズ（AOP）。くぼみにシャンパーニュやマールを注いで楽しむ","t":"ウォッシュ特有の力強い芳香としっかりした塩気がありながら、中身はきめ細かくほろりとろける濃厚でクリーミーな味","z":"くぼみにシャンパーニュを注いで食べることも"},{"f":"Livarot","r":"リヴァロ","j":"リヴァロ","c":"チーズ","g":"ウォッシュ","m":"ノルマンディ地方リヴァロ村原産の、側面に5本の葦の帯を巻いた牛乳製ウォッシュチーズ（AOP）。熟成中に塩水で洗って仕上げ、シードルやカルヴァドス、力強い赤ワインに合う","t":"表皮は燻製を思わせる力強い香りを放つが、弾力のある中身は意外にもまろやかで、旨味とスパイシーなコクが長く続く","z":"巻かれた帯が大佐の階級章に似て「コロネル」の愛称"},{"f":"Mâconnais","r":"マコネ","j":"マコネ","c":"チーズ","g":"シェーヴル","m":"ブルゴーニュ南部マコン周辺で造られる、底が広く上がすぼまった小さな山羊乳チーズ（AOP）。地元の白ワイン（マコンやプイィ・フュイッセ）との相性は抜群","t":"若いうちは爽やかな酸味とミルキーな口当たり、熟成して乾くにつれて凝縮した旨味と香ばしいナッツ風味が強まる","z":"熟すほど硬く乾いて味が濃くなる"},{"f":"Maroilles","r":"マロワル","j":"マロワル","c":"チーズ","g":"ウォッシュ","m":"北フランス・ノール地方の修道院発祥の四角い牛乳製ウォッシュチーズ（AOP）。「北のチーズの王」と呼ばれ、そのまま食べるほかタルト・オ・マロワルやソースにも使う","t":"強烈で個性的な表皮の香りに反して、中身は驚くほどまろやかで旨味たっぷり。しっかりした塩気と深いコクがビールにも合う","z":"マロワル修道院の修道士が作り始めたとされる"},{"f":"Mimolette","r":"ミモレット","j":"ミモレット","c":"チーズ","g":"ハード","m":"北フランス・リール周辺で造られる鮮やかなオレンジ色の球形牛乳製ハードチーズ。熟成期間（3か月〜24か月以上）で呼び名が変わり、長期熟成ものはからすみに例えられる","t":"若いものは柔らかくマイルド、18か月以上の長期熟成では硬く締まり、キャラメルやナッツのような濃厚な甘みと旨味が凝縮する","z":"色は着色料アナトー。ルイ14世がエダムの代わりに作らせたとされる"},{"f":"Mont d’or","r":"モン・ドール","j":"ヴァシュラン・モン・ドール","c":"チーズ","g":"ウォッシュ","m":"ジュラ山脈のフランス・スイス国境地帯で秋冬限定で造られる、もみの木の樹皮を巻いた牛乳製ウォッシュチーズ（AOP）。そのままスプーンですくうほか、白ワインとにんにくでオーブン焼きにする","t":"クリームのようにとろりとなめらかな口溶けに、濃厚なミルクの甘みと、巻いたもみの木由来の爽やかな森の香りが溶け合う","z":"冬季限定。オーブンで温めて食べるのが人気"},{"f":"Morbier","r":"モルビエ","j":"モルビエ","c":"チーズ","g":"セミハード","m":"フランシュ＝コンテ地方で造られる、断面の中央に食用植物炭の黒い一本の線が入った牛乳製セミハードチーズ（AOP）。そのままでも溶かしてじゃがいもにかけても美味","t":"しなやかで弾力のある生地から、まろやかでミルキーなコクとほのかな果実味・ナッツの香りが広がるクセの少ない味わい","z":"黒い層はもともと煤で朝夕の凝乳を仕切った名残"},{"f":"Munster","r":"マンステール","j":"マンステール","c":"チーズ","g":"ウォッシュ","m":"アルザス地方のヴォージュ山脈周辺で造られる、鮮やかな赤茶色の表皮を持つ牛乳製ウォッシュチーズ（AOP）。現地ではゆでじゃがいもやクミンを添え、ゲヴェルツトラミネールと合わせる","t":"強烈で個性的な香りを放つが、中身はとろりと濃厚でクリーミー。力強い旨味と甘みがあり、クミンと合わせると驚くほど調和する","z":"アルザスではゆでじゃがいもやクミンと食べる"},{"f":"Neufchâtel","r":"ヌシャテル","j":"ヌシャテル","c":"チーズ","g":"白カビ","m":"ノルマンディ地方ヌシャテル村原産の、愛らしいハート型で知られる牛乳製白カビチーズ（AOP）。カマンベールより古い歴史を持ち、しっかりめの赤ワインやシードルと好相性","t":"きめ細かくやや締まった生地に、しっかりとした塩気と濃厚なミルクのコク、熟成によるきのこの芳醇な香りが調和する","z":"ハート形は百年戦争中に少女が英兵へ贈ったという言い伝え"},{"f":"Ossau-Iraty","r":"オッソー・イラティ","j":"オッソー・イラティ","c":"チーズ","g":"ハード","m":"フランス南西部バスク・ベアルン地方で羊乳から造られる大型ハードチーズ（AOP）。バスク地方では黒さくらんぼのジャムを添え、地元の赤ワインと合わせて楽しむのが伝統","t":"しっとり締まった生地に、羊乳ならではの豊かな甘みと焦がしバターやヘーゼルナッツを思わせる奥深いコク、穏やかな酸味がある","z":"黒さくらんぼジャムを添えるのがバスク流"},{"f":"Pélardon","r":"ペラルドン","j":"ペラルドン","c":"チーズ","g":"シェーヴル","m":"南仏ラングドック地方セヴェンヌ山麓で造られる、手のひらサイズの小さな円盤型山羊乳チーズ（AOP）。熟成段階による変化が大きく、南仏の白・ロゼ・軽めの赤ワインに合う","t":"若いうちはみずみずしくミルキーで爽やかな酸味、熟成すると表皮に風味がつき、ほのかなハーブ感とナッツのコクが増す","z":"セヴェンヌ地方の伝統チーズ"},{"f":"Picodon de l’Ardèche","r":"ピコドン・ド・ラルデシュ","j":"ピコドン・ド・ラルデシュ","c":"チーズ","g":"シェーヴル","m":"南仏アルデーシュ地方で造られる小ぶりで平たい円盤型の山羊乳チーズ（AOP）。熟成が進むと引き締まり、白ワインで洗って熟成させる希少な「メトード・ディユー」製法もある","t":"名の通りほのかにピリッとしたスパイシーな刺激と爽やかな酸味があり、噛むほどに山羊乳の凝縮した旨味と甘みが広がる","z":"名はオック語の「ピリッとする」に由来するとされる"},{"f":"Pont-l’Évêque","r":"ポン・レヴェック","j":"ポン・レヴェック","c":"チーズ","g":"ウォッシュ","m":"ノルマンディ地方ポン・レヴェック村発祥の、12世紀から伝わる四角い牛乳製ウォッシュチーズ（AOP）。カマンベールより歴史が古く、シードルやブルゴーニュ赤ワインと好相性","t":"表皮の香りはやや力強いが、中身は弾力がありつつクリーミーでまろやか。ヘーゼルナッツのような香ばしさと深いコクが広がる","z":"ノルマンディ最古級のチーズの一つ"},{"f":"Pouligny-Saint-Pierre","r":"プリニー・サン・ピエール","j":"プリニー・サン・ピエール","c":"チーズ","g":"シェーヴル","m":"フランス中央部ベリー地方で造られる、細長いピラミッド型（「エッフェル塔」の愛称）の山羊乳チーズ（AOP）。ロワールのソーヴィニヨン・ブランと抜群の相性を誇る","t":"きめ細かくしっとりした口当たりで、爽やかな酸味とほどよい塩気、熟成とともに深まるヘーゼルナッツの上品な風味が魅力","z":"「エッフェル塔」の愛称がある"},{"f":"Raclette","r":"ラクレット","j":"ラクレット","c":"チーズ","g":"セミハード","m":"サヴォワやスイス・アルプス一帯で造られる加熱用の牛乳製セミハードチーズ。断面を直火や専用ヒーターでとろりと溶かし、ゆでじゃがいもや生ハム、ピクルスにかけて味わう","t":"加熱することで芳醇な香りが立ち、とろりと糸を引くクリーミーなコクとまろやかなミルクの甘み、穏やかな酸味が広がる","z":"名は「削る(racler)」から。溶かして芋やハムにかける"},{"f":"Reblochon","r":"ルブロッション","j":"ルブロッション","c":"チーズ","g":"ウォッシュ","m":"サヴォワ地方アルプスで造られる、薄く柔らかい表皮の牛乳製ウォッシュチーズ（AOP）。そのまま食べても絶品だが、郷土料理「タルティフレット」に欠かせない主役チーズ","t":"ウォッシュの中では香りが穏やかで食べやすく、とろりとなめらかな口当たりにやさしいミルクの甘みとヘーゼルナッツの余韻がある","z":"農家が税を逃れ再搾乳（reblocher）した乳が名の由来。タルティフレットに"},{"f":"Rigotte de Condrieu","r":"リゴット・ド・コンドリュー","j":"リゴット・ド・コンドリュー","c":"チーズ","g":"シェーヴル","m":"リヨン南部のワイン銘醸地コンドリュー周辺で造られる、小ぶりな円盤型の山羊乳チーズ（AOP）。地元の香り高い白ワイン「コンドリュー」との組み合わせが至高とされる","t":"しっとり柔らかく口溶けのよい生地から、穏やかな酸味とやさしいミルクの甘み、熟成するとほのかなナッツの風味が広がる","z":"コンドリューは白ワインの産地でもある"},{"f":"Rocamadour","r":"ロカマドゥール","j":"ロカマドゥール","c":"チーズ","g":"シェーヴル","m":"南仏ケルシー地方の巡礼地ロカマドゥール周辺で造られる、直径6cmほどの極小円盤型山羊乳チーズ（AOP）。熟成が早く、トーストにのせて蜂蜜や黒こしょうを添えても絶品","t":"驚くほどしっとりクリーミーで口の中でとろけ、山羊乳特有のクセが少なく優しい酸味と上品なナッツ・クリームのコクが広がる","z":"名は巡礼地ロカマドゥール村に由来"},{"f":"Saint Albray","r":"サン・タルブレ","j":"サン・タルブレ","c":"チーズ","g":"ウォッシュ","m":"フランス南西部アキテーヌ地方で造られる、6枚の花びらのようなユニークな形をした牛乳製ウォッシュチーズ。切り分けやすく、見た目も華やかなためチーズプラトーに映える","t":"ウォッシュ特有のクセや強い香りは控えめで、柔らかくクリーミーな生地からまろやかなミルクのコクと程よい塩気が広がる","z":"花びらのような形で知られる"},{"f":"Sainte-Maure de Touraine","r":"サント・モール・ド・トゥーレーヌ","j":"サント・モール・ド・トゥーレーヌ","c":"チーズ","g":"シェーヴル","m":"ロワール地方トゥーレーヌで造られる、中心に1本の麦わらを通し木炭粉をまぶした細長い円柱形の山羊乳チーズ（AOP）。ロワールの白ワイン（サンセールやヴーヴレ）と好相性","t":"ほろりと繊細でクリーミーな口溶けに、柑橘のような爽やかな酸味とまろやかなコク、ほのかなナッツの香りが上品に広がる","z":"中心に麦わらを通して形を保つ"},{"f":"Saint-Félicien","r":"サン・フェリシアン","j":"サン・フェリシアン","c":"チーズ","g":"白カビ","m":"ローヌ＝アルプ地方ドーフィネで造られる、生クリームを加えて濃厚に仕上げた牛乳製ソフトチーズ。熟成すると流れ出すほど柔らかくなるため、素焼きの器に入れて供されることも多い","t":"スプーンですくえるほどとろりと濃厚で、生クリームのような豊かなコクとミルキーな甘み、ごく穏やかな酸味が口いっぱいに広がる","z":"サン・マルセランと並ぶドーフィネの名品"},{"f":"Saint-Marcellin","r":"サン・マルセラン","j":"サン・マルセラン","c":"チーズ","g":"白カビ","m":"ドーフィネ地方イゼール県発祥の小ぶりな円盤型の牛乳製ソフトチーズ（IGP）。かつては山羊乳だったが現在は牛乳製で、リヨンのビストロでは定番の食後チーズとして愛される","t":"若いうちはミルキーで軽い酸味があり、熟成が進むと中身がとろりと流れ出すほど柔らかくなり、ナッツのような芳醇なコクが増す","z":"素焼きの器入りで売られることも"},{"f":"Saint-Nectaire","r":"サン・ネクテール","j":"サン・ネクテール","c":"チーズ","g":"セミハード","m":"オーヴェルニュ地方の高原で造られ、ライ麦の藁の上で熟成させる円盤型の牛乳製セミハードチーズ（AOP）。農家製（フェルミエ）は特に風味が豊かで、軽めの赤ワインに合う","t":"しっとり弾力のある生地に、湿った土やきのこ、藁を思わせる素朴で豊かな香りと、まろやかな酸味・ヘーゼルナッツのコクが調和する","z":"ライ麦の藁の上で熟成。ルイ14世の宮廷で有名になったと伝わる"},{"f":"Salers","r":"サレール","j":"サレール","c":"チーズ","g":"ハード","m":"オーヴェルニュ地方で夏の放牧期（4〜11月）のみ、伝統の木桶「ガーレ」を使って無殺菌牛乳から造られる希少な大型ハードチーズ（AOP）。長期熟成で力強い個性が生まれる","t":"放牧の草花やハーブを思わせる力強い芳香と、締まった生地から溢れるバターやローストナッツの濃厚なコク、心地よい塩気が特徴","z":"夏の放牧期に木桶ガーレで作る伝統"},{"f":"Selles-sur-Cher","r":"セル・シュール・シェール","j":"セル・シュール・シェール","c":"チーズ","g":"シェーヴル","m":"ロワール地方ベリー地区で造られる、塩を混ぜた木炭の灰を表面にまぶした平たい円盤型の山羊乳チーズ（AOP）。黒い表皮と真っ白な中身の対比が美しく、ロワールの白ワインに合う","t":"きめ細かくしっとりした口当たりに、爽やかな酸味と灰由来のほのかな塩気・ミネラル感、熟成によるナッツのような旨味が広がる","z":"黒い灰の表皮が目印"},{"f":"Tomme des Bauges","r":"トム・デ・ボージュ","j":"トム・デ・ボージュ","c":"チーズ","g":"セミハード","m":"サヴォワ地方のボージュ山塊で造られる、灰色の素朴な表皮を持つ牛乳製セミハードチーズ（AOP）。サヴォワの白・赤ワインと気軽に合わせられる、山の暮らしに根付いたチーズ","t":"ほどよい弾力のある生地から、ナッツやきのこ、山の牧草を思わせる穏やかで素朴な香りと、やさしいミルクの甘みが広がる","z":"「Tome」「Tomme」は表記が揺れるが同じ山のチーズの意"},{"f":"Tome fraîche","r":"トム・フレッシュ","j":"トム・フレッシュ","c":"チーズ","g":"フレッシュ","m":"オーヴェルニュ地方でカンタルやライヨールを造る途中の、熟成・加塩する前の新鮮な牛乳製凝乳（カード）。そのままでは食べず、じゃがいもとにんにくと練る郷土料理「アリゴ」に使う","t":"淡白でクセがなく、ほのかな酸味と優しいミルクの甘みがある。加熱すると驚くほど長く糸を引き、もっちりとした食感を生む","z":"アリゴ（じゃがいもとチーズの郷土料理）に欠かせない"},{"f":"Tomme de Savoie","r":"トム・ド・サヴォワ","j":"トム・ド・サヴォワ","c":"チーズ","g":"セミハード","m":"サヴォワ地方を代表する、灰色がかった素朴なカビの表皮を持つ牛乳製セミハードチーズ（IGP）。脂肪分がやや控えめなものが多く、日常の食卓やサンドイッチでも親しまれる","t":"クセが少なく穏やかな酸味と素朴な土・きのこの香りがあり、噛むほどにやさしいミルクの旨味が広がる食べやすい味わい","z":"灰色のカビの表皮が特徴"},{"f":"Tomme des Pyrénées","r":"トム・デ・ピレネー","j":"トム・デ・ピレネー","c":"チーズ","g":"セミハード","m":"ピレネー山脈一帯で造られる牛乳製のセミハードチーズ（IGP）。黒いワックスや自然の表皮で覆われており、クセがないため料理の加熱用からサンドイッチまで幅広く使われる","t":"しっとり柔らかな弾力があり、ミルキーでまろやかなコクと軽い酸味がバランスよく広がる、毎日食べても飽きない優しい味","z":"黒っぽい表皮のものもある"},{"f":"Trou du Cru","r":"トゥルー・デュ・クリュ","j":"トゥルー・デュ・クリュ","c":"チーズ","g":"ウォッシュ","m":"ブルゴーニュ地方でエポワスと同じ製法（マールで洗う）を用いて造られる、一口サイズの小さな牛乳製ウォッシュチーズ。エポワスの弟分として、一人分ずつ気軽に楽しめる","t":"小ぶりながらエポワスに引けを取らない力強い芳香と濃厚なコクがあり、熟成すると中心までとろりとクリーミーに溶ける","z":"エポワスと同じ村で作られる親戚筋"},{"f":"Valençay","r":"ヴァランセ","j":"ヴァランセ","c":"チーズ","g":"シェーヴル","m":"フランス中央部ベリー地方ヴァランセ村周辺で造られる、頂点を平らに切り落としたピラミッド型で木炭灰をまぶした山羊乳チーズ（AOP）。地元のソーヴィニヨン・ブランと定番の相性","t":"きめ細かくしっとりとした口溶けに、山羊乳の爽やかな酸味と軽い塩気、熟成とともに深まるヘーゼルナッツの上品な甘みが広がる","z":"エジプト遠征に敗れたナポレオンが頂点を切り落としたという言い伝え"},{"f":"Fromage bleu","r":"フロマージュ・ブルー","j":"ブルーチーズ","c":"チーズ","g":"青カビ","m":"生地の内部にアオカビを植え付けて熟成させたチーズの総称（フランス語ではパット・ペルシエとも呼ぶ）。ロックフォールやフルム・ダンベールなどがあり、ソースやサラダにも多用される","t":"青カビ特有のピリッとした刺激と香り、しっかりした塩気に乳脂肪の濃厚なコクが溶け合い、甘口ワインやはちみつとも絶妙に調和する","z":"「bleu」は青だが、実際のカビは青緑色。ステーキの「ブルー（超レア）」とは別の意味"},{"f":"Marchand de vin","r":"マルシャン・ド・ヴァン","j":"ワイン商風","c":"ソース","g":"褐色ソース系","m":"たっぷりのエシャロットと赤ワインをじっくり煮詰め、フォン・ド・ヴォーやグラス・ド・ヴィアンドを加えて冷たいバターで仕上げるソース。ビストロのステーキの定番","t":"赤ワインの華やかな酸味とほどよい渋みに、エシャロットの甘みとバターの丸みが調和した親しみやすく深い味わい","z":"名は「ワイン商」の意味。ボルドレーズと違い骨髄を使わない"},{"f":"Robert","r":"ロベール","j":"ロベール","c":"ソース","g":"褐色ソース系","m":"みじん切りの玉ねぎをバターで炒め、白ワインと酢を煮詰めてドゥミ・グラスを加え、仕上げにディジョンマスタードを溶かし込んだ古典ソース。豚肉のグリルやソテーの定番","t":"炒め玉ねぎのまろやかな甘みとドゥミ・グラスのコクを、マスタードの爽やかな酸味と辛味がきりっと引き締める","z":"豚肉料理の定番。名の由来には諸説ある"},{"f":"Charcutière","r":"シャルキュティエール","j":"豚肉屋風","c":"ソース","g":"褐色ソース系","m":"ソース・ロベール（玉ねぎ・白ワイン・ドゥミ・グラス・マスタード）に、千切りにしたコルニション（小きゅうりのピクルス）を加えた「豚肉屋風」ソース。豚肉料理の王道","t":"ロベールの甘酸っぱくコクのある味に、ピクルスの心地よい酸味とシャキッとした歯ざわりが加わり脂をさっぱり切る","z":"「豚肉加工業者風」の意味。豚肉料理に合う"},{"f":"Madère","r":"マデール","j":"マデラ酒ソース","c":"ソース","g":"褐色ソース系","m":"丁寧に煮詰めたドゥミ・グラスソースに、火を止める直前に香り高いマデラ酒を加えて仕上げた古典ソース。牛ヒレやフォアグラ、ハム、タンの料理に合わせる","t":"ドゥミ・グラスの重厚な旨味に、マデラ酒特有のカラメルやドライフルーツを思わせる甘く芳醇な香りが溶け合う","z":"火を止めてから酒を加え、香りを残す"},{"f":"Périgueux","r":"ペリグー","j":"ペリグー","c":"ソース","g":"褐色ソース系","m":"マデラ酒を効かせた濃厚なドゥミ・グラスに、トリュフの煮汁（エッセンス）と細かく刻んだ黒トリュフを贅沢に加えた最高級ソース。牛ヒレやロッシーニ風の定番","t":"肉の凝縮したコクとマデラ酒の余韻の上に、黒トリュフの気高く芳醇な香りがふわりと立ち上る贅沢な味わい","z":"名はトリュフの産地ペリゴール地方の都市にちなむ"},{"f":"Lyonnaise","r":"リヨネーズ","j":"リヨン風","c":"ソース","g":"褐色ソース系","m":"薄切り玉ねぎをバターできつね色になるまで炒め、白ワインとワインビネガーを煮詰めてドゥミ・グラスと合わせた「リヨン風」ソース。牛肉や豚肉、内臓肉によく合う","t":"飴色玉ねぎの香ばしく深い甘みと、ビネガーのきりっとした酸味、褐色ソースのコクが絶妙に釣り合う味わい","z":"「リヨン風」は玉ねぎを使う料理につく名"},{"f":"Diable","r":"ディアブル","j":"悪魔風","c":"ソース","g":"褐色ソース系","m":"エシャロットと白ワイン、酢を強く煮詰め、ドゥミ・グラスにカイエンペッパーや粗挽きこしょうをたっぷり効かせた「悪魔風」ソース。鶏のグリルや焼き肉に添える","t":"エシャロットと酢の鋭い酸味に、唐辛子とこしょうのピリッと刺激的な辛みが弾ける、食欲をそそるキレのある味","z":"名は「悪魔」。辛さをそのまま表した名前"},{"f":"Piquante","r":"ピカント","j":"ピカント","c":"ソース","g":"褐色ソース系","m":"白ワイン・ワインビネガー・エシャロットを煮詰めてエスパニョールソースを加え、刻んだコルニション、ケッパー、ハーブを混ぜ込んだソース。ゆでた牛タンや豚肉に合う","t":"酢とピクルスのシャープな酸味、ハーブの清涼感、褐色ソースの旨味が一体となった、重たい肉を軽やかにする味","z":"「piquant」は「ピリッとした」の意味"},{"f":"Poivrade","r":"ポワヴラード","j":"ポワヴラード","c":"ソース","g":"褐色ソース系","m":"香味野菜（ミルポワ）と酢・ワインのマリナードを煮詰めてエスパニョールソースを合わせ、仕上げに粗挽き黒こしょうを効かせたジビエ用ソースの基本","t":"黒こしょうのスパイシーな芳香と力強い辛味に、マリネ液由来のしっかりした酸味と深いコクが重なる骨格のある味","z":"ジビエ用ソースの基本。グラン・ヴヌールの土台"},{"f":"Grand Veneur","r":"グラン・ヴヌール","j":"狩猟長官風","c":"ソース","g":"褐色ソース系","m":"ジビエ用のポワヴラードソースに、赤すぐり（グロゼイユ）のゼリーと生クリーム（古典では血も）を加えて仕上げた「狩猟長官風」ソース。鹿や猪のローストの王道","t":"黒こしょうの刺激と酸味に、赤い果実の甘酸っぱさとクリームのまろやかなコクが調和した気品あふれる重厚な味","z":"名は「狩猟長官」の意味。大型ジビエに合わせる"},{"f":"Chateaubriand","r":"シャトーブリアン","j":"シャトーブリアン","c":"ソース","g":"褐色ソース系","m":"白ワインとエシャロットを煮詰め、仔牛のジュやドゥミ・グラスを加えて、エストラゴンを練り込んだバターとレモン汁で仕上げたソース。厚切り牛ヒレステーキの定番","t":"肉の濃い旨味と白ワインの爽やかな酸味に、エストラゴンの甘く上品なハーブ香とバターのコクが溶け合う洗練された味","z":"作家シャトーブリアンの料理人が考案したと伝わる"},{"f":"Rouennaise","r":"ルワネーズ","j":"ルーアン風","c":"ソース","g":"褐色ソース系","m":"赤ワインベースのボルドレーズソースに、裏ごしした鴨のレバーを加えて濃度とコクを出した「ルーアン風」ソース。名物の鴨のローストや鴨料理に合わせる","t":"赤ワインの渋みと酸味に、鴨レバーならではのねっとりした濃厚なコクと鉄分の旨味が重なる、奥深く力強い味わい","z":"ルーアンは鴨料理で有名な町"},{"f":"Genevoise","r":"ジュヌヴォワーズ","j":"ジュネーヴ風","c":"ソース","g":"褐色ソース系","m":"赤ワインと香味野菜、魚の頭・骨を煮詰めて魚用エスパニョールやフュメを合わせ、アンチョビバターで仕上げた「ジュネーヴ風」ソース。サーモンやマスなど川魚に合う","t":"赤ワインのふくよかなコクと魚の澄んだ旨味に、アンチョビの塩気とバターのまろやかさが調和した奥行きある味","z":"鮭やマスなど魚用の褐色ソース"},{"f":"Italienne","r":"イタリエンヌ","j":"イタリア風","c":"ソース","g":"褐色ソース系","m":"トマトを加えたドゥミ・グラスに、きのことエシャロットのデュクセル、細かく刻んだハム、パセリやエストラゴンを加えた「イタリア風」ソース。仔牛やパスタ、内臓肉に合う","t":"トマトの軽やかな酸味に、きのことハムの凝縮した旨味、ハーブの香りが重なった具だくさんで親しみやすい味わい","z":"名はイタリア風だが褐色ソース系"},{"f":"Matelote","r":"マトロート","j":"マトロート","c":"ソース","g":"褐色ソース系","m":"うなぎや川魚を赤ワインと香味野菜で煮た煮汁を煮詰め、魚用エスパニョールやバターでつないだ「水夫風」ソース。白ワイン仕立てのバリエーションもある","t":"魚の旨味がたっぷり溶け出した赤ワインの濃厚なコクと、バターの艶やかな口当たりが絡み合う力強い味わい","z":"名は水夫（matelot）風の魚の煮込みに由来。白ワイン版もある"},{"f":"Bigarade","r":"ビガラード","j":"ビガラード","c":"ソース","g":"褐色ソース系","m":"砂糖と酢を焦がしたガストリックに、鴨の焼き汁とフォン・ド・ヴォーを加え、ビターオレンジとレモンの果汁・細切りの皮で仕上げたソース。鴨のオレンジ煮の要","t":"カラメルのほろ苦さと柑橘の爽やかな甘酸っぱさが、鴨の脂の濃いコクを華やかに引き立てる絶妙なバランス","z":"「ビガラード」はビターオレンジのこと。鴨のオレンジ煮の原型"},{"f":"Porto","r":"ポルト","j":"ポートワインソース","c":"ソース","g":"褐色ソース系","m":"煮詰めたドゥミ・グラスや仔牛のジュに、仕上げとして香り豊かなポートワインを加えて軽く温めたソース。鴨のロースト、ジビエ、フォアグラ、ハム料理に合わせる","t":"ポートワイン特有の熟した果実のような甘みと芳醇な香りに、肉の深い旨味が溶け合うまろやかで気品ある味わい","z":"鴨やジビエ、フォアグラに合う"},{"f":"Champignons","r":"シャンピニョン","j":"きのこソース","c":"ソース","g":"褐色ソース系/ヴルーテ系","m":"マッシュルームの煮汁を煮詰め、褐色版はドゥミ・グラス、白版はヴルーテを加えて小ぶりのマッシュルームを具材として加えたソース。肉・鶏・魚と幅広く合わせる","t":"マッシュルームから溶け出した豊かな旨味と森の香りが広がり、ベースソースのコクと調和した穏やかな味わい","z":"褐色と白の二系統がある"},{"f":"Bercy","r":"ベルシー","j":"ベルシー","c":"ソース","g":"褐色ソース系/ヴルーテ系","m":"魚用の白は、エシャロット・白ワイン・魚フュメを煮詰めてヴルーテとバター、パセリで仕上げる。肉用の褐色は白ワインと牛骨髄・エシャロットを使う別系統のソース","t":"白ワインとエシャロットの爽やかな香りとほのかな酸味に、バターのコクが軽やかに溶け込む上品な味わい","z":"同名で系統が違うので配合を混同しないこと"},{"f":"Allemande","r":"アルマンド","j":"ドイツ風","c":"ソース","g":"ヴルーテ系","m":"仔牛のヴルーテにきのこの煮汁を加えて煮詰め、卵黄と生クリーム（リエゾン）、レモン汁、バターで仕上げた白いソース。ヴルーテ系から派生する重要な中間ソース","t":"卵黄とバターによるビロードのようになめらかで豊かなコクがありつつ、レモンの軽い酸味で後味はすっきり上品","z":"名に反してドイツ起源ではないとされる"},{"f":"Poulette","r":"プーレット","j":"プーレット","c":"ソース","g":"ヴルーテ系","m":"ソース・アルマンドにマッシュルームの煮汁を加えて煮詰め、仕上げにレモン汁・バター・刻みパセリをたっぷり加えた白いソース。きのこ、仔牛、羊の足、ムール貝に合う","t":"きのこの芳醇な旨味と卵黄・バターのクリーミーなコクに、レモンとパセリの爽やかな酸味と香りが映える味わい","z":"きのこ料理や羊の足の煮込みなどに合わせる"},{"f":"Aurore","r":"オーロール","j":"曙","c":"ソース","g":"ヴルーテ系","m":"白いヴルーテ（またはベシャメル）に裏ごししたトマトピューレを加えて淡いバラ色に仕上げ、バターで艶を出した「曙（あけぼの）」の名のソース。卵・魚・鶏に合う","t":"白系ソースのやさしくクリーミーなコクに、トマトのほのかな甘みと穏やかな酸味が溶け込んだマイルドな味わい","z":"「曙」の名は淡いピンク色から"},{"f":"Hongroise","r":"オングロワーズ","j":"ハンガリー風","c":"ソース","g":"ヴルーテ系","m":"玉ねぎとたっぷりのパプリカ粉をバターで炒め、白ワインを煮詰めて白いヴルーテと生クリームで仕上げた「ハンガリー風」ソース。鶏肉、仔牛肉、白身魚に合わせる","t":"パプリカの甘く温かみのある香りとほのかなスパイシーさに、クリームとヴルーテのまろやかさが調和した味","z":"名の通りパプリカを使う"},{"f":"Curry","r":"カレー","j":"カレーソース","c":"ソース","g":"ヴルーテ系","m":"玉ねぎやりんごなどの香味野菜をカレー粉と炒め、白いフォンとヴルーテで煮込んだフランス古典のカレーソース。インド風はココナッツミルクと生クリームを加える","t":"スパイスの芳醇な香りと穏やかな辛味に、フォンとクリームのまろやかなコクが溶け合った上品で奥深い味わい","z":"魚や鶏に合わせる"},{"f":"Villeroi","r":"ヴィルロワ","j":"ヴィルロワ","c":"ソース","g":"ヴルーテ系","m":"ソース・アルマンドにトリュフとハムの旨味を加え、冷ますと固まって食材に厚くまとわせられる濃度まで煮詰めたソース。パン粉をつけて揚げる料理（ヴィルロワ風）に使う","t":"トリュフとハムの凝縮した旨味と卵黄・バターの濃厚なコクが詰まった、衣の中でとろりと溶ける贅沢な味わい","z":"冷まして素材にまとわせ、衣をつけて揚げる料理に使う"},{"f":"Suprême","r":"シュプレーム","j":"シュプレーム","c":"ソース","g":"ヴルーテ系","m":"鶏のヴルーテにマッシュルームの煮汁を加えて煮詰め、生クリームと冷たいバターで白く艶やかに仕上げた「極上」の名を持つソース。鶏の胸肉料理の王道","t":"雑味のない鶏の澄んだ旨味と生クリーム・バターの絹のようになめらかなコクが広がる、繊細で気品ある味わい","z":"「シュプレーム」は「極上」の意味。鶏料理の代表的ソース"},{"f":"Albuféra","r":"アルビュフェラ","j":"アルビュフェラ","c":"ソース","g":"ヴルーテ系","m":"ソース・シュプレームに、淡い色のグラス・ド・ヴィアンドと赤ピーマン（ピメント）を練り込んだバターを加えて仕上げた華やかなソース。鶏や仔牛の高級料理に合わせる","t":"シュプレームの上品でクリーミーなコクに、赤ピーマンのほのかな甘みと香り、肉の旨味が重なる洗練された味わい","z":"ナポレオン軍の元帥シュシェ（アルブフェラ公）にちなむ名"},{"f":"Ivoire","r":"イヴォワール","j":"象牙色","c":"ソース","g":"ヴルーテ系","m":"ソース・シュプレームに、ごく少量の淡いグラス・ド・ヴィアンドを加えて美しい象牙色（アイボリー）に仕立てたソース。ゆでた鶏肉や仔牛肉の繊細な料理に合わせる","t":"シュプレームの軽やかでクリーミーな味わいに、肉の凝縮した旨味とほどよいコクがひとさじ加わった奥深い味","z":"名は淡い象牙色から"},{"f":"À la reine","r":"ア・ラ・レーヌ","j":"王妃風","c":"ソース","g":"ヴルーテ系","m":"鶏のヴルーテに生クリームやトリュフの風味を加えた「王妃風」の白いソース。鶏胸肉やきのこのクリーム煮をパイに詰める「ブーシェ・ア・ラ・レーヌ」などで知られる","t":"鶏のだしとクリームが織りなす白く上品なまろやかさで、口当たりが優しく素材の繊細な甘みを引き立てる味わい","z":"「à la reine」は「王妃風」。鶏や白身の肉料理につく名"},{"f":"Chaud-froid","r":"ショーフロワ","j":"ショーフロワ","c":"ソース","g":"ヴルーテ系","m":"ヴルーテにゼラチン質の濃い澄んだアスピック（ゼリー）と生クリームを合わせて煮詰め、冷やすと艶やかに固まって食材を覆う「温・冷」ソース。冷製オードブルの飾り付けに使う","t":"冷たく引き締まった口当たりで、クリームとだしのなめらかで上品な旨味がひんやりと舌の上でほどける味わい","z":"「温・冷」の意味。温かく作って冷やし固めて使う"},{"f":"Vin blanc","r":"ヴァン・ブラン","j":"白ワインソース","c":"ソース","g":"ヴルーテ系","m":"魚のヴルーテに白ワインと魚のフュメを煮詰めて加え、卵黄と生クリーム、バターで艶やかに仕上げたソース。舌平目やヒラメなど、あらゆる魚用白系ソースの土台になる","t":"白ワインの爽やかな酸味と魚の澄んだ旨味に、卵黄とバターのまろやかなコクが溶け合ったエレガントな味わい","z":"ノルマンドなど魚系ソースの土台"},{"f":"Normande","r":"ノルマンド","j":"ノルマンディ風","c":"ソース","g":"ヴルーテ系","m":"魚のヴルーテに、マッシュルームと牡蠣・ムール貝の煮汁、舌平目のフュメを加えて煮詰め、卵黄・生クリーム・バターで仕上げた「ノルマンディ風」の豪華な魚ソース","t":"貝類と魚の豊かな海の旨味ときのこの芳香、ノルマンディらしい濃厚なクリームとバターのコクが重なる極上の味","z":"ノルマンディの魚介とクリームにちなむ"},{"f":"Diplomate","r":"ディプロマット","j":"外交官風","c":"ソース","g":"ヴルーテ系","m":"ソース・ノルマンドに鮮やかな赤色のオマールバターを加え、角切りにしたオマールの身と黒トリュフを散らした「外交官風」の最高級魚介ソース。白身魚や舌平目に合わせる","t":"オマール海老の濃厚で甘い甲殻類の風味とトリュフの芳香が、クリーミーな魚ソースと溶け合う華やかで贅沢な味","z":"名にふさわしい豪華なソース"},{"f":"Joinville","r":"ジョワンヴィル","j":"ジョワンヴィル","c":"ソース","g":"ヴルーテ系","m":"ソース・ノルマンドに、ザリガニ（エクルヴィス）と小エビの殻から作った甲殻類バターを溶かし込み、好みでトリュフを添えた古典の高級魚ソース","t":"エビやザリガニの香ばしく華やかな香りと甘みに、海の旨味とクリームのまろやかさが調和した上品な味わい","z":"用途によりトリュフを加える"},{"f":"Marinière","r":"マリニエール","j":"水夫風","c":"ソース","g":"ヴルーテ系","m":"白ワインとエシャロットのソース・ベルシーに、ムール貝の蒸し汁を煮詰めて加え、卵黄とバターでつないだ「水夫風」ソース。ムール貝や白身魚のポシェに合わせる","t":"ムール貝の磯の香りと凝縮した貝のだし、白ワインの軽やかな酸味にバターのコクが寄り添う風味豊かな味わい","z":"ムール貝の料理で知られる"},{"f":"Vénitienne","r":"ヴェニティエンヌ","j":"ヴェネツィア風","c":"ソース","g":"ヴルーテ系","m":"エストラゴンビネガーとエシャロットを煮詰めてソース・ヴァン・ブランに加え、セルフィーユとエストラゴンの緑のハーブバターで仕上げた「ヴェネツィア風」魚ソース","t":"エストラゴンとビネガーのきりっと爽やかな酸味と青いハーブの香りが、バターのコクを軽やかに引き立てる味わい","z":"名はヴェネツィア風だが特徴は緑のハーブ"},{"f":"Cardinal","r":"カルディナル","j":"枢機卿風","c":"ソース","g":"ヴルーテ系/ベシャメル系","m":"ベシャメル（または魚ヴルーテ）に魚のフュメ、トリュフのエッセンス、生クリームを加え、赤いオマールバターとカイエンペッパーで仕上げた「枢機卿風」ソース。魚介料理の華","t":"甲殻類の濃厚で甘い香りとクリームのまろやかなコクに、カイエンヌのほのかな辛みが後味を引き締めるリッチな味","z":"赤い色が枢機卿の衣を連想させる。二つの系統に登場する"},{"f":"Crème","r":"クレーム","j":"クリームソース","c":"ソース","g":"ベシャメル系","m":"ベシャメルソースに生クリームを加えてじっくり煮詰め、仕上げに生クリームと数滴のレモン汁で濃度とキレを整えた白いソース。卵、白身魚、温野菜に幅広く合う","t":"生クリームの豊かでまろやかなコクとミルクの甘みがありながら、わずかなレモンの酸味で重くなりすぎない上品な味","z":"卵・魚・野菜料理に合う"},{"f":"Nantua","r":"ナンテュア","j":"ナンテュア","c":"ソース","g":"ベシャメル系","m":"ベシャメルソースと生クリームを煮詰め、ザリガニの殻で作ったエクルヴィスバターとザリガニの尾の身を加えたソース。リヨン名物「クネル・ド・ブロシェ」の定番","t":"ザリガニの香ばしく繊細な甲殻類の香りと甘みが、なめらかなクリームソースに溶け込んだ贅沢でまろやかな味わい","z":"名はザリガニ料理で知られる町ナンテュアから"},{"f":"Moutarde","r":"ムータルド","j":"マスタードソース","c":"ソース","g":"ベシャメル系","m":"ベシャメルやヴルーテ、またはブール・ブランなどの温かい白系ソースに、仕上げとしてディジョンマスタードを溶かし込んだソース。ウサギ、豚肉、サバやニシンによく合う","t":"クリーミーでまろやかなソースに、マスタードの爽やかな酸味と鼻に抜けるピリッとした辛味が心地よいアクセント","z":"マスタードを入れたら沸かしすぎない"},{"f":"Cheddar","r":"チェダー","j":"チェダーソース","c":"ソース","g":"ベシャメル系","m":"ベシャメルソースに熟成したチェダーチーズをたっぷり溶かし込み、好みで少量のマスタードやカイエンヌを加えたチーズソース。温野菜やグラタン、魚料理に合わせる","t":"チェダーチーズ特有の力強いコクとほどよい塩気、ほのかな酸味がベシャメルと溶け合った濃厚で食べ応えのある味","z":"イギリス由来のチーズを使うモルネーの仲間"},{"f":"Raifort","r":"レフォール","j":"西洋わさびソース","c":"ソース","g":"ベシャメル系","m":"すりおろした西洋わさび（レフォール）にマスタード、酢、生クリーム（温製はブイヨンやベシャメル）を合わせたソース。ゆで牛肉（ポトフ）やスモークサーモンに添える","t":"西洋わさびのツンと鼻に抜ける清涼感のある辛味を、クリームのまろやかさが包み込む爽快でキレのある味わい","z":"温製と冷製で処方が大きく異なる"},{"f":"Thermidor","r":"テルミドール","j":"テルミドール","c":"ソース","g":"ベシャメル系","m":"白ワインとエシャロット、魚フュメを煮詰めてベシャメルとマスタード、チーズを合わせたソース。オマール海老の身を殻に戻して焼く「オマール・テルミドール」で名高い","t":"白ワインの香り、マスタードのほのかな酸味、クリームと焼きチーズの香ばしいコクが一体となった豪華で濃厚な味","z":"「オマール・テルミドール」は1890年代のパリで生まれたと伝わる"},{"f":"Portugaise","r":"ポルテュゲーズ","j":"ポルトガル風","c":"ソース","g":"トマト系","m":"みじん切りの玉ねぎ・にんにく・完熟トマトをオリーブ油で炒め、トマトソースとグラス・ド・ヴィアンド、刻みパセリで仕上げた「ポルトガル風」ソース。魚・肉・卵に合う","t":"完熟トマトの瑞々しい甘酸っぱさに、にんにくの香ばしさと肉の旨味が加わった、明るく食欲をそそる味わい","z":"名はポルトガル風だがフランス古典の呼称"},{"f":"Créole","r":"クレオール","j":"クレオール風","c":"ソース","g":"トマト系","m":"ピーマン、玉ねぎ、セロリ、完熟トマトをスパイスや唐辛子、白ワインとともに煮込んだ「クレオール風」ソース。鶏肉や魚介、米料理に合わせる","t":"炒めた香味野菜の甘みとトマトの酸味に、スパイスの温かみのある香りとほどよい辛みが効いたエキゾチックな味","z":"処方が文献により大きく異なる"},{"f":"Provençale","r":"プロヴァンサル","j":"プロヴァンス風","c":"ソース","g":"トマト系","m":"完熟トマトをオリーブ油、たっぷりのにんにく、エシャロット、パセリやタイムとともに水分が飛ぶまでゆっくり煮込んだ「プロヴァンス風」ソース。魚・肉・パスタに万能","t":"トマトの凝縮した甘みと穏やかな酸味に、オリーブ油の青い香りとにんにく・ハーブの風味が広がる南仏らしい味","z":"古典では「トマトのフォンデュ」に近い"},{"f":"Maltaise","r":"マルテーズ","j":"マルタ風","c":"ソース","g":"温製乳化系","m":"オランデーズソースに、香り高いブラッドオレンジの搾り汁と細く刻んだ果皮を加えた「マルタ風」ソース。ゆでたホワイトアスパラガスや白身魚に添える春の定番","t":"バターと卵黄の濃厚なコクに、ブラッドオレンジの華やかな香りと爽やかな甘酸っぱさが重なる軽やかで洗練された味","z":"アスパラガスによく合う"},{"f":"Mousseline","r":"ムースリーヌ","j":"ムースリーヌ","c":"ソース","g":"温製乳化系","m":"オランデーズソースに、提供直前に固く泡立てた生クリームをふんわり混ぜ合わせた「モスリン織りのような」温かいソース。アスパラガスや白身魚のポシェに合わせる","t":"空気を含んだムースのようにふんわり軽く、口の中でとろけるまろやかなバターとクリームのコクにレモンの酸味が映える","z":"温製の「シャンティ」とも呼ばれる"},{"f":"Choron","r":"ショロン","j":"ショロン","c":"ソース","g":"温製乳化系","m":"エストラゴンなどのハーブを省いたベアルネーズソースに、煮詰めた濃縮トマト（またはトマトピューレ）を加えて淡い赤色に仕立てたソース。ステーキや魚、卵料理に合う","t":"ベアルネーズの濃厚なバターと卵黄のコクに、トマトのやさしい酸味と甘みが加わったまろやかで華やかな味わい","z":"19世紀の料理人ショロンが考案したと伝わる"},{"f":"Foyot","r":"フォワイヨ","j":"フォワイヨ/ヴァロワ","c":"ソース","g":"温製乳化系","m":"ベアルネーズソースに、溶かしたグラス・ド・ヴィアンド（肉の凝縮だし）を加えてコクを深めたソース。ヴァロワとも呼ばれ、牛ステーキや仔牛のグリルに合わせる","t":"ベアルネーズのハーブ香とバターの濃厚さに、肉の凝縮した旨味と深いコクが重なった力強く贅沢な味わい","z":"パリの老舗レストラン「フォワイヨ」にちなむとされる"},{"f":"Paloise","r":"パロワーズ","j":"パロワーズ","c":"ソース","g":"温製乳化系","m":"ベアルネーズソースのエストラゴンをフレッシュなミントに替え、白ワインビネガーとエシャロットで仕立てた「ポー風」ソース。仔羊のローストやグリルの定番","t":"濃厚なバターと卵黄のコクを、ミントのすっと抜ける清涼感のある香りと酸味が軽やかに引き締める爽やかな味わい","z":"名はピレネー地方の都市ポーにちなむ"},{"f":"Tartare","r":"タルタル","j":"タルタルソース","c":"ソース","g":"冷製乳化系","m":"古典処方では固ゆで卵黄を油と酢で乳化し、青ねぎやシブレットのピューレを加えた冷製ソース。現在はマヨネーズに刻みピクルス・ケッパー・ゆで卵を混ぜる型が広く親しまれる","t":"卵のまろやかなコクに、ねぎやハーブ・ピクルスの爽やかな酸味とシャキッとした食感が効いた、揚げ物や魚に合う味","z":"現在の「マヨネーズ＋ピクルス＋卵」とは別系統の古典処方"},{"f":"Ravigote","r":"ラヴィゴット","j":"ラヴィゴット","c":"ソース","g":"冷製乳化系","m":"油とワインビネガーのベースに、みじん切りのケッパー、玉ねぎ、パセリ、セルフィーユ、エストラゴン、シブレットをたっぷり加えた「元気が出る」冷製ソース。肉や魚の冷菜に合う","t":"きりっとしたビネガーの酸味とケッパーの塩気、数種のフレッシュハーブの青い香りが弾ける極めて爽やかな味わい","z":"「ravigoter」は「元気づける」の意味"},{"f":"Andalouse","r":"アンダルーズ","j":"アンダルシア風","c":"ソース","g":"冷製乳化系","m":"固めに仕上げたマヨネーズに、煮詰めた濃いトマトピューレと細かく刻んだ甘い赤ピーマンを加えた「アンダルシア風」冷製ソース。冷製魚介やゆで卵、サラダに合わせる","t":"マヨネーズのまろやかなコクに、トマトの穏やかな酸味と赤ピーマンのやさしい甘みが溶け合った親しみやすい味わい","z":"名はスペイン南部アンダルシア地方から"},{"f":"Mousquetaire","r":"ムスクテール","j":"銃士風","c":"ソース","g":"冷製乳化系","m":"マヨネーズに、白ワインで煮詰めたエシャロット、冷めたグラス・ド・ヴィアンド、刻みシブレット、カイエンペッパーを加えた「銃士風」冷製ソース。冷製肉料理の定番","t":"マヨネーズのコクに肉の旨味とエシャロットの風味、シブレットの香りとカイエンヌのピリッとした辛みが効いた大人の味","z":"名は「銃士」の意味"},{"f":"Verte","r":"ヴェルト","j":"緑のソース","c":"ソース","g":"冷製乳化系","m":"固めに仕上げたマヨネーズに、さっとゆでて絞ったほうれん草・クレソン・パセリ・エストラゴンなどの濃い緑の絞り汁を混ぜた冷製ソース。冷製サーモンや白身魚に映える","t":"まろやかなマヨネーズの中に、青菜とハーブのみずみずしく清涼な青い香りが広がる、見た目も味も爽やかなソース","z":"鮮やかな緑色が特徴"},{"f":"Vincent","r":"ヴァンサン","j":"ヴァンサン","c":"ソース","g":"冷製乳化系","m":"ゆでたハーブ・クレソン・ほうれん草と固ゆで卵黄を裏ごしし、生卵黄・油・酢で乳化させた緑色の冷製ソース（簡略型はマヨネーズにハーブピューレを混ぜる）。冷製魚料理に合う","t":"フレッシュなハーブと青菜の豊かな香りに、卵黄のコクとすっきりした酸味が調和した軽やかで上品な味わい","z":"簡略型ではハーブピューレをマヨネーズに混ぜる"},{"f":"Beurre nantais","r":"ブール・ナンテ","j":"ナント風バターソース","c":"ソース","g":"バター乳化系","m":"白ワインとエシャロットの煮詰めに冷たいバターを乳化させるブール・ブランの、発祥地ナント地方での呼称。ロワール川の川魚（パイクやパイクパーチ）に合わせる古典ソース","t":"良質なバターの豊かなコクとなめらかな口溶けに、白ワイン（ミュスカデ等）のきりっとした酸味が映える洗練された味","z":"ブール・ブランはロワール川下流域で生まれたとされる"},{"f":"Beurre rouge","r":"ブール・ルージュ","j":"赤ワインバターソース","c":"ソース","g":"バター乳化系","m":"ブール・ブランの白ワインを赤ワインに替え、エシャロットと煮詰めて冷たいバターを乳化させたソース。魚用には魚のフュメを加える。赤身魚や肉料理のどちらにも合う","t":"赤ワインの華やかな渋みと酸味を、たっぷりのバターがまろやかに包み込んだ、艶やかでコクのある上品な味わい","z":"白ワインを赤ワインに替えたブール・ブラン"},{"f":"Beurre blanc aux herbes","r":"ブール・ブラン・オ・ゼルブ","j":"ハーブ入りブール・ブラン","c":"ソース","g":"バター乳化系","m":"基本のブール・ブランに、仕上げとして刻んだセルフィーユ・エストラゴン・シブレット・ディルなどのフレッシュハーブをたっぷり加えたソース。白身魚やホタテに最適","t":"バターのコクと白ワインの酸味に、摘みたてのハーブの爽やかで繊細な香りが立ち上る軽やかで華やかな味わい","z":"魚料理に合わせる"},{"f":"Sauce noisette","r":"ソース・ノワゼット","j":"ノワゼット","c":"ソース","g":"温製乳化系","m":"オランデーズソースに、通常の澄ましバターの代わりに香ばしく焦がしたバター（ブール・ノワゼット）を加えて乳化させた温かいソース。白身魚や温野菜に合わせる","t":"オランデーズの濃厚でクリーミーな口当たりに、焦がしバター特有のヘーゼルナッツを思わせる香ばしい風味が広がる","z":"「noisette」はヘーゼルナッツのこと。実際にナッツは使わず、焦がしバターの香りを指す"},{"f":"Sauce Chantilly","r":"ソース・シャンティ","j":"シャンティ","c":"ソース","g":"冷製乳化系","m":"レモン汁で作った固めのマヨネーズに、提供直前に固く泡立てた無糖の生クリームをさっくり合わせた冷製ソース。アスパラガスや冷製魚介、アーティチョークに添える","t":"生クリームのふんわり軽やかな口溶けとまろやかさに、レモンの爽やかな酸味が効いた上品で優しい味わい","z":"温製ではムースリーヌをシャンティと呼ぶ。甘いクレーム・シャンティとは別物"},{"f":"À point","r":"ア・ポワン","j":"ミディアム","c":"コース・その他","m":"肉の中心がほんのりロゼ（ピンク色）に仕上がり、肉汁をたっぷり保った「ちょうどよい」焼き加減（芯温55〜60℃目安）。フランスでは日本のミディアムレア寄り","t":"表面の香ばしさと中のしっとりした柔らかさ、凝縮した肉の旨味が最もバランスよく調和した王道の味わい","z":"芯温55〜60℃前後が目安。フランスでは日本のミディアムレア寄りに感じられることもある","g":"火入れ・食感"},{"f":"Bien cuit","r":"ビヤン・キュイ","j":"ウェルダン","c":"コース・その他","m":"中心部までピンク色を残さず完全に火を通したウェルダンの焼き加減（芯温65℃以上目安）。牛肉では好みが分かれるが、豚肉・鶏肉・仔牛肉では基本となる","t":"肉汁は控えめながらしっかりとした噛みごたえと香ばしさがあり、ソースと絡めてじっくり味わうのに向く","z":"芯温65℃以上が目安。仔牛・豚・鶏などはこの火入れが基本","g":"火入れ・食感"},{"f":"Rosé","r":"ロゼ","j":"ロゼ（桃色の火入れ）","c":"コース・その他","m":"鴨胸肉、仔羊、鳩、仔牛などを、中心部が美しい淡い桃色（ロゼ色）になるよう余熱を活かして仕上げる火入れ。肉汁が流れ出ないよう休ませてから切る","t":"驚くほどしっとり柔らかくきめ細かい食感に、鴨や仔羊ならではのジューシーな甘みと鉄分の旨味が最も引き立つ","z":"綴りはロゼワインと同じ。焼いた後に休ませて余熱で仕上げるのが定番","g":"火入れ・食感"},{"f":"Mi-cuit","r":"ミ・キュイ","j":"半生の火入れ","c":"コース・その他","m":"外側だけに穏やかに火を通し、中心部は半生（ミ・キュイ）のなめらかな状態に残す繊細な火入れ。サーモンやマグロ、フォアグラのテリーヌなどで定番","t":"生とも完全加熱とも違う、舌の上でねっとりとろけるような極上の滑らかさと、凝縮した素材の甘みが楽しめる","z":"フォアグラやサーモンのミ・キュイが代表的","g":"火入れ・食感"},{"f":"Entrée","r":"アントレ","j":"前菜","c":"コース・その他","m":"コース料理でアミューズの後、主菜の前に提供される前菜。冷前菜（アントレ・フロワド）と温前菜（アントレ・ショード）に分かれる","z":"フランスでは前菜を指す。アメリカ英語のentréeは主菜なので注意","g":"コース・構成"},{"f":"Plat du jour","r":"プラ・デュ・ジュール","j":"本日の料理","c":"サービス・接客","m":"定番メニューとは別に、その日の仕入れや季節に合わせて日替わりで提供される「本日の料理」。ビストロでは店内の黒板（アルドワーズ）に書かれることが多い","z":"ビストロでは黒板に書かれることが多い","g":"メニュー・注文"},{"f":"À la carte","r":"ア・ラ・カルト","j":"アラカルト","c":"サービス・接客","m":"決まったコース（ムニュ）ではなく、メニュー表（カルト）の中から前菜・主菜・デザートを自分の好みで一品ずつ自由に選んで注文する方式","z":"セットで出すコース料理は「menu（ムニュ）」と呼ぶ","g":"メニュー・注文"},{"f":"Menu dégustation","r":"ムニュ・デギュスタシオン","j":"おまかせコース","c":"サービス・接客","m":"シェフが季節の厳選食材で組み立てた、少しずつ多皿（5〜10皿以上）を順に味わう「おまかせテイスティングコース」。ワインペアリングと楽しむことが多い","z":"シェフが考えた流れで食べ進める。ワインのペアリングを付けることも多い","g":"メニュー・注文"},{"f":"Beurre noisette","r":"ブール・ノワゼット","j":"焦がしバター","c":"ソース","m":"無塩バターを火にかけて水分を飛ばし、乳固形分がヘーゼルナッツ（ノワゼット）色のきつね色に色づくまで焦がしたバター。魚のムニエルやフィナンシェの風味の要","t":"焼き上げたナッツを思わせる芳醇で香ばしい香りと、バターの凝縮した深いコクが口いっぱいに広がる","z":"noisetteはヘーゼルナッツの意味。魚のムニエルやフィナンシェに使う","g":"合わせバター・薬味"},{"f":"Beurre noir","r":"ブール・ノワール","j":"黒バター","c":"ソース","m":"バターをブール・ノワゼットよりさらに濃い茶色まで焦がし、熱いうちにワインビネガーとケッパー、パセリを加えて仕上げたソース。エイ（レ）や仔牛の脳の古典ソース","t":"焦がしバターの力強い香ばしさとほろ苦さに、酢とケッパーの鋭い酸味がキリッと重なる、淡白な素材を引き立てる味","z":"エイのブール・ノワール（raie au beurre noir）が古典。実際は黒焦げではなく濃い茶色","g":"合わせバター・薬味"},{"f":"Beurre maître d’hôtel","r":"ブール・メートル・ドテル","j":"パセリレモンバター","c":"ソース","m":"室温で柔らかくしたバターに、みじん切りのパセリ、レモン汁、塩・こしょうを練り込んで棒状に冷やし固めた合わせバター。焼きたてのステーキやグリル魚にのせて溶かす","t":"熱でとろけ出すバターの豊かなコクに、フレッシュなパセリの青い香りとレモンの爽やかな酸味が弾ける王道の味","z":"焼いた肉や魚にのせ、余熱で溶かして使う","g":"合わせバター・薬味"},{"f":"Beurre manié","r":"ブール・マニエ","j":"練りバター","c":"ソース","m":"同量の柔らかいバターと小麦粉を炒めずに生のまま均一に練り合わせた、即席のとろみ付け用ペースト。煮込みやソースの仕上げに少しずつ溶かし込んで濃度を調整する","t":"主張する味はなく、ソースに自然なとろみとバターのまろやかな艶だけをそっと加える黒子のような存在","z":"ルーと違って炒めない。煮汁や仕上げのソースに少しずつ溶かす","g":"だし・ベース"},{"f":"Sauce au poivre","r":"ソース・オ・ポワヴル","j":"胡椒ソース","c":"ソース","m":"粗く砕いた黒こしょう（または緑こしょう）を肉を焼いた鍋で炒め、コニャックでフランベしてフォン・ド・ヴォーと生クリームで煮詰めたソース。ステーキの定番","t":"挽きたてこしょうの鮮烈な香りとピリッとした辛みを、コニャックの芳香と生クリームのまろやかなコクが包み込む","z":"ステーク・オ・ポワヴルの定番。緑こしょうを使う型もある","g":"褐色ソース系"},{"f":"Sauce vierge","r":"ソース・ヴィエルジュ","j":"ヴィエルジュ","c":"ソース","m":"良質なオリーブ油とレモン汁に、角切りトマト（コンカッセ）、コリアンダーやバジルなどのハーブ、エシャロットを合わせた非加熱（またはごく軽く温める）ソース。魚料理の定番","t":"火を通さないトマトとレモンの瑞々しくフレッシュな酸味、オリーブ油とハーブの青い香りが広がる極めて軽やかな味","z":"vierge（バージン）の名の通り、軽く温める程度。魚料理に添えることが多い","g":"冷製乳化系"},{"f":"Glace de viande","r":"グラス・ド・ヴィアンド","j":"肉のグラス","c":"ソース","m":"フォン・ド・ヴォーなどのだしをアクを取りながらごく弱火で10分の1ほどまで煮詰め、シロップ状にした究極の凝縮エッセンス。ソースのコク出しや照り付けに少量使う","t":"一滴で料理の格が変わるほど濃密な肉の旨味と、豊富なゼラチン質によるねっとりとした深いコクと艶がある","z":"ソースの仕上げや照りづけに少量使う。冷えるとゼリー状に固まる","g":"だし・ベース"},{"f":"Sabayon","r":"サバイヨン","j":"サバイヨン","c":"ソース","m":"卵黄に白ワインやシャンパーニュ、だし（菓子用は砂糖と洋酒）を加え、湯せんにかけながら泡立て器で空気を含ませてとろりと仕上げた泡状ソース。魚介や果物のグラタンに使う","t":"空気を含んだふんわり軽やかな口溶けに、卵黄のやさしいコクとワインの芳醇な香りが広がる繊細な味わい","z":"甘い菓子にも塩味の魚料理にも使う。イタリアのザバイオーネにあたる","g":"温製乳化系"},{"f":"Bœuf bourguignon","r":"ブフ・ブルギニョン","j":"牛肉のブルゴーニュ風赤ワイン煮","c":"料理","m":"牛肉の角切りをブルゴーニュ産赤ワインでマリネし、ベーコン、小玉ねぎ、マッシュルームとともに時間をかけて柔らかく煮込んだブルゴーニュを代表する古典料理","t":"赤ワインの豊かな酸味と渋みが煮詰まって深いコクに変わり、ほろほろにとろける牛肉の旨味とベーコンの燻製香が溶け合う","z":"ブルゴーニュの郷土料理。翌日の方が味がなじむと言われる","g":"肉・ジビエ料理"},{"f":"Soupe à l’oignon","r":"スープ・ア・ロニョン","j":"オニオングラタンスープ","c":"料理","m":"薄切り玉ねぎを飴色になるまでじっくり炒めてブイヨンで煮込み、器に注いでバゲットとグリュイエールチーズをのせてオーブンでこんがり焼いたパリの名物スープ","t":"飴色玉ねぎの濃厚で香ばしい甘みとブイヨンの旨味に、スープを吸ったパンととろける焼きチーズの塩気とコクが絡み合う","z":"パリの中央市場（レ・アル）の夜食として知られる","g":"スープ・ポタージュ"},{"f":"Confit de canard","r":"コンフィ・ド・カナール","j":"鴨のコンフィ","c":"料理","m":"塩とハーブでマリネした鴨のもも肉を、たっぷりの鴨脂の中で低温のまま数時間じっくり煮て保存し、提供前に皮目をパリッと焼き上げた南西地方の名物料理","t":"パリパリに香ばしく焼けた皮と、フォークでほろりと崩れるほどしっとり柔らかい身の濃厚な旨味が絶妙なコントラストを生む","z":"南西地方の名物。脂に漬ければ長く保存できる","g":"肉・ジビエ料理"},{"f":"Moules marinières","r":"ムール・マリニエール","j":"ムール貝の白ワイン蒸し","c":"料理","m":"砂抜きしたムール貝を、刻みエシャロット・白ワイン・バター・パセリとともに強火で一気に蒸し上げた北仏・ベルギーの名物料理。フライドポテトを添えるのが定番","t":"ぷりっとふっくら蒸し上がったムール貝の甘みと、貝の潮のだし・白ワイン・バターが溶け合った香り高いスープが絶品","z":"フライドポテトを添えた「ムール・フリット」はベルギーや北仏で人気","g":"魚介料理"},{"f":"Hachis parmentier","r":"アッシ・パルマンティエ","j":"牛ひき肉のマッシュポテト焼き","c":"料理","m":"玉ねぎや香味野菜と炒め煮にした牛ひき肉（または残ったポトフの牛肉）を耐熱皿に敷き、なめらかなマッシュポテトを重ねてオーブンで焼き色をつけたフランスの定番家庭料理","t":"旨味の詰まったひき肉と、バター香るなめらかで甘いマッシュポテト、こんがり焼けた表面の香ばしさが一体となるやさしい味","z":"じゃがいもの普及に尽力した農学者パルマンティエにちなむ","g":"肉・ジビエ料理"},{"f":"Tartiflette","r":"タルティフレット","j":"タルティフレット","c":"料理","m":"ゆでたじゃがいも、ベーコン（ラルドン）、炒め玉ねぎに白ワインを振り、サヴォワ産のウォッシュチーズ「ルブロッション」を豪快にのせてオーブンで焼いた冬の郷土料理","t":"とろりと溶けたルブロッションの芳醇な香りと濃厚なコク、ベーコンの塩気とホクホクのじゃがいもが絡み合う贅沢で温まる味","z":"サヴォワ地方の冬の料理。1980年代にルブロッションの販促とともに広まったとされる","g":"野菜・チーズ・軽食"},{"f":"Canard à l’orange","r":"カナール・ア・ロランジュ","j":"鴨のオレンジソース","c":"料理","m":"皮目を香ばしくローストした鴨肉に、カラメルと酢のガストリック・オレンジ果汁・鴨のジュで作るビガラードソースとオレンジの果肉を添えたフランス古典の代表作","t":"鉄分を感じる鴨の濃厚な旨味と脂のコクを、オレンジの華やかな香りと甘酸っぱさ、ほろ苦いカラメルが鮮やかに引き立てる","z":"ソースは「ビガラード」の項を参照","g":"肉・ジビエ料理"},{"f":"Croque-monsieur","r":"クロック・ムッシュ","j":"クロック・ムッシュ","c":"料理","m":"食パンにハムとグリュイエールチーズを挟み、表面にもベシャメルソースとチーズをのせて香ばしく焼き上げたパリのカフェ定番の温かいサンドイッチ","t":"カリッと焼けたパンととろけるチーズの香ばしさ、ハムの塩気、ベシャメルのクリーミーなコクが重なる満足感たっぷりの味","z":"目玉焼きをのせるとクロック・マダム。カフェの定番","g":"野菜・チーズ・軽食"},{"f":"Tarte Tatin","r":"タルト・タタン","j":"タルト・タタン","c":"デザート","m":"たっぷりのバターと砂糖で飴色にキャラメリゼしたりんごを型にぎっしり詰め、パイ生地をかぶせて焼き、ひっくり返して提供するソローニュ地方発祥の逆さタルト","t":"とろりと濃密に煮詰まったりんごの甘酸っぱさとほろ苦いカラメルのコク、サクサクのパイ生地が調和し、生クリームを添えると格別","z":"ソローニュ地方のタタン姉妹のホテルで偶然生まれたという逸話がある","g":"ケーキ・タルト"},{"f":"Mousse au chocolat","r":"ムース・オ・ショコラ","j":"チョコレートのムース","c":"デザート","m":"溶かしたビターチョコレートに卵黄とバターを混ぜ、固く泡立てた卵白（メレンゲ）や生クリームをさっくり合わせて冷やし固めた、ビストロ定番の冷製デザート","t":"空気を含んだふんわり軽やかな口溶けながら、カカオの濃厚なほろ苦さと芳醇な香りが舌の上でじっくり広がる贅沢な味わい","z":"家庭でもビストロでも定番のデザート","g":"冷菓・皿盛りデザート"},{"f":"Crème caramel","r":"クレーム・カラメル","j":"カスタードプリン","c":"デザート","m":"型の底にほろ苦いカラメルを敷き、全卵・牛乳・砂糖・バニラの液を流して湯せん焼きにし、冷やしてから型を外して皿に盛るフランス伝統のカスタードプリン","t":"つるんとなめらかな口当たりに、卵とミルクの素朴でやさしい甘みと、さらりと絡むほろ苦いカラメルソースが調和する王道の味","z":"「フラン」はフランスではタルト状の菓子を指すこともある","g":"冷菓・皿盛りデザート"},{"f":"Profiterole","r":"プロフィトロール","j":"プロフィトロール","c":"デザート","m":"小ぶりに焼いたシュー生地の中にバニラアイスクリーム（またはカスタード）を詰め、食べる直前に熱々の濃厚チョコレートソースをたっぷりかけて楽しむビストロの定番デザート","t":"冷たく甘いバニラアイスと熱々でほろ苦いチョコレートソースの温度のコントラストに、香ばしいシューの軽快な食感が重なる","z":"ビストロの定番デザート","g":"冷菓・皿盛りデザート"},{"f":"Saint-Honoré","r":"サン・トノレ","j":"サントノレ","c":"デザート","m":"パイ生地とシュー生地の土台の縁に、カラメルを絡めたプチシューを王冠のように並べ、中央にクレーム・シブーストやシャンティイを美しく絞ったパリの伝統的祝宴菓子","t":"パリッと香ばしくほろ苦いキャラメル、サクサクのパイ、ふんわり軽いクリームとシューの多彩な食感が一度に楽しめる華やかな味","z":"パン職人・菓子職人の守護聖人サン・トノレにちなむ","g":"ケーキ・タルト"},{"f":"Opéra","r":"オペラ","j":"オペラ","c":"デザート","m":"アーモンド生地（ビスキュイ・ジョコンド）に濃いコーヒーシロップをたっぷり打ち、コーヒーのバタークリームとガナッシュを薄く何層にも重ねて艶やかなチョコで覆った菓子","t":"口の中で全層が一体になってとろけ、深煎りコーヒーの芳醇な苦みと濃厚なチョコレート、バタークリームのコクが響き合う大人の味","z":"パリのオペラ座にちなむ名とされる。考案者には諸説ある","g":"ケーキ・タルト"},{"f":"Crêpe Suzette","r":"クレープ・シュゼット","j":"クレープ・シュゼット","c":"デザート","m":"薄く焼いたクレープを、オレンジ果汁・皮・砂糖・バターのソースで煮含め、仕上げにグランマルニエなどのオレンジリキュールを注いで炎を上げる（フランベ）華やかなデザート","t":"もちもちのクレープに染み込んだバターの濃厚なコクと、オレンジの甘酸っぱい爽やかさ、フランベしたリキュールの気高い香りが広がる","z":"モンテカルロで偶然生まれたという逸話がある。客席でのフランベが見せ場","g":"冷菓・皿盛りデザート"},{"f":"Galette des rois","r":"ガレット・デ・ロワ","j":"王様のガレット","c":"デザート","m":"アーモンドクリーム（またはカスタードを混ぜたフランジパーヌ）を折り込みパイ生地で包み、表面に美しい模様を刻んで焼き上げる、1月6日の公現祭に欠かせない伝統菓子","t":"バターが豊かに香るサクサクのパイ生地と、中から現れるしっとり濃厚で香ばしいアーモンドクリームの甘みが調和する祝祭の味","z":"中に小さなフェーヴ（陶製の人形）が入っていて、当たった人がその日の王様","g":"ケーキ・タルト"},{"f":"Cuisson","r":"キュイソン","j":"火入れ・焼き加減","c":"コース・その他","m":"加熱の度合い。肉はbleu・saignant・à point・bien cuit、魚はnacréなどで表す","z":"注文時に「Quelle cuisson ?（焼き加減は？）」と聞かれる","g":"火入れ・食感"},{"f":"Nacré","r":"ナクレ","j":"真珠色の火入れ","c":"コース・その他","m":"真珠母のように半透明の美しい光沢を残し、中心部がしっとりほぐれるギリギリの温度で仕上げる魚料理の理想的な火入れ（芯温48〜52℃前後）","t":"パサつきが一切なく、口の中でしっとりとろけるように身がほぐれ、白身魚やサーモン本来の繊細な甘みが際立つ","z":"nacréは「真珠母のような」の意味。サーモンやオヒョウなどによく使う","g":"火入れ・食感"},{"f":"Apéritif","r":"アペリティフ","j":"食前酒","c":"ワイン・酒類","m":"食事の前に食欲を刺激し、会話を楽しむために飲む食前酒。シャンパーニュ、キール、パスティス、シェリー、ベルモットなど軽快で爽やかな酒が選ばれる","z":"友人同士で軽く飲む習慣は「アペロ」と呼ばれる","t":"すっきりした酸味やほろ苦さ、繊細な泡立ちが口中をリフレッシュさせ、これから始まる食事への期待を高める","g":"酒類・リキュール"},{"f":"Digestif","r":"ディジェスティフ","j":"食後酒","c":"ワイン・酒類","m":"コースの食後、コーヒーや小菓子とともに消化を助け余韻を楽しむために飲む食後酒。コニャック、アルマニャック、カルヴァドス、マール、薬草リキュールなど","z":"消化を助けると言われる","t":"長期熟成による芳醇な樽香や果実・ハーブの複雑な香りと温かなアルコール感が、食後の幸福な余韻を長く引き伸ばす","g":"酒類・リキュール"},{"f":"Pré-dessert","r":"プレ・デセール","j":"プレデザート","c":"コース・その他","m":"メイン料理（またはチーズ）と本格的なデザートの間に供される、小さな口直しの一品（アヴァン・デセールとも呼ぶ）。ソルベや軽いジュレ、泡の仕立てが多い","t":"爽やかな柑橘やハーブの酸味、ひんやりした口当たりが主菜の余韻をすっと切り替え、甘いデザートへの橋渡しをする","z":"デザートの前に少量出して口を整える。ソルベや軽いゼリーが多い","g":"コース・構成"},{"f":"Plateau de fromages","r":"プラトー・ド・フロマージュ","j":"チーズの盛り合わせ","c":"コース・その他","m":"白カビ・青カビ・ウォッシュ・シェーヴル・ハードなど熟成状態のよい数種類のチーズを並べた盛り合わせワゴン・盆。フランスではメインの後、デザートの前に選ぶ","z":"フランスのコースではデザートの前にチーズを食べる","g":"コース・構成"},{"f":"Coup de feu","r":"クー・ド・フー","j":"ピークタイム","c":"厨房・道具","m":"ランチやディナーの営業中、客席からの注文が一気に集中して厨房が戦場のように忙しくなるピークタイム（直訳は「銃声・砲火」）","z":"直訳は「銃声」。ランチやディナーのピークを指す","g":"厨房役職・組織"},{"f":"Saucier","r":"ソシエ","j":"ソース担当","c":"厨房・道具","m":"厨房の分業（ブリガード）で、フランス料理の命であるソース全般や煮込み、肉料理の仕上げを担当する花形ポジション。副料理長に次ぐ実力者が任されることが多い","z":"厨房の分業（ブリガード）の花形ポジションとされる","g":"厨房役職・組織"},{"f":"Gastrique","r":"ガストリック","j":"ガストリック","c":"ソース","m":"砂糖を鍋で焦がしてカラメル状にし、ワインビネガーを加えて溶きのばした甘酸っぱいベース液。鴨のオレンジソースやベリー系ソースなど、フルーツを使う肉ソースの土台になる","t":"カラメルの香ばしい甘みとほろ苦さに、ビネガーのきりっとした酸味が溶け合った、肉の脂を引き締める奥深い味","z":"鴨のオレンジソースや、果物を使うソースの土台になる","g":"だし・ベース"},{"f":"Sauce Dugléré","r":"ソース・デュグレレ","j":"デュグレレ","c":"ソース","m":"エシャロット・白ワイン・魚フュメを煮詰めて魚ヴルーテを合わせ、湯むきしたトマトのコンカッセ、冷たいバター、刻みパセリで仕上げた古典魚ソース。舌平目やヒラメの定番","t":"白ワインと魚だしのまろやかな白いソースに、トマトの爽やかな酸味と甘み、パセリの香りが彩りを添える上品な味","z":"名は19世紀のシェフ、デュグレレにちなむ。魚料理に使う","g":"ヴルーテ系"},{"f":"Fond de volaille","r":"フォン・ド・ヴォライユ","j":"鶏のだし","c":"ソース","m":"鶏ガラと香味野菜（玉ねぎ・にんじん・ポロねぎ）、ブーケ・ガルニを沸騰させずにじっくり煮出した淡い色の基本だし。ヴルーテやリゾット、スープの土台になる","t":"クセや雑味がなく、鶏の骨と肉から出たやさしく澄んだ旨味と香味野菜のほのかな甘みが調和した穏やかな味","z":"ヴルーテやリゾット、スープの土台に使う","g":"だし・ベース"},{"f":"Beurre d’escargot","r":"ブール・デスカルゴ","j":"エスカルゴバター","c":"ソース","m":"室温に戻したバターに、みじん切りのパセリ、にんにく、エシャロット、塩・こしょうをたっぷり練り込んだ緑色の合わせバター。エスカルゴのブルゴーニュ風や貝のオーブン焼きに使う","t":"焼くことで立ち上るにんにくとエシャロットの食欲をそそる芳香、パセリの爽やかさとバターの濃厚なコクが絡み合う","z":"エスカルゴのブルゴーニュ風に使う。パンに塗って焼いても合う","g":"合わせバター・薬味"},{"f":"Financière","r":"フィナンシエール","j":"金融家風","c":"ソース","m":"ドゥミ・グラスソースにマデラ酒とトリュフのエッセンス（煮汁）を加え、艶やかに仕上げた「金融家風」の高級古典ソース。パテやヴォ・ロ・ヴァン、鶏や仔牛に合わせる","t":"ドゥミ・グラスの重厚な旨味に、マデラ酒の甘く気品ある香りとトリュフの芳醇な余韻が重なる贅沢な味わい","z":"パテやヴォ・ロ・ヴァンに添える古典ソース","g":"褐色ソース系"},{"f":"Persillade","r":"ペルシヤード","j":"パン粉入りの刻み薬味","c":"ソース","m":"みじん切りにしたフレッシュなパセリとにんにくを混ぜ合わせた香草薬味（香草パン粉焼き用にパン粉を加える型も多い）。仔羊のロースト、貝類、じゃがいも料理の仕上げに使う","t":"刻みたてのパセリの青々とした爽快な香りと、にんにくのパンチのある風味が料理の香ばしさを一気に引き立てる","z":"仕上げに加える香りづけ。エスカルゴや仔羊、じゃがいも料理に使う","g":"合わせバター・薬味"},{"f":"Navarin","r":"ナヴァラン","j":"仔羊と春野菜の煮込み","c":"料理","m":"仔羊の肩肉や首肉に焼き色をつけ、トマトやだしで煮込んでから、かぶ・にんじん・新じゃが・小玉ねぎ・いんげんなど彩り豊かな春野菜を加えて仕上げる伝統的煮込み料理","t":"仔羊ならではのコク深い旨味が溶け込んだ煮汁と、みずみずしく甘い春野菜の調和が楽しめる、軽やかで華やかな煮込みの味","z":"名の由来は諸説あり、かぶ（navet）説などがある","g":"肉・ジビエ料理"},{"f":"Daube","r":"ドーブ","j":"牛肉の赤ワイン煮込み","c":"料理","m":"牛肉のすね肉や肩肉を赤ワイン、にんにく、オレンジの皮、プロヴァンスのハーブでマリネし、厚手鍋（ドービエール）で密閉して長時間じっくり蒸し煮にした南仏の郷土料理","t":"赤ワインの豊かなコクとほろほろ崩れる牛肉の旨味に、南仏ハーブとほのかな柑橘の香りが爽やかな余韻を残す奥深い味","z":"専用の鍋「ドービエール」がある。プロヴァンスの料理","g":"肉・ジビエ料理"},{"f":"Brandade de morue","r":"ブランダード・ド・モリュ","j":"塩ダラのペースト","c":"料理","m":"塩抜きしてゆでた塩ダラ（モリュ）をほぐし、温めたオリーブ油と牛乳（または生クリーム）、にんにくを少しずつ混ぜてなめらかなペースト状に練り上げた南仏ニームの名物","t":"塩ダラの凝縮した旨味とほどよい塩気に、オリーブ油のフルーティーなコクとにんにくの風味が溶け合ったクリーミーな味わい","z":"ニームの名物。じゃがいもを混ぜたり、グラタンにしたりもする","g":"魚介料理"},{"f":"Pâté en croûte","r":"パテ・アン・クルート","j":"パイ包みのパテ","c":"料理","m":"型に敷いたパイ生地の中に、調味した肉やレバー、フォアグラ、ピスタチオなどの詰め物（ファルス）を詰めて焼き上げ、焼き上がり後に隙間へコンソメゼリーを流し込んだ冷製料理","t":"バター香るサクサクのパイ、凝縮した肉とスパイスの濃厚な旨味、ひんやり澄んだゼリーが断面ごと口の中で一体になる贅沢な味","z":"断面の美しさが見せどころ。職人の腕が出る料理とされる","g":"前菜・冷菜・サラダ"},{"f":"Bisque de homard","r":"ビスク・ド・オマール","j":"オマール海老のビスク","c":"料理","m":"オマール海老の殻を香味野菜と香ばしく炒め、コニャックでフランベしてトマト・白ワイン・だしで煮出し、丁寧に裏ごしして生クリームで仕上げた濃厚な甲殻類スープ","t":"ひと口目から広がるオマール海老の芳醇で力強い香りと甘み、クリームのなめらかでリッチなコクが余韻まで続く極上の味","z":"古典では米でとろみをつけていた","g":"スープ・ポタージュ"},{"f":"Fondue savoyarde","r":"フォンデュ・サヴォワヤルド","j":"チーズフォンデュ","c":"料理","m":"にんにくをこすりつけた土鍋に白ワインを温め、コンテ・ボーフォール・エメンタールなどのチーズを溶かし、キルシュを加えて角切りパンを絡めて食べるサヴォワ地方の冬料理","t":"数種の熟成チーズが溶け合った濃厚で芳醇なコクと伸びのある口当たりに、白ワインとキルシュの爽やかな香りがキレを添える","z":"サヴォワ地方の冬の料理。キルシュを加えることが多い","g":"野菜・チーズ・軽食"},{"f":"Pissaladière","r":"ピサラディエール","j":"ニース風玉ねぎのタルト","c":"料理","m":"パン生地（またはタルト生地）の上に、じっくり炒めて甘くしたたっぷりの飴色玉ねぎを敷き詰め、アンチョビを格子状に並べて黒オリーブを飾って焼いたニースの名物料理","t":"とろりと甘い飴色玉ねぎと、アンチョビの力強い塩気・旨味、オリーブのコクが香ばしい生地の上で絶妙に引き立て合う","z":"名は魚の塩漬けのペースト「ピサラ」に由来する","g":"野菜・チーズ・軽食"},{"f":"Steak frites","r":"ステーク・フリット","j":"ステーキとフライドポテト","c":"料理","m":"アントルコートやバヴェットなどの牛肉ステーキを好みの焼き加減で焼き、カリッと揚げたフライドポテト（ポム・フリット）をたっぷり添えた、フランス人最愛のビストロ定番","t":"香ばしく焼いた赤身牛肉のジューシーな旨味と、揚げたてポテトのカリッとほくほくした食感がシンプルながら無敵の組み合わせ","z":"ビストロの代表的な定番。ステーキはアントルコートが多い","g":"肉・ジビエ料理"},{"f":"Salade lyonnaise","r":"サラド・リヨネーズ","j":"リヨン風サラダ","c":"料理","m":"ほろ苦い縮れ葉のフリゼレタスに、カリッと炒めた厚切りベーコン（ラルドン）、とろりとしたポーチドエッグ、クルトンをのせ、温かいヴィネグレットで和えたリヨン名物サラダ","t":"温かいベーコンの塩気と香ばしさ、弾ける卵黄の濃厚なコク、酢の効いたドレッシングとほろ苦い葉野菜が絶妙に絡み合う","z":"リヨンの食堂「ブション」の定番","g":"前菜・冷菜・サラダ"},{"f":"Mont-Blanc","r":"モン・ブラン","j":"モンブラン","c":"デザート","m":"サクサクに焼いたメレンゲ（またはタルト）を土台に、無糖のシャンティイを重ね、ラム酒やバニラ香るマロンクリームを細い糸状に絞って白い雪山に見立てた名菓","t":"濃厚でほっくりとした栗の濃い甘みに、軽やかで甘さ控えめの生クリームとサクッと溶けるメレンゲが絶妙なバランスを生む","z":"名はアルプスの最高峰モンブランにちなむ","g":"ケーキ・タルト"},{"f":"Tarte au citron","r":"タルト・オ・シトロン","j":"レモンタルト","c":"デザート","m":"サクサクの甘いタルト生地（パート・サブレ）に、たっぷりのレモン果汁とバター・卵で炊いた爽やかなレモンクリームを流して仕上げた、フランスで最も愛される定番タルトの一つ","t":"キュッと目を覚ますような鮮烈なレモンの酸味と爽やかな香りを、バターのまろやかなコクと香ばしいタルト生地が包み込む","z":"メレンゲをのせて焼き色をつけたものもある","g":"ケーキ・タルト"},{"f":"Baba au rhum","r":"ババ・オ・ラム","j":"ババ・オ・ラム","c":"デザート","m":"イーストで発酵させたブリオッシュ風の軽い生地を円筒型で焼き、香り高いラム酒を効かせた温かいシロップに芯までたっぷり浸して、シャンティイを添えた大人の伝統菓子","t":"フォークを入れるとじゅわりと溢れ出す芳醇なラム酒シロップの甘みと香り、しっとりほどける生地に軽やかな生クリームが好相性","z":"ロレーヌ公スタニスワフが、乾いたお菓子に酒を注いだのが始まりという逸話がある","g":"ケーキ・タルト"},{"f":"Kouign-amann","r":"クイニー・アマン","j":"クイニー・アマン","c":"デザート","m":"パン生地にたっぷりの有塩バターと砂糖を何度も折り込んで型に詰め、表面と底がキャラメル状にカリッと焦げるまで焼き上げた、ブルターニュ地方発祥の濃厚焼き菓子","t":"外側は砂糖が焦げたカリカリ・ザクザクの香ばしい食感、中は有塩バターがじゅわっと染み出すもっちり濃厚な甘じょっぱい味","z":"ブルターニュの菓子。ブルトン語でkouignは「菓子」、amannは「バター」の意味","g":"焼き菓子・小菓子"},{"f":"Fondant au chocolat","r":"フォンダン・オ・ショコラ","j":"フォンダン・ショコラ","c":"デザート","m":"上質なチョコレートとバター、卵、少量の小麦粉で作り、外側にだけ火を通して中心部を半生のまま残して焼き上げた温かいチョコレート菓子。バニラアイスを添えるのが定番","t":"スプーンを入れると中からとろりと溢れ出す熱い濃厚チョコレートと、外側の軽くしっとりした生地が織りなす贅沢で濃密な味わい","z":"焼き時間の見極めが肝。温かいうちに出す","g":"焼き菓子・小菓子"},{"f":"Meringue","r":"ムラング","j":"メレンゲ","c":"デザート","m":"卵白に砂糖を加えてツヤが出るまで泡立てた菓子素材。低温でサクサクに焼き乾燥させてそのまま味わうほか、ムースやスフレ、マカロン、タルトの飾りなど幅広く使う","t":"驚くほど軽やかでサクッと乾いた歯ざわりから、口の中でしゅわっと儚く溶けて卵白と砂糖の澄んだ甘みが広がる","z":"作り方は、フランス式、イタリア式、スイス式の3種類がある","g":"生地・クリーム・製菓技法"},{"f":"Crème d’amande","r":"クレーム・ダマンド","j":"アーモンドクリーム","c":"デザート","m":"同量のバター・砂糖・全卵・アーモンドプードルを混ぜ合わせた、焼き込み用の基本クリーム。フルーツタルトの土台に敷いたり、カスタードと合わせてガレット・デ・ロワに使う","t":"焼き上げることでふっくら香ばしくなり、ローストしたアーモンドの豊かな香りとバターの濃厚なコク、しっとりした甘みが広がる","z":"クレーム・パティシエールと合わせたものがフランジパーヌ","g":"生地・クリーム・製菓技法"},{"f":"Poire belle-Hélène","r":"ポワール・ベル・エレーヌ","j":"洋梨のベル・エレーヌ","c":"デザート","m":"バニラ香るシロップで柔らかく煮た洋梨に、冷たいバニラアイスクリームを添え、上から温かいビターチョコレートソースとスライスアーモンドをかけた19世紀パリの名作デザート","t":"みずみずしく芳醇な洋梨の甘みと冷たいバニラアイス、熱々でほろ苦いチョコレートソースが口の中で溶け合う気品ある味","z":"オッフェンバックのオペレッタ『美しきエレーヌ』にちなむ","g":"冷菓・皿盛りデザート"},{"f":"Pêche Melba","r":"ペーシュ・メルバ","j":"ピーチ・メルバ","c":"デザート","m":"皮をむいてシロップ煮にした完熟の白桃をバニラアイスクリームの上にのせ、鮮やかなフランボワーズ（ラズベリー）のクーリとアーモンドを添えた、エスコフィエ考案の古典デザート","t":"桃のとろけるような甘い芳香とバニラアイスのまろやかさに、フランボワーズのきゅっと爽やかな酸味が彩りを添える華やかな味","z":"エスコフィエが、歌手ネリー・メルバのために考案したとされる","g":"冷菓・皿盛りデザート"},{"f":"Religieuse","r":"ルリジューズ","j":"ルリジューズ","c":"デザート","m":"大小2つの丸いシューにカスタードクリームを詰め、表面にコーヒーやチョコレートのフォンダンをかけて雪だるま状に重ね、境目にバタークリームの襟飾りを絞った修道女風の菓子","t":"さっくり香ばしいシューとたっぷりの濃厚クリーム、フォンダンのしっかりした甘みとコーヒーやチョコのほろ苦さが調和する","z":"修道女（religieuse）の姿に見立てた名前","g":"ケーキ・タルト"},{"f":"Oursin","r":"ウルサン","j":"ウニ","c":"食材","m":"ウニ。食べるのは生殖巣の部分","t":"とろけるように濃厚な海の甘みと芳醇な磯の香りが口いっぱいに広がり、クリームや甲殻類のジュレと至高の相性を生む","z":"キャビアと合わせて前菜の飾りにすることがある（SAKURAのメニューにも登場）","d":"ウニとキャビアの冷前菜、ウニのムース・ロワイヤル、ウニのクリームソース","g":"魚介類"},{"f":"Caviar","r":"キャヴィアール","j":"キャビア","c":"食材","m":"チョウザメの卵を塩漬けにした世界三大珍味の一つ。前菜の飾りやブリニ、クリームと合わせて塩気と旨味のアクセントに使う","t":"粒がプチッと弾けるたびに広がる上品な塩気と、ナッツを思わせる濃厚でクリーミーな海の旨味が余韻を長く残す","z":"トリュフ、フォアグラと並ぶ世界三大珍味の一つ（SAKURAのメニューにも登場）","d":"キャビアのブリニ＆クレーム・フレッシュ添え、冷前菜や魚介料理の仕上げ","g":"魚介類"},{"f":"Asperge blanche","r":"アスペルジュ・ブランシュ","j":"ホワイトアスパラガス","c":"食材","m":"日光に当てず、土をかぶせて育てた白いアスパラガス","t":"グリーンより繊細でみずみずしく、上品な甘みの奥に春らしい柔らかなほろ苦さがあり、バター系ソースと完璧に調和する","z":"春が旬。オランデーズソースを添えるのが定番（SAKURAのメニューにも登場）","d":"ホワイトアスパラガスのオランデーズ／ムースリーヌ／マルテーズソース添え","g":"野菜"},{"f":"Citronnelle","r":"シトロネル","j":"レモングラス","c":"食材","m":"レモンに似た爽やかな香りのハーブ","t":"レモンより柔らかく華やかな柑橘系の清涼な芳香があり、ジュレやクリーム、魚介のブイヨンに洗練された爽やかさを添える","z":"デザートの香りづけやジュレにも使う（SAKURAのメニューにも登場）","d":"レモングラスのジュレ、魚介のナージュ、エキゾチック系デザート","g":"ハーブ"},{"f":"Ananas","r":"アナナ","j":"パイナップル","c":"食材","m":"甘酸っぱい南国果実（パイナップル）。生のカルパッチョやソルベのほか、ローストやキャラメリゼにして温かいデザートや豚肉料理にも使う","t":"ジューシーな甘みと爽やかな酸味があり、加熱すると甘みと香りが一層濃くなる","z":"加熱すると甘みが増し、キャラメルやラム酒と合う（SAKURAのメニューにも登場）","d":"パイナップルのロースト（ラム酒フランベ）、カルパッチョ、ソルベ","g":"果物"},{"f":"Cacao","r":"カカオ","j":"カカオ","c":"食材","m":"チョコレートの原料になる木の実の種子","t":"焙煎したカカオならではの奥深い芳醇な芳香と気品あるほろ苦さがあり、甘味と重なることで濃厚な余韻を生む","z":"ガナッシュやムースの材料（SAKURAのメニューにも登場）","d":"ムース・オ・ショコラ、ガナッシュ、フォンダン・オ・ショコラ、オペラ","g":"調味料・薬味"},{"f":"Café","r":"カフェ","j":"コーヒー","c":"食材","m":"コーヒー。食後の飲み物のほか、コーヒーを出す店の意味でも使う","t":"深煎りの香ばしく芳醇な苦味と心地よい酸味があり、食後の口をすっきりと整えるほかチョコレートやクリームと好相性","z":"デザートの味づけにも使う（SAKURAのメニューにも登場）","d":"オペラ、ルリジューズ（カフェ）、エクレール・オ・カフェ、ドゥミタス","g":"調味料・薬味"},{"f":"Coquillage","r":"コキヤージュ","j":"貝類","c":"食材","m":"ホタテ、ムール貝、アサリ、カキなど貝類全般の総称。海のだしが豊かに出るため、白ワイン蒸しやスープ、魚料理の付け合わせに多用される","t":"海ならではの澄んだ磯の香りと濃密な貝のだしの旨味が凝縮しており、白ワインとハーブで蒸すだけで極上のソースになる","z":"ブイヤベースやフリカセなど、だしを生かす料理に使う（SAKURAのメニューにも登場）","d":"ムール・マリニエール、ブイヤベース、貝類のナージュ、魚介のフリカセ","g":"魚介類"},{"f":"Laitance","r":"レタンス","j":"白子","c":"食材","m":"タラやニシンなど魚の精巣（白子）。フランスでも珍味として親しまれ、下処理をしてムニエルやポワレ、フリットにして味わう","t":"外は香ばしく中はクリームのようにとろりと濃厚で、雑味のない甘みがある","z":"ニシンなどの白子をムニエルやポワレにする（SAKURAのメニューにも登場）","d":"白子のムニエル（ブール・ノワゼット）、白子のポワレ（焦がしバター＆ケッパー）","g":"魚介類"},{"f":"Condiment","r":"コンディモン","j":"薬味・つけ合わせの調味料","c":"食材","m":"料理に添える調味料や薬味。刻んだ野菜の酢漬けなど","t":"きりっとした酸味や辛味、香味野菜の爽やかな風味が主役の肉や魚の脂を引き締め、一皿に鮮やかなリズムを生む","z":"魚や肉の料理にそえて、味のアクセントにする（SAKURAのメニューにも登場）","d":"肉・魚料理の添え物、シャルキュトリの付け合わせ、タプナード","g":"調味料・薬味"},{"f":"Mousse","r":"ムース","j":"ムース","c":"料理","m":"魚介・肉・野菜のピューレ、またはチョコレートや果実などに、泡立てた卵白や生クリームをさっくり混ぜてふんわり軽く仕立てた料理や菓子。温製・冷製ともにある","t":"空気を含んだふわっと軽くなめらかな口溶けで、素材の繊細な香りとコクがやさしく舌の上に広がる","z":"塩味の前菜にも、甘いデザートにも使う（SAKURAのメニューにも登場）","g":"前菜・冷菜・サラダ"},{"f":"Gelée","r":"ジュレ","j":"ジュレ","c":"料理","m":"コンソメや魚介のだし、果汁、ワインなどをゼラチンでぷるんと固めた冷製仕立て。前菜の彩りやテリーヌの添え物、夏の冷菜・デザートに広く使われる","t":"ひんやりつるんとした涼やかな舌ざわりで、口の中で溶けると同時にだしや果汁の澄んだ旨味と香りがふわりと広がる","z":"魚のだしをジュレにして前菜に使うこともある（SAKURAのメニューにも登場）","g":"前菜・冷菜・サラダ"},{"f":"Foie gras poêlé","r":"フォアグラ・ポワレ","j":"フォアグラのポワレ","c":"料理","m":"厚切りにした生のフォアグラに軽く粉をはたき、強火のフライパンで表面をこんがり焼き上げ、中はとろりと仕上げた豪華な温前菜。甘酸っぱい果実やバルサミコソースと合わせる","t":"外側はカリッと香ばしく、中はクリームのようにとろける濃厚な脂の甘みとコクが口いっぱいに広がる極上の味わい","z":"焼きすぎると脂が溶け出すので、短時間で仕上げる（SAKURAのメニューにも登場）","g":"前菜・冷菜・サラダ"},{"f":"Jardinière","r":"ジャルディニエール","j":"菜園風","c":"料理","m":"にんじん、かぶ、いんげん、グリーンピース、カリフラワーなど数種類の野菜をきれいに切りそろえてゆで、バターで和えて彩りよく盛り合わせた「菜園風」の付け合わせ","t":"旬の野菜それぞれの素朴な甘みとみずみずしい食感が活きており、ほのかなバターの香りが肉や魚料理をやさしく彩る","z":"にんじん、かぶ、グリーンピース、いんげんなどを使うのが古典（SAKURAのメニューにも登場）","g":"野菜・チーズ・軽食"},{"f":"Rôtir","r":"ロティール","j":"ロースト","c":"調理法","m":"塊肉や丸鶏、骨付きの魚をオーブンや回転串（ロティソワール）の乾熱で、焼き汁を回しかけながらじっくり焼き上げる調理法（ロティの動詞形）","t":"外側は香ばしく黄金色に焼き上がり、焼き後に休ませることで中心までしっとり肉汁あふれる仕上がりになる","z":"焼いた料理そのものも「ロティ」と呼ぶ。焼いた後に休ませてから切り分ける（SAKURAのメニューにも登場）","g":"加熱・火入れ"},{"f":"Caraméliser","r":"キャラメリゼ","j":"キャラメリゼする","c":"調理法","m":"砂糖を加熱して飴色のカラメルに焦がすこと、またはタルト・タタンのりんごやクレーム・ブリュレの表面、玉ねぎなどを砂糖や自身の糖分で香ばしく茶色く焼き上げること","t":"砂糖が焦げることで生まれるほろ苦い大人の甘みと、パリッと香ばしい芳醇な香りが広がる","z":"クレーム・ブリュレの表面やタルト・タタンのりんごが代表例（SAKURAのメニューにも登場）","g":"調味・仕上げ"},{"f":"Déclinaison","r":"デクリネゾン","j":"展開・バリエーション","c":"コース・その他","m":"一つの主役食材（例：りんご、ビーツ、鴨など）を、生・焼き・ムース・ジュレ・アイスなど温度や食感・調理法を変えて何通りにも仕立てて一皿に盛り合わせる現代フレンチの技法","z":"同じ素材の違った表情を、一皿で楽しめる（SAKURAのメニューにも登場）","g":"調理基礎・表現"},{"f":"Mariage","r":"マリアージュ","j":"結婚・相性","c":"コース・その他","m":"料理とワイン（または食材同士）を組み合わせたとき、互いの長所を引き立て合って単体以上の美味しさを生み出す理想的な相性（本来は「結婚」の意味）","z":"本来は「結婚」の意味。ワインと料理の相性にもよく使う（SAKURAのメニューにも登場）","g":"調理基礎・表現"},{"f":"Poisson du jour","r":"ポワソン・デュ・ジュール","j":"本日の鮮魚","c":"サービス・接客","m":"その朝に市場や漁港から届いた最も新鮮な魚を使い、シェフが日替わりの火入れとソースで仕立てる「本日の鮮魚料理」","z":"「プラ・デュ・ジュール」の魚版にあたる（SAKURAのメニューにも登場）","g":"メニュー・注文"},{"f":"Glace","r":"グラス","j":"アイスクリーム・氷菓","c":"デザート","m":"牛乳・生クリーム・卵黄・砂糖で作るクレーム・アングレーズをベースに、空気を含ませながら凍らせたフランス式アイスクリーム。バニラやピスタチオ、キャラメルなど多彩","t":"ひんやりとなめらかで舌の上でとろけるリッチな口溶けに、乳のまろやかなコクと素材の芳醇な香りがまっすぐ広がる","z":"同じ綴りで、肉の旨味を煮詰めた「グラス」や、菓子の糖衣も指す（SAKURAのメニューにも登場）","g":"冷菓・皿盛りデザート"},{"f":"Caneton","r":"カヌトン","j":"仔鴨","c":"食材","m":"若い鴨。生後2か月ほどまでを指す","t":"成鴨よりさらにきめ細かく驚くほど柔らかな肉質で、上品な鉄分の旨味と軽やかな脂が果実のソースによく合う","z":"ローストして、フルーツ系のソースを合わせることが多い（提供メニュー資料にも登場）","d":"仔鴨のロティ（オレンジ／チェリーソース）、仔鴨のルーアン風","g":"鳥肉、うさぎ肉"},{"f":"Sériole","r":"セリヨル","j":"カンパチなどブリの仲間","c":"食材","m":"ブリ類の魚。カンパチに近い種","t":"引き締まったプリッとした身質に上品な脂の甘みがあり、生食のカルパッチョでも皮目を焼いたポワレでも旨味が際立つ","z":"カルパッチョやグリルに向く（提供メニュー資料にも登場）","d":"カンパチのカルパッチョ、セビーチェ風前菜、ポワレ（ソース・ヴィエルジュ）","g":"魚介類"},{"f":"Ormeau","r":"オルモー","j":"アワビ","c":"食材","m":"耳のような片貝を持つ高級貝（アワビ）。フランスではブルターニュ産が知られ、叩いて柔らかくしてからステーキやブレゼ、肝ソースで味わう","t":"コリッと力強い弾力（蒸し煮では柔らかくもっちり）と濃密な磯の旨味があり、ほろ苦い肝のソースが味に深い奥行きを与える","z":"肝（ソース）まで使う料理が多い（提供メニュー資料にも登場）","d":"アワビのステーキ（肝バターソース）、アワビのブレゼ","g":"魚介類"},{"f":"Bonite","r":"ボニット","j":"カツオの仲間","c":"食材","m":"カツオやハガツオなどサバ科の回遊魚。赤身の旨味が濃く、表面を炙ったミ・キュイやカルパッチョ、マリネに仕立てることが多い","t":"赤身魚ならではの鉄分を感じる力強い旨味と豊かな風味があり、表面を炙ったミ・キュイや酸味のある薬味と好相性","z":"炙りやマリネにする（提供メニュー資料にも登場）","d":"カツオのミ・キュイ、カルパッチョ、マリネ、ニース風サラダ","g":"魚介類"},{"f":"Espadon","r":"エスパドン","j":"メカジキ","c":"食材","m":"長く鋭い吻を持つ大型の白身魚（メカジキ）。肉のように身が締まっており、厚切りのグリルやポワレ、南仏風のトマトソースによく合う","t":"肉のようにしっかり締まった食べ応えのある白身で脂は控えめながら旨味があり、オリーブ油やトマトソースをよく受け止める","z":"厚切りにしてステーキのように焼く（提供メニュー資料にも登場）","d":"メカジキのグリル（プロヴァンス風トマトソース）、ポワレ（ソース・ヴィエルジュ）","g":"魚介類"},{"f":"Anguille","r":"アンギーユ","j":"うなぎ","c":"食材","m":"川や汽水域に棲むウナギ。フランスではロワール川やブルゴーニュの赤ワイン煮（マトロート）や、香草と煮る緑のソース（オ・ヴェール）が古典","t":"豊かな脂がのったふっくらほくほくの身と強い旨味があり、赤ワインの酸味や香草のソースと合わせると格別のコクになる","z":"ブルゴーニュ流の赤ワイン煮（マトロート）などの古典がある（提供メニュー資料にも登場）","d":"ウナギの赤ワイン煮（マトロート・ダンギーユ）、ウナギの緑ソース煮（オ・ヴェール）","g":"魚介類"},{"f":"Chevreuil","r":"シュヴルイユ","j":"ノロジカ","c":"食材","m":"ノロジカ。ヨーロッパを代表するジビエ","t":"ヨーロッパのジビエの中でも特にきめ細かな柔らかな赤身で、クセが穏やかながら気品ある野趣と深い旨味がある","z":"ポワヴラードなどのソースを合わせる古典がある（提供メニュー資料にも登場）","d":"ノロジカの背肉のロティ（グラン・ヴヌール／ポワヴラードソース）","g":"肉"},{"f":"Biche","r":"ビッシュ","j":"雌鹿","c":"食材","m":"秋から冬に狩猟される雌の鹿肉。雄鹿（セルフ）より肉質がきめ細かく柔らかいとされ、ローストにベリーや赤ワインのソースを合わせる","t":"雄鹿よりさらに柔らかくしっとりとした上品な赤身で、脂肪が少なく繊細な旨味が赤ワインやベリーソースと絶妙に調和する","z":"雄鹿より肉質がやわらかいとされる（提供メニュー資料にも登場）","d":"雌鹿のロティ（グラン・ヴヌールソース）、鹿肉のシヴェ","g":"肉"},{"f":"Perdreau","r":"ペルドロー","j":"若いヤマウズラ","c":"食材","m":"生後1年未満の若いヤマウズラ","t":"若鳥ならではの繊細で淡白な肉質にほのかな野趣があり、豚の背脂で巻いて焼くとしっとり上品な旨味が引き立つ","z":"ジビエの鳥としては小ぶりで、ローストに向く（提供メニュー資料にも登場）","d":"ヤマウズラのロティ（キャベツ蒸し煮添え）、サルミ","g":"鳥肉、うさぎ肉"},{"f":"Potimarron","r":"ポティマロン","j":"栗かぼちゃ","c":"食材","m":"小ぶりで栗に似た味のかぼちゃ","t":"皮ごと食べられるほど柔らかく、栗を思わせるほくほくとした濃厚な甘みと鮮やかなオレンジ色が秋冬の料理を彩る","z":"皮ごと調理できる（提供メニュー資料にも登場）","d":"栗かぼちゃのポタージュ（ヴルーテ）、ロースト、ピューレ","g":"野菜"},{"f":"Chou-rave","r":"シュー・ラーヴ","j":"コールラビ","c":"食材","m":"かぶのように太る、キャベツの仲間","t":"かぶとキャベツの中間のようなみずみずしくシャキッとした食感と、ほんのり優しい甘みがあり生でも加熱でも美味しい","z":"生でも加熱でも使える（提供メニュー資料にも登場）","d":"コールラビのカルパッチョ・サラダ、クリーム煮、付け合わせのグラッセ","g":"野菜"},{"f":"Réglisse","r":"レグリス","j":"甘草（リコリス）","c":"食材","m":"マメ科植物「甘草（リコリス）」の根やそのエキス。アニスに似た独特の甘い芳香があり、アイスクリームやムース、肉料理のソースの隠し味に使う","t":"アニスに似た独特の甘い芳香とほのかな薬草のほろ苦さがあり、少量使うとアイスクリームや肉のソースに印象的な余韻を残す","z":"お菓子やデザートの香りづけに使う（提供メニュー資料にも登場）","d":"レグリスのアイスクリーム・ムース、鴨や仔羊のスパイスソース","g":"スパイス"},{"f":"Tonka","r":"トンカ","j":"トンカ豆","c":"食材","m":"トンカ豆。南米原産の香りの豆","t":"バニラ、アーモンド、桜の葉を合わせたような甘く官能的な芳香があり、少量すりおろすだけでデザートが一気に華やぐ","z":"少量で香りが強く、すりおろして使う（提供メニュー資料にも登場）","d":"トンカ豆のクレーム・ブリュレ、アイスクリーム、ガナッシュ、マドレーヌ","g":"スパイス"},{"f":"Bergamote","r":"ベルガモット","j":"ベルガモット","c":"食材","m":"イタリア南部などで栽培される香り高い柑橘類。生食よりも果皮の精油や果汁を、焼き菓子・クリーム・魚介のソースの香り付けに用いる","t":"柑橘のきりっと爽やかな芳香の奥に、白い花のような気品ある余韻が長く続き、菓子や魚介料理を洗練された印象にする","z":"紅茶のアールグレイの香りづけでも知られる（提供メニュー資料にも登場）","d":"ベルガモットのタルト・マカロン、魚介のマリネ、紅茶（アールグレイ）の香り付け","g":"果物"},{"f":"Vin jaune","r":"ヴァン・ジョーヌ","j":"黄ワイン","c":"ワイン・酒類","m":"ジュラ地方の白ワイン。酵母の膜の下で6年以上熟成させる","t":"長期熟成が生み出すくるみやカレー粉・スパイスを思わせる複雑で芳醇な芳香と、背筋の伸びる力強い酸味・長い余韻が特徴","z":"モリーユ茸と合わせるクリームソースの料理が古典（提供メニュー資料にも登場）","d":"ブレス鶏とモリーユ茸のヴァン・ジョーヌ煮込み、コンテチーズとのマリアージュ","g":"種類・スタイル"},{"f":"Écrevisse","r":"エクルヴィス","j":"ザリガニ","c":"食材","m":"ザリガニの仲間。淡水の甲殻類","t":"淡水の甲殻類ならではの繊細で上品な甘みがあり、殻を炒めて煮出すと驚くほど芳醇で香り高い赤色のバターやソースになる","z":"「ナンテュア」の項で使われる素材（提供メニュー資料にも登場）","d":"ソース・ナンテュア、クネル・ド・ブロシェ、ジョワンヴィルソース","g":"魚介類"},{"f":"Potage","r":"ポタージュ","j":"ポタージュ","c":"料理","m":"フランス料理におけるスープ全般の総称。特に現代では野菜や豆を煮て裏ごしし、クリームやバターで仕上げたとろみのあるスープ（ポタージュ・リエ）を指すことが多い","t":"裏ごしによる絹のようになめらかな口当たりで、野菜や素材の凝縮した甘みと旨味、クリームの優しいコクがじんわり広がる","z":"澄んだものは「コンソメ」と呼んで区別する（提供メニュー資料にも登場）","g":"スープ・ポタージュ"},{"f":"Carpaccio","r":"カルパッチョ","j":"カルパッチョ","c":"料理","m":"新鮮な生の牛肉や白身魚、ホタテなどを極薄切りにして皿に美しく並べ、良質なオリーブ油、レモン汁、塩・こしょう、ハーブやチーズで調味した冷前菜","t":"素材本来の新鮮な甘みと繊細な食感がダイレクトに届き、オリーブ油の青い香りと柑橘の爽やかな酸味が味を引き締める","z":"名はイタリアの画家カルパッチョにちなむとされる（提供メニュー資料にも登場）","g":"前菜・冷菜・サラダ"},{"f":"Royale","r":"ロワイヤル","j":"ロワイヤル","c":"料理","m":"卵にコンソメや牛乳・生クリーム、裏ごしした野菜や魚介を合わせて湯せんで優しく蒸し固めた、フランス風の洋風茶碗蒸し。コンソメの浮き身や温かい前菜に使う","t":"口の中でふるふると崩れるほど繊細でなめらかな食感に、卵のやさしいコクとだしの旨味が穏やかに広がる上品な味","z":"コンソメの浮き身や前菜に使う（提供メニュー資料にも登場）","g":"前菜・冷菜・サラダ"},{"f":"Aspic","r":"アスピク","j":"アスピック","c":"料理","m":"肉や魚の澄んだコンソメをゼラチンで固めたゼリー（アスピック）の中に、ゆで卵や魚介、ハム、野菜などを美しく閉じ込めて冷やし固めた古典の冷前菜","t":"ひんやりとしたゼリーのつるんとした口当たりに、凝縮しただしの旨味と具材の風味が引き締まって調和する涼やかな味","z":"パテやテリーヌの仕上げにも使う（提供メニュー資料にも登場）。アスピックとも書く","g":"前菜・冷菜・サラダ"},{"f":"Meurette","r":"ムーレット","j":"赤ワインの煮込み","c":"料理","m":"ブルゴーニュ産赤ワインにエシャロット、ベーコン、マッシュルーム、ハーブを加えて煮込んだ濃厚なソース、およびそれで川魚やポーチドエッグを仕上げた郷土料理","t":"赤ワインの力強い酸味と深いコクに、ベーコンの燻製香ときのこの旨味が溶け込んだ、パンが進む濃厚なブルゴーニュの味","z":"ポーチドエッグの赤ワインソース「ウフ・アン・ムーレット」が名物（提供メニュー資料にも登場）","g":"肉・ジビエ料理"},{"f":"Vichyssoise","r":"ヴィシソワーズ","j":"ヴィシソワーズ","c":"料理","m":"白いポロねぎとじゃがいもをバターで色づけずに炒め、鶏ブイヨンで煮て裏ごしし、生クリームを加えて冷やしたポタージュ。夏の定番冷製スープとして世界中で愛される","t":"ひんやりとなめらかでクリーミーな口当たりに、ポロねぎとじゃがいもの穏やかで上品な甘みが広がる涼やかな味わい","z":"ニューヨークのホテルで考案されたと言われる（提供メニュー資料にも登場）","g":"スープ・ポタージュ"},{"f":"Ballotine","r":"バロティーヌ","j":"バロティーヌ","c":"料理","m":"骨を抜いた鶏や鴨、魚などにひき肉やきのこ・フォアグラなどの詰め物（ファルス）をして筒状に巻き、ポシェやローストで仕上げた温製の肉・魚料理","t":"しっとりジューシーに火の入った外側の肉と、旨味が詰まった内側のファルスの異なる食感と風味が重なり合う上品な味","z":"温製が本式で、冷製に仕上げるものはガランティーヌと呼ぶ（提供メニュー資料にも登場）","g":"肉・ジビエ料理"},{"f":"Flamber","r":"フランベ","j":"フランベする","c":"調理法","m":"肉料理や甲殻類、クレープ・シュゼットなどの仕上げにブランデーやリキュールを注ぎ、火をつけて炎を上げアルコール分だけを飛ばす技法（フランベの動詞形）","t":"アルコールの刺激が消え、熟成した洋酒の気高く芳醇な香りだけが料理やデザートにふわりと残る","z":"クレープ・シュゼットのように、客席でも見せる（提供メニュー資料にも登場）","g":"調味・仕上げ"},{"f":"Granité","r":"グラニテ","j":"グラニテ","c":"コース・その他","m":"果汁、ワイン、ハーブティー、シャンパーニュなどを凍らせながらフォークで粗くかき混ぜてシャリシャリの結晶にした氷菓。コースの口直しや夏のデザートに供される","t":"ざらっと涼やかな氷の粒が口の中で一気に溶け、すっきりした酸味と爽やかな香りが口中を鮮やかにリフレッシュする","z":"ソルベよりも粒が粗い（提供メニュー資料にも登場）","g":"コース・構成"},{"f":"Vacherin","r":"ヴァシュラン","j":"ヴァシュラン","c":"デザート","m":"サクサクに焼いたメレンゲの土台や器に、アイスクリーム・ソルベ・シャンティイを幾層にも重ねて凍らせた華やかな冷菓（ヴァシュラン・グラッセ）。果物ソースを添える","t":"サクッと軽い甘いメレンゲと、ひんやりなめらかなアイス・生クリームの食感と温度の対比が楽しめるエレガントな味わい","z":"同名のチーズ（ヴァシュラン・モン・ドール）もある（提供メニュー資料にも登場）","g":"冷菓・皿盛りデザート"},{"f":"Crème chiboust","r":"クレーム・シブースト","j":"クレーム・シブースト","c":"デザート","m":"炊きたての熱いカスタードクリームにゼラチンを溶かし、温かいイタリアンメレンゲをさっくり混ぜ合わせた軽やかなクリーム。サン・トノレやタルト・シブーストの要","t":"カスタードの濃厚な卵とバニラのコクを持ちながら、メレンゲによるふんわりしゅわっと雲のように軽い口溶けが魅力","z":"サン・トノレの詰め物に使う（提供メニュー資料にも登場）","g":"生地・クリーム・製菓技法"},{"f":"Pavlova","r":"パヴロワ","j":"パブロバ","c":"デザート","m":"低温でじっくり焼き上げた、外はサクサク中はマシュマロのように柔らかな大型メレンゲの器に、甘さ控えめの生クリームとベリーやパッションフルーツをたっぷり飾った菓子","t":"サクッと割れるメレンゲの豊かな甘みと中のふんわり感に、軽やかなクリームとフレッシュフルーツの鮮やかな酸味が絶妙に調和する","z":"ロシアのバレリーナ、パヴロワにちなむとされる（提供メニュー資料にも登場）","g":"冷菓・皿盛りデザート"},{"f":"Dacquoise","r":"ダクワーズ","j":"ダクワーズ","c":"デザート","m":"泡立てた卵白にアーモンドプードルと粉砂糖を混ぜて焼き上げたメレンゲ生地、またはその生地2枚でプラリネやコーヒーのバタークリームを挟んだフランス南西部発祥の焼き菓子","t":"表面はさっくり香ばしく中はふんわりもっちりとした独特の軽い食感に、アーモンドの芳醇な香りとクリームのコクが広がる","z":"名は南西部の町ダクス（Dax）に由来する（提供メニュー資料にも登場）","g":"焼き菓子・小菓子"},{"f":"Bavarois","r":"バヴァロワ","j":"ババロア","c":"デザート","m":"バニラや果実で香り付けしたクレーム・アングレーズにゼラチンを加え、泡立てた生クリームを混ぜて型に流し冷やし固めた伝統冷菓。シャルロットの中身にも使われる","t":"ゼラチンのほどよい弾力と生クリームのふんわり感が合わさった、ぷるんとなめらかで優しい口溶けとまろやかな甘み","z":"名はバイエルン（Bavière）に由来するという説がある（提供メニュー資料にも登場）","g":"冷菓・皿盛りデザート"},{"f":"Cerises jubilé","r":"スリーズ・ジュビレ","j":"桜桃のジュビレ","c":"デザート","m":"ダークチェリーを砂糖と果汁で温め、客前でキルシュ（さくらんぼのブランデー）を注いでフランベし、冷たいバニラアイスクリームの上にかけて楽しむ華やかなクラシックデザート","t":"熱々でジューシーなさくらんぼの甘酸っぱさとキルシュの芳醇な香りが、とろけ出す冷たいバニラアイスと溶け合う贅沢な味","z":"ヴィクトリア女王の在位記念にちなむとされる（提供メニュー資料にも登場）","g":"冷菓・皿盛りデザート"},{"f":"Gaspacho","r":"ガスパチョ","j":"ガスパチョ","c":"料理","m":"完熟トマト、きゅうり、パプリカ、玉ねぎ、にんにく、パンをオリーブ油とシェリービネガーとともに攪拌し、しっかり冷やしたスペイン・アンダルシア発祥の夏の冷製スープ","t":"生野菜の瑞々しい甘みとビネガーのきりっとした酸味、オリーブ油とにんにくの香りが喉を爽やかに潤す清涼な味わい","z":"アンダルシア地方の夏の料理（提供メニュー資料にも登場）","g":"スープ・ポタージュ"},{"f":"Garbure","r":"ガルビュール","j":"ガルビュール","c":"料理","m":"キャベツ、白いんげん豆、じゃがいも等の野菜に、鴨のコンフィや生ハムの骨、塩豚を加えて長時間煮込んだフランス南西地方の具だくさんな伝統スープ","t":"肉と骨から溶け出した深い旨味ととろける豆・野菜の甘みが溶け合った、スプーンが立つほど濃厚で体の芯から温まる味","z":"ほとんど煮込み料理に近い（提供メニュー資料にも登場）","g":"スープ・ポタージュ"},{"f":"Salmis","r":"サルミ","j":"サルミ","c":"料理","m":"鴨やヤマウズラ、ヤマシギなどの野鳥（ジビエ）をまず半生にローストして切り分け、残った骨とガラ・赤ワイン・エシャロットで取った濃厚ソースで温め絡めた古典料理","t":"ローストの香ばしさとジビエ特有の野趣ある濃い旨味に、骨と内臓のコクが詰まった赤ワインソースが絡み合う重厚な味","z":"古典のジビエ料理（提供メニュー資料にも登場）","g":"肉・ジビエ料理"},{"f":"Tartine","r":"タルティーヌ","j":"タルティーヌ","c":"料理","m":"スライスしたカンパーニュやバゲットに、バターやジャムを塗った朝食の定番、またはチーズ・リエット・野菜・魚介などを彩りよくのせたカフェ風のオープンサンド","t":"香ばしく噛みごたえのあるパンの風味が主役となり、のせる具材の塩気や甘み、バターのコクが素朴に引き立つ味わい","z":"朝食の定番。メニューではオープンサンドを指すこともある（提供メニュー資料にも登場）","g":"野菜・チーズ・軽食"},{"f":"Barigoule","r":"バリグール","j":"バリグール","c":"料理","m":"下処理したアーティチョーク（小ぶりな紫種が定番）に香味野菜やベーコンを合わせ、白ワイン・オリーブ油・ハーブで柔らかく蒸し煮にした南仏プロヴァンスの郷土料理","t":"ほっくり甘いアーティチョークに、白ワインの爽やかな酸味とオリーブ油・ハーブのやさしい風味が染み込んだ滋味深い味","z":"「ア・ラ・バリグール」は、この煮方を指す（提供メニュー資料にも登場）","g":"野菜・チーズ・軽食"},{"f":"Viennoise","r":"ヴィエノワーズ","j":"ウィーン風","c":"料理","m":"薄く叩いた仔牛肉や白身魚にパン粉の衣をつけて澄ましバターで香ばしく揚げ焼きにし、ゆで卵のみじん切り・ケッパー・アンチョビ・レモンを添える「ウィーン風」仕立て","t":"バター香るサクッと軽やかな衣と中のしっとりした肉の旨味に、レモンとケッパー、アンチョビの酸味と塩気が絶妙に映える","z":"仔牛のカツレツが有名（提供メニュー資料にも登場）","g":"肉・ジビエ料理"},{"f":"Crozets","r":"クロゼ","j":"クロゼ","c":"料理","m":"サヴォワ地方の伝統的な小さな正方形のパスタ（そば粉入りまたは小麦粉製）。ゆでてからボーフォールやルブロッションなどの地元チーズとクリームでグラタン（クロジフレット）にする","t":"そば粉や小麦の素朴な香ばしさと、小粒ながらもっちり噛みごたえのある食感が濃厚なチーズやソースによく絡む","z":"そば粉や小麦粉で作られる（提供メニュー資料にも登場）","g":"野菜・チーズ・軽食"},{"f":"Gougères","r":"グジェール","j":"グジェール","c":"料理","m":"グリュイエールやコンテなどの熟成チーズを練り込んだシュー生地を一口大に絞って焼き上げた、ブルゴーニュ地方名物の温かいアペリティフ（食前のおつまみ）","t":"外はさっくり中はふんわり軽やかなシュー生地から、焼けた熟成チーズの香ばしい香りとほどよい塩気が広がる","z":"ブルゴーニュの名物で、ワインの試飲に添えられる（提供メニュー資料にも登場）","g":"前菜・冷菜・サラダ"},{"f":"Allumette","r":"アリュメット","j":"アリュメット","c":"料理","m":"折り込みパイ生地を細長いマッチ棒状に切り、アンチョビやチーズ、ひき肉ペーストをのせて焼き上げた一口サイズの前菜（おつまみ）。極細のフライドポテトを指すこともある","t":"幾重にも重なったパイのサクサクと軽い食感に、バターの豊かな香りと具材の塩気が効いたワインが進む味わい","z":"名は「マッチ棒」の意味。細いフライドポテトも指す（提供メニュー資料にも登場）","g":"前菜・冷菜・サラダ"},{"f":"Pressé","r":"プレッセ","j":"プレッセ","c":"料理","m":"薄切りにした野菜、フォアグラ、ほぐした肉、魚介などを型に何層にも重ね、重しをして押し固めて冷やし、美しい断面に切り分けた現代フレンチ定番の冷前菜","t":"押し固めることで重なり合った素材の旨味と食感が一体となり、しっとりなめらかで洗練された口当たりが楽しめる","z":"冷たい前菜として出す（提供メニュー資料にも登場）","g":"前菜・冷菜・サラダ"},{"f":"Charlotte","r":"シャルロット","j":"シャルロット","c":"デザート","m":"型の周囲と底に指形のビスキュイ・ア・ラ・キュイエール（またはバターを塗ったパン）をびっしり敷き詰め、中にババロアやムース、果物を詰めて冷やし固めた王冠形の菓子","t":"シロップをほどよく含んだふんわり柔らかなビスキュイと、中から現れるなめらかで軽やかなババロア・果物の酸味が上品に調和する","z":"パンを敷いた、温かいりんごのシャルロットもある（提供メニュー資料にも登場）","g":"ケーキ・タルト"},{"f":"Blanc-manger","r":"ブラン・マンジェ","j":"ブラン・マンジェ","c":"デザート","m":"牛乳や生クリームにアーモンドの香りをじっくり移し、砂糖とゼラチン（またはコーンスターチ）でぷるんと固めた「白い食べ物」の名を持つ古典冷菓。赤い果実のソースと好相性","t":"つるんと繊細でなめらかな口溶けに、牛乳の優しい甘みとアーモンドの気品ある甘い芳香（杏仁にも似た余韻）がふわりと広がる","z":"中世には、鶏肉を使った料理だった（提供メニュー資料にも登場）","g":"冷菓・皿盛りデザート"},{"f":"Nougat","r":"ヌガー","j":"ヌガー","c":"デザート","m":"砂糖とたっぷりの蜂蜜を煮詰め、泡立てた卵白とローストしたアーモンドやピスタチオ、ドライフルーツを混ぜ込んで固めた南仏モンテリマール名物の伝統砂糖菓子","t":"ねっちり柔らかく噛みごたえのある口当たりに、花香る蜂蜜の濃い甘みと香ばしいナッツのカリッとした食感が弾ける","z":"南仏のモンテリマールが産地として有名（提供メニュー資料にも登場）","g":"焼き菓子・小菓子"},{"f":"Crémeux","r":"クレムー","j":"クレムー","c":"デザート","m":"カスタードベース（アングレーズ）にチョコレートや果実ピューレ、バターを加えて乳化させ、ムースより濃密でガナッシュより滑らかに仕立てた現代フレンチ定番のクリーム菓子","t":"スプーンがすっと入るほど艶やかになめらかで、舌に絡みつくように濃厚な素材の旨味とコクがじっくりととろけ出す味わい","z":"チョコレートのクレムーが定番（提供メニュー資料にも登場）","g":"冷菓・皿盛りデザート"},{"f":"Compotée","r":"コンポテ","j":"コンポテ（コンポート）","c":"デザート","m":"りんご・洋梨・ベリーなどの果物（料理では玉ねぎや赤キャベツなどの野菜）を、控えめな砂糖やワイン、スパイスとともに果肉の形が少し残る程度まで柔らかく煮込んだもの","t":"ジャムほど甘すぎず、じっくり火を通すことで引き出された果物本来の穏やかな甘みと瑞々しい酸味、自然な香りが活きている","z":"ジャムより果肉の形が残り、砂糖は控えめ（提供メニュー資料にも登場）","g":"冷菓・皿盛りデザート"},{"f":"Cigarette","r":"シガレット","j":"シガレット","c":"デザート","m":"バター・砂糖・卵白・薄力粉のラングドシャ生地を極薄く丸く焼き、オーブンから出して熱く柔らかいうちに細い棒にくるくると巻いて冷やし固めた繊細な焼き菓子","t":"驚くほど薄くパリッと軽快に砕ける食感と、バターとバニラの香ばしく上品な甘みがアイスやムースに心地よいアクセントを添える","z":"デザートの飾りやプティフールに使う（提供メニュー資料にも登場）","g":"焼き菓子・小菓子"},{"f":"Orangette","r":"オランジェット","j":"オランジェット","c":"デザート","m":"厚めのオレンジの皮を何度もゆでこぼして苦みを和らげ、シロップでじっくり砂糖煮にして乾かし、細長く切ってビターチョコレートをまとわせた食後の小菓子（プティ・フール）","t":"オレンジピールの爽やかな芳香と心地よいほろ苦さ・ねっちりした甘みに、パリッと割れるビターチョコのコクが完璧に響き合う","z":"細長いオレンジピールに、ビターチョコレートを合わせる（提供メニュー資料にも登場）","g":"焼き菓子・小菓子"},{"f":"Dôme","r":"ドーム","j":"ドーム型の菓子","c":"デザート","m":"半球型（ドーム型）のシリコンや金属型に、ムース・クレムー・ジュレ・アイスなどを層にして詰め、冷やし固めて艶やかなグラサージュで覆った現代パティスリーの象徴的フォルム","z":"ムースやアイスを型に詰めて作る（提供メニュー資料にも登場）","t":"中身によって異なるが、なめらかなムースや冷たいアイスにグラサージュの艶とコクが重なる味わい","g":"ケーキ・タルト"},{"f":"Tartelette","r":"タルトレット","j":"小さなタルト","c":"デザート","m":"直径数センチ〜10センチほどの一人分サイズに焼いた小さなタルト。フルーツやクリーム、チョコレートを詰めてデザートや小菓子にする","t":"小ぶりながらサクサク香ばしいタルト生地の比率が高く、中に詰めたクリームや季節のフルーツの甘酸っぱさとの対比が際立つ","z":"デザートやプティフールに使う（提供メニュー資料にも登場）","g":"ケーキ・タルト"},{"f":"Saint-Pierre","r":"サン・ピエール","j":"マトウダイ","c":"食材","m":"体側に黒い丸い斑点を持つ高級白身魚（マトウダイ）。身崩れしにくく上品な旨味があるため、ポワレやロースト、ブイヤベースに重宝される","t":"煮崩れしにくくプリッと締まった極上の白身で、雑味のない上品な旨味とほのかな甘みがバターやサフランと完璧に合う","z":"体の黒い斑点は、聖ペテロの指の跡だという言い伝えがある（提供メニュー資料にも登場）","d":"サン・ピエールのポワレ（ブール・ブラン）、ブイヤベース、ロースト","g":"魚介類"},{"f":"Mousseron","r":"ムスロン","j":"ムスロン茸","c":"食材","m":"小ぶりで香りのよい、春のきのこ","t":"春の森を思わせる独特の粉っぽい芳醇な芳香と、小ぶりながら上品で濃い旨味があり、クリームやバターと好相性","z":"ソースやソテーの香りづけに向く（提供メニュー資料にも登場）","d":"ムスロン茸のバターソテー、鶏のフリカセ、クリームソース","g":"野菜"},{"f":"Omble chevalier","r":"オンブル・シュヴァリエ","j":"イワナの仲間（ホッキョクイワナ）","c":"食材","m":"イワナの仲間。アルプスの湖などに棲む","t":"清らかな冷水で育つため泥臭さが一切なく、きめ細かく淡白でとろけるように繊細な身質と優しい甘みが魅力","z":"冷たい水を好む魚（提供メニュー資料にも登場）","d":"オンブル・シュヴァリエのポワレ（ブール・ブラン）、ヴァプール","g":"魚介類"},{"f":"Carpe","r":"カルプ","j":"鯉","c":"食材","m":"ヨーロッパの河川や池で広く食用にされる淡水魚（コイ）。泥抜きをしてから、アルザス名物のフライ（カルプ・フリット）や赤ワイン煮にする","t":"淡白でふっくらした身質（丁寧な泥抜きが要）で、カリッと揚げたり赤ワインとスパイスで煮込むと豊かなコクが出る","z":"アルザスの「カルプ・フリット」が有名（提供メニュー資料にも登場）","d":"カルプ・フリット（アルザス名物）、鯉のマトロート（赤ワイン煮）","g":"魚介類"},{"f":"Mimosa","r":"ミモザ","j":"ミモザ風","c":"料理","m":"ゆで卵の黄身を裏ごしして、春のミモザの花のようにふんわりと料理の上に散らした仕立て。ゆで卵にマヨネーズを詰める「ウフ・ミモザ」やサラダ、アスパラガスに用いる","t":"裏ごしした卵黄のほろりと軽やかでやさしいコクが、マヨネーズの酸味や野菜のみずみずしさをまろやかに包み込む","z":"「ウフ・ミモザ」はゆで卵の前菜として知られる（提供メニュー資料にも登場）","g":"前菜・冷菜・サラダ"},{"f":"Crème fouettée","r":"クレーム・フエテ","j":"泡立てた生クリーム","c":"デザート","m":"生クリームを空気を含ませてふんわり泡立てたもの（ホイップクリーム）。砂糖やバニラを加えて甘くしたものは「シャンティイ」と呼んで区別する","t":"砂糖を加えないため乳脂肪本来の清らかな甘みと軽やかなコクが際立ち、甘いケーキやフルーツの味わいをすっきりと引き立てる","z":"砂糖を加えたものはシャンティイ（提供メニュー資料にも登場）","g":"生地・クリーム・製菓技法"},{"f":"Croustillant","r":"クルスティヤン","j":"カリッとした食感","c":"コース・その他","m":"パート・フィロやブリック生地、揚げた皮、焼いた飴などによって生まれる「カリッと軽やかに砕ける」食感、またはそのパーツを指す表現","t":"歯を立てるとパリパリ・サクサクと軽快な音を立てて砕け、柔らかなソースやムースに心地よい食感のアクセントを添える","z":"より硬くて歯ごたえのあるものは「クロカン（croquant）」と言う（提供メニュー資料にも登場）","g":"火入れ・食感"},{"f":"Thé","r":"テ","j":"紅茶・お茶","c":"食材","m":"お茶。食後にコーヒーとともに選ぶ飲み物","z":"フランスのコースでは、食後のコーヒーか紅茶を選ぶことが多い（提供メニュー資料にも登場）","t":"繊細な渋みと茶葉ごとの華やかな芳香が食後の口中をすっきりと洗い流し、焼き菓子やデザートの甘みを引き立てる","d":"食後のティーサービス、ミニャルディーズのお供、紅茶風味のクレーム・ブリュレ","g":"調味料・薬味"},{"f":"Couscous","r":"クスクス","j":"クスクス","c":"食材","m":"デュラム小麦のセモリナを小さな粒にした、北アフリカの主食。蒸して使う","t":"蒸した極小粒がぱらりと軽やかにほどけ、小麦の淡白でほのかな甘みが肉や野菜のスープ・スパイスの旨味をたっぷり吸い込む","z":"フランスでは広く食べられ、野菜や肉の煮込みを添える料理の名でもある。【日本との違い】日本では見かける機会が少なく、湯で戻すだけの乾燥品が主","d":"クスクス・ロワイヤル（仔羊・メルゲーズ・野菜の煮込み添え）、タブレ","g":"穀類"},{"f":"Semoule","r":"スムール","j":"セモリナ","c":"食材","m":"デュラム小麦を粗く挽いたもの","t":"デュラム小麦ならではの素朴な甘みとプチプチ・ざらっとした心地よい粒感があり、甘いミルク煮からニョッキまで幅広く活きる","z":"クスクスの原料で、デザートやニョッキにも使う。【日本との違い】日本ではパスタの原料としての印象が強い","d":"クスクス、ガトー・ド・スムール（セモリナケーキ）、ニョッキ・ア・ラ・ロメーヌ","g":"穀類"},{"f":"Polenta","r":"ポレンタ","j":"ポレンタ","c":"食材","m":"とうもろこしの粉を煮て練った、粥状の料理","t":"とうもろこしの素朴でやさしい甘みと香ばしさがあり、バターやチーズを混ぜるととろりクリーミー、焼くとカリッと香ばしい","z":"イタリア北部の料理がフランスにも広まった。【日本との違い】日本ではまだ一般的ではない","d":"クリーミーポレンタ（煮込み料理の付け合わせ）、焼きポレンタ","g":"穀類"},{"f":"Harissa","r":"アリサ","j":"ハリッサ","c":"食材","m":"唐辛子、にんにく、スパイスで作る、チュニジア発祥のペースト","t":"唐辛子の力強い辛味に、にんにく・クミン・コリアンダーの芳醇なスパイス香が重なり、少量で料理に奥行きと刺激を与える","z":"クスクスに添える薬味。【日本との違い】日本では専門店や輸入食材店でないと手に入りにくい","d":"クスクスの薬味、メルゲーズの添え物、魚介スープのアクセント","g":"調味料・薬味"},{"f":"Merguez","r":"メルゲーズ","j":"メルゲーズ","c":"食材","m":"羊肉や牛肉を唐辛子などで味つけした、北アフリカ起源の生ソーセージ","t":"クミンや唐辛子・にんにくが効いたスパイシーで食欲をそそる芳香と、羊肉・牛肉のジューシーで力強い旨味が弾ける","z":"クスクスやバーベキューの定番。【日本との違い】日本では専門店でないと扱いが少ない","d":"クスクス・ロワイヤル、メルゲーズのグリル（ハリッサ添え）","g":"肉"},{"f":"Mâche","r":"マーシュ","j":"コーンサラダ","c":"食材","m":"丸く柔らかな小葉が株状につく冬野菜（コーンサラダ）。クセが少なく、ビーツやくるみ油と合わせる秋冬サラダの定番","t":"やわらかな小葉の優しい口当たりに、ほのかにヘーゼルナッツを思わせる上品な香りと穏やかな甘みが広がる","z":"秋から冬のサラダの定番。【日本との違い】日本では「コーンサラダ」「ラムズレタス」と呼ばれ、流通は少ない","d":"マーシュとビーツ・くるみ油のサラダ、鴨のコンフィの付け合わせサラダ","g":"野菜"},{"f":"Roquette","r":"ロケット","j":"ルッコラ","c":"食材","m":"ごまに似た香りと辛みのある葉野菜","t":"焙煎ごまを思わせる香ばしい芳香と、ピリッと心地よいほろ苦さ・辛味があり、牛肉やチーズの濃厚な味を軽やかに締める","z":"サラダや肉料理の付け合わせに使う。【日本との違い】日本ではイタリア語の「ルッコラ」の名が一般的","d":"牛肉のカルパッチョ（ルッコラ＆パルメザン添え）、イタリアン風サラダ","g":"野菜"},{"f":"Oseille","r":"オゼイユ","j":"ソレル（スイバの仲間）","c":"食材","m":"レモンのような酸味のある葉野菜","t":"レモンを思わせるきゅっと爽やかな強い酸味と青い香りがあり、加熱するととろりと溶けてサーモンやクリームと絶妙に合う","z":"鮭にソースを合わせる「サーモン・ア・ロゼイユ」が古典。【日本との違い】日本では「ソレル」の名で使われ、流通は少ない","d":"サーモン・ア・ロゼイユ（鮭のソレルクリームソース）、オゼイユのポタージュ","g":"野菜"},{"f":"Blette","r":"ブレット","j":"フダンソウ","c":"食材","m":"葉と太い茎を食べる、ほうれん草の仲間の野菜","t":"葉はほうれん草に似たやさしい甘み、太い茎はみずみずしくほのかな土の香りがあり、クリームやチーズと相性抜群","z":"グラタンや煮込みに使う。【日本との違い】日本では「スイスチャード」の名でも知られる","d":"ブレットのグラタン（ベシャメル＆チーズ）、ニース風スイスチャードのタルト","g":"野菜"},{"f":"Cardon","r":"カルドン","j":"カルドン（アーティチョークの仲間）","c":"食材","m":"アーティチョークの仲間で、茎を食べる野菜","t":"アーティチョークに似た上品な芳香と心地よいほろ苦さ、繊維質のしっかりした歯ざわりが冬の濃厚なクリーム煮に映える","z":"冬の煮込みやグラタンに使う。【日本との違い】日本ではほとんど流通しない","d":"カルドンの骨髄グラタン（リヨンの冬の郷土料理）、クリーム煮","g":"野菜"},{"f":"Salsifis","r":"サルシフィ","j":"西洋ごぼう（バラモンジン）","c":"食材","m":"ごぼうに似た細長い白い根菜（西洋ごぼう）。皮をむいて酢水でアクを抜き、クリーム煮やバターソテー、フリットにして付け合わせに使う","t":"ごぼうや牡蠣にも例えられる穏やかで上品な土の香りとほくっとした甘みがあり、バターやクリームと合わせると格別","z":"皮をむくと変色するので、すぐに酢水につける。【日本との違い】日本のごぼうとは別の植物","d":"サルシフィのクリーム煮、バターソテー、フリット（肉料理の付け合わせ）","g":"野菜"},{"f":"Panais","r":"パネ","j":"パースニップ","c":"食材","m":"白いにんじんのような姿をした冬の根菜（パースニップ）。加熱すると甘みと独特の香りが際立ち、ポタージュやピューレ、ローストに向く","t":"にんじんを思わせる濃い甘みの中に、ハーブのような独特の爽やかな芳香があり、裏ごしすると驚くほど滑らかで濃厚になる","z":"ポタージュやピューレによく使う。【日本との違い】日本ではまだ珍しい根菜","d":"パースニップのポタージュ（ヴルーテ）、ピューレ、ハチミツロースト","g":"野菜"},{"f":"Coing","r":"コワン","j":"マルメロ","c":"食材","m":"洋梨に似た黄金色の果実（マルメロ）。生では硬く渋いため、砂糖で煮てジャムやゼリー、パート・ド・フリュイにし、チーズにも添える","t":"生では硬く強い渋みがあるが、加熱すると部屋中に広がるほど華やかな芳香と、蜜のように濃密で上品な甘酸っぱさに変わる","z":"生では硬いので、ジャムやゼリーにする。【日本との違い】日本の「かりん」とは別の果物","d":"マルメロのジュレ・コンフィチュール、パート・ド・フリュイ、羊チーズの添え物","g":"果物"},{"f":"Groseille","r":"グロゼイユ","j":"赤すぐり（レッドカラント）","c":"食材","m":"透明感のある小さな赤い粒が房状になるベリー（赤すぐり）。鋭い酸味を活かし、タルトやムースの彩り、鴨やジビエのソースに使う","t":"透明感のある粒がプチッと弾け、目の覚めるような鮮烈な酸味と清らかな果実香が脂の濃いジビエや甘い菓子を引き締める","z":"ソースや飾りに使う。【日本との違い】日本では生の流通が少なく、冷凍品が中心","d":"ソース・グラン・ヴヌール（赤すぐりゼリー）、タルトやムースの彩り","g":"果物"},{"f":"Verjus","r":"ヴェルジュ","j":"未熟なぶどうの搾り汁","c":"食材","m":"完熟前の青いぶどうを搾った酸味のある果汁。酢より角がなくまろやかなため、繊細なソースやヴィネグレット、デグラセに用いられる","t":"酢のようなツンとした刺激がなく、未熟ぶどう由来の丸く上品な酸味と清らかな果実香が繊細なソースを美しくまとめる","z":"酢の代わりに、ソースやヴィネグレットに使う。【日本との違い】日本ではほとんど流通しない","d":"ディジョンマスタードの原料、ヴェルジュのソース、ヴィネグレット、デグラセ","g":"調味料・薬味"},{"f":"Cuisses de grenouille","r":"キュイス・ド・グルヌイユ","j":"カエルのもも肉","c":"食材","m":"食用のカエルの後ろ脚のもも肉。フランス東部のドンブ地方などが名産地で、小麦粉をまぶしてにんにく・パセリバターでソテーするのが定番","t":"鶏のささみと白身魚の中間のような驚くほど繊細で淡白な白身で、にんにくとパセリのバターを絡めると絶妙な旨味になる","z":"にんにくとパセリのバターで炒めるのが定番。【日本との違い】日本ではほとんど食べられない","d":"キュイス・ド・グルヌイユのムニエル（ペルシヤード・にんにくパセリバター）","g":"鳥肉、うさぎ肉"},{"f":"Couteau","r":"クトー","j":"マテ貝","c":"食材","m":"細長い筒状の殻を持つ二枚貝（マテ貝）。砂抜きをして強火でさっとソテーし、にんにくとパセリ（ペルシヤード）や白ワインで仕上げる","t":"ホタテの貝柱にも似たプリッとした心地よい弾力と上品な甘み・磯の香りがあり、さっと火を通すだけで絶品になる","z":"「ナイフ」の意味の名がつく。【日本との違い】日本のマテ貝と近い仲間","d":"マテ貝のペルシヤード（にんにくパセリバター焼き）、白ワイン蒸し","g":"魚介類"},{"f":"Araignée de mer","r":"アレニェ・ド・メール","j":"ヨーロッパケアシガニ","c":"食材","m":"脚の長い、ヨーロッパの大きなカニ","t":"極めて繊細で上品な甘みを持つほぐし身と、濃厚でコク深いミソが魅力で、冷製でレモンやマヨネーズと味わうのが最高","z":"「araignée」は蜘蛛の意味。【日本との違い】日本のタカアシガニとは別の種","d":"アレニェ・ド・メールの冷製（マヨネーズ添え）、海の幸の盛り合わせ","g":"魚介類"},{"f":"Langouste","r":"ラングースト","j":"イセエビの仲間","c":"食材","m":"オマールと違い大きなハサミを持たない大型の甲殻類（イセエビの仲間）。塩ゆでやグリル、グラタンなど豪華な魚介料理の主役になる","t":"オマールよりさらに繊細で引き締まったプリプリの身質と、気品あふれる豊かな甘みがあり、特別な祝宴の主役にふさわしい","z":"ロブスターのオマールと違い、爪がない。【日本との違い】日本のイセエビに近い仲間","d":"ラングーストのグリル（ハーブバター）、ラングーストのテルミドール、冷製マヨネーズ","g":"魚介類"},{"f":"Merlu","r":"メルリュ","j":"メルルーサ","c":"食材","m":"大西洋で多く獲れるタラ目の白身魚（メルルーサ）。身が柔らかく扱いやすいため、ムニエルやフライ、トマトソース煮など日常的に親しまれる","t":"クセのない淡白でふっくら柔らかな白身で、火を通すとほろりとほどけ、バスク風ソースやトマト、バターと軽やかに合う","z":"フランスでは日常的な魚。【日本との違い】日本では冷凍の切り身で流通することが多い","d":"メルルーサのバスク風（サルサ・ベルデ）、ムニエル、ポワレ","g":"魚介類"},{"f":"Barbue","r":"バルビュ","j":"ブリル（カレイ目の仲間）","c":"食材","m":"ターボットに近い、カレイ目の魚","t":"ターボットに近い上品でしっとりした白身で、淡白ながらきめ細かな旨味があり、白ワインやシャンパーニュソースと好相性","z":"ターボットより小ぶりで、手頃とされる。【日本との違い】日本ではほとんど見かけない","d":"バルビュのポシェ（シャンパーニュソース）、ムニエル、デュグレレ風","g":"魚介類"},{"f":"Poulet de Bresse","r":"プーレ・ド・ブレス","j":"ブレス産の鶏","c":"食材","m":"フランス東部ブレス地方産の、AOC（原産地呼称）の鶏","t":"放し飼いで長く育てた鶏ならではの引き締まった弾力と濃い旨味、豊かな脂の甘みがあり、シンプルなローストで真価を発揮する","z":"足が青いのが特徴。【日本との違い】日本の一般的なブロイラーより、放し飼いで長く育てる","d":"プーレ・ド・ブレスのロティ、ブレス鶏のクリーム煮（モリーユ茸＆ヴァン・ジョーヌ）","g":"鳥肉、うさぎ肉"},{"f":"Demi-tasse","r":"ドゥミ・タス","j":"ドゥミタス","c":"サービス・接客","m":"食後にエスプレッソなど濃いコーヒーを少量楽しむための、通常の半分の大きさ（60〜100mlほど）の小ぶりなカップ、およびそのコーヒーのこと","z":"「半分のカップ」の意味。エスプレッソなど濃いコーヒーを少量で出す","g":"食器・卓上"},{"f":"Maître d’hôtel","r":"メートル・ドテル","j":"給仕長","c":"サービス・接客","m":"客席サービス全体の総責任者（給仕長）。予約・席案内から料理の説明、客前仕上げ（フランベや切り分け）、スタッフの統括までホスピタリティの要を担う","z":"「ホテルの主人」の意味。ソースの「ブール・メートル・ドテル」と同じ語","g":"接客・マナー"},{"f":"Chef de rang","r":"シェフ・ド・ラン","j":"担当テーブルの給仕","c":"サービス・接客","m":"客席の決められた区画（ラン／数テーブル）を専任で担当する給仕責任者。注文の聞き取りから料理の提供、テーブルの進行管理まで細やかに対応する","z":"「ラン」は列や区画の意味","g":"接客・マナー"},{"f":"Commis","r":"コミ","j":"見習い・補助","c":"厨房・道具","m":"厨房や客席で先輩スタッフ（部門シェフやシェフ・ド・ラン）の指示のもと、下ごしらえや料理運びなどの補助業務を担いながら技術を学ぶ見習いスタッフ","z":"厨房では「コミ・ド・キュイジーヌ」と呼ぶ","g":"厨房役職・組織"},{"f":"Sous-chef","r":"スー・シェフ","j":"副料理長","c":"厨房・道具","m":"厨房で料理長（シェフ）の直下に位置し、仕込みの管理や調理の指揮、シェフ不在時の代行を担う副料理長","z":"「スー」は「下の」の意味","g":"厨房役職・組織"},{"f":"Chef de partie","r":"シェフ・ド・パルティ","j":"部門シェフ","c":"厨房・道具","m":"厨房の分業体制（ブリガード）において、ソース・魚・肉・野菜・冷菜など各専門部門の責任者を務める中堅シェフ（部門長）","z":"「パルティ」は部門の意味","g":"厨房役職・組織"},{"f":"Garde-manger","r":"ガルド・マンジェ","j":"冷製・前菜担当","c":"厨房・道具","m":"厨房でサラダ、テリーヌ、パテ、マリネなどの冷製前菜や冷製ソース、さらには肉や魚の仕込み・食材保管を受け持つ専門部門（直訳は「食べ物を守る場所」）","z":"「食べ物を守る」という意味","g":"厨房役職・組織"},{"f":"Poissonnier","r":"ポワソニエ","j":"魚料理担当","c":"厨房・道具","m":"厨房の分業体制（ブリガード）で、魚介類の下処理から火入れ、魚用ソースの仕上げまでを専門に担当する部門・担当者","z":"魚のソースも担当することが多い","g":"厨房役職・組織"},{"f":"Rôtisseur","r":"ロティスール","j":"肉のロースト担当","c":"厨房・道具","m":"厨房でオーブン焼き（ロティ）、グリル、揚げ物など、肉やジビエの焼き物全般の火入れを専門に受け持つ部門・担当者","z":"ロティ（オーブン焼き）専門の役職。グリヤード（グリル担当）を兼ねることもある","g":"厨房役職・組織"},{"f":"Entremétier","r":"アントルメティエ","j":"野菜・スープ・卵担当","c":"厨房・道具","m":"厨房で付け合わせの野菜料理、ポタージュやスープ、卵料理、パスタやリゾットなどを専門に受け持つ部門・担当者","z":"「アントルメ」は、もとは料理と料理の間に出す皿の意味","g":"厨房役職・組織"},{"f":"Pâtissier","r":"パティシエ","j":"菓子職人","c":"厨房・道具","m":"レストランや専門店で、デザート（デセール）、焼き菓子、パン、アイスクリーム、食後の小菓子（ミニャルディーズ）の製作を専門に担う菓子職人","z":"厨房とは別の部門として扱われる","g":"厨房役職・組織"},{"f":"Passe","r":"パス","j":"料理の受け渡し台","c":"厨房・道具","m":"厨房と客席の境界に設けられた、仕上げた料理を並べる受け渡し台（パントリー）。ここで料理長が温度・盛り付け・ソースを最終確認してから客席へ送り出す","z":"料理の最終確認をする場所","g":"厨房役職・組織"},{"f":"Plongeur","r":"プロンジュール","j":"洗い場担当","c":"厨房・道具","m":"厨房の洗い場で食器・グラス・調理器具・鍋類を洗浄し、厨房の衛生と回転を支える専門担当","z":"「潜る」の意味から来た名"
